name: stacklab

# One command: `docker compose up` builds everything, migrates, imports all content and serves
# Stacklab on http://localhost:8080 (port configurable via STACKLAB_PORT).

x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: stacklab
      POSTGRES_USER: stacklab
      POSTGRES_PASSWORD: ${STACKLAB_DB_PASSWORD:-stacklab}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stacklab -d stacklab"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [app]

  php:
    <<: *restart
    build: ./docker/php
    image: stacklab-php
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: stacklab
      DB_USERNAME: stacklab
      DB_PASSWORD: ${STACKLAB_DB_PASSWORD:-stacklab}
      STACKLAB_CONTENT_PATH: /var/www/content
      STACKLAB_SANDBOX_URL: http://nginx:8081
      STACKLAB_SANDBOX_SECRET_FILE: /run/stacklab/sandbox.secret
      STACKLAB_WORKSPACE_HOST: ${STACKLAB_WORKSPACE:-./workspace}
      STACKLAB_ROOT_ENV_FILE: /stacklab-root/.env
    volumes:
      - ./backend:/var/www/backend
      - ./content:/var/www/content:ro
      - secrets:/run/stacklab
      - ./:/stacklab-root
    healthcheck:
      test: ["CMD-SHELL", "pgrep php-fpm > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    networks: [app]

  frontend:
    image: oven/bun:1.4.2
    working_dir: /app
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run build"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: "no"
    networks: [app]

  nginx:
    <<: *restart
    image: nginx:1.29-alpine
    depends_on:
      frontend:
        condition: service_completed_successfully
      php:
        condition: service_started
      sandbox:
        condition: service_started
    ports:
      - "${STACKLAB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./content:/srv/content:ro
    networks: [app, sandbox]

  sandbox:
    <<: *restart
    build:
      context: ./sandbox
      args:
        LEARNER_UID: ${STACKLAB_UID:-1000}
        LEARNER_GID: ${STACKLAB_GID:-1000}
    image: stacklab-sandbox
    environment:
      HTTP_PROXY: http://proxy:8888
      HTTPS_PROXY: http://proxy:8888
      http_proxy: http://proxy:8888
      https_proxy: http://proxy:8888
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      SANDBOX_SECRET_FILE: /run/stacklab/sandbox.secret
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - ${STACKLAB_WORKSPACE:-./workspace}:/workspace
      - secrets:/run/stacklab:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: ${STACKLAB_SANDBOX_MEMORY:-2g}
    cpus: ${STACKLAB_SANDBOX_CPUS:-2}
    tmpfs:
      - /tmp:size=512m,mode=1777
    networks: [sandbox]

  proxy:
    <<: *restart
    build: ./docker/proxy
    image: stacklab-proxy
    networks: [app, sandbox]

  vite:
    profiles: [dev]
    image: oven/bun:1.4.2
    working_dir: /app
    command: ["sh", "-c", "bun install && bun run dev --host 0.0.0.0"]
    environment:
      STACKLAB_PROXY_TARGET: http://nginx:80
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks: [app]

networks:
  app: {}
  sandbox:
    internal: true

volumes:
  pgdata: {}
  secrets: {}
  frontend_node_modules: {}
