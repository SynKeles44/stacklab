<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="430" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e1b3a">Schichten einer gewachsenen Laravel-App</text>

  <g font-size="15" fill="#1e1b3a" text-anchor="middle">
    <rect x="40" y="62" width="220" height="44" rx="10" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="150" y="90">HTTP-Request</text>
    <rect x="300" y="62" width="220" height="44" rx="10" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="410" y="90">Artisan-Befehl</text>
    <rect x="560" y="62" width="220" height="44" rx="10" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="670" y="90">Queue-Worker</text>

    <rect x="40" y="146" width="220" height="70" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="150" y="174" font-weight="700">Controller</text>
    <text x="150" y="198" font-size="13">+ Form Request (prüfen)</text>
    <rect x="300" y="146" width="220" height="70" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="410" y="174" font-weight="700">Command</text>
    <text x="410" y="198" font-size="13">liest Datei oder Argumente</text>
    <rect x="560" y="146" width="220" height="70" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="670" y="174" font-weight="700">Job</text>
    <text x="670" y="198" font-size="13">trägt einfache Werte</text>

    <rect x="40" y="262" width="740" height="70" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2.5"/>
    <text x="410" y="292" font-size="17" font-weight="700">Action / Service – genau ein Anwendungsfall</text>
    <text x="410" y="316" font-size="13" font-family="ui-monospace, Menlo, monospace">CreateInvoice::handle(CreateInvoiceData $data)</text>

    <rect x="40" y="378" width="170" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="125" y="406" font-weight="700">DTO</text>
    <text x="125" y="430" font-size="13">Daten in fester Form</text>
    <rect x="230" y="378" width="170" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="315" y="406" font-weight="700">Value Object</text>
    <text x="315" y="430" font-size="13">Money, EmailAddress</text>
    <rect x="420" y="378" width="170" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="505" y="406" font-weight="700">Model</text>
    <text x="505" y="430" font-size="13">Eloquent, Tabelle</text>
    <rect x="610" y="378" width="170" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="695" y="406" font-weight="700">Domain Event</text>
    <text x="695" y="430" font-size="13">InvoiceCreated</text>
  </g>

  <g stroke="#1e1b3a" stroke-width="2">
    <line x1="150" y1="108" x2="150" y2="143" marker-end="url(#pfeil)"/>
    <line x1="410" y1="108" x2="410" y2="143" marker-end="url(#pfeil)"/>
    <line x1="670" y1="108" x2="670" y2="143" marker-end="url(#pfeil)"/>
    <line x1="150" y1="218" x2="150" y2="259" marker-end="url(#pfeil)"/>
    <line x1="410" y1="218" x2="410" y2="259" marker-end="url(#pfeil)"/>
    <line x1="670" y1="218" x2="670" y2="259" marker-end="url(#pfeil)"/>
    <line x1="125" y1="334" x2="125" y2="375" marker-end="url(#pfeil)"/>
    <line x1="315" y1="334" x2="315" y2="375" marker-end="url(#pfeil)"/>
    <line x1="505" y1="334" x2="505" y2="375" marker-end="url(#pfeil)"/>
    <line x1="695" y1="334" x2="695" y2="375" marker-end="url(#pfeil)"/>
  </g>

  <line x1="830" y1="70" x2="830" y2="440" stroke="#f87171" stroke-width="3" marker-end="url(#pfeil)"/>
  <text x="860" y="255" text-anchor="middle" font-size="14" fill="#1e1b3a" transform="rotate(90 860 255)">Abhängigkeiten zeigen nach innen</text>
  <text x="410" y="490" text-anchor="middle" font-size="14" fill="#1e1b3a">Drei Eingänge, eine Action: Die inneren Schichten kennen weder Request noch Konsole noch Queue.</text>
</svg>
