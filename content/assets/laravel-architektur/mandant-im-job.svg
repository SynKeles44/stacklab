<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">Der Mandant muss im Job mitreisen</text>

  <rect x="30" y="60" width="270" height="250" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="165" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Web-Prozess (Request)</text>
  <g font-size="13" fill="#1e1b3a">
    <text x="50" y="120">1. Middleware setzt</text>
    <text x="70" y="140" font-family="ui-monospace, Menlo, monospace">TenantContext = 2</text>
    <text x="50" y="172">2. Action schickt Job ab</text>
    <text x="50" y="204">3. Konstruktor merkt sich</text>
    <text x="70" y="224" font-family="ui-monospace, Menlo, monospace">$this->tenantId = 2</text>
    <text x="50" y="262">Request endet, Kontext</text>
    <text x="50" y="280">wird verworfen</text>
  </g>

  <rect x="350" y="120" width="200" height="130" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Queue</text>
  <text x="450" y="178" text-anchor="middle" font-size="13" fill="#1e1b3a">gespeicherter Job:</text>
  <text x="450" y="204" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">CountInvoices</text>
  <text x="450" y="226" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">tenantId: 2</text>

  <rect x="600" y="60" width="270" height="250" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="735" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Worker-Prozess</text>
  <g font-size="13" fill="#1e1b3a">
    <text x="620" y="120">4. scoped-Objekte werden</text>
    <text x="620" y="140">zurückgesetzt: Kontext leer</text>
    <text x="620" y="172">5. handle() setzt zuerst</text>
    <text x="640" y="192" font-family="ui-monospace, Menlo, monospace">TenantContext = 2</text>
    <text x="620" y="224">6. Global Scope filtert</text>
    <text x="620" y="244">wieder richtig</text>
  </g>

  <line x1="302" y1="185" x2="347" y2="185" stroke="#1e1b3a" stroke-width="2.5" marker-end="url(#pfeil)"/>
  <line x1="552" y1="185" x2="597" y2="185" stroke="#1e1b3a" stroke-width="2.5" marker-end="url(#pfeil)"/>

  <rect x="30" y="335" width="840" height="64" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="450" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">Ohne Schritt 3 und 5: Der Worker kennt keinen Mandanten.</text>
  <text x="450" y="384" text-anchor="middle" font-size="13" fill="#1e1b3a">Ein fail-closed-Scope liefert dann nichts – ein nachlässiger Scope liefert die Daten aller Mandanten.</text>
</svg>
