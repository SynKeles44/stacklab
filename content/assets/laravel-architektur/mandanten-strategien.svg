<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">Drei Wege, Mandanten zu trennen</text>

  <g font-size="14" fill="#1e1b3a" text-anchor="middle">
    <rect x="30" y="60" width="260" height="300" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="160" y="88" font-size="16" font-weight="700">Gemeinsame Tabellen</text>
    <rect x="60" y="106" width="200" height="150" rx="8" fill="#ffffff" stroke="#1e1b3a"/>
    <text x="160" y="128" font-weight="700" font-family="ui-monospace, Menlo, monospace">invoices</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="13">
      <text x="160" y="156">tenant_id=1 · R-100</text>
      <text x="160" y="180">tenant_id=2 · R-101</text>
      <text x="160" y="204">tenant_id=1 · R-102</text>
      <text x="160" y="228">tenant_id=3 · R-103</text>
    </g>
    <text x="160" y="290">Trennung: jede Abfrage</text>
    <text x="160" y="310">filtert auf tenant_id</text>
    <text x="160" y="340" fill="#047857" font-weight="700">Aufwand: gering</text>

    <rect x="320" y="60" width="260" height="300" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="450" y="88" font-size="16" font-weight="700">Schema pro Mandant</text>
    <rect x="350" y="106" width="200" height="150" rx="8" fill="#ffffff" stroke="#1e1b3a"/>
    <text x="450" y="128" font-weight="700">eine Datenbank</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="13">
      <rect x="365" y="142" width="170" height="28" rx="5" fill="#f5f3ff" stroke="#a78bfa"/>
      <text x="450" y="161">tenant_1.invoices</text>
      <rect x="365" y="178" width="170" height="28" rx="5" fill="#f5f3ff" stroke="#a78bfa"/>
      <text x="450" y="197">tenant_2.invoices</text>
      <rect x="365" y="214" width="170" height="28" rx="5" fill="#f5f3ff" stroke="#a78bfa"/>
      <text x="450" y="233">tenant_3.invoices</text>
    </g>
    <text x="450" y="290">Trennung: Suchpfad bzw.</text>
    <text x="450" y="310">Schema pro Request</text>
    <text x="450" y="340" fill="#b45309" font-weight="700">Aufwand: mittel</text>

    <rect x="610" y="60" width="260" height="300" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="740" y="88" font-size="16" font-weight="700">Datenbank pro Mandant</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="13">
      <ellipse cx="680" cy="130" rx="40" ry="10" fill="#ffffff" stroke="#1e1b3a"/>
      <path d="M 640 130 L 640 175 A 40 10 0 0 0 720 175 L 720 130" fill="#ffffff" stroke="#1e1b3a"/>
      <text x="680" y="162">db_1</text>
      <ellipse cx="800" cy="130" rx="40" ry="10" fill="#ffffff" stroke="#1e1b3a"/>
      <path d="M 760 130 L 760 175 A 40 10 0 0 0 840 175 L 840 130" fill="#ffffff" stroke="#1e1b3a"/>
      <text x="800" y="162">db_2</text>
      <ellipse cx="740" cy="205" rx="40" ry="10" fill="#ffffff" stroke="#1e1b3a"/>
      <path d="M 700 205 L 700 250 A 40 10 0 0 0 780 250 L 780 205" fill="#ffffff" stroke="#1e1b3a"/>
      <text x="740" y="237">db_3</text>
    </g>
    <text x="740" y="290">Trennung: eigene Verbindung</text>
    <text x="740" y="310">pro Mandant</text>
    <text x="740" y="340" fill="#b91c1c" font-weight="700">Aufwand: hoch</text>
  </g>

  <line x1="60" y1="395" x2="840" y2="395" stroke="#1e1b3a" stroke-width="2"/>
  <path d="M 840 389 L 852 395 L 840 401 z" fill="#1e1b3a"/>
  <text x="60" y="422" font-size="13" fill="#1e1b3a">einfacher Betrieb, Trennung im Code</text>
  <text x="840" y="422" text-anchor="end" font-size="13" fill="#1e1b3a">stärkere Trennung, mehr Betriebsaufwand</text>
</svg>
