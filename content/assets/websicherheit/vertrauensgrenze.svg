<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">Die Vertrauensgrenze einer Web-App</text>

  <rect x="20" y="60" width="230" height="380" rx="16" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="135" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Nicht vertrauenswürdig</text>
  <rect x="50" y="115" width="170" height="44" rx="10" fill="#ffffff" stroke="#f87171"/>
  <text x="135" y="143" text-anchor="middle" font-size="14" fill="#1e1b3a">Browser der Nutzer</text>
  <rect x="50" y="171" width="170" height="44" rx="10" fill="#ffffff" stroke="#f87171"/>
  <text x="135" y="199" text-anchor="middle" font-size="14" fill="#1e1b3a">curl, Skripte, Bots</text>
  <rect x="50" y="227" width="170" height="44" rx="10" fill="#ffffff" stroke="#f87171"/>
  <text x="135" y="255" text-anchor="middle" font-size="14" fill="#1e1b3a">Fremde APIs, Uploads</text>
  <text x="135" y="310" text-anchor="middle" font-size="13" fill="#1e1b3a">URL · Formulare · Cookies</text>
  <text x="135" y="330" text-anchor="middle" font-size="13" fill="#1e1b3a">Header · Dateien · JSON</text>
  <text x="135" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Alles frei veränderbar</text>

  <line x1="300" y1="55" x2="300" y2="445" stroke="#a78bfa" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="300" y="455" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Vertrauensgrenze</text>

  <rect x="340" y="60" width="500" height="380" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="590" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Dein Server</text>

  <line x1="220" y1="137" x2="362" y2="137" stroke="#1e1b3a" stroke-width="2" marker-end="url(#p)"/>
  <text x="290" y="128" text-anchor="middle" font-size="12" fill="#1e1b3a">Request</text>

  <rect x="365" y="112" width="190" height="50" rx="10" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="460" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">1. Eingaben prüfen</text>
  <text x="460" y="152" text-anchor="middle" font-size="12" fill="#1e1b3a">Typ, Format, Allowlist</text>

  <line x1="555" y1="137" x2="607" y2="137" stroke="#1e1b3a" stroke-width="2" marker-end="url(#p)"/>
  <rect x="610" y="112" width="200" height="50" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  <text x="710" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">Geschäftslogik</text>

  <text x="590" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">2. Daten und Befehle trennen</text>
  <rect x="365" y="220" width="140" height="56" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="435" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b3a">SQL</text>
  <text x="435" y="263" text-anchor="middle" font-size="12" fill="#1e1b3a">Platzhalter</text>
  <rect x="520" y="220" width="140" height="56" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="590" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b3a">Shell</text>
  <text x="590" y="263" text-anchor="middle" font-size="12" fill="#1e1b3a">Argument-Liste</text>
  <rect x="675" y="220" width="140" height="56" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="745" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b3a">Dateisystem</text>
  <text x="745" y="263" text-anchor="middle" font-size="12" fill="#1e1b3a">IDs, Allowlist</text>

  <rect x="365" y="320" width="450" height="56" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="590" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">3. Ausgaben kodieren</text>
  <text x="590" y="363" text-anchor="middle" font-size="12" fill="#1e1b3a">HTML, Attribute, URLs, JavaScript – passend zum Kontext</text>

  <line x1="362" y1="348" x2="222" y2="348" stroke="#1e1b3a" stroke-width="2" marker-end="url(#p)"/>
  <text x="290" y="340" text-anchor="middle" font-size="12" fill="#1e1b3a">Response</text>
</svg>
