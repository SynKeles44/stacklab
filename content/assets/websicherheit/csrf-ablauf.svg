<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
    <marker id="pfeil-rot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">Ablauf eines CSRF-Angriffs</text>

  <rect x="44" y="170" width="200" height="100" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="3"/>
  <text x="144" y="215" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Browser der Nutzerin</text>
  <text x="144" y="242" text-anchor="middle" font-size="13" fill="#1e1b3a">eingeloggt bei deiner App</text>

  <rect x="556" y="60" width="200" height="100" rx="14" fill="#fef2f2" stroke="#f87171" stroke-width="3"/>
  <text x="656" y="105" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Fremde Seite</text>
  <text x="656" y="132" text-anchor="middle" font-size="13" fill="#1e1b3a">evil.example</text>

  <rect x="556" y="320" width="200" height="100" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
  <text x="656" y="365" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Deine App</text>
  <text x="656" y="392" text-anchor="middle" font-size="13" fill="#1e1b3a">app.example.com</text>

  <line x1="244" y1="250" x2="552" y2="335" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="350" y="308" text-anchor="middle" font-size="13" fill="#1e1b3a">1. Login → Session-Cookie</text>

  <line x1="244" y1="185" x2="552" y2="100" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="372" y="122" text-anchor="middle" font-size="13" fill="#1e1b3a">2. Seite öffnen</text>

  <line x1="552" y1="140" x2="250" y2="205" stroke="#f87171" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil-rot)"/>
  <text x="430" y="196" text-anchor="middle" font-size="13" fill="#b91c1c">3. verstecktes Formular</text>

  <path d="M 144 270 Q 144 445 552 400" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#pfeil-rot)"/>
  <text x="330" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">4. POST /ueberweisen</text>

  <rect x="320" y="426" width="160" height="36" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="449" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">Session-Cookie</text>
  <text x="400" y="486" text-anchor="middle" font-size="12" fill="#1e1b3a">Der Browser hängt das Cookie automatisch an – die App hält die Anfrage für echt.</text>
</svg>
