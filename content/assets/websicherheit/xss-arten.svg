<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">Drei Arten von Cross-Site Scripting</text>

  <g>
    <rect x="20" y="56" width="270" height="400" rx="16" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="155" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Reflected XSS</text>
    <rect x="45" y="110" width="220" height="62" rx="10" fill="#ffffff" stroke="#22d3ee"/>
    <text x="155" y="135" text-anchor="middle" font-size="13" fill="#1e1b3a">Präparierter Link</text>
    <text x="155" y="157" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">/suche?q=&lt;script&gt;…</text>
    <line x1="155" y1="172" x2="155" y2="208" stroke="#1e1b3a" stroke-width="2" marker-end="url(#p)"/>
    <rect x="45" y="212" width="220" height="62" rx="10" fill="#ffffff" stroke="#22d3ee"/>
    <text x="155" y="237" text-anchor="middle" font-size="13" fill="#1e1b3a">Server spiegelt q</text>
    <text x="155" y="259" text-anchor="middle" font-size="12" fill="#1e1b3a">„Ergebnisse für …“</text>
    <line x1="155" y1="274" x2="155" y2="310" stroke="#1e1b3a" stroke-width="2" marker-end="url(#p)"/>
    <rect x="45" y="314" width="220" height="62" rx="10" fill="#ffffff" stroke="#f87171" stroke-width="2"/>
    <text x="155" y="339" text-anchor="middle" font-size="13" fill="#1e1b3a">Browser des Opfers</text>
    <text x="155" y="361" text-anchor="middle" font-size="12" fill="#b91c1c">führt das Skript aus</text>
    <text x="155" y="410" text-anchor="middle" font-size="12" fill="#1e1b3a">Trifft, wer den Link öffnet</text>
  </g>

  <g>
    <rect x="315" y="56" width="270" height="400" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="450" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Stored XSS</text>
    <rect x="340" y="110" width="220" height="62" rx="10" fill="#ffffff" stroke="#a78bfa"/>
    <text x="450" y="135" text-anchor="middle" font-size="13" fill="#1e1b3a">Kommentar mit</text>
    <text x="450" y="157" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">&lt;script&gt;…&lt;/script&gt;</text>
    <line x1="450" y1="172" x2="450" y2="208" stroke="#1e1b3a" stroke-width="2" marker-end="url(#p)"/>
    <rect x="340" y="212" width="220" height="62" rx="10" fill="#ffffff" stroke="#a78bfa"/>
    <text x="450" y="237" text-anchor="middle" font-size="13" fill="#1e1b3a">Datenbank</text>
    <text x="450" y="259" text-anchor="middle" font-size="12" fill="#1e1b3a">speichert den Text</text>
    <line x1="450" y1="274" x2="450" y2="310" stroke="#1e1b3a" stroke-width="2" marker-end="url(#p)"/>
    <rect x="340" y="314" width="220" height="62" rx="10" fill="#ffffff" stroke="#f87171" stroke-width="2"/>
    <text x="450" y="339" text-anchor="middle" font-size="13" fill="#1e1b3a">Alle Besucher</text>
    <text x="450" y="361" text-anchor="middle" font-size="12" fill="#b91c1c">führen das Skript aus</text>
    <text x="450" y="410" text-anchor="middle" font-size="12" fill="#1e1b3a">Trifft jeden – auch Admins</text>
  </g>

  <g>
    <rect x="610" y="56" width="270" height="400" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="745" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">DOM-based XSS</text>
    <rect x="635" y="110" width="220" height="62" rx="10" fill="#ffffff" stroke="#f59e0b"/>
    <text x="745" y="135" text-anchor="middle" font-size="13" fill="#1e1b3a">Wert aus der URL</text>
    <text x="745" y="157" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">?name=&lt;img onerror=…&gt;</text>
    <line x1="745" y1="172" x2="745" y2="208" stroke="#1e1b3a" stroke-width="2" marker-end="url(#p)"/>
    <rect x="635" y="212" width="220" height="62" rx="10" fill="#ffffff" stroke="#f59e0b"/>
    <text x="745" y="237" text-anchor="middle" font-size="13" fill="#1e1b3a">Eigenes JavaScript</text>
    <text x="745" y="259" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">el.innerHTML = name</text>
    <line x1="745" y1="274" x2="745" y2="310" stroke="#1e1b3a" stroke-width="2" marker-end="url(#p)"/>
    <rect x="635" y="314" width="220" height="62" rx="10" fill="#ffffff" stroke="#f87171" stroke-width="2"/>
    <text x="745" y="339" text-anchor="middle" font-size="13" fill="#1e1b3a">Browser-DOM</text>
    <text x="745" y="361" text-anchor="middle" font-size="12" fill="#b91c1c">führt das Skript aus</text>
    <text x="745" y="410" text-anchor="middle" font-size="12" fill="#1e1b3a">Server sieht den Angriff oft nie</text>
  </g>
</svg>
