<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="200" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">N+1: 1 + 100 Abfragen</text>
  <text x="598" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Eager Loading: 2 Abfragen</text>
  <line x1="400" y1="40" x2="400" y2="320" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="15" y="50" width="90" height="250" rx="10" fill="#e0f7fb" stroke="#22d3ee" stroke-width="2"/>
  <text x="60" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b3a">Anwendung</text>
  <rect x="295" y="50" width="90" height="250" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="340" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b3a">Datenbank</text>
  <line x1="105" y1="70" x2="291" y2="70" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="200" y="64" text-anchor="middle" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">SELECT * FROM customers</text>
  <line x1="105" y1="105" x2="291" y2="105" stroke="#f87171" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="200" y="99" text-anchor="middle" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#b91c1c">… WHERE customer_id = 1</text>
  <line x1="105" y1="135" x2="291" y2="135" stroke="#f87171" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="200" y="129" text-anchor="middle" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#b91c1c">… WHERE customer_id = 2</text>
  <line x1="105" y1="165" x2="291" y2="165" stroke="#f87171" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="200" y="159" text-anchor="middle" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#b91c1c">… WHERE customer_id = 3</text>
  <text x="200" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#b91c1c">⋮</text>
  <line x1="105" y1="270" x2="291" y2="270" stroke="#f87171" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="200" y="264" text-anchor="middle" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#b91c1c">… WHERE customer_id = 100</text>
  <text x="200" y="322" text-anchor="middle" font-size="12" fill="#1e1b3a">101 Rundreisen × 2 ms Netz = über 200 ms Wartezeit</text>
  <rect x="415" y="50" width="90" height="250" rx="10" fill="#e0f7fb" stroke="#22d3ee" stroke-width="2"/>
  <text x="460" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b3a">Anwendung</text>
  <rect x="695" y="50" width="90" height="250" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="740" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b3a">Datenbank</text>
  <line x1="505" y1="110" x2="691" y2="110" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="598" y="104" text-anchor="middle" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">SELECT * FROM customers</text>
  <line x1="505" y1="200" x2="691" y2="200" stroke="#34d399" stroke-width="3" marker-end="url(#pfeil)"/>
  <text x="598" y="180" text-anchor="middle" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#047857">SELECT * FROM orders</text>
  <text x="598" y="194" text-anchor="middle" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#047857">WHERE customer_id IN (1, …, 100)</text>
  <text x="598" y="322" text-anchor="middle" font-size="12" fill="#1e1b3a">2 Rundreisen – die Zuordnung passiert im Arbeitsspeicher</text>
</svg>
