<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Caching-Schichten: je weiter links ein Treffer, desto schneller</text>
  <rect x="15" y="60" width="130" height="80" rx="10" fill="#e0f7fb" stroke="#22d3ee" stroke-width="2"/>
  <text x="80" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b3a">Browser-Cache</text>
  <text x="80" y="112" text-anchor="middle" font-size="11" fill="#1e1b3a">Cache-Control</text>
  <text x="80" y="128" text-anchor="middle" font-size="11" fill="#1e1b3a">0 ms</text>
  <rect x="170" y="60" width="130" height="80" rx="10" fill="#e0f7fb" stroke="#22d3ee" stroke-width="2"/>
  <text x="235" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b3a">CDN</text>
  <text x="235" y="112" text-anchor="middle" font-size="11" fill="#1e1b3a">nah bei den Nutzer:innen</text>
  <text x="235" y="128" text-anchor="middle" font-size="11" fill="#1e1b3a">~10–30 ms</text>
  <rect x="325" y="60" width="130" height="80" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="390" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b3a">Reverse Proxy</text>
  <text x="390" y="112" text-anchor="middle" font-size="11" fill="#1e1b3a">ganze Antworten</text>
  <text x="390" y="128" text-anchor="middle" font-size="11" fill="#1e1b3a">~1–5 ms</text>
  <rect x="480" y="60" width="140" height="80" rx="10" fill="#d1fae5" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b3a">App-Cache</text>
  <text x="550" y="112" text-anchor="middle" font-size="11" fill="#1e1b3a">Redis, Memoisierung</text>
  <text x="550" y="128" text-anchor="middle" font-size="11" fill="#1e1b3a">&lt; 1 ms</text>
  <rect x="645" y="60" width="140" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="715" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b3a">Datenbank</text>
  <text x="715" y="112" text-anchor="middle" font-size="11" fill="#1e1b3a">Quelle der Wahrheit</text>
  <text x="715" y="128" text-anchor="middle" font-size="11" fill="#1e1b3a">5–500 ms</text>
  <line x1="145" y1="100" x2="166" y2="100" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="300" y1="100" x2="321" y2="100" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="455" y1="100" x2="476" y2="100" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="620" y1="100" x2="641" y2="100" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="400" y="175" text-anchor="middle" font-size="13" fill="#1e1b3a">Eine Anfrage wandert nach rechts, bis eine Schicht eine gültige Kopie hat (Treffer).</text>
  <text x="400" y="195" text-anchor="middle" font-size="13" fill="#1e1b3a">Bei einem Fehlschlag fragt jede Schicht die nächste und merkt sich die Antwort für die TTL.</text>
  <rect x="140" y="220" width="520" height="56" rx="10" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
  <text x="400" y="243" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b3a">Je weiter links, desto weniger weiß die Schicht über Nutzer:innen.</text>
  <text x="400" y="263" text-anchor="middle" font-size="12" fill="#1e1b3a">Persönliche Daten nie in geteilten Caches (CDN, Proxy) ablegen – Cache-Control: private.</text>
</svg>
