<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="400" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Critical Rendering Path</text>
  <rect x="20" y="40" width="120" height="50" rx="8" fill="#e0f7fb" stroke="#22d3ee" stroke-width="2"/>
  <text x="80" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b3a">HTML</text>
  <rect x="20" y="180" width="120" height="50" rx="8" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="80" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b3a">CSS</text>
  <rect x="200" y="40" width="120" height="50" rx="8" fill="#e0f7fb" stroke="#22d3ee" stroke-width="2"/>
  <text x="260" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b3a">DOM</text>
  <rect x="200" y="180" width="120" height="50" rx="8" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="260" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b3a">CSSOM</text>
  <rect x="380" y="110" width="120" height="50" rx="8" fill="#d1fae5" stroke="#34d399" stroke-width="2"/>
  <text x="440" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b3a">Render Tree</text>
  <rect x="540" y="110" width="120" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b3a">Layout</text>
  <rect x="680" y="110" width="110" height="50" rx="8" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
  <text x="735" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b3a">Paint</text>
  <line x1="140" y1="65" x2="196" y2="65" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="140" y1="205" x2="196" y2="205" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="320" y1="70" x2="376" y2="125" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="320" y1="200" x2="376" y2="145" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="500" y1="135" x2="536" y2="135" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="660" y1="135" x2="676" y2="135" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <rect x="20" y="110" width="120" height="44" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="80" y="129" text-anchor="middle" font-size="12" font-weight="600" fill="#1e1b3a">&lt;script&gt;</text>
  <text x="80" y="145" text-anchor="middle" font-size="11" fill="#1e1b3a">ohne defer/async</text>
  <line x1="140" y1="122" x2="196" y2="88" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#pfeil)"/>
  <text x="168" y="118" text-anchor="middle" font-size="11" fill="#b91c1c">hält an</text>
  <text x="400" y="268" text-anchor="middle" font-size="13" fill="#1e1b3a">Erst wenn DOM und CSSOM fertig sind, kann der Browser berechnen, wo alles steht, und Pixel zeichnen.</text>
  <text x="400" y="288" text-anchor="middle" font-size="13" fill="#1e1b3a">Alles, was diesen Weg aufhält, verzögert den ersten sichtbaren Inhalt.</text>
</svg>
