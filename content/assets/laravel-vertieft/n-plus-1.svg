<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e1b3a">Das N+1-Problem: 50 Beiträge mit Autor anzeigen</text>
  <rect x="20" y="60" width="420" height="300" rx="14" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="230" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Lazy Loading: 1 + 50 Abfragen</text>
  <text x="40" y="118" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">$posts = Post::all();</text>
  <text x="40" y="138" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">foreach ($posts as $p) $p-&gt;author-&gt;name;</text>
  <rect x="40" y="156" width="380" height="26" rx="5" fill="#ffffff" stroke="#f87171"/>
  <text x="50" y="174" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">select * from posts</text>
  <rect x="40" y="188" width="380" height="26" rx="5" fill="#ffffff" stroke="#f87171"/>
  <text x="50" y="206" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">select * from users where id = 1</text>
  <rect x="40" y="220" width="380" height="26" rx="5" fill="#ffffff" stroke="#f87171"/>
  <text x="50" y="238" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">select * from users where id = 2</text>
  <rect x="40" y="252" width="380" height="26" rx="5" fill="#ffffff" stroke="#f87171"/>
  <text x="50" y="270" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">select * from users where id = 3</text>
  <rect x="40" y="284" width="380" height="26" rx="5" fill="#ffffff" stroke="#f87171"/>
  <text x="50" y="302" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">select * from users where id = 4</text>
  <text x="230" y="335" text-anchor="middle" font-size="14" fill="#1e1b3a">… und so weiter, 50-mal</text>
  <rect x="460" y="60" width="420" height="300" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="670" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Eager Loading: 2 Abfragen</text>
  <text x="480" y="118" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">$posts = Post::with('author')-&gt;get();</text>
  <text x="480" y="138" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">foreach ($posts as $p) $p-&gt;author-&gt;name;</text>
  <rect x="480" y="156" width="380" height="26" rx="5" fill="#ffffff" stroke="#34d399"/>
  <text x="490" y="174" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">select * from posts</text>
  <rect x="480" y="188" width="380" height="26" rx="5" fill="#ffffff" stroke="#34d399"/>
  <text x="490" y="206" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">select * from users where id in (1, 2, 3, …)</text>
  <text x="670" y="260" text-anchor="middle" font-size="14" fill="#1e1b3a">Laravel sammelt alle Autor-IDs</text>
  <text x="670" y="282" text-anchor="middle" font-size="14" fill="#1e1b3a">und lädt sie in einem Rutsch.</text>
  <text x="450" y="395" text-anchor="middle" font-size="14" fill="#1e1b3a">Gleiches Ergebnis, aber 51 statt 2 Datenbank-Runden – bei 1000 Beiträgen 1001 statt 2.</text>
</svg>
