<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#1e1b3a">Der Weg eines Jobs durch die Queue</text>
  <rect x="20" y="150" width="160" height="80" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  
  
  <rect x="230" y="150" width="160" height="80" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  
  
  <rect x="440" y="150" width="160" height="80" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  
  
  <rect x="650" y="60" width="230" height="80" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  
  
  <rect x="650" y="240" width="230" height="80" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  
  
  <line x1="182" y1="190" x2="226" y2="190" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pq)"/>
  <line x1="392" y1="190" x2="436" y2="190" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pq)"/>
  <line x1="602" y1="175" x2="646" y2="110" stroke="#34d399" stroke-width="2.5" marker-end="url(#pq)"/>
  <text x="600" y="128" font-size="12" fill="#1e1b3a">Erfolg</text>
  <line x1="602" y1="205" x2="646" y2="270" stroke="#f87171" stroke-width="2.5" marker-end="url(#pq)"/>
  <text x="590" y="262" font-size="12" fill="#1e1b3a">Fehler</text>
  <path d="M520,232 C520,300 310,300 310,234" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pq)"/>
  <text x="415" y="318" text-anchor="middle" font-size="12" fill="#1e1b3a">Fehler mit Versuchen übrig: zurück in die Queue (Backoff)</text>
  <text x="450" y="360" text-anchor="middle" font-size="13" fill="#1e1b3a">Der Request ist schon längst beantwortet, während der Worker im Hintergrund arbeitet.</text>
</svg>
