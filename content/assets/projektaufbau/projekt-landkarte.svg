<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b3a">Die fünf Dateiarten in einem Projekt</text>
  <rect x="40" y="60" width="300" height="370" rx="12" fill="#f8fafc" stroke="#1e1b3a" stroke-width="1.5"/>
  <text x="60" y="90" font-size="15" font-weight="700" fill="#1e1b3a">mein-projekt/</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#1e1b3a">
    <rect x="58" y="104" width="12" height="12" fill="#22d3ee"/><text x="80" y="115">src/</text>
    <rect x="58" y="132" width="12" height="12" fill="#22d3ee"/><text x="80" y="143">tests/</text>
    <rect x="58" y="160" width="12" height="12" fill="#a78bfa"/><text x="80" y="171">package.json</text>
    <rect x="58" y="188" width="12" height="12" fill="#a78bfa"/><text x="80" y="199">tsconfig.json</text>
    <rect x="58" y="216" width="12" height="12" fill="#a78bfa"/><text x="80" y="227">.gitignore</text>
    <rect x="58" y="244" width="12" height="12" fill="#a78bfa"/><text x="80" y="255">.env.example</text>
    <rect x="58" y="272" width="12" height="12" fill="#34d399"/><text x="80" y="283">README.md</text>
    <rect x="58" y="300" width="12" height="12" fill="#34d399"/><text x="80" y="311">docs/</text>
    <rect x="58" y="328" width="12" height="12" fill="#f59e0b"/><text x="80" y="339">node_modules/</text>
    <rect x="58" y="356" width="12" height="12" fill="#f59e0b"/><text x="80" y="367">dist/</text>
    <rect x="58" y="384" width="12" height="12" fill="#f87171"/><text x="80" y="395">.env</text>
  </g>
  <g font-size="14" fill="#1e1b3a">
    <rect x="380" y="80" width="380" height="60" rx="10" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="396" y="104" font-weight="700">Quellcode</text>
    <text x="396" y="126">Von Menschen geschrieben – wird committet</text>
    <rect x="380" y="150" width="380" height="60" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="396" y="174" font-weight="700">Konfiguration</text>
    <text x="396" y="196">Steuert Werkzeuge – wird committet</text>
    <rect x="380" y="220" width="380" height="60" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="396" y="244" font-weight="700">Dokumentation</text>
    <text x="396" y="266">Erklärt das Projekt – wird committet</text>
    <rect x="380" y="290" width="380" height="60" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="396" y="314" font-weight="700">Generiert</text>
    <text x="396" y="336">Von Werkzeugen erzeugt – wird ignoriert</text>
    <rect x="380" y="360" width="380" height="60" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
    <text x="396" y="384" font-weight="700">Geheim</text>
    <text x="396" y="406">Passwörter und Schlüssel – niemals committen</text>
  </g>
</svg>
