<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs><marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1e1b3a"/></marker></defs>
  <text x="430" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b3a">Wie ein Wert aus .env in deinen Code kommt</text>
  <g font-size="13" fill="#1e1b3a">
    <rect x="20" y="70" width="180" height="110" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="110" y="96" text-anchor="middle" font-size="15" font-weight="700">.env.example</text>
    <text x="110" y="122" text-anchor="middle">Vorlage ohne Geheimnisse</text>
    <text x="110" y="146" text-anchor="middle" font-weight="700" fill="#047857">committet</text>
    <rect x="240" y="70" width="180" height="110" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
    <text x="330" y="96" text-anchor="middle" font-size="15" font-weight="700">.env</text>
    <text x="330" y="122" text-anchor="middle">echte Werte pro Rechner</text>
    <text x="330" y="146" text-anchor="middle" font-weight="700" fill="#b91c1c">ignoriert</text>
    <rect x="460" y="70" width="180" height="110" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="550" y="96" text-anchor="middle" font-size="15" font-weight="700">config/app.php</text>
    <text x="550" y="122" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">env('APP_NAME')</text>
    <text x="550" y="146" text-anchor="middle">liest einmal ein</text>
    <rect x="680" y="70" width="160" height="110" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="760" y="96" text-anchor="middle" font-size="15" font-weight="700">Dein Code</text>
    <text x="760" y="122" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">config('app.name')</text>
    <text x="760" y="146" text-anchor="middle">nutzt den Wert</text>
    <line x1="200" y1="125" x2="236" y2="125" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
    <line x1="420" y1="125" x2="456" y2="125" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
    <line x1="640" y1="125" x2="676" y2="125" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
    <text x="218" y="210" text-anchor="middle" font-size="12" fill="#475569">cp</text>
    <text x="30" y="226" font-size="15" font-weight="700">Laravel (Server)</text>
    <line x1="20" y1="250" x2="840" y2="250" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="30" y="282" font-size="15" font-weight="700">Vite (Browser)</text>
    <rect x="20" y="300" width="250" height="90" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
    <text x="145" y="328" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">VITE_API_URL=…</text>
    <text x="145" y="354" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">DB_PASSWORD=…</text>
    <text x="145" y="376" text-anchor="middle" font-size="12">.env im Frontend</text>
    <rect x="320" y="300" width="250" height="90" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="445" y="328" text-anchor="middle" font-weight="700">vite build</text>
    <text x="445" y="354" text-anchor="middle">nur VITE_-Variablen</text>
    <text x="445" y="376" text-anchor="middle">werden eingesetzt</text>
    <rect x="620" y="300" width="220" height="90" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="730" y="328" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">import.meta.env</text>
    <text x="730" y="354" text-anchor="middle">im Bundle – für jeden</text>
    <text x="730" y="376" text-anchor="middle">Besucher lesbar!</text>
    <line x1="270" y1="345" x2="316" y2="345" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
    <line x1="570" y1="345" x2="616" y2="345" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  </g>
</svg>
