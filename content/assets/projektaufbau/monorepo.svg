<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs><marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1e1b3a"/></marker></defs>
  <text x="400" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b3a">Ein Monorepo: viele Projekte, ein Repository</text>
  <g font-size="13" fill="#1e1b3a">
    <rect x="20" y="56" width="760" height="320" rx="14" fill="#f8fafc" stroke="#1e1b3a" stroke-width="1.5"/>
    <text x="40" y="82" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700">mein-produkt/  (package.json mit "workspaces", README.md, .gitignore)</text>
    <text x="40" y="118" font-size="15" font-weight="700">apps/ – was ausgeliefert wird</text>
    <rect x="40" y="132" width="200" height="80" rx="10" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="140" y="164" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-weight="700">apps/web</text>
    <text x="140" y="188" text-anchor="middle">React-Frontend</text>
    <rect x="300" y="132" width="200" height="80" rx="10" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="400" y="164" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-weight="700">apps/admin</text>
    <text x="400" y="188" text-anchor="middle">Verwaltungsoberfläche</text>
    <rect x="560" y="132" width="200" height="80" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="660" y="164" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-weight="700">apps/api</text>
    <text x="660" y="188" text-anchor="middle">Backend</text>
    <text x="40" y="262" font-size="15" font-weight="700">packages/ – was geteilt wird</text>
    <rect x="40" y="276" width="200" height="80" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="140" y="308" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-weight="700">packages/ui</text>
    <text x="140" y="332" text-anchor="middle">gemeinsame Komponenten</text>
    <rect x="300" y="276" width="200" height="80" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="400" y="308" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-weight="700">packages/config</text>
    <text x="400" y="332" text-anchor="middle">tsconfig, Linter-Regeln</text>
    <line x1="140" y1="212" x2="140" y2="272" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
    <line x1="400" y1="212" x2="160" y2="272" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
    <line x1="160" y1="212" x2="390" y2="272" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
    <line x1="420" y1="212" x2="410" y2="272" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
    <text x="560" y="300" font-size="13">Pfeil = „nutzt“</text>
    <text x="560" y="324" font-size="13">Eine Änderung in packages/ui</text>
    <text x="560" y="344" font-size="13">wirkt sofort in web und admin.</text>
  </g>
</svg>
