<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="410" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b3a">Ein Laravel-Projekt auf einen Blick</text>
  <g font-size="13" fill="#1e1b3a">
    <rect x="30" y="60" width="240" height="120" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="46" y="84" font-size="15" font-weight="700">Dein Code</text>
    <text x="46" y="108" font-family="ui-monospace, Menlo, monospace">app/</text><text x="130" y="108">Logik, Models</text>
    <text x="46" y="132" font-family="ui-monospace, Menlo, monospace">routes/</text><text x="130" y="132">URLs → Code</text>
    <text x="46" y="156" font-family="ui-monospace, Menlo, monospace">resources/</text><text x="130" y="156">Views, JS, CSS</text>
    <rect x="290" y="60" width="240" height="120" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="306" y="84" font-size="15" font-weight="700">Einstellungen</text>
    <text x="306" y="108" font-family="ui-monospace, Menlo, monospace">config/</text><text x="390" y="108">Konfiguration</text>
    <text x="306" y="132" font-family="ui-monospace, Menlo, monospace">bootstrap/</text><text x="390" y="132">App starten</text>
    <text x="306" y="156" font-family="ui-monospace, Menlo, monospace">.env</text><text x="390" y="156">lokale Werte</text>
    <rect x="550" y="60" width="240" height="120" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="566" y="84" font-size="15" font-weight="700">Daten und Tests</text>
    <text x="566" y="108" font-family="ui-monospace, Menlo, monospace">database/</text><text x="660" y="108">Migrationen</text>
    <text x="566" y="132" font-family="ui-monospace, Menlo, monospace">tests/</text><text x="660" y="132">Unit, Feature</text>
    <text x="566" y="156" font-family="ui-monospace, Menlo, monospace">phpunit.xml</text><text x="660" y="156">Test-Setup</text>
    <rect x="30" y="210" width="370" height="110" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="46" y="234" font-size="15" font-weight="700">Vom Werkzeug verwaltet</text>
    <text x="46" y="260" font-family="ui-monospace, Menlo, monospace">vendor/</text><text x="150" y="260">Pakete von Composer (ignoriert)</text>
    <text x="46" y="286" font-family="ui-monospace, Menlo, monospace">storage/</text><text x="150" y="286">Logs, Cache, Uploads</text>
    <text x="46" y="308" font-size="12" fill="#475569">Inhalte werden zur Laufzeit erzeugt</text>
    <rect x="420" y="210" width="370" height="110" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
    <text x="436" y="234" font-size="15" font-weight="700">Öffentlich erreichbar</text>
    <text x="436" y="260" font-family="ui-monospace, Menlo, monospace">public/</text><text x="540" y="260">einziger Ordner fürs Web</text>
    <text x="436" y="286" font-family="ui-monospace, Menlo, monospace">public/index.php</text><text x="600" y="286">Einstiegspunkt</text>
    <text x="436" y="308" font-size="12" fill="#475569">Der Webserver zeigt nur hierhin</text>
    <rect x="30" y="350" width="760" height="90" rx="12" fill="#f8fafc" stroke="#1e1b3a" stroke-width="1.5"/>
    <text x="46" y="376" font-size="15" font-weight="700">Ablauf einer Anfrage</text>
    <text x="46" y="410" font-size="14">Browser → public/index.php → bootstrap/app.php → routes/web.php → app/… → resources/views → Antwort</text>
  </g>
</svg>
