<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b3a">Datenmodell: users, workshops, bookings</text>
  <rect x="30" y="70" width="230" height="170" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="145" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">users</text>
  <line x1="30" y1="110" x2="260" y2="110" stroke="#22d3ee"/>
  <text x="48" y="136" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">id  PK</text>
  <text x="48" y="160" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">name</text>
  <text x="48" y="184" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">email  UNIQUE</text>
  <text x="48" y="208" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">password (Hash)</text>
  <rect x="335" y="60" width="240" height="230" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="455" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">workshops</text>
  <line x1="335" y1="100" x2="575" y2="100" stroke="#34d399"/>
  <text x="352" y="126" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">id  PK</text>
  <text x="352" y="150" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">user_id  FK → users</text>
  <text x="352" y="174" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">title</text>
  <text x="352" y="198" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">description  NULL</text>
  <text x="352" y="222" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">location</text>
  <text x="352" y="246" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">starts_at  INDEX</text>
  <text x="352" y="270" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">capacity</text>
  <rect x="650" y="70" width="230" height="170" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="765" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">bookings</text>
  <line x1="650" y1="110" x2="880" y2="110" stroke="#f59e0b"/>
  <text x="667" y="136" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">id  PK</text>
  <text x="667" y="160" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">workshop_id  FK</text>
  <text x="667" y="184" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">user_id  FK</text>
  <text x="667" y="216" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">UNIQUE(workshop_id, user_id)</text>
  <line x1="262" y1="150" x2="333" y2="150" stroke="#1e1b3a" stroke-width="2"/>
  <text x="272" y="142" font-size="13" font-weight="700" fill="#1e1b3a">1</text>
  <text x="318" y="142" font-size="13" font-weight="700" fill="#1e1b3a">n</text>
  <text x="297" y="172" text-anchor="middle" font-size="11" fill="#1e1b3a">organisiert</text>
  <line x1="577" y1="160" x2="648" y2="160" stroke="#1e1b3a" stroke-width="2"/>
  <text x="587" y="152" font-size="13" font-weight="700" fill="#1e1b3a">1</text>
  <text x="633" y="152" font-size="13" font-weight="700" fill="#1e1b3a">n</text>
  <text x="612" y="182" text-anchor="middle" font-size="11" fill="#1e1b3a">hat</text>
  <path d="M145 242 C145 320, 765 320, 765 242" fill="none" stroke="#1e1b3a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="170" y="262" font-size="13" font-weight="700" fill="#1e1b3a">1</text>
  <text x="742" y="262" font-size="13" font-weight="700" fill="#1e1b3a">n</text>
  <text x="455" y="314" text-anchor="middle" font-size="12" fill="#1e1b3a">bucht (bookings ist die Zwischentabelle zwischen users und workshops)</text>
</svg>
