<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="500" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Der Weg einer Änderung: vom Branch zum Merge</text>
<g font-size="14" text-anchor="middle">
<rect x="20" y="110" width="140" height="80" rx="12" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-width="2.5"/>
<text x="90" y="98" fill="#475569" font-size="13">1</text>
<text x="90" y="155" font-weight="700" fill="#1e1b3a">Branch anlegen</text>
<rect x="180" y="110" width="140" height="80" rx="12" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-width="2.5"/>
<text x="250" y="98" fill="#475569" font-size="13">2</text>
<text x="250" y="155" font-weight="700" fill="#1e1b3a">Commits pushen</text>
<rect x="340" y="110" width="140" height="80" rx="12" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-width="2.5"/>
<text x="410" y="98" fill="#475569" font-size="13">3</text>
<text x="410" y="155" font-weight="700" fill="#1e1b3a">PR öffnen</text>
<rect x="500" y="110" width="140" height="80" rx="12" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-width="2.5"/>
<text x="570" y="98" fill="#475569" font-size="13">4</text>
<text x="570" y="155" font-weight="700" fill="#1e1b3a">Review + Checks</text>
<rect x="660" y="110" width="140" height="80" rx="12" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-width="2.5"/>
<text x="730" y="98" fill="#475569" font-size="13">5</text>
<text x="730" y="155" font-weight="700" fill="#1e1b3a">Merge</text>
<rect x="820" y="110" width="140" height="80" rx="12" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-width="2.5"/>
<text x="890" y="98" fill="#475569" font-size="13">6</text>
<text x="890" y="155" font-weight="700" fill="#1e1b3a">Branch löschen</text>
</g>
<g stroke="#64748b" stroke-width="2.5" marker-end="url(#a)">
<path d="M160 150 H 176"/><path d="M320 150 H 336"/><path d="M480 150 H 496"/><path d="M640 150 H 656"/><path d="M800 150 H 816"/>
</g>
<path d="M570 194 C 570 250, 250 250, 250 194" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/>
<text x="410" y="262" text-anchor="middle" font-size="13" fill="#475569">Änderungen gewünscht? Weitere Commits auf denselben Branch – der PR aktualisiert sich.</text>
</svg>
