<text x="700" y="148" text-anchor="middle" font-size="12" fill="#475569" font-family="ui-monospace, Menlo, monospace">github.com/du/app</text>
<rect x="320" y="355" width="260" height="100" rx="14" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-width="3"/>
<text x="450" y="394" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">lokal</text>
<text x="450" y="418" text-anchor="middle" font-size="13" fill="#475569">Klon auf deinem Rechner</text>
<text x="450" y="438" text-anchor="middle" font-size="12" fill="#475569" font-family="ui-monospace, Menlo, monospace">~/code/app</text>
<path d="M334 100 H 566" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<text x="450" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b3a">1 · Fork</text>
