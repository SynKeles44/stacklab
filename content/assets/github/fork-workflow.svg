<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Der Fork-Workflow mit drei Repositorys</text>
<rect x="70" y="65" width="260" height="100" rx="14" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-width="3"/>
<text x="200" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">upstream</text>
<text x="200" y="128" text-anchor="middle" font-size="13" fill="#475569">Original-Projekt auf GitHub</text>
<text x="200" y="148" text-anchor="middle" font-size="12" fill="#475569" font-family="ui-monospace, Menlo, monospace">github.com/projekt/app</text>
<rect x="570" y="65" width="260" height="100" rx="14" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-width="3"/>
<text x="700" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">origin</text>
