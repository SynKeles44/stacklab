<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">Hash-Tabelle: aus dem Schlüssel wird ein Fach</text>
  <text x="70" y="70" font-size="15" font-weight="700" fill="#1e1b3a">Schlüssel</text>
  <text x="300" y="70" font-size="15" font-weight="700" fill="#1e1b3a">Hash-Funktion</text>
  <text x="560" y="70" font-size="15" font-weight="700" fill="#1e1b3a">Fächer (Buckets)</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#1e1b3a">
    <rect x="40" y="100" width="140" height="44" rx="8" fill="#cffafe" stroke="#22d3ee" stroke-width="2"/><text x="110" y="128" text-anchor="middle">"ada"</text>
    <rect x="40" y="200" width="140" height="44" rx="8" fill="#cffafe" stroke="#22d3ee" stroke-width="2"/><text x="110" y="228" text-anchor="middle">"linus"</text>
    <rect x="40" y="300" width="140" height="44" rx="8" fill="#cffafe" stroke="#22d3ee" stroke-width="2"/><text x="110" y="328" text-anchor="middle">"grace"</text>
  </g>
  <rect x="270" y="160" width="170" height="100" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <text x="355" y="205" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">hash(schlüssel)</text>
  <text x="355" y="230" text-anchor="middle" font-size="14" fill="#1e1b3a">→ Fachnummer</text>
  <line x1="180" y1="122" x2="268" y2="185" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="180" y1="222" x2="268" y2="212" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="180" y1="322" x2="268" y2="240" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <g font-size="14" fill="#1e1b3a">
    <rect x="520" y="90" width="60" height="50" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="550" y="120" text-anchor="middle">0</text>
    <rect x="520" y="140" width="60" height="50" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="550" y="170" text-anchor="middle">1</text>
    <rect x="520" y="190" width="60" height="50" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="550" y="220" text-anchor="middle">2</text>
    <rect x="520" y="240" width="60" height="50" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="550" y="270" text-anchor="middle">3</text>
    <rect x="520" y="290" width="60" height="50" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="550" y="320" text-anchor="middle">4</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#1e1b3a">
    <rect x="600" y="148" width="90" height="34" rx="6" fill="#d1fae5" stroke="#34d399" stroke-width="2"/><text x="645" y="171" text-anchor="middle">ada</text>
    <rect x="600" y="248" width="90" height="34" rx="6" fill="#d1fae5" stroke="#34d399" stroke-width="2"/><text x="645" y="271" text-anchor="middle">linus</text>
    <rect x="700" y="248" width="90" height="34" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text x="745" y="271" text-anchor="middle">grace</text>
  </g>
  <line x1="440" y1="190" x2="518" y2="165" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="440" y1="225" x2="518" y2="262" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="745" y="310" text-anchor="middle" font-size="13" fill="#b91c1c">Kollision:</text>
  <text x="745" y="328" text-anchor="middle" font-size="13" fill="#b91c1c">gleiches Fach</text>
  <text x="400" y="395" text-anchor="middle" font-size="16" fill="#1e1b3a">Suchen = Fach berechnen + wenige Einträge prüfen → im Mittel <tspan font-weight="700" fill="#047857">O(1)</tspan></text>
</svg>
