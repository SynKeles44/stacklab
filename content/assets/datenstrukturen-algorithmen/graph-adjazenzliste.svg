<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <line x1="110" y1="110" x2="330" y2="110" stroke="#1e1b3a" stroke-width="2"/>
  <line x1="110" y1="110" x2="110" y2="290" stroke="#1e1b3a" stroke-width="2"/>
  <line x1="330" y1="110" x2="330" y2="290" stroke="#1e1b3a" stroke-width="2"/>
  <line x1="110" y1="290" x2="330" y2="290" stroke="#1e1b3a" stroke-width="2"/>
  <line x1="330" y1="290" x2="470" y2="200" stroke="#1e1b3a" stroke-width="2"/>
  <circle cx="110" cy="110" r="28" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/>
  <text x="110" y="117" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">A</text>
  <circle cx="330" cy="110" r="28" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/>
  <text x="330" y="117" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">B</text>
  <circle cx="110" cy="290" r="28" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/>
  <text x="110" y="297" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">C</text>
  <circle cx="330" cy="290" r="28" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/>
  <text x="330" y="297" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">D</text>
  <circle cx="470" cy="200" r="28" fill="#d1fae5" stroke="#34d399" stroke-width="3"/>
  <text x="470" y="207" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">E</text>
  <text x="260" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Graph (ungerichtet, mit Kreis A–B–D–C)</text>
  <text x="220" y="98" text-anchor="middle" font-size="13" fill="#1e1b3a">Kante</text>
  <text x="220" y="360" text-anchor="middle" font-size="14" fill="#1e1b3a">Knoten = Kreise, Kanten = Linien</text>
  <rect x="540" y="70" width="240" height="250" rx="12" fill="#f8fafc" stroke="#22d3ee" stroke-width="2"/>
  <text x="660" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Adjazenzliste (Map)</text>
  <text x="565" y="140" font-size="17" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">A → [B, C]</text>
  <text x="565" y="176" font-size="17" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">B → [A, D]</text>
  <text x="565" y="212" font-size="17" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">C → [A, D]</text>
  <text x="565" y="248" font-size="17" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">D → [B, C, E]</text>
  <text x="565" y="284" font-size="17" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">E → [D]</text>
</svg>
