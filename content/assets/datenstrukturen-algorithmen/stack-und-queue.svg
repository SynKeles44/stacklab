<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="170" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">Stack (LIFO)</text>
  <text x="560" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">Queue (FIFO)</text>
  <polyline points="100,110 100,350 240,350 240,110" fill="none" stroke="#1e1b3a" stroke-width="3"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#1e1b3a" text-anchor="middle">
    <rect x="110" y="290" width="120" height="52" rx="6" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="170" y="322">A</text>
    <rect x="110" y="232" width="120" height="52" rx="6" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="170" y="264">B</text>
    <rect x="110" y="174" width="120" height="52" rx="6" fill="#d1fae5" stroke="#34d399" stroke-width="3"/><text x="170" y="206">C</text>
  </g>
  <line x1="150" y1="70" x2="150" y2="160" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="190" y1="160" x2="190" y2="70" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="140" y="85" text-anchor="end" font-size="15" fill="#1e1b3a">push</text>
  <text x="200" y="85" font-size="15" fill="#1e1b3a">pop → C</text>
  <text x="170" y="385" text-anchor="middle" font-size="15" fill="#1e1b3a">zuletzt rein, zuerst raus</text>
  <line x1="380" y1="170" x2="760" y2="170" stroke="#1e1b3a" stroke-width="3"/>
  <line x1="380" y1="260" x2="760" y2="260" stroke="#1e1b3a" stroke-width="3"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#1e1b3a" text-anchor="middle">
    <rect x="420" y="185" width="90" height="60" rx="6" fill="#d1fae5" stroke="#34d399" stroke-width="3"/><text x="465" y="221">A</text>
    <rect x="520" y="185" width="90" height="60" rx="6" fill="#cffafe" stroke="#22d3ee" stroke-width="2"/><text x="565" y="221">B</text>
    <rect x="620" y="185" width="90" height="60" rx="6" fill="#cffafe" stroke="#22d3ee" stroke-width="2"/><text x="665" y="221">C</text>
  </g>
  <line x1="780" y1="300" x2="720" y2="300" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="780" y="325" text-anchor="end" font-size="15" fill="#1e1b3a">enqueue (hinten)</text>
  <line x1="410" y1="300" x2="350" y2="300" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="350" y="325" font-size="15" fill="#1e1b3a">dequeue → A</text>
  <text x="560" y="385" text-anchor="middle" font-size="15" fill="#1e1b3a">zuerst rein, zuerst raus</text>
</svg>
