<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">Vom Code zum Release mit Changesets</text>
<rect x="20" y="80" width="200" height="150" rx="14" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-width="3"/>
<text x="120" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">1. Ändern</text>
<text x="120" y="142" text-anchor="middle" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">bunx changeset</text>
<text x="120" y="172" text-anchor="middle" font-size="12" fill="#475569">.changeset/xyz.md</text>
<text x="120" y="192" text-anchor="middle" font-size="12" fill="#475569" font-family="ui-monospace, Menlo, monospace">"@kiosk/preise": minor</text>
<text x="120" y="215" text-anchor="middle" font-size="12" fill="#475569">mit dem Code committen</text>
<rect x="260" y="80" width="200" height="150" rx="14" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-width="3"/>
<text x="360" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">2. Sammeln</text>
<text x="360" y="142" text-anchor="middle" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">changeset status</text>
<text x="360" y="172" text-anchor="middle" font-size="12" fill="#475569">mehrere Changesets</text>
<text x="360" y="192" text-anchor="middle" font-size="12" fill="#475569">aus vielen Pull Requests</text>
<rect x="500" y="80" width="200" height="150" rx="14" fill="#34d399" fill-opacity=".16" stroke="#34d399" stroke-width="3"/>
<text x="600" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">3. Versionieren</text>
<text x="600" y="142" text-anchor="middle" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">changeset version</text>
<text x="600" y="168" text-anchor="middle" font-size="12" fill="#475569">preise 1.0.0 → 1.1.0</text>
<text x="600" y="188" text-anchor="middle" font-size="12" fill="#475569">kasse 0.1.0 → 0.1.1</text>
<text x="600" y="210" text-anchor="middle" font-size="12" fill="#475569">CHANGELOG.md je Paket</text>
<rect x="740" y="80" width="200" height="150" rx="14" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-width="3"/>
<text x="840" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">4. Veröffentlichen</text>
<text x="840" y="142" text-anchor="middle" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">changeset publish</text>
<text x="840" y="172" text-anchor="middle" font-size="12" fill="#475569">neue Versionen in die</text>
<text x="840" y="192" text-anchor="middle" font-size="12" fill="#475569">Registry, Git-Tags</text>
<line x1="222" y1="155" x2="256" y2="155" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="462" y1="155" x2="496" y2="155" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="702" y1="155" x2="736" y2="155" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="480" y="280" text-anchor="middle" font-size="13" fill="#1e1b3a">Schritt 1 passiert bei jeder Änderung, Schritte 3 und 4 nur beim Release</text>
</svg>
