<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="800" height="340" fill="#ffffff"/>
<text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Wie die Shell einen Befehl findet</text>
<rect x="30" y="60" width="200" height="60" rx="12" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-width="3"/>
<text x="130" y="96" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">$ pint</text>
<text x="130" y="150" text-anchor="middle" font-size="13" fill="#475569">Kein / im Namen:</text>
<text x="130" y="170" text-anchor="middle" font-size="13" fill="#475569">Shell durchsucht PATH</text>
<text x="130" y="190" text-anchor="middle" font-size="13" fill="#475569">von links nach rechts</text>
<path d="M232 90 H 296" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<rect x="300" y="60" width="460" height="52" rx="10" fill="#e2e8f0" fill-opacity=".5" stroke="#94a3b8" stroke-width="2"/>
<text x="320" y="92" font-size="15" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">1. /home/du/.local/bin/pint</text><text x="740" y="92" text-anchor="end" font-size="14" fill="#f87171">fehlt</text>
<rect x="300" y="122" width="460" height="52" rx="10" fill="#34d399" fill-opacity=".16" stroke="#34d399" stroke-width="3"/>
<text x="320" y="154" font-size="15" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">2. /opt/composer/vendor/bin/pint</text><text x="740" y="154" text-anchor="end" font-size="14" font-weight="700" fill="#059669">Treffer!</text>
<rect x="300" y="184" width="460" height="52" rx="10" fill="#e2e8f0" fill-opacity=".3" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
<text x="320" y="216" font-size="15" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace">3. /usr/local/bin/pint</text><text x="740" y="216" text-anchor="end" font-size="14" fill="#94a3b8">nicht mehr gesucht</text>
<rect x="30" y="262" width="730" height="56" rx="12" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-width="2"/>
<text x="395" y="288" text-anchor="middle" font-size="14" fill="#1e1b3a">Projekt-Version gezielt starten: <tspan font-family="ui-monospace, Menlo, monospace">vendor/bin/pint</tspan> oder <tspan font-family="ui-monospace, Menlo, monospace">npx eslint</tspan></text>
<text x="395" y="308" text-anchor="middle" font-size="13" fill="#475569">Ein Pfad mit / umgeht die PATH-Suche komplett.</text>
</svg>
