<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="800" height="320" fill="#ffffff"/>
<text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Der Weg eines Pakets</text>
<rect x="20" y="90" width="160" height="140" rx="14" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-width="3"/>
<text x="100" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a"></text>
<text x="100" y="212" text-anchor="middle" font-size="12" fill="#475569">schreibt Code + Manifest</text>
<rect x="220" y="90" width="160" height="140" rx="14" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-width="3"/>
<text x="300" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a"></text>
<text x="300" y="212" text-anchor="middle" font-size="12" fill="#475569">speichert alle Versionen</text>
<rect x="420" y="90" width="160" height="140" rx="14" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-width="3"/>
<text x="500" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a"></text>
<text x="500" y="212" text-anchor="middle" font-size="12" fill="#475569">löst Versionen auf</text>
<rect x="620" y="90" width="160" height="140" rx="14" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-width="3"/>
<text x="700" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a"></text>
<text x="700" y="212" text-anchor="middle" font-size="12" fill="#475569">Abhängigkeiten + Lockfile</text>
<path d="M182 130 H 216" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<path d="M382 130 H 416" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<path d="M582 130 H 616" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<text x="200" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">npm publish</text>
<text x="400" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">Download</text>
<text x="600" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">npm install</text>
<text x="400" y="300" text-anchor="middle" font-size="12" fill="#475569">Bei PHP: Packagist liefert nur Metadaten, die Dateien kommen meist direkt von GitHub.</text>
</svg>
