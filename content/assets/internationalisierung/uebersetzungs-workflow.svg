<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="430" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b3a">Der Weg eines Textes durch den Übersetzungs-Workflow</text>
  <g font-size="15" fill="#1e1b3a" text-anchor="middle">
    <rect x="20" y="80" width="170" height="90" rx="12" fill="#e0f7fb" stroke="#22d3ee" stroke-width="2"/>
    <text x="105" y="108" font-weight="700">1. Code</text>
    <text x="105" y="134" font-family="ui-monospace, Menlo, monospace" font-size="13">t('cart.title')</text>
    <text x="105" y="156" font-size="13">Entwickler:in</text>

    <rect x="235" y="80" width="170" height="90" rx="12" fill="#efe9fe" stroke="#a78bfa" stroke-width="2"/>
    <text x="320" y="108" font-weight="700">2. Extraktion</text>
    <text x="320" y="134" font-size="13">Werkzeug findet</text>
    <text x="320" y="152" font-size="13">neue Schlüssel</text>

    <rect x="450" y="80" width="170" height="90" rx="12" fill="#e3f9ef" stroke="#34d399" stroke-width="2"/>
    <text x="535" y="108" font-weight="700">3. Quellkatalog</text>
    <text x="535" y="134" font-family="ui-monospace, Menlo, monospace" font-size="13">de.json</text>
    <text x="535" y="156" font-size="13">Ausgangssprache</text>

    <rect x="665" y="80" width="175" height="90" rx="12" fill="#fef3e0" stroke="#f59e0b" stroke-width="2"/>
    <text x="752" y="108" font-weight="700">4. Übersetzung</text>
    <text x="752" y="134" font-size="13">Übersetzer:in oder TMS</text>
    <text x="752" y="156" font-size="13">mit Kontext</text>

    <rect x="560" y="220" width="280" height="80" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
    <text x="700" y="248" font-weight="700">5. Zielkataloge</text>
    <text x="700" y="274" font-family="ui-monospace, Menlo, monospace" font-size="13">en.json · fr.json · ar.json</text>

    <rect x="235" y="220" width="250" height="80" rx="12" fill="#ffffff" stroke="#1e1b3a" stroke-width="2"/>
    <text x="360" y="248" font-weight="700">6. Prüfung in CI</text>
    <text x="360" y="274" font-size="13">fehlende Schlüssel, Platzhalter</text>

    <rect x="20" y="220" width="170" height="80" rx="12" fill="#e0f7fb" stroke="#22d3ee" stroke-width="2"/>
    <text x="105" y="248" font-weight="700">7. Laufzeit</text>
    <text x="105" y="274" font-size="13">UI in jeder Sprache</text>
  </g>
  <g stroke="#1e1b3a" stroke-width="2" fill="none" marker-end="url(#pfeil)">
    <line x1="190" y1="125" x2="233" y2="125"/>
    <line x1="405" y1="125" x2="448" y2="125"/>
    <line x1="620" y1="125" x2="663" y2="125"/>
    <line x1="752" y1="170" x2="752" y2="218"/>
    <line x1="560" y1="260" x2="487" y2="260"/>
    <line x1="235" y1="260" x2="192" y2="260"/>
  </g>
</svg>
