<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="410" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b3a">Speichern in UTC, anzeigen in der Zeitzone der Person</text>
  <rect x="40" y="130" width="250" height="110" rx="14" fill="#efe9fe" stroke="#a78bfa" stroke-width="3"/>
  <text x="165" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Datenbank / API</text>
  <text x="165" y="198" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#1e1b3a">2026-03-29T01:30:00Z</text>
  <text x="165" y="224" text-anchor="middle" font-size="14" fill="#1e1b3a">ein Zeitpunkt, in UTC</text>
  <g stroke="#1e1b3a" stroke-width="2" fill="none" marker-end="url(#pf)">
    <path d="M290 165 C 360 165, 380 90, 470 90"/>
    <line x1="290" y1="185" x2="470" y2="185"/>
    <path d="M290 205 C 360 205, 380 280, 470 280"/>
  </g>
  <g font-size="14" fill="#1e1b3a">
    <rect x="470" y="60" width="310" height="62" rx="10" fill="#e0f7fb" stroke="#22d3ee" stroke-width="2"/>
    <text x="485" y="85" font-weight="700">Europe/Berlin (de-DE)</text>
    <text x="485" y="108" font-family="ui-monospace, Menlo, monospace">29.03.2026, 03:30 (Sommerzeit)</text>
    <rect x="470" y="155" width="310" height="62" rx="10" fill="#e3f9ef" stroke="#34d399" stroke-width="2"/>
    <text x="485" y="180" font-weight="700">Asia/Tokyo (de-DE)</text>
    <text x="485" y="203" font-family="ui-monospace, Menlo, monospace">29.03.2026, 10:30</text>
    <rect x="470" y="250" width="310" height="62" rx="10" fill="#fef3e0" stroke="#f59e0b" stroke-width="2"/>
    <text x="485" y="275" font-weight="700">America/New_York (de-DE)</text>
    <text x="485" y="298" font-family="ui-monospace, Menlo, monospace">28.03.2026, 21:30 – anderer Tag!</text>
