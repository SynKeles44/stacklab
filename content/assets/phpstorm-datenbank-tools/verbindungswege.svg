<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs><marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/></marker></defs>
  <text x="20" y="30" font-size="16" font-weight="700" fill="#1e1b3a">Drei Wege von PhpStorm zur Datenbank</text>
  <!-- row 1 -->
  <text x="20" y="72" font-size="13" font-weight="700" fill="#64748b">1 · Lokal installiert</text>
  <rect x="20" y="84" width="150" height="56" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="95" y="117" font-size="14" font-weight="700" fill="#1e1b3a" text-anchor="middle">PhpStorm</text>
  <line x1="170" y1="112" x2="600" y2="112" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="385" y="104" font-size="13" fill="#1e1b3a" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">localhost:5432</text>
  <rect x="605" y="84" width="230" height="56" rx="8" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/><text x="720" y="110" font-size="14" font-weight="700" fill="#1e1b3a" text-anchor="middle">PostgreSQL</text><text x="720" y="128" font-size="12" fill="#64748b" text-anchor="middle">lauscht auf Port 5432</text>
  <!-- row 2 -->
  <text x="20" y="200" font-size="13" font-weight="700" fill="#64748b">2 · Im Docker-Container</text>
  <rect x="20" y="212" width="150" height="56" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="95" y="245" font-size="14" font-weight="700" fill="#1e1b3a" text-anchor="middle">PhpStorm</text>
  <line x1="170" y1="240" x2="330" y2="240" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="250" y="232" font-size="13" fill="#1e1b3a" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">localhost:5433</text>
  <rect x="335" y="214" width="150" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="410" y="237" font-size="13" font-weight="700" fill="#1e1b3a" text-anchor="middle">Port-Mapping</text><text x="410" y="255" font-size="12" fill="#1e1b3a" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">"5433:5432"</text>
  <line x1="485" y1="240" x2="600" y2="240" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <rect x="595" y="196" width="250" height="90" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="605" y="212" font-size="11" fill="#64748b">Container postgres:18</text>
  <rect x="605" y="218" width="230" height="56" rx="8" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/><text x="720" y="244" font-size="14" font-weight="700" fill="#1e1b3a" text-anchor="middle">PostgreSQL</text><text x="720" y="262" font-size="12" fill="#64748b" text-anchor="middle">Port 5432 im Container</text>
  <!-- row 3 -->
  <text x="20" y="338" font-size="13" font-weight="700" fill="#64748b">3 · Auf einem Server hinter SSH (Tunnel)</text>
  <rect x="20" y="350" width="150" height="56" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="95" y="383" font-size="14" font-weight="700" fill="#1e1b3a" text-anchor="middle">PhpStorm</text>
  <rect x="170" y="364" width="190" height="28" fill="#fef3c7" stroke="#f59e0b"/><text x="265" y="383" font-size="12" fill="#1e1b3a" text-anchor="middle">SSH-Tunnel · Port 22</text>
  <line x1="360" y1="378" x2="380" y2="378" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <rect x="385" y="350" width="150" height="56" rx="8" fill="#f0fdf4" stroke="#34d399" stroke-width="2"/><text x="460" y="374" font-size="13" font-weight="700" fill="#1e1b3a" text-anchor="middle">Bastion-Host</text><text x="460" y="392" font-size="11" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">203.0.113.10</text>
  <line x1="535" y1="378" x2="600" y2="378" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="567" y="370" font-size="11" fill="#1e1b3a" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">:5432</text>
  <rect x="605" y="350" width="230" height="56" rx="8" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/><text x="720" y="374" font-size="14" font-weight="700" fill="#1e1b3a" text-anchor="middle">PostgreSQL</text><text x="720" y="392" font-size="11" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">198.51.100.20 (intern)</text>
  <text x="20" y="438" font-size="12" fill="#64748b">Fall 3: Die Datenbank ist von außen nicht erreichbar. PhpStorm baut selbst die SSH-Verbindung auf</text><text x="20" y="456" font-size="12" fill="#64748b">(Reiter SSH/SSL) und leitet den Datenbank-Verkehr durch diesen Tunnel.</text>
</svg>
