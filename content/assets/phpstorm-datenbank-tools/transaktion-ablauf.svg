<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/></marker></defs>
  <text x="20" y="30" font-size="16" font-weight="700" fill="#1e1b3a">Auto-Commit und manueller Modus in der Query-Konsole</text>
  <!-- auto -->
  <rect x="20" y="50" width="860" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="34" y="62" width="90" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="79" y="79" font-size="12" text-anchor="middle" fill="#1e1b3a">Tx: Auto ▾</text>
  <text x="140" y="79" font-size="13" fill="#1e1b3a">Jedes Statement ist sofort eine eigene, abgeschlossene Transaktion.</text>
  <g font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a" text-anchor="middle">
    <rect x="40" y="110" width="170" height="40" rx="6" fill="#ecfeff" stroke="#22d3ee"/><text x="125" y="135">UPDATE … id = 1</text>
    <rect x="240" y="110" width="100" height="40" rx="6" fill="#dcfce7" stroke="#34d399"/><text x="290" y="135">COMMIT</text>
    <rect x="380" y="110" width="170" height="40" rx="6" fill="#ecfeff" stroke="#22d3ee"/><text x="465" y="135">UPDATE … id = 2</text>
    <rect x="580" y="110" width="100" height="40" rx="6" fill="#dcfce7" stroke="#34d399"/><text x="630" y="135">COMMIT</text>
  </g>
  <g stroke="#1e1b3a" stroke-width="2"><line x1="210" y1="130" x2="236" y2="130" marker-end="url(#p)"/><line x1="340" y1="130" x2="376" y2="130" marker-end="url(#p)"/><line x1="550" y1="130" x2="576" y2="130" marker-end="url(#p)"/></g>
  <text x="700" y="128" font-size="12" fill="#1e1b3a">automatisch,</text><text x="700" y="145" font-size="12" fill="#1e1b3a">nicht rückgängig</text>
  <text x="40" y="182" font-size="12" fill="#64748b">Commit- und Rollback-Knopf sind ausgegraut – es gibt nichts Offenes.</text>
  <!-- manual -->
  <rect x="20" y="220" width="860" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="34" y="232" width="100" height="24" rx="4" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/><text x="84" y="249" font-size="12" text-anchor="middle" fill="#1e1b3a">Tx: Manual ▾</text>
  <rect x="142" y="232" width="30" height="24" rx="4" fill="#dcfce7"/><text x="157" y="249" font-size="12" text-anchor="middle">✓</text>
  <rect x="178" y="232" width="30" height="24" rx="4" fill="#fee2e2"/><text x="193" y="249" font-size="12" text-anchor="middle">↶</text>
  <text x="222" y="249" font-size="13" fill="#1e1b3a">Statements sammeln sich in einer offenen Transaktion, bis du entscheidest.</text>
  <rect x="40" y="272" width="520" height="70" rx="8" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="50" y="288" font-size="11" fill="#6d28d9">offene Transaktion (nur du siehst die Änderungen)</text>
  <g font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a" text-anchor="middle">
    <rect x="55" y="296" width="140" height="36" rx="6" fill="#ecfeff" stroke="#22d3ee"/><text x="125" y="319">UPDATE … 1</text>
    <rect x="225" y="296" width="140" height="36" rx="6" fill="#ecfeff" stroke="#22d3ee"/><text x="295" y="319">UPDATE … 2</text>
    <rect x="395" y="296" width="150" height="36" rx="6" fill="#ecfeff" stroke="#22d3ee"/><text x="470" y="319">SELECT (prüfen)</text>
  </g>
  <g stroke="#1e1b3a" stroke-width="2"><line x1="560" y1="300" x2="640" y2="282" marker-end="url(#p)"/><line x1="560" y1="320" x2="640" y2="352" marker-end="url(#p)"/></g>
  <rect x="645" y="262" width="220" height="36" rx="6" fill="#dcfce7" stroke="#34d399"/><text x="755" y="285" font-size="13" text-anchor="middle" fill="#1e1b3a">✓ Commit: alles dauerhaft</text>
  <rect x="645" y="336" width="220" height="36" rx="6" fill="#fee2e2" stroke="#f87171"/><text x="755" y="359" font-size="13" text-anchor="middle" fill="#1e1b3a">↶ Roll back: alles verworfen</text>
  <text x="40" y="392" font-size="12" fill="#64748b">Alles oder nichts: Beide UPDATEs landen gemeinsam in der Datenbank – oder keins von beiden.</text>
</svg>
