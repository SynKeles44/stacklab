<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#1e1b3a">Schema: Daten-Editor für die Tabelle „orders“ (vereinfacht)</text>
  <rect x="20" y="42" width="820" height="410" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <!-- toolbar -->
  <g font-size="12" fill="#1e1b3a" text-anchor="middle">
    <rect x="32" y="52" width="70" height="26" rx="4" fill="#e2e8f0"/><text x="67" y="70">⟳ Reload</text>
    <rect x="108" y="52" width="70" height="26" rx="4" fill="#dcfce7"/><text x="143" y="70">+ Add Row</text>
    <rect x="184" y="52" width="80" height="26" rx="4" fill="#fee2e2"/><text x="224" y="70">− Delete Row</text>
    <rect x="270" y="52" width="70" height="26" rx="4" fill="#e2e8f0"/><text x="305" y="70">↶ Revert</text>
    <rect x="346" y="52" width="70" height="26" rx="4" fill="#a78bfa"/><text x="381" y="70" fill="#ffffff" font-weight="700">⇧ Submit</text>
    <rect x="422" y="52" width="70" height="26" rx="4" fill="#e2e8f0"/><text x="457" y="70">👁 DML</text>
    <rect x="498" y="52" width="90" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="543" y="70">Tx: Auto ▾</text>
    <rect x="700" y="52" width="130" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="765" y="70">⤓ CSV ▾ (Export)</text>
  </g>
  <!-- filter row -->
  <rect x="32" y="88" width="400" height="26" rx="4" fill="#ffffff" stroke="#22d3ee" stroke-width="2"/>
  <text x="40" y="106" font-size="12" font-weight="700" fill="#0e7490">WHERE</text><text x="92" y="106" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">status = 'open'</text>
  <rect x="440" y="88" width="390" height="26" rx="4" fill="#ffffff" stroke="#22d3ee" stroke-width="2"/>
  <text x="448" y="106" font-size="12" font-weight="700" fill="#0e7490">ORDER BY</text><text x="520" y="106" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">total DESC</text>
  <!-- grid -->
  <g font-size="13" fill="#1e1b3a">
    <rect x="32" y="124" width="798" height="28" fill="#e2e8f0"/>
    <text x="50" y="143" font-weight="700">id</text><text x="160" y="143" font-weight="700">customer_id</text><text x="340" y="143" font-weight="700">status</text><text x="500" y="143" font-weight="700">total ▼</text>
    <rect x="32" y="152" width="798" height="28" fill="#ffffff"/>
    <text x="50" y="171">17</text><text x="160" y="171">42</text><text x="340" y="171">open</text>
    <rect x="490" y="155" width="110" height="22" fill="#dbeafe" stroke="#3b82f6"/><text x="500" y="171">129.90</text><text x="620" y="171" font-size="11" fill="#3b82f6">geändert, noch nicht gesendet</text>
    <rect x="32" y="180" width="798" height="28" fill="#f8fafc"/>
    <text x="50" y="199">8</text><text x="160" y="199">7</text><text x="340" y="199">open</text><text x="500" y="199">88.00</text>
    <rect x="32" y="208" width="798" height="28" fill="#fee2e2"/>
    <text x="50" y="227" text-decoration="line-through">23</text><text x="160" y="227" text-decoration="line-through">42</text><text x="340" y="227" text-decoration="line-through">open</text><text x="500" y="227" text-decoration="line-through">12.50</text><text x="620" y="227" font-size="11" fill="#b91c1c">zum Löschen markiert</text>
    <rect x="32" y="236" width="798" height="28" fill="#dcfce7"/>
    <text x="50" y="255" fill="#64748b">&lt;generated&gt;</text><text x="160" y="255">99</text><text x="340" y="255">open</text><text x="500" y="255">5.00</text><text x="620" y="255" font-size="11" fill="#15803d">neue Zeile</text>
  </g>
  <!-- pending changes -->
  <rect x="32" y="284" width="798" height="150" rx="6" fill="#ffffff" stroke="#a78bfa" stroke-dasharray="6 4"/>
  <text x="44" y="306" font-size="12" font-weight="700" fill="#6d28d9">DML-Vorschau (Preview Pending Changes) – das schickt Submit an die Datenbank:</text>
  <g font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">
    <text x="44" y="332">UPDATE orders SET total = 129.90 WHERE id = 17;</text>
    <text x="44" y="356">DELETE FROM orders WHERE id = 23;</text>
    <text x="44" y="380">INSERT INTO orders (customer_id, status, total) VALUES (99, 'open', 5.00);</text>
  </g>
  <text x="44" y="418" font-size="12" fill="#64748b">Farben: blau = geändert · rot = gelöscht · grün = neu. Erst „Submit“ (Ctrl+Enter / ⌘↩) schreibt in die Datenbank.</text>
</svg>
