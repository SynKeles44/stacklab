<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- callouts -->
  <g fill="#f5f3ff" stroke="#a78bfa" stroke-width="2">
    <rect x="20" y="10" width="130" height="36" rx="8"/>
    <rect x="160" y="10" width="130" height="36" rx="8"/>
    <rect x="300" y="10" width="130" height="36" rx="8"/>
    <rect x="440" y="10" width="130" height="36" rx="8"/>
    <rect x="580" y="10" width="130" height="36" rx="8"/>
    <rect x="720" y="10" width="130" height="36" rx="8"/>
  </g>
  <g font-size="13" font-weight="700" fill="#1e1b3a" text-anchor="middle">
    <text x="85" y="33" data-slot="1">Execute</text>
    <text x="225" y="33" data-slot="1">Explain Plan</text>
    <text x="365" y="33" data-slot="1">Query-Historie</text>
    <text x="505" y="33" data-slot="1">Tx-Modus</text>
    <text x="645" y="33" data-slot="1">Commit</text>
    <text x="785" y="33" data-slot="1">Roll back</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="85" y1="46" x2="85" y2="78"/><line x1="225" y1="46" x2="225" y2="78"/><line x1="365" y1="46" x2="365" y2="78"/>
    <line x1="505" y1="46" x2="505" y2="78"/><line x1="645" y1="46" x2="645" y2="78"/><line x1="785" y1="46" x2="785" y2="78"/>
  </g>
  <!-- window -->
  <rect x="20" y="58" width="860" height="490" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="30" y="64" width="210" height="14" rx="3" fill="#e2e8f0"/><text x="38" y="75" font-size="10" fill="#1e1b3a">console [shop@localhost]</text>
  <!-- toolbar -->
  <rect x="30" y="80" width="840" height="34" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-size="12" fill="#1e1b3a" text-anchor="middle">
    <rect x="70" y="85" width="30" height="24" rx="4" fill="#34d399"/><text x="85" y="102" fill="#ffffff" font-size="13">▶</text>
    <rect x="195" y="85" width="60" height="24" rx="4" fill="#e2e8f0"/><text x="225" y="102">⌗ ▾</text>
    <rect x="350" y="85" width="30" height="24" rx="4" fill="#e2e8f0"/><text x="365" y="102">◷</text>
    <rect x="455" y="85" width="100" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="505" y="102">Tx: Manual ▾</text>
    <rect x="630" y="85" width="30" height="24" rx="4" fill="#dcfce7"/><text x="645" y="102">✓</text>
    <rect x="770" y="85" width="30" height="24" rx="4" fill="#fee2e2"/><text x="785" y="102">↶</text>
    <rect x="270" y="85" width="30" height="24" rx="4" fill="#e2e8f0"/><text x="285" y="102">{ }</text>
    <rect x="700" y="85" width="30" height="24" rx="4" fill="#e2e8f0"/><text x="715" y="102">■</text>
    <rect x="815" y="85" width="50" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="840" y="102" font-size="11">public</text>
  </g>
  <!-- editor -->
  <rect x="30" y="122" width="840" height="190" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">
    <text x="40" y="148" fill="#94a3b8">1</text><text x="70" y="148"><tspan fill="#7c3aed" font-weight="700">SELECT</tspan> id, status, total</text>
    <text x="40" y="172" fill="#94a3b8">2</text><text x="70" y="172"><tspan fill="#7c3aed" font-weight="700">FROM</tspan> orders</text>
    <text x="40" y="196" fill="#94a3b8">3</text><text x="70" y="196"><tspan fill="#7c3aed" font-weight="700">WHERE</tspan> customer_id = :kunde</text>
    <text x="40" y="220" fill="#94a3b8">4</text><text x="70" y="220"><tspan fill="#7c3aed" font-weight="700">ORDER BY</tspan> total <tspan fill="#7c3aed" font-weight="700">DESC</tspan>;</text>
    <text x="40" y="256" fill="#94a3b8">6</text><text x="70" y="256"><tspan fill="#7c3aed" font-weight="700">UPDATE</tspan> orders <tspan fill="#7c3aed" font-weight="700">SET</tspan> status = 'paid' <tspan fill="#7c3aed" font-weight="700">WHERE</tspan> id = 17;</text>
  </g>
  <rect x="64" y="132" width="3" height="96" fill="#22d3ee"/>
  <text x="560" y="300" font-size="11" fill="#64748b">Cursor im Statement + Ctrl+Enter (⌘↩) führt es aus</text>
  <!-- results -->
  <rect x="30" y="320" width="840" height="220" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="30" y="320" width="840" height="26" fill="#e2e8f0"/>
  <text x="42" y="338" font-size="12" font-weight="700" fill="#1e1b3a">Services › shop@localhost › console</text>
  <rect x="300" y="324" width="70" height="18" rx="3" fill="#ffffff"/><text x="335" y="337" font-size="11" text-anchor="middle" fill="#1e1b3a">Output</text>
  <rect x="380" y="324" width="90" height="18" rx="3" fill="#a78bfa"/><text x="425" y="337" font-size="11" text-anchor="middle" fill="#ffffff">shop.orders</text>
  <g font-size="12" fill="#1e1b3a">
    <rect x="40" y="354" width="400" height="22" fill="#f1f5f9"/>
    <text x="50" y="369" font-weight="700">id</text><text x="140" y="369" font-weight="700">status</text><text x="260" y="369" font-weight="700">total</text>
    <text x="50" y="393">17</text><text x="140" y="393">open</text><text x="260" y="393">129.90</text>
    <text x="50" y="415">31</text><text x="140" y="415">paid</text><text x="260" y="415">64.00</text>
    <text x="50" y="437">58</text><text x="140" y="437">open</text><text x="260" y="437">12.00</text>
  </g>
  <text x="40" y="470" font-size="12" fill="#64748b">3 rows retrieved starting from 1 in 18 ms (execution: 6 ms, fetching: 12 ms)</text>
  <text x="40" y="500" font-size="11" fill="#64748b">Weitere Knöpfe: { } Parameter anzeigen · ■ laufende Abfrage abbrechen · public = aktuelles Schema</text>
</svg>
