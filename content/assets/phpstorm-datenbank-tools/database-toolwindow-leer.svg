<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#1e1b3a">Schema: Database-Tool-Fenster – beschrifte die Kästen</text>
  <!-- panel -->
  <rect x="20" y="45" width="440" height="430" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="20" y="45" width="440" height="30" rx="8" fill="#e2e8f0"/>
  <text x="34" y="65" font-size="13" font-weight="700" fill="#1e1b3a">Database</text>
  <!-- toolbar -->
  <rect x="30" y="84" width="420" height="30" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="38" y="88" width="22" height="22" rx="4" fill="#a78bfa"/><text x="49" y="104" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">+</text>
  <rect x="68" y="88" width="22" height="22" rx="4" fill="#e2e8f0"/><text x="79" y="104" font-size="13" fill="#1e1b3a" text-anchor="middle">⟳</text>
  <rect x="98" y="88" width="22" height="22" rx="4" fill="#e2e8f0"/><text x="109" y="104" font-size="12" fill="#1e1b3a" text-anchor="middle">⚙</text>
  <rect x="128" y="88" width="22" height="22" rx="4" fill="#e2e8f0"/><text x="139" y="104" font-size="11" fill="#1e1b3a" text-anchor="middle">■</text>
  <rect x="158" y="88" width="22" height="22" rx="4" fill="#e2e8f0"/><text x="169" y="104" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a" text-anchor="middle">QL</text>
  <rect x="188" y="88" width="22" height="22" rx="4" fill="#e2e8f0"/><text x="199" y="104" font-size="12" fill="#1e1b3a" text-anchor="middle">⌕</text>
  <!-- tree -->
  <g font-size="13" fill="#1e1b3a">
    <text x="40" y="150">▾</text><rect x="54" y="138" width="14" height="14" rx="3" fill="#22d3ee"/><text x="76" y="150" font-weight="700">shop@localhost</text><text x="196" y="150" fill="#64748b" font-size="11">1 of 3</text>
    <text x="58" y="180">▾</text><rect x="72" y="168" width="14" height="14" rx="3" fill="#94a3b8"/><text x="94" y="180">shop</text>
    <text x="76" y="210">▾</text><rect x="90" y="198" width="14" height="14" rx="7" fill="#34d399"/><text x="112" y="210">public</text>
    <text x="94" y="240">▾</text><text x="110" y="240" fill="#64748b">tables</text><text x="160" y="240" fill="#64748b" font-size="11">2</text>
    <text x="112" y="270">▾</text><rect x="126" y="258" width="14" height="14" rx="2" fill="#f59e0b"/><text x="148" y="270" font-weight="700">orders</text>
    <text x="130" y="300">▸</text><text x="146" y="300" fill="#64748b">columns</text><text x="210" y="300" fill="#64748b" font-size="11">4</text>
    <text x="130" y="325">▸</text><text x="146" y="325" fill="#64748b">keys</text>
    <text x="130" y="350">▸</text><text x="146" y="350" fill="#64748b">indexes</text>
    <text x="112" y="380">▸</text><rect x="126" y="368" width="14" height="14" rx="2" fill="#f59e0b"/><text x="148" y="380">customers</text>
    <text x="94" y="410">▸</text><text x="110" y="410" fill="#64748b">views</text>
    <text x="40" y="445">▸</text><rect x="54" y="433" width="14" height="14" rx="3" fill="#a78bfa"/><text x="76" y="445">lager.sqlite</text>
  </g>
  <!-- callouts -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <polyline points="49,111 49,124 470,124 560,95" fill="none"/>
    <line x1="245" y1="145" x2="560" y2="175"/>
    <line x1="160" y1="205" x2="560" y2="235"/>
    <line x1="200" y1="265" x2="560" y2="295"/>
    <line x1="210" y1="346" x2="560" y2="375"/>
  </g>
  <g fill="#f5f3ff" stroke="#a78bfa" stroke-width="2">
    <rect x="560" y="75" width="200" height="40" rx="8"/>
    <rect x="560" y="155" width="200" height="40" rx="8"/>
    <rect x="560" y="215" width="200" height="40" rx="8"/>
    <rect x="560" y="275" width="200" height="40" rx="8"/>
    <rect x="560" y="355" width="200" height="40" rx="8"/>
  </g>
  <g font-size="14" font-weight="700" fill="#1e1b3a" text-anchor="middle">
  </g>
