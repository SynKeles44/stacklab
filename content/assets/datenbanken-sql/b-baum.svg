<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1e1b3a">Index auf orders(customer_id) als B-Baum</text>
  <text x="30" y="56" font-size="13" fill="#1e1b3a">Suche nach customer_id = 4: Wurzel → Zwischenknoten → Blatt → Zeile. Wenige Schritte statt alle Zeilen lesen.</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#1e1b3a">
    <rect x="370" y="80" width="160" height="40" rx="6" fill="#a78bfa" fill-opacity="0.35" stroke="#1e1b3a"/>
    <text x="450" y="105" text-anchor="middle">&lt; 3 | ≥ 3</text>
    <rect x="160" y="160" width="180" height="40" rx="6" fill="#22d3ee" fill-opacity="0.3" stroke="#1e1b3a"/>
    <text x="250" y="185" text-anchor="middle">&lt; 2 | ≥ 2</text>
    <rect x="560" y="160" width="180" height="40" rx="6" fill="#22d3ee" fill-opacity="0.3" stroke="#1e1b3a" stroke-width="3"/>
    <text x="650" y="185" text-anchor="middle">&lt; 5 | ≥ 5</text>
    <rect x="60" y="240" width="170" height="40" rx="6" fill="#34d399" fill-opacity="0.3" stroke="#1e1b3a"/>
    <text x="145" y="265" text-anchor="middle">1→#1 #3 #8</text>
    <rect x="250" y="240" width="170" height="40" rx="6" fill="#34d399" fill-opacity="0.3" stroke="#1e1b3a"/>
    <text x="335" y="265" text-anchor="middle">2→#2 #6</text>
    <rect x="480" y="240" width="170" height="40" rx="6" fill="#f59e0b" fill-opacity="0.45" stroke="#1e1b3a" stroke-width="3"/>
    <text x="565" y="265" text-anchor="middle">3→#4  4→#5</text>
    <rect x="670" y="240" width="170" height="40" rx="6" fill="#34d399" fill-opacity="0.3" stroke="#1e1b3a"/>
    <text x="755" y="265" text-anchor="middle">5→#7</text>
  </g>
  <g stroke="#1e1b3a" stroke-width="1.5" fill="none">
    <line x1="410" y1="120" x2="250" y2="160"/>
    <line x1="490" y1="120" x2="650" y2="160" stroke-width="3" stroke="#f59e0b"/>
    <line x1="205" y1="200" x2="145" y2="240"/>
    <line x1="295" y1="200" x2="335" y2="240"/>
    <line x1="605" y1="200" x2="565" y2="240" stroke-width="3" stroke="#f59e0b"/>
    <line x1="695" y1="200" x2="755" y2="240"/>
    <line x1="230" y1="260" x2="250" y2="260" stroke-dasharray="4 3"/>
    <line x1="420" y1="260" x2="480" y2="260" stroke-dasharray="4 3"/>
    <line x1="650" y1="260" x2="670" y2="260" stroke-dasharray="4 3"/>
  </g>
  <g font-size="13" fill="#1e1b3a">
    <text x="545" y="98">Wurzel</text>
    <text x="750" y="185">Zwischenknoten</text>
    <text x="30" y="310">Blätter: sortierte Schlüsselwerte mit Verweis auf die Zeile (#5 = Bestellung mit id 5).</text>
    <text x="30" y="330">Die gestrichelten Verbindungen erlauben schnelles Weiterlesen bei Bereichen wie customer_id BETWEEN 2 AND 4.</text>
    <text x="30" y="358" font-weight="700">Ohne Index: SCAN orders (jede Zeile prüfen) · Mit Index: SEARCH orders USING INDEX</text>
  </g>
</svg>
