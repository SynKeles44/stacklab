<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/></marker>
  </defs>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1e1b3a">ER-Diagramm des Beispiel-Shops</text>
  <g font-size="14" fill="#1e1b3a">
    <rect x="40" y="70" width="230" height="150" rx="10" fill="#22d3ee" fill-opacity="0.18" stroke="#1e1b3a" stroke-width="1.5"/>
    <rect x="40" y="70" width="230" height="38" rx="10" fill="#22d3ee" fill-opacity="0.5" stroke="#1e1b3a" stroke-width="1.5"/>
    <text x="155" y="95" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, monospace">customers</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="13"><text x="55" y="132">PK  id</text><text x="55" y="155">name</text><text x="55" y="178">email (UNIQUE)</text><text x="55" y="201">city</text></g>

    <rect x="620" y="70" width="240" height="150" rx="10" fill="#a78bfa" fill-opacity="0.18" stroke="#1e1b3a" stroke-width="1.5"/>
    <rect x="620" y="70" width="240" height="38" rx="10" fill="#a78bfa" fill-opacity="0.5" stroke="#1e1b3a" stroke-width="1.5"/>
    <text x="740" y="95" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, monospace">orders</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="13"><text x="635" y="132">PK  id</text><text x="635" y="155">FK  customer_id</text><text x="635" y="178">order_date</text><text x="635" y="201">status</text></g>

    <rect x="620" y="280" width="240" height="150" rx="10" fill="#34d399" fill-opacity="0.18" stroke="#1e1b3a" stroke-width="1.5"/>
    <rect x="620" y="280" width="240" height="38" rx="10" fill="#34d399" fill-opacity="0.5" stroke="#1e1b3a" stroke-width="1.5"/>
    <text x="740" y="305" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, monospace">order_items</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="13"><text x="635" y="342">PK, FK  order_id</text><text x="635" y="365">PK, FK  product_id</text><text x="635" y="388">quantity</text><text x="635" y="411">unit_price</text></g>

    <rect x="40" y="280" width="230" height="150" rx="10" fill="#f59e0b" fill-opacity="0.18" stroke="#1e1b3a" stroke-width="1.5"/>
    <rect x="40" y="280" width="230" height="38" rx="10" fill="#f59e0b" fill-opacity="0.5" stroke="#1e1b3a" stroke-width="1.5"/>
    <text x="155" y="305" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, monospace">products</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="13"><text x="55" y="342">PK  id</text><text x="55" y="365">name</text><text x="55" y="388">price</text><text x="55" y="411">stock</text></g>
  </g>
  <line x1="270" y1="145" x2="620" y2="145" stroke="#1e1b3a" stroke-width="2"/>
  <text x="285" y="137" font-size="16" font-weight="700" fill="#1e1b3a">1</text>
  <text x="598" y="137" font-size="16" font-weight="700" fill="#1e1b3a">n</text>
  <text x="445" y="168" text-anchor="middle" font-size="13" fill="#1e1b3a">ein Kunde gibt viele Bestellungen auf</text>
  <line x1="740" y1="220" x2="740" y2="280" stroke="#1e1b3a" stroke-width="2"/>
  <text x="750" y="238" font-size="16" font-weight="700" fill="#1e1b3a">1</text>
  <text x="750" y="274" font-size="16" font-weight="700" fill="#1e1b3a">n</text>
  <line x1="270" y1="355" x2="620" y2="355" stroke="#1e1b3a" stroke-width="2"/>
  <text x="285" y="347" font-size="16" font-weight="700" fill="#1e1b3a">1</text>
  <text x="598" y="347" font-size="16" font-weight="700" fill="#1e1b3a">n</text>
  <text x="445" y="378" text-anchor="middle" font-size="13" fill="#1e1b3a">Zwischentabelle löst n:m auf:</text>
  <text x="445" y="396" text-anchor="middle" font-size="13" fill="#1e1b3a">eine Bestellung ↔ viele Produkte</text>
  <text x="30" y="452" font-size="12" fill="#1e1b3a">PK = Primärschlüssel · FK = Fremdschlüssel</text>
</svg>
