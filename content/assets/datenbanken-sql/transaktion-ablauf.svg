<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/></marker></defs>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1e1b3a">Eine Transaktion: alles oder nichts</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#1e1b3a">
    <rect x="30" y="120" width="110" height="50" rx="8" fill="#a78bfa" fill-opacity="0.35" stroke="#1e1b3a"/>
    <text x="85" y="150" text-anchor="middle" font-weight="700">BEGIN</text>
    <rect x="190" y="70" width="330" height="150" rx="8" fill="#22d3ee" fill-opacity="0.15" stroke="#1e1b3a" stroke-dasharray="6 4"/>
    <text x="205" y="105">INSERT INTO orders …</text>
    <text x="205" y="140">INSERT INTO order_items …</text>
    <text x="205" y="175">UPDATE products SET stock = …</text>
    <text x="205" y="208" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">nur für diese Sitzung sichtbar, noch nicht dauerhaft</text>
    <rect x="610" y="70" width="250" height="60" rx="8" fill="#34d399" fill-opacity="0.35" stroke="#1e1b3a"/>
    <text x="735" y="97" text-anchor="middle" font-weight="700">COMMIT</text>
    <text x="735" y="118" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">alle Änderungen dauerhaft gespeichert</text>
    <rect x="610" y="170" width="250" height="60" rx="8" fill="#f87171" fill-opacity="0.35" stroke="#1e1b3a"/>
    <text x="735" y="197" text-anchor="middle" font-weight="700">ROLLBACK</text>
    <text x="735" y="218" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">alle Änderungen verworfen</text>
  </g>
  <g stroke="#1e1b3a" stroke-width="2" fill="none" marker-end="url(#p)">
    <line x1="140" y1="145" x2="188" y2="145"/>
    <line x1="520" y1="120" x2="606" y2="100"/>
    <line x1="520" y1="170" x2="606" y2="200"/>
  </g>
  <text x="545" y="96" font-size="12" fill="#1e1b3a">alles ok</text>
  <text x="535" y="215" font-size="12" fill="#1e1b3a">Fehler</text>
  <text x="30" y="270" font-size="13" fill="#1e1b3a">Andere Sitzungen sehen entweder den Zustand vor BEGIN oder den nach COMMIT – nie einen halben Zwischenstand.</text>
</svg>
