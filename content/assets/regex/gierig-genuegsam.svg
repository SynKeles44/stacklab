<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Gieriger und genügsamer Quantor im Vergleich">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="40" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e1b3a">Text: &lt;b&gt;fett&lt;/b&gt; und &lt;i&gt;kursiv&lt;/i&gt;</text>

  <text x="30" y="108" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="700" fill="#1e1b3a">/&lt;.*&gt;/</text>
  <text x="30" y="132" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1b3a">gierig: so viel wie möglich</text>
  <rect x="300" y="82" width="452.4" height="40" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
  <text x="300" y="110" textLength="452.4" lengthAdjust="spacing" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#1e1b3a">&lt;b&gt;fett&lt;/b&gt; und &lt;i&gt;kursiv&lt;/i&gt;</text>
  <text x="776" y="108" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1b3a">1 Treffer</text>

  <text x="30" y="208" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="700" fill="#1e1b3a">/&lt;.*?&gt;/g</text>
  <text x="30" y="232" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1b3a">genügsam: so wenig wie nötig</text>
  <rect x="300" y="182" width="46.8" height="40" rx="6" fill="#d1fae5" stroke="#34d399" stroke-width="2"/>
  <rect x="409.2" y="182" width="62.4" height="40" rx="6" fill="#d1fae5" stroke="#34d399" stroke-width="2"/>
  <rect x="549.6" y="182" width="46.8" height="40" rx="6" fill="#d1fae5" stroke="#34d399" stroke-width="2"/>
  <rect x="690" y="182" width="62.4" height="40" rx="6" fill="#d1fae5" stroke="#34d399" stroke-width="2"/>
  <text x="300" y="210" textLength="452.4" lengthAdjust="spacing" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#1e1b3a">&lt;b&gt;fett&lt;/b&gt; und &lt;i&gt;kursiv&lt;/i&gt;</text>
  <text x="776" y="208" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e1b3a">4 Treffer</text>

  <text x="450" y="282" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1e1b3a" text-anchor="middle">Das angehängte ? macht aus dem gierigen * einen genügsamen Quantor.</text>
</svg>
