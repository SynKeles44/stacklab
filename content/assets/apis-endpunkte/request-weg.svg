<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="900" height="340" fill="#ffffff"/>
<text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Der Weg eines Requests zum Endpunkt</text>
<rect x="30" y="70" width="170" height="120" rx="16" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-width="3"/>
<text x="115" y="125" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Client</text>
<text x="115" y="150" text-anchor="middle" font-size="13" fill="#475569">curl, Browser, App</text>
<rect x="250" y="70" width="170" height="120" rx="16" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-width="3"/>
<text x="335" y="125" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Router</text>
<text x="335" y="150" text-anchor="middle" font-size="13" fill="#475569">Methode + Pfad → Route</text>
<rect x="470" y="70" width="170" height="120" rx="16" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-width="3"/>
<text x="555" y="125" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Controller</text>
<text x="555" y="150" text-anchor="middle" font-size="13" fill="#475569">prüft, rechnet, antwortet</text>
<rect x="690" y="70" width="180" height="120" rx="16" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-width="3"/>
<text x="780" y="125" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Datenspeicher</text>
<text x="780" y="150" text-anchor="middle" font-size="13" fill="#475569">Datenbank, Datei</text>
<path d="M202 110 H 246" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<path d="M422 110 H 466" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<path d="M642 110 H 686" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<text x="224" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">GET /books/2</text>
<text x="444" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">show(2)</text>
<text x="664" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">lesen</text>
<path d="M555 194 C 555 280, 115 280, 115 194" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/>
<text x="335" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">HTTP/1.1 200 OK  ·  {"data": {"id": 2, …}}</text>
<text x="335" y="322" text-anchor="middle" font-size="13" fill="#475569">Response: Statuscode, Header, JSON-Body</text>
</svg>
