<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="900" height="400" fill="#ffffff"/>
<text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Ressourcen sind Substantive, Methoden sind Verben</text>
<rect x="30" y="60" width="260" height="300" rx="16" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-width="3"/>
<text x="160" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Sammlung</text>
<text x="160" y="122" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">/books</text>
<text x="50" y="170" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">GET</text><text x="120" y="170" font-size="14" fill="#475569">alle auflisten</text>
<text x="50" y="200" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">POST</text><text x="120" y="200" font-size="14" fill="#475569">neues anlegen</text>
<text x="160" y="260" text-anchor="middle" font-size="13" fill="#475569">Filter, Sortierung, Seiten</text>
<text x="160" y="282" text-anchor="middle" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">?genre=krimi&amp;page=2</text>
<rect x="320" y="60" width="260" height="300" rx="16" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-width="3"/>
<text x="450" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Einzelnes Element</text>
<text x="450" y="122" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">/books/{id}</text>
<text x="340" y="170" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">GET</text><text x="420" y="170" font-size="14" fill="#475569">eines lesen</text>
<text x="340" y="200" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">PUT</text><text x="420" y="200" font-size="14" fill="#475569">komplett ersetzen</text>
<text x="340" y="230" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">PATCH</text><text x="420" y="230" font-size="14" fill="#475569">teilweise ändern</text>
<text x="340" y="260" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">DELETE</text><text x="420" y="260" font-size="14" fill="#475569">löschen</text>
<rect x="610" y="60" width="260" height="300" rx="16" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-width="3"/>
<text x="740" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Verschachtelt</text>
<text x="740" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">/authors/{id}/books</text>
<text x="630" y="170" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">GET</text><text x="700" y="170" font-size="14" fill="#475569">Bücher einer Person</text>
<text x="740" y="260" text-anchor="middle" font-size="13" fill="#475569">höchstens eine Ebene tief</text>
<path d="M292 210 H 316" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<path d="M582 210 H 606" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<text x="450" y="388" text-anchor="middle" font-size="13" fill="#475569">Nie: /getBooks, /createBook, /deleteBook?id=3 – das Verb steckt schon in der Methode.</text>
</svg>
