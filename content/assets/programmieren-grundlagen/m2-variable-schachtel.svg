<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Variablen sind beschriftete Schachteln</text>
<rect x="60" y="110" width="200" height="120" rx="12" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-width="3"/>
<rect x="110" y="92" width="100" height="30" rx="6" fill="#ffffff" stroke="#1e1b3a" stroke-width="1.5"/>
<text x="160" y="113" text-anchor="middle" font-size="15" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">punkte</text>
<text x="160" y="185" text-anchor="middle" font-size="30" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">15</text>
<text x="160" y="265" text-anchor="middle" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">let punkte = 10;</text>
<text x="160" y="287" text-anchor="middle" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">punkte = 15;</text>
<text x="160" y="312" text-anchor="middle" font-size="12" fill="#047857">let: Inhalt darf ausgetauscht werden</text>
<rect x="320" y="110" width="200" height="120" rx="12" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-width="3"/>
<rect x="370" y="92" width="100" height="30" rx="6" fill="#ffffff" stroke="#1e1b3a" stroke-width="1.5"/>
<text x="420" y="113" text-anchor="middle" font-size="15" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">MWST</text>
<text x="420" y="185" text-anchor="middle" font-size="30" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">0.19</text>
<path d="M330 120 L510 220 M510 120 L330 220" stroke="#a78bfa" stroke-opacity=".0"/>
<text x="420" y="265" text-anchor="middle" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">const MWST = 0.19;</text>
<text x="420" y="287" text-anchor="middle" font-size="14" fill="#b91c1c" font-family="ui-monospace, Menlo, monospace">MWST = 0.07; ✗</text>
<text x="420" y="312" text-anchor="middle" font-size="12" fill="#b91c1c">const: fest verschlossen → TypeError</text>
<rect x="580" y="110" width="200" height="120" rx="12" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-width="3"/>
<rect x="630" y="92" width="100" height="30" rx="6" fill="#ffffff" stroke="#1e1b3a" stroke-width="1.5"/>
<text x="680" y="113" text-anchor="middle" font-size="15" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">name</text>
<text x="680" y="185" text-anchor="middle" font-size="26" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">"Ada"</text>
<text x="680" y="265" text-anchor="middle" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">const name = "Ada";</text>
<text x="680" y="287" text-anchor="middle" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">console.log(name);</text>
<text x="680" y="312" text-anchor="middle" font-size="12" fill="#475569">Lesen: über den Namen</text>
<text x="410" y="66" text-anchor="middle" font-size="13" fill="#475569">Etikett = Name der Variablen · Inhalt = Wert</text>
</svg>
