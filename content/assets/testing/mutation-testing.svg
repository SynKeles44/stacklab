<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="800" height="380" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Mutation Testing: Werden Fehler bemerkt?</text>
<rect x="30" y="140" width="210" height="90" rx="14" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-width="3"/>
<text x="135" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">Originalcode</text>
<text x="135" y="200" text-anchor="middle" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">$cents &gt;= 5000</text>
<rect x="300" y="60" width="220" height="80" rx="14" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-width="3"/>
<text x="410" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">Mutant 1</text>
<text x="410" y="118" text-anchor="middle" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">$cents &gt; 5000</text>
<rect x="300" y="230" width="220" height="80" rx="14" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-width="3"/>
<text x="410" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">Mutant 2</text>
<text x="410" y="288" text-anchor="middle" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">$cents &lt; 5000</text>
<path d="M242 170 L296 110" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<path d="M242 200 L296 262" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<path d="M522 100 H 566" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<path d="M522 270 H 566" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<rect x="570" y="60" width="200" height="80" rx="14" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-width="3"/>
<text x="670" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">Tests bleiben grün</text>
<text x="670" y="116" text-anchor="middle" font-size="13" fill="#475569">„untested“ – Lücke!</text>
<rect x="570" y="230" width="200" height="80" rx="14" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-width="3"/>
<text x="670" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">Ein Test wird rot</text>
<text x="670" y="286" text-anchor="middle" font-size="13" fill="#475569">„tested“ – gut so</text>
<text x="400" y="355" text-anchor="middle" font-size="14" fill="#1e1b3a">Mutation Score = bemerkte Mutanten ÷ alle Mutanten</text>
