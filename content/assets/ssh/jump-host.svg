<text x="400" y="320" text-anchor="middle" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">ssh -J deploy@203.0.113.5 deploy@10.0.1.20</text>
<text x="400" y="342" text-anchor="middle" font-size="12" fill="#475569">Der Schlüssel bleibt auf dem Laptop – die Bastion leitet nur weiter.</text>
