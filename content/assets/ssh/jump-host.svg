<text x="105" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Laptop</text>
<text x="105" y="204" text-anchor="middle" font-size="12" fill="#475569">im Homeoffice</text>
<text x="105" y="128" text-anchor="middle" font-size="13" fill="#475569">Internet</text>
<rect x="330" y="60" width="440" height="290" rx="18" fill="#a78bfa" fill-opacity=".07" stroke="#a78bfa" stroke-width="2" stroke-dasharray="8 6"/>
<text x="550" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b3a">Privates Netz 10.0.1.0/24 – von außen nicht erreichbar</text>
