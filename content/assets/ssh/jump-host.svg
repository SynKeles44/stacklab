<text x="380" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Bastion</text>
<text x="380" y="198" text-anchor="middle" font-size="12" fill="#475569" font-family="ui-monospace, Menlo, monospace">203.0.113.5</text>
