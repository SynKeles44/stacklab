<text x="655" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b3a">Datenbank :5432</text>
<path d="M655 203 V 163" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<rect x="250" y="208" width="300" height="38" rx="19" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa" stroke-width="3"/>
<text x="400" y="232" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b3a">SSH-Tunnel (Port 22)</text>
<text x="400" y="315" text-anchor="middle" font-size="13" fill="#475569">Der Datenbank-Port 5432 ist aus dem Internet gesperrt – erreichbar ist nur Port 22.</text>
<text x="400" y="337" text-anchor="middle" font-size="13" fill="#475569">Was du lokal an Port 5433 schickst, kommt auf dem Server bei localhost:5432 an.</text>
