<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b3a">Der Weg einer Anfrage durch Laravel</text>

  <!-- obere Reihe -->
  <rect x="20" y="80" width="140" height="80" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="90" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Browser</text>
  <text x="90" y="140" text-anchor="middle" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">GET /books</text>

  <rect x="210" y="80" width="160" height="80" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="290" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Front-Controller</text>
  <text x="290" y="140" text-anchor="middle" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">public/index.php</text>

  <rect x="420" y="80" width="150" height="80" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="495" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Middleware</text>
  <text x="495" y="140" text-anchor="middle" font-size="13" fill="#1e1b3a">Session, CSRF …</text>

  <rect x="620" y="80" width="140" height="80" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="690" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Router</text>
  <text x="690" y="140" text-anchor="middle" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">routes/web.php</text>

  <rect x="800" y="80" width="140" height="80" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="870" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Controller</text>
  <text x="870" y="140" text-anchor="middle" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">index()</text>

  <line x1="160" y1="120" x2="206" y2="120" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="370" y1="120" x2="416" y2="120" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="570" y1="120" x2="616" y2="120" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="760" y1="120" x2="796" y2="120" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>

  <!-- untere Reihe -->
  <rect x="800" y="250" width="140" height="80" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="870" y="286" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Model</text>
  <text x="870" y="310" text-anchor="middle" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">Book::all()</text>

  <rect x="620" y="250" width="140" height="80" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="690" y="286" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Datenbank</text>
  <text x="690" y="310" text-anchor="middle" font-size="13" fill="#1e1b3a">SQLite, MySQL …</text>

  <rect x="420" y="250" width="150" height="80" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="495" y="286" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">View</text>
  <text x="495" y="310" text-anchor="middle" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">index.blade.php</text>

  <rect x="210" y="250" width="160" height="80" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="290" y="286" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Response</text>
  <text x="290" y="310" text-anchor="middle" font-size="13" fill="#1e1b3a">200 OK + HTML</text>

  <line x1="870" y1="160" x2="870" y2="246" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="880" y="208" font-size="13" fill="#1e1b3a">fragt Daten an</text>
  <line x1="800" y1="290" x2="764" y2="290" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)" marker-start="url(#pfeil)"/>
  <path d="M 830 250 C 760 200, 600 210, 540 248" fill="none" stroke="#1e1b3a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil)"/>
  <text x="600" y="214" font-size="13" fill="#1e1b3a">Controller übergibt Daten</text>
  <line x1="420" y1="290" x2="374" y2="290" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <path d="M 210 290 L 90 290 L 90 164" fill="none" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>

  <text x="480" y="375" text-anchor="middle" font-size="14" fill="#1e1b3a">Jede Anfrage startet in public/index.php. Der Router wählt den passenden Controller.</text>
  <text x="480" y="398" text-anchor="middle" font-size="14" fill="#1e1b3a">Der Controller holt Daten über Models und lässt eine View das HTML erzeugen.</text>
</svg>
