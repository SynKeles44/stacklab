<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b3a">Beziehungen in Eloquent – und was in der Datenbank steht</text>

  <!-- authors -->
  <rect x="30" y="80" width="230" height="150" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="145" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">authors</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#1e1b3a">
    <text x="50" y="145">id</text>
    <text x="50" y="170">name</text>
    <text x="50" y="195">timestamps</text>
  </g>

  <!-- books -->
  <rect x="365" y="80" width="230" height="175" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="480" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">books</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#1e1b3a">
    <text x="385" y="145">id</text>
    <text x="385" y="170" font-weight="700">author_id</text>
    <text x="385" y="195">title</text>
    <text x="385" y="220">timestamps</text>
  </g>

  <!-- book_tag -->
  <rect x="700" y="80" width="230" height="150" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="815" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">book_tag (Pivot)</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#1e1b3a">
    <text x="720" y="145" font-weight="700">book_id</text>
    <text x="720" y="170" font-weight="700">tag_id</text>
  </g>

  <!-- tags -->
  <rect x="700" y="290" width="230" height="110" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="815" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">tags</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#1e1b3a">
    <text x="720" y="352">id</text>
    <text x="720" y="377">name</text>
  </g>

  <!-- Verbindungen -->
  <line x1="260" y1="140" x2="365" y2="165" stroke="#1e1b3a" stroke-width="2"/>
  <text x="270" y="132" font-size="16" font-weight="700" fill="#1e1b3a">1</text>
  <text x="345" y="158" font-size="16" font-weight="700" fill="#1e1b3a">n</text>
  <line x1="595" y1="140" x2="700" y2="140" stroke="#1e1b3a" stroke-width="2"/>
  <line x1="815" y1="230" x2="815" y2="290" stroke="#1e1b3a" stroke-width="2"/>

  <!-- Code -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#1e1b3a">
    <text x="30" y="290">Author: hasMany(Book::class)</text>
    <text x="30" y="315">Book:   belongsTo(Author::class)</text>
    <text x="30" y="365">Book:   belongsToMany(Tag::class)</text>
    <text x="30" y="390">Tag:    belongsToMany(Book::class)</text>
  </g>
  <text x="30" y="420" font-size="13" fill="#1e1b3a">Der Fremdschlüssel steht immer auf der „n“-Seite; bei n:m in einer eigenen Zwischentabelle.</text>
</svg>
