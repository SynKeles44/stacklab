<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b3a">Was passiert beim Absenden eines Formulars?</text>

  <rect x="20" y="150" width="170" height="90" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="105" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Formular</text>
  <text x="105" y="212" text-anchor="middle" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">POST /books</text>

  <rect x="260" y="150" width="190" height="90" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="355" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Validierung</text>
  <text x="355" y="212" text-anchor="middle" font-size="13" fill="#1e1b3a">Regeln prüfen</text>

  <rect x="560" y="70" width="380" height="100" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="750" y="105" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Alles gültig</text>
  <text x="750" y="130" text-anchor="middle" font-size="13" fill="#1e1b3a">Controller läuft weiter, speichert die Daten</text>
  <text x="750" y="152" text-anchor="middle" font-size="13" fill="#1e1b3a">und leitet weiter (z. B. zur Liste, mit Flash-Nachricht)</text>

  <rect x="560" y="220" width="380" height="110" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="750" y="255" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Mindestens eine Regel verletzt</text>
  <text x="750" y="280" text-anchor="middle" font-size="13" fill="#1e1b3a">Controller-Code läuft NICHT weiter. Laravel leitet zurück</text>
  <text x="750" y="302" text-anchor="middle" font-size="13" fill="#1e1b3a">zum Formular, mit $errors und alten Eingaben (old()).</text>

  <line x1="190" y1="195" x2="256" y2="195" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="450" y1="180" x2="556" y2="125" stroke="#34d399" stroke-width="3" marker-end="url(#pfeil)"/>
  <line x1="450" y1="210" x2="556" y2="270" stroke="#f87171" stroke-width="3" marker-end="url(#pfeil)"/>
  <path d="M 560 320 C 400 380, 160 370, 105 244" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil)"/>
  <text x="250" y="372" font-size="13" fill="#1e1b3a">302-Weiterleitung zurück zum Formular</text>
</svg>
