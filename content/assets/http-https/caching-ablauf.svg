<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1e1b3a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Caching mit max-age und ETag</text>
<rect x="60" y="48" width="160" height="40" rx="10" fill="#22d3ee" fill-opacity=".18" stroke="#22d3ee" stroke-width="2"/>
<text x="140" y="74" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Browser + Cache</text>
<rect x="680" y="48" width="160" height="40" rx="10" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa" stroke-width="2"/>
<text x="760" y="74" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Server</text>
<line x1="140" y1="88" x2="140" y2="455" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="760" y1="88" x2="760" y2="455" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
<text x="30" y="122" font-size="13" font-weight="700" fill="#0284c7">1</text>
<line x1="145" y1="118" x2="752" y2="118" stroke="#1e1b3a" stroke-width="2" marker-end="url(#p)"/>
<text x="450" y="110" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">GET /logo.svg</text>
<line x1="755" y1="160" x2="148" y2="160" stroke="#34d399" stroke-width="2.5" marker-end="url(#p)"/>
<text x="450" y="142" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">200 OK · ETag: "v1" · Cache-Control: max-age=60</text>
<text x="450" y="178" text-anchor="middle" font-size="12" fill="#475569">Browser speichert Antwort und ETag</text>
<text x="30" y="222" font-size="13" font-weight="700" fill="#0284c7">2</text>
<rect x="160" y="200" width="300" height="38" rx="8" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-width="1.5"/>
<text x="310" y="224" text-anchor="middle" font-size="13" fill="#1e1b3a">Nach 30 s: noch frisch → aus dem Cache</text>
<text x="600" y="224" text-anchor="middle" font-size="12" fill="#475569">keine Anfrage an den Server</text>
<text x="30" y="282" font-size="13" font-weight="700" fill="#0284c7">3</text>
<line x1="145" y1="278" x2="752" y2="278" stroke="#1e1b3a" stroke-width="2" marker-end="url(#p)"/>
<text x="450" y="270" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">Nach 90 s: GET /logo.svg · If-None-Match: "v1"</text>
<line x1="755" y1="320" x2="148" y2="320" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#p)"/>
<text x="450" y="302" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">304 Not Modified (ohne Body)</text>
<text x="450" y="338" text-anchor="middle" font-size="12" fill="#475569">Datei unverändert → Browser nimmt seine Kopie, wieder 60 s frisch</text>
<text x="30" y="382" font-size="13" font-weight="700" fill="#0284c7">4</text>
<line x1="145" y1="378" x2="752" y2="378" stroke="#1e1b3a" stroke-width="2" marker-end="url(#p)"/>
<text x="450" y="370" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">Später: GET /logo.svg · If-None-Match: "v1"</text>
<line x1="755" y1="420" x2="148" y2="420" stroke="#34d399" stroke-width="2.5" marker-end="url(#p)"/>
<text x="450" y="402" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">200 OK · ETag: "v2" · neuer Inhalt</text>
<text x="450" y="440" text-anchor="middle" font-size="12" fill="#475569">Datei wurde geändert → neue Version mit neuem ETag</text>
</svg>
