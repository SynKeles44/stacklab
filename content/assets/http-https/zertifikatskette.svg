<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1e1b3a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Die Zertifikatskette</text>
<rect x="262" y="42" width="616" height="112" rx="16" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="685" y="57" width="170" height="30" rx="15" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
<text x="770" y="77" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">Vertrauensspeicher</text>
<text x="770" y="108" text-anchor="middle" font-size="12" fill="#475569">in Browser und</text>
<text x="770" y="124" text-anchor="middle" font-size="12" fill="#475569">Betriebssystem vorinstalliert</text>
<rect x="280" y="52" width="340" height="94" rx="12" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-width="3"/>
<rect x="355" y="61" width="190" height="30" rx="15" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
<text x="450" y="81" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">Root-Zertifikat</text>
<text x="300" y="114" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">für:  Beispiel Root CA</text>
<text x="300" y="134" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">von:  Beispiel Root CA (selbst signiert)</text>
<rect x="280" y="182" width="340" height="94" rx="12" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-width="3"/>
<rect x="355" y="191" width="190" height="30" rx="15" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
<text x="450" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">Zwischenzertifikat</text>
<text x="300" y="244" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">für:  Beispiel TLS CA 1</text>
<text x="300" y="264" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">von:  Beispiel Root CA</text>
<rect x="280" y="312" width="340" height="94" rx="12" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-width="3"/>
<rect x="355" y="321" width="190" height="30" rx="15" fill="#ffffff" stroke="#22d3ee" stroke-width="2"/>
<text x="450" y="341" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">Server-Zertifikat</text>
<text x="300" y="374" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">für:  www.example.com (SAN)</text>
<text x="300" y="394" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">von:  Beispiel TLS CA 1</text>
<line x1="450" y1="147" x2="450" y2="179" stroke="#1e1b3a" stroke-width="2" marker-end="url(#p)"/>
<text x="462" y="169" font-size="13" fill="#1e1b3a" font-style="italic">signiert</text>
<line x1="450" y1="277" x2="450" y2="309" stroke="#1e1b3a" stroke-width="2" marker-end="url(#p)"/>
<text x="462" y="299" font-size="13" fill="#1e1b3a" font-style="italic">signiert</text>
<path d="M262 186 H248 V402 H262" fill="none" stroke="#0284c7" stroke-width="2.5"/>
<text x="236" y="272" text-anchor="end" font-size="13" fill="#0284c7" font-weight="600">schickt der</text>
<text x="236" y="290" text-anchor="end" font-size="13" fill="#0284c7" font-weight="600">Server im</text>
<text x="236" y="308" text-anchor="end" font-size="13" fill="#0284c7" font-weight="600">TLS-Handshake</text>
<text x="236" y="326" text-anchor="end" font-size="13" fill="#0284c7" font-weight="600">mit</text>
<text x="760" y="250" text-anchor="middle" font-size="13" fill="#475569">Prüfung von unten nach oben:</text>
<text x="760" y="270" text-anchor="middle" font-size="13" fill="#475569">Signatur passt? Gültig?</text>
<text x="760" y="290" text-anchor="middle" font-size="13" fill="#475569">Name passt? Root vertraut?</text>
</svg>
