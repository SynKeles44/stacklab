<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">HTTP/1.1, HTTP/2 und HTTP/3 im Schichtenvergleich</text>
<text x="170" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">HTTP/1.1</text>
<rect x="40" y="88" width="260" height="50" rx="10" fill="#22d3ee" fill-opacity=".16" stroke="#22d3ee" stroke-width="2"/>
<text x="170" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b3a">HTTP/1.1 · Text</text>
<rect x="40" y="146" width="260" height="50" rx="10" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa" stroke-width="2"/>
<text x="170" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b3a">TLS (optional)</text>
<rect x="40" y="204" width="260" height="50" rx="10" fill="#f59e0b" fill-opacity=".16" stroke="#f59e0b" stroke-width="2"/>
<text x="170" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b3a">TCP</text>
<rect x="40" y="262" width="260" height="50" rx="10" fill="#94a3b8" fill-opacity=".16" stroke="#94a3b8" stroke-width="2"/>
<text x="170" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b3a">IP</text>
<text x="170" y="350" text-anchor="middle" font-size="13" fill="#475569">1 Anfrage pro Verbindung gleichzeitig</text>
<text x="170" y="372" text-anchor="middle" font-size="13" fill="#475569">≈ 6 Verbindungen pro Host</text>
<text x="450" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">HTTP/2</text>
<rect x="320" y="88" width="260" height="50" rx="10" fill="#22d3ee" fill-opacity=".16" stroke="#22d3ee" stroke-width="2"/>
<text x="450" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b3a">HTTP/2 · binär, Streams</text>
<rect x="320" y="146" width="260" height="50" rx="10" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa" stroke-width="2"/>
<text x="450" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b3a">TLS</text>
<rect x="320" y="204" width="260" height="50" rx="10" fill="#f59e0b" fill-opacity=".16" stroke="#f59e0b" stroke-width="2"/>
<text x="450" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b3a">TCP</text>
<rect x="320" y="262" width="260" height="50" rx="10" fill="#94a3b8" fill-opacity=".16" stroke="#94a3b8" stroke-width="2"/>
<text x="450" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b3a">IP</text>
<text x="450" y="350" text-anchor="middle" font-size="13" fill="#475569">Viele Streams über 1 Verbindung</text>
<text x="450" y="372" text-anchor="middle" font-size="13" fill="#475569">Paketverlust bremst alle Streams</text>
<text x="730" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">HTTP/3</text>
<rect x="600" y="88" width="260" height="50" rx="10" fill="#22d3ee" fill-opacity=".16" stroke="#22d3ee" stroke-width="2"/>
<text x="730" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b3a">HTTP/3 · Streams</text>
<rect x="600" y="146" width="260" height="50" rx="10" fill="#34d399" fill-opacity=".22" stroke="#34d399" stroke-width="2.5"/>
<text x="730" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b3a">QUIC  (mit TLS 1.3)</text>
<rect x="600" y="204" width="260" height="50" rx="10" fill="#f87171" fill-opacity=".16" stroke="#f87171" stroke-width="2"/>
<text x="730" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b3a">UDP</text>
<rect x="600" y="262" width="260" height="50" rx="10" fill="#94a3b8" fill-opacity=".16" stroke="#94a3b8" stroke-width="2"/>
<text x="730" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b3a">IP</text>
<text x="730" y="350" text-anchor="middle" font-size="13" fill="#475569">Streams unabhängig voneinander</text>
<text x="730" y="372" text-anchor="middle" font-size="13" fill="#475569">Schnellerer Verbindungsaufbau</text>
<text x="450" y="408" text-anchor="middle" font-size="13" fill="#1e1b3a">Methoden, Header und Statuscodes bedeuten in allen drei Versionen dasselbe.</text>
</svg>
