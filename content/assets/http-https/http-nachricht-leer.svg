<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="30" y="45" width="410" height="205" rx="14" fill="#22d3ee" fill-opacity=".10" stroke="#22d3ee" stroke-width="3"/>
<text x="235" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Anfrage (Request)</text>
<rect x="38" y="62" width="262" height="30" rx="6" fill="#f59e0b" fill-opacity=".16"/>
<rect x="38" y="110" width="262" height="52" rx="6" fill="#34d399" fill-opacity=".16"/>
<rect x="38" y="170" width="262" height="30" rx="6" fill="#94a3b8" fill-opacity=".16"/>
<rect x="38" y="210" width="262" height="30" rx="6" fill="#f87171" fill-opacity=".16"/>
<text x="45" y="82" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a" font-weight="700">POST /notizen HTTP/1.1</text>
<text x="45" y="131" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">Host: api.example.com</text>
<text x="45" y="152" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">Content-Type: application/json</text>
<text x="45" y="190" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#64748b">\r\n  (leere Zeile)</text>
<text x="45" y="230" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">{"titel": "Einkaufen"}</text>
<rect x="312" y="65" width="116" height="30" rx="15" fill="#ffffff" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="312" y="122" width="116" height="30" rx="15" fill="#ffffff" stroke="#34d399" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="312" y="170" width="116" height="30" rx="15" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="312" y="210" width="116" height="30" rx="15" fill="#ffffff" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="460" y="45" width="410" height="205" rx="14" fill="#a78bfa" fill-opacity=".10" stroke="#a78bfa" stroke-width="3"/>
<text x="665" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Antwort (Response)</text>
<rect x="468" y="62" width="262" height="30" rx="6" fill="#f59e0b" fill-opacity=".16"/>
<rect x="468" y="110" width="262" height="52" rx="6" fill="#34d399" fill-opacity=".16"/>
<rect x="468" y="170" width="262" height="30" rx="6" fill="#94a3b8" fill-opacity=".16"/>
<rect x="468" y="210" width="262" height="30" rx="6" fill="#f87171" fill-opacity=".16"/>
<text x="475" y="82" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a" font-weight="700">HTTP/1.1 201 Created</text>
<text x="475" y="131" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">Location: /notizen/7</text>
<text x="475" y="152" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">Content-Type: application/json</text>
<text x="475" y="190" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#64748b">\r\n  (leere Zeile)</text>
<text x="475" y="230" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">{"id": 7, "titel": "Einkaufen"}</text>
<rect x="742" y="65" width="116" height="30" rx="15" fill="#ffffff" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="742" y="122" width="116" height="30" rx="15" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
<text x="800" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b3a">Header</text>
<rect x="742" y="170" width="116" height="30" rx="15" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="800" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b3a">Leerzeile</text>
<rect x="742" y="210" width="116" height="30" rx="15" fill="#ffffff" stroke="#f87171" stroke-width="2"/>
<text x="800" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b3a">Body</text>
<text x="450" y="283" text-anchor="middle" font-size="13" fill="#475569">Jede Zeile endet mit CRLF (\r\n) · Header-Namen: Groß-/Kleinschreibung egal · Body ist optional</text>
</svg>
