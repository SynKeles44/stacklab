<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="410" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b3a">Docs as Code: Doku geht denselben Weg wie Code</text>
  <g font-size="16" fill="#1e1b3a" text-anchor="middle">
    <rect x="30" y="70" width="220" height="100" rx="12" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="3"/>
    <text x="140" y="108" font-weight="700">1. Ändern</text>
    <text x="140" y="132" font-size="14">Code und Doku im</text>
    <text x="140" y="150" font-size="14">selben Branch</text>
    <rect x="300" y="70" width="220" height="100" rx="12" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa" stroke-width="3"/>
    <text x="410" y="108" font-weight="700">2. Pull Request</text>
    <text x="410" y="132" font-size="14">Diff zeigt Code- und</text>
    <text x="410" y="150" font-size="14">Doku-Änderungen</text>
    <rect x="570" y="70" width="220" height="100" rx="12" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="3"/>
    <text x="680" y="108" font-weight="700">3. Automatische Prüfung</text>
    <text x="680" y="132" font-size="14" font-family="ui-monospace, Menlo, monospace">markdownlint</text>
    <text x="680" y="150" font-size="14">+ Link-Check in der CI</text>
    <rect x="570" y="240" width="220" height="100" rx="12" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-width="3"/>
    <text x="680" y="278" font-weight="700">4. Review</text>
    <text x="680" y="302" font-size="14">Ist die Doku richtig,</text>
    <text x="680" y="320" font-size="14">verständlich, vollständig?</text>
    <rect x="300" y="240" width="220" height="100" rx="12" fill="#34d399" fill-opacity="0.3" stroke="#34d399" stroke-width="3"/>
    <text x="410" y="278" font-weight="700">5. Merge</text>
    <text x="410" y="302" font-size="14">Code und Doku landen</text>
    <text x="410" y="320" font-size="14">gemeinsam in main</text>
    <rect x="30" y="240" width="220" height="100" rx="12" fill="#f87171" fill-opacity="0.15" stroke="#f87171" stroke-width="3"/>
    <text x="140" y="278" font-weight="700">6. Veröffentlicht</text>
    <text x="140" y="302" font-size="14">auf GitHub oder als</text>
    <text x="140" y="320" font-size="14">Doku-Website</text>
  </g>
  <g stroke="#1e1b3a" stroke-width="2" fill="none" marker-end="url(#pfeil)">
    <line x1="250" y1="120" x2="296" y2="120"/>
    <line x1="520" y1="120" x2="566" y2="120"/>
    <line x1="680" y1="170" x2="680" y2="236"/>
    <line x1="570" y1="290" x2="524" y2="290"/>
    <line x1="300" y1="290" x2="254" y2="290"/>
  </g>
  <text x="595" y="212" font-size="13" fill="#4b4766">rot? zurück zu 1.</text>
</svg>
