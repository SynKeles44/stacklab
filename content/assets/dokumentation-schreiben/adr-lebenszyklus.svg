<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="410" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b3a">Lebenszyklus eines ADR</text>
  <rect x="30" y="150" width="170" height="70" rx="12" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-width="3"/>
  <text x="115" y="182" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Vorgeschlagen</text>
  <text x="115" y="205" text-anchor="middle" font-size="13" fill="#4b4766" font-family="ui-monospace, Menlo, monospace">Proposed</text>
  <rect x="320" y="150" width="170" height="70" rx="12" fill="#34d399" fill-opacity="0.2" stroke="#34d399" stroke-width="3"/>
  <text x="405" y="182" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Akzeptiert</text>
  <text x="405" y="205" text-anchor="middle" font-size="13" fill="#4b4766" font-family="ui-monospace, Menlo, monospace">Accepted</text>
  <rect x="610" y="70" width="180" height="70" rx="12" fill="#a78bfa" fill-opacity="0.2" stroke="#a78bfa" stroke-width="3"/>
  <text x="700" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Abgelöst</text>
  <text x="700" y="125" text-anchor="middle" font-size="13" fill="#4b4766" font-family="ui-monospace, Menlo, monospace">Superseded by 0007</text>
  <rect x="610" y="230" width="180" height="70" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="3"/>
  <text x="700" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Veraltet</text>
  <text x="700" y="285" text-anchor="middle" font-size="13" fill="#4b4766" font-family="ui-monospace, Menlo, monospace">Deprecated</text>
  <rect x="320" y="300" width="170" height="60" rx="12" fill="#f87171" fill-opacity="0.15" stroke="#f87171" stroke-width="3"/>
  <text x="405" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Abgelehnt</text>
  <g stroke="#1e1b3a" stroke-width="2" fill="none" marker-end="url(#pfeil)">
    <line x1="200" y1="185" x2="316" y2="185"/>
    <line x1="490" y1="170" x2="606" y2="110"/>
    <line x1="490" y1="200" x2="606" y2="260"/>
    <path d="M115,220 C115,320 220,330 316,330"/>
  </g>
  <g font-size="14" fill="#1e1b3a">
    <text x="258" y="174" text-anchor="middle">Review</text>
    <text x="530" y="125" text-anchor="middle">neuer ADR</text>
    <text x="530" y="140" text-anchor="middle">ersetzt ihn</text>
    <text x="535" y="260" text-anchor="middle">gilt nicht</text>
    <text x="535" y="275" text-anchor="middle">mehr</text>
    <text x="175" y="310" text-anchor="middle">nicht übernommen</text>
  </g>
  <text x="410" y="390" text-anchor="middle" font-size="14" fill="#4b4766">Der Inhalt eines akzeptierten ADR bleibt unverändert – nur sein Status ändert sich.</text>
</svg>
