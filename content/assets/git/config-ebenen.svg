<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="800" height="380" fill="#ffffff"/>
<text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Die drei Ebenen der Git-Konfiguration</text>
<rect x="60" y="64" width="560" height="80" rx="14" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-width="3"/>
<text x="84" y="96" font-size="18" font-weight="700" fill="#1e1b3a">system</text>
<text x="84" y="124" font-size="14" fill="#475569">Für alle Benutzer:innen des Rechners</text>
<text x="600" y="96" text-anchor="end" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">/etc/gitconfig</text>
<text x="600" y="124" text-anchor="end" font-size="13" fill="#475569" font-family="ui-monospace, Menlo, monospace">git config --system</text>
<rect x="60" y="160" width="560" height="80" rx="14" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-width="3"/>
<text x="84" y="192" font-size="18" font-weight="700" fill="#1e1b3a">global</text>
<text x="84" y="220" font-size="14" fill="#475569">Für dich, in allen deinen Repositorys</text>
<text x="600" y="192" text-anchor="end" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">~/.gitconfig</text>
<text x="600" y="220" text-anchor="end" font-size="13" fill="#475569" font-family="ui-monospace, Menlo, monospace">git config --global</text>
<rect x="60" y="256" width="560" height="80" rx="14" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-width="3"/>
<text x="84" y="288" font-size="18" font-weight="700" fill="#1e1b3a">local</text>
<text x="84" y="316" font-size="14" fill="#475569">Nur für dieses eine Repository</text>
<text x="600" y="288" text-anchor="end" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">.git/config</text>
<text x="600" y="316" text-anchor="end" font-size="13" fill="#475569" font-family="ui-monospace, Menlo, monospace">git config --local</text>
<path d="M690 76 V 320" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
<text x="712" y="190" font-size="14" font-weight="600" fill="#1e1b3a">wird</text>
<text x="712" y="208" font-size="14" font-weight="600" fill="#1e1b3a">gelesen</text>
<text x="712" y="226" font-size="14" font-weight="600" fill="#1e1b3a">nach</text>
<text x="712" y="244" font-size="14" font-weight="600" fill="#1e1b3a">unten</text>
<text x="400" y="364" text-anchor="middle" font-size="14" fill="#1e1b3a">Gleiche Einstellung auf mehreren Ebenen? Die <tspan font-weight="700" fill="#059669">unterste (local)</tspan> gewinnt.</text>
</svg>
