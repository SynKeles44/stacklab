<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1e1b3a">Vom Farbwert zum Button: die Token-Kette</text>
  <rect x="20" y="60" width="175" height="150" rx="12" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-width="2"/>
  <text x="107" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">CSS-Variable</text>
  <text x="107" y="150" text-anchor="middle" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">--primary: oklch(…)</text>
  <text x="107" y="174" text-anchor="middle" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">in :root und .dark</text>
  <line x1="195" y1="135" x2="207" y2="135" stroke="#1e1b3a" stroke-width="2"/>
  <polygon points="207,130 215,135 207,140" fill="#1e1b3a"/>
  <rect x="215" y="60" width="175" height="150" rx="12" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-width="2"/>
  <text x="302" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">@theme inline</text>
  <text x="302" y="150" text-anchor="middle" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">--color-primary:</text>
  <text x="302" y="174" text-anchor="middle" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">var(--primary)</text>
  <line x1="390" y1="135" x2="402" y2="135" stroke="#1e1b3a" stroke-width="2"/>
  <polygon points="402,130 410,135 402,140" fill="#1e1b3a"/>
  <rect x="410" y="60" width="175" height="150" rx="12" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-width="2"/>
  <text x="497" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Utility-Klasse</text>
  <text x="497" y="150" text-anchor="middle" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">bg-primary</text>
  <text x="497" y="174" text-anchor="middle" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">text-primary-foreground</text>
  <line x1="585" y1="135" x2="597" y2="135" stroke="#1e1b3a" stroke-width="2"/>
  <polygon points="597,130 605,135 597,140" fill="#1e1b3a"/>
  <rect x="605" y="60" width="175" height="150" rx="12" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2"/>
  <text x="692" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Komponente</text>
  <text x="692" y="150" text-anchor="middle" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">&lt;Button&gt; mit</text>
  <text x="692" y="174" text-anchor="middle" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">cva-Variante default</text>
  <text x="400" y="240" text-anchor="middle" font-size="13" fill="#1e1b3a">Änderst du nur den Wert links, ändert sich jede Komponente, die die Klasse benutzt.</text>
</svg>
