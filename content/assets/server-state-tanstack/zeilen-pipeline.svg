<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b3a">Die Zeilen-Pipeline von TanStack Table</text>
  <rect x="20" y="110" width="160" height="80" rx="12" fill="#f1f5f9" stroke="#1e1b3a" stroke-width="2"/>
  <text x="100" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">data</text>
  <text x="100" y="168" text-anchor="middle" font-size="13" fill="#1e1b3a">alle Zeilen</text>
  <rect x="215" y="110" width="170" height="80" rx="12" fill="#cffafe" stroke="#22d3ee" stroke-width="3"/>
  <rect x="415" y="110" width="170" height="80" rx="12" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/>
  <rect x="615" y="110" width="170" height="80" rx="12" fill="#d1fae5" stroke="#34d399" stroke-width="3"/>
  <rect x="815" y="110" width="170" height="80" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <text x="300" y="156" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Core</text>
  <text x="500" y="156" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Filtern</text>
  <text x="700" y="156" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Sortieren</text>
  <text x="900" y="156" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Blättern</text>
  <line x1="182" y1="150" x2="211" y2="150" stroke="#1e1b3a" stroke-width="2.5" marker-end="url(#pp)"/>
  <line x1="387" y1="150" x2="411" y2="150" stroke="#1e1b3a" stroke-width="2.5" marker-end="url(#pp)"/>
  <line x1="587" y1="150" x2="611" y2="150" stroke="#1e1b3a" stroke-width="2.5" marker-end="url(#pp)"/>
  <line x1="787" y1="150" x2="811" y2="150" stroke="#1e1b3a" stroke-width="2.5" marker-end="url(#pp)"/>
  <text x="300" y="220" text-anchor="middle" font-size="13" fill="#1e1b3a">immer dabei</text>
  <text x="500" y="220" text-anchor="middle" font-size="13" fill="#1e1b3a">columnFilteringFeature</text>
  <text x="500" y="238" text-anchor="middle" font-size="13" fill="#1e1b3a">+ filteredRowModel</text>
  <text x="700" y="220" text-anchor="middle" font-size="13" fill="#1e1b3a">rowSortingFeature</text>
  <text x="700" y="238" text-anchor="middle" font-size="13" fill="#1e1b3a">+ sortedRowModel</text>
  <text x="900" y="220" text-anchor="middle" font-size="13" fill="#1e1b3a">rowPaginationFeature</text>
  <text x="900" y="238" text-anchor="middle" font-size="13" fill="#1e1b3a">+ paginatedRowModel</text>
  <line x1="900" y1="250" x2="900" y2="290" stroke="#1e1b3a" stroke-width="2.5" marker-end="url(#pp)"/>
  <rect x="640" y="294" width="345" height="56" rx="12" fill="#ffffff" stroke="#1e1b3a" stroke-width="2"/>
  <text x="812" y="328" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">table.getRowModel().rows</text>
  <text x="30" y="314" font-size="14" fill="#1e1b3a">Jede Stufe arbeitet auf dem Ergebnis der vorigen.</text>
  <text x="30" y="336" font-size="14" fill="#1e1b3a">Mit manual… = true überspringt die Tabelle eine Stufe –</text>
  <text x="30" y="358" font-size="14" fill="#1e1b3a">dann muss der Server sie erledigt haben.</text>
</svg>
