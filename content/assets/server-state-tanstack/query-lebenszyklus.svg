<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b3a">Lebenszyklus eines Query-Eintrags</text>
  <rect x="45" y="120" width="190" height="80" rx="14" fill="#cffafe" stroke="#22d3ee" stroke-width="3"/>
  <rect x="295" y="120" width="190" height="80" rx="14" fill="#d1fae5" stroke="#34d399" stroke-width="3"/>
  <rect x="545" y="120" width="190" height="80" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <rect x="795" y="120" width="190" height="80" rx="14" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/>
  <text x="140" y="167" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Lädt (fetching)</text>
  <text x="390" y="167" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Frisch (fresh)</text>
  <text x="640" y="167" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Veraltet (stale)</text>
  <text x="890" y="167" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Inaktiv (inactive)</text>
  <line x1="237" y1="160" x2="291" y2="160" stroke="#1e1b3a" stroke-width="2.5" marker-end="url(#pfeil)"/>
  <line x1="487" y1="160" x2="541" y2="160" stroke="#1e1b3a" stroke-width="2.5" marker-end="url(#pfeil)"/>
  <line x1="737" y1="160" x2="791" y2="160" stroke="#1e1b3a" stroke-width="2.5" marker-end="url(#pfeil)"/>
  <text x="264" y="105" text-anchor="middle" font-size="14" fill="#1e1b3a">Daten da</text>
  <text x="514" y="98" text-anchor="middle" font-size="14" fill="#1e1b3a">staleTime</text>
  <text x="514" y="114" text-anchor="middle" font-size="14" fill="#1e1b3a">abgelaufen</text>
  <text x="764" y="98" text-anchor="middle" font-size="14" fill="#1e1b3a">keine Komponente</text>
  <text x="764" y="114" text-anchor="middle" font-size="14" fill="#1e1b3a">nutzt ihn mehr</text>
  <path d="M640,202 C640,280 140,280 140,206" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#pfeil)"/>
  <text x="390" y="300" text-anchor="middle" font-size="15" fill="#1e1b3a">Refetch im Hintergrund: Mount, Fensterfokus, Reconnect oder Invalidierung</text>
  <line x1="890" y1="202" x2="890" y2="330" stroke="#1e1b3a" stroke-width="2.5" marker-end="url(#pfeil)"/>
  <text x="878" y="268" text-anchor="end" font-size="14" fill="#1e1b3a">gcTime abgelaufen</text>
  <text x="878" y="284" text-anchor="end" font-size="14" fill="#1e1b3a">(Standard 5 Min.)</text>
  <rect x="795" y="334" width="190" height="60" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="3"/>
  <text x="890" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Aus dem Cache entfernt</text>
  <text x="40" y="370" font-size="14" fill="#1e1b3a">Frische Daten werden bei Mount oder Fokus nicht neu geladen.</text>
  <text x="40" y="392" font-size="14" fill="#1e1b3a">Veraltete und inaktive Daten werden sofort angezeigt und im Hintergrund aktualisiert.</text>
</svg>
