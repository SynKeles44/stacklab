<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b3a">Ein Sprachmodell sagt immer nur das nächste Token voraus</text>
  <text x="40" y="90" font-size="15" font-weight="700" fill="#1e1b3a">1. Text wird in Tokens zerlegt</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#1e1b3a">
    <rect x="40" y="105" width="70" height="40" rx="8" fill="#e0f7fb" stroke="#22d3ee" stroke-width="2"/>
    <text x="75" y="131" text-anchor="middle">Der</text>
    <rect x="118" y="105" width="80" height="40" rx="8" fill="#e0f7fb" stroke="#22d3ee" stroke-width="2"/>
    <text x="158" y="131" text-anchor="middle">␣Test</text>
    <rect x="206" y="105" width="64" height="40" rx="8" fill="#e0f7fb" stroke="#22d3ee" stroke-width="2"/>
    <text x="238" y="131" text-anchor="middle">␣ist</text>
    <rect x="278" y="105" width="60" height="40" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="308" y="131" text-anchor="middle" fill="#a78bfa">?</text>
  </g>
  <text x="40" y="172" font-size="13" fill="#1e1b3a">Jedes Token ist für das Modell nur eine Zahl (Token-ID).</text>
  <text x="40" y="225" font-size="15" font-weight="700" fill="#1e1b3a">2. Das Modell berechnet Wahrscheinlichkeiten</text>
  <g font-size="15" fill="#1e1b3a">
    <text x="40" y="262" font-family="ui-monospace, Menlo, monospace">␣grün</text>
    <rect x="170" y="247" width="230" height="22" rx="4" fill="#34d399"/>
    <text x="410" y="263">46 %</text>
    <text x="40" y="297" font-family="ui-monospace, Menlo, monospace">␣fehlgeschlagen</text>
    <rect x="170" y="282" width="155" height="22" rx="4" fill="#f59e0b"/>
    <text x="335" y="298">31 %</text>
    <text x="40" y="332" font-family="ui-monospace, Menlo, monospace">␣rot</text>
    <rect x="170" y="317" width="60" height="22" rx="4" fill="#f87171"/>
    <text x="240" y="333">12 %</text>
    <text x="40" y="367" font-family="ui-monospace, Menlo, monospace">␣fertig</text>
    <rect x="170" y="352" width="30" height="22" rx="4" fill="#a78bfa"/>
    <text x="210" y="368">6 %</text>
  </g>
  <path d="M470 300 L560 300" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="580" y="225" font-size="15" font-weight="700" fill="#1e1b3a">3. Ein Token wird gewählt</text>
  <text x="580" y="250" font-size="13" fill="#1e1b3a">(nicht immer das wahrscheinlichste –</text>
  <text x="580" y="268" font-size="13" fill="#1e1b3a">die Temperatur steuert den Zufall)</text>
  <rect x="580" y="285" width="280" height="44" rx="8" fill="#f3efff" stroke="#a78bfa" stroke-width="2"/>
  <text x="720" y="313" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#1e1b3a">Der Test ist grün</text>
  <text x="580" y="360" font-size="15" font-weight="700" fill="#1e1b3a">4. Anhängen und wiederholen</text>
  <text x="580" y="384" font-size="13" fill="#1e1b3a">Bis ein Stopp-Token kommt oder das Limit erreicht ist.</text>
  <text x="580" y="402" font-size="13" fill="#f87171">„Wahrscheinlich“ heißt nicht „wahr“.</text>
</svg>
