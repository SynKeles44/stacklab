<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b3a">Das Kontextfenster: alles, was das Modell gerade „sieht“</text>
  <rect x="60" y="60" width="780" height="330" rx="14" fill="#ffffff" stroke="#1e1b3a" stroke-width="2"/>
  <rect x="80" y="80" width="740" height="44" rx="8" fill="#f3efff" stroke="#a78bfa" stroke-width="2"/>
  <text x="450" y="108" text-anchor="middle" font-size="16" fill="#1e1b3a"></text>
  <rect x="80" y="134" width="740" height="44" rx="8" fill="#f3efff" stroke="#a78bfa" stroke-width="2"/>
  <text x="450" y="162" text-anchor="middle" font-size="16" fill="#1e1b3a"></text>
  <rect x="80" y="188" width="740" height="44" rx="8" fill="#e0f7fb" stroke="#22d3ee" stroke-width="2"/>
  <text x="450" y="216" text-anchor="middle" font-size="16" fill="#1e1b3a"></text>
  <rect x="80" y="242" width="740" height="44" rx="8" fill="#e0f7fb" stroke="#22d3ee" stroke-width="2"/>
  <text x="450" y="270" text-anchor="middle" font-size="16" fill="#1e1b3a"></text>
