  <text x="450" y="371" text-anchor="middle" font-size="14" fill="#1e1b3a">Platz für die Antwort</text>
  <text x="60" y="420" font-size="14" fill="#1e1b3a">Alles zusammen muss in das Token-Limit passen. Was nicht drinsteht, kennt das Modell nicht.</text>
  <text x="60" y="442" font-size="14" fill="#f87171">Wird es voll, fallen alte Teile weg oder werden zusammengefasst.</text>
