<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">make setup – Targets und ihre Voraussetzungen</text>
  <rect x="300" y="60" width="200" height="56" rx="10" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="400" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">setup</text>
  <rect x="60" y="190" width="200" height="56" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="160" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">.env</text>
  <rect x="300" y="190" width="200" height="56" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="400" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">install</text>
  <rect x="540" y="190" width="200" height="56" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="640" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">hooks</text>
  <rect x="60" y="300" width="200" height="50" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="160" y="330" text-anchor="middle" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">.env.example</text>
  <line x1="360" y1="116" x2="180" y2="190" stroke="#1e1b3a" stroke-width="2"/>
  <line x1="400" y1="116" x2="400" y2="190" stroke="#1e1b3a" stroke-width="2"/>
  <line x1="440" y1="116" x2="620" y2="190" stroke="#1e1b3a" stroke-width="2"/>
  <line x1="160" y1="246" x2="160" y2="300" stroke="#1e1b3a" stroke-width="2"/>
  <text x="300" y="300" font-size="13" fill="#1e1b3a">Datei-Target: wird nur gebaut,</text>
  <text x="300" y="318" font-size="13" fill="#1e1b3a">wenn .env fehlt oder älter ist als .env.example</text>
  <text x="560" y="140" font-size="13" fill="#1e1b3a">Erst die Voraussetzungen,</text>
  <text x="560" y="158" font-size="13" fill="#1e1b3a">dann das Rezept von setup</text>
</svg>
