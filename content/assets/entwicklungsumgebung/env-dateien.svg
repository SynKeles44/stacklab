<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">.env.example im Repository, .env nur lokal</text>
  <rect x="40" y="64" width="330" height="200" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="60" y="92" font-size="16" font-weight="700" fill="#1e1b3a">.env.example  (wird committet)</text>
  <text x="60" y="126" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">APP_NAME=Demo</text>
  <text x="60" y="148" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">APP_PORT=8000</text>
  <text x="60" y="170" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">DB_PASSWORD=</text>
  <text x="60" y="192" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">API_TOKEN=&lt;dein-token&gt;</text>
  <text x="60" y="232" font-size="13" fill="#1e1b3a">Vorlage: welche Variablen gibt es?</text>
  <text x="60" y="252" font-size="13" fill="#1e1b3a">Keine echten Geheimnisse.</text>
  <rect x="430" y="64" width="330" height="200" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="450" y="92" font-size="16" font-weight="700" fill="#1e1b3a">.env  (steht in .gitignore)</text>
  <text x="450" y="126" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">APP_NAME=Demo</text>
  <text x="450" y="148" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">APP_PORT=8080</text>
  <text x="450" y="170" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">DB_PASSWORD=geheim123</text>
  <text x="450" y="192" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">API_TOKEN=xyz…</text>
  <text x="450" y="232" font-size="13" fill="#1e1b3a">Deine echten Werte.</text>
  <text x="450" y="252" font-size="13" fill="#1e1b3a">Verlässt nie deinen Rechner.</text>
  <line x1="370" y1="164" x2="428" y2="164" stroke="#1e1b3a" stroke-width="2"/>
  <polygon points="428,158 440,164 428,170" fill="#1e1b3a"/>
  <text x="400" y="150" text-anchor="middle" font-size="12" fill="#1e1b3a">cp</text>
  <rect x="140" y="296" width="520" height="56" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="400" y="322" text-anchor="middle" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">cp .env.example .env</text>
  <text x="400" y="342" text-anchor="middle" font-size="12" fill="#1e1b3a">Einmal nach dem Klonen – danach eigene Werte eintragen</text>
</svg>
