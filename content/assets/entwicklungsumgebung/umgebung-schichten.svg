<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">Die Schichten einer Entwicklungsumgebung</text>
  <rect x="60" y="56" width="680" height="62" rx="10" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="80" y="84" font-size="16" font-weight="700" fill="#1e1b3a">Editor / IDE</text>
  <text x="80" y="104" font-size="13" fill="#1e1b3a">VS Code, PhpStorm, Zed – Erweiterungen, Einstellungen, .editorconfig</text>
  <rect x="60" y="128" width="680" height="62" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="80" y="156" font-size="16" font-weight="700" fill="#1e1b3a">Werkzeuge &amp; Automatisierung</text>
  <text x="80" y="176" font-size="13" fill="#1e1b3a">Makefile, Git-Hooks, Linter, Formatter, direnv</text>
  <rect x="60" y="200" width="680" height="62" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="80" y="228" font-size="16" font-weight="700" fill="#1e1b3a">Laufzeitumgebungen (Runtimes)</text>
  <text x="80" y="248" font-size="13" fill="#1e1b3a">Node.js 24, PHP 8.5, Bun 1.4 – Versionen festgelegt mit mise</text>
  <rect x="60" y="272" width="680" height="62" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="80" y="300" font-size="16" font-weight="700" fill="#1e1b3a">Dienste</text>
  <text x="80" y="320" font-size="13" fill="#1e1b3a">Datenbank, Cache, Mail-Testserver – meist in Containern (Docker)</text>
  <rect x="60" y="344" width="680" height="62" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="80" y="372" font-size="16" font-weight="700" fill="#1e1b3a">Betriebssystem &amp; Konfiguration</text>
  <text x="80" y="392" font-size="13" fill="#1e1b3a">macOS, Linux, Windows (WSL) – Umgebungsvariablen, .env, dotfiles</text>
  <text x="400" y="430" text-anchor="middle" font-size="12" fill="#1e1b3a">Jede Schicht kann auf zwei Rechnern verschieden sein – deshalb hält man sie als Dateien im Repository fest.</text>
</svg>
