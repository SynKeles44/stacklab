<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><title>OAuth 2.0 Authorization Code Flow mit PKCE</title><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/></marker></defs><line x1="125" y1="84" x2="125" y2="620" stroke="#c4c2d4" stroke-width="2" stroke-dasharray="6 6"/><rect x="15" y="28" width="220" height="56" rx="10" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="2"/><text x="125" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Browser</text><line x1="375" y1="84" x2="375" y2="620" stroke="#c4c2d4" stroke-width="2" stroke-dasharray="6 6"/><rect x="265" y="28" width="220" height="56" rx="10" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa" stroke-width="2"/><text x="375" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Deine App (Client)</text><line x1="625" y1="84" x2="625" y2="620" stroke="#c4c2d4" stroke-width="2" stroke-dasharray="6 6"/><rect x="515" y="28" width="220" height="56" rx="10" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="2"/><text x="625" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Autorisierungsserver</text><line x1="875" y1="84" x2="875" y2="620" stroke="#c4c2d4" stroke-width="2" stroke-dasharray="6 6"/><rect x="765" y="28" width="220" height="56" rx="10" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-width="2"/><text x="875" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">API (Ressourcenserver)</text><line x1="129" y1="140" x2="369" y2="140" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/><text x="250" y="130" text-anchor="middle" font-size="14" fill="#1e1b3a">1  Klick: „Mit Konto anmelden“</text><line x1="371" y1="196" x2="131" y2="196" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/><text x="250" y="186" text-anchor="middle" font-size="14" fill="#1e1b3a">2  302 zum Login-Server</text><text x="250" y="216" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#6b6889">state + code_challenge</text><line x1="129" y1="252" x2="619" y2="252" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/><text x="375" y="242" text-anchor="middle" font-size="14" fill="#1e1b3a">3  GET /authorize – Login und Zustimmung</text><text x="375" y="272" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#6b6889">client_id, redirect_uri, scope</text><line x1="621" y1="308" x2="131" y2="308" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/><text x="375" y="298" text-anchor="middle" font-size="14" fill="#1e1b3a">4  302 zurück an redirect_uri</text><text x="375" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Autorisierungscode</text><line x1="129" y1="364" x2="369" y2="364" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/><text x="250" y="354" text-anchor="middle" font-size="14" fill="#1e1b3a">5  GET /callback mit code und state</text><text x="250" y="384" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#6b6889">App prüft state</text><line x1="379" y1="420" x2="619" y2="420" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/><text x="500" y="410" text-anchor="middle" font-size="14" fill="#1e1b3a">6  POST /token mit code</text><text x="500" y="443" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">code_verifier</text><line x1="621" y1="476" x2="381" y2="476" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/><text x="500" y="466" text-anchor="middle" font-size="14" fill="#1e1b3a">7  access_token, id_token</text><line x1="379" y1="532" x2="869" y2="532" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/><text x="625" y="522" text-anchor="middle" font-size="14" fill="#1e1b3a">8  GET /userinfo mit Authorization: Bearer …</text><line x1="871" y1="588" x2="381" y2="588" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/><text x="625" y="578" text-anchor="middle" font-size="14" fill="#1e1b3a">9  Daten des Nutzers (JSON)</text></svg>
