<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Ablauf einer Session-Anmeldung mit Cookie</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/></marker>
  </defs>
  <rect x="30" y="30" width="220" height="60" rx="10" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="2"/>
  <text x="140" y="67" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Browser</text>
  <rect x="440" y="30" width="220" height="60" rx="10" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa" stroke-width="2"/>
  <text x="550" y="67" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Server (Laravel)</text>
  <rect x="720" y="30" width="210" height="60" rx="10" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-width="2"/>
  <text x="825" y="58" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Session-Speicher</text>
  <text x="825" y="78" text-anchor="middle" font-size="12" fill="#1e1b3a">Datenbank, Redis, Dateien</text>
  <line x1="140" y1="90" x2="140" y2="500" stroke="#c4c2d4" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="550" y1="90" x2="550" y2="500" stroke="#c4c2d4" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="825" y1="90" x2="825" y2="500" stroke="#c4c2d4" stroke-width="2" stroke-dasharray="6 6"/>

  <line x1="144" y1="140" x2="544" y2="140" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pf)"/>
  <text x="345" y="130" text-anchor="middle" font-size="14" fill="#1e1b3a">1  POST /login – E-Mail und Passwort</text>
  <line x1="554" y1="180" x2="819" y2="180" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pf)"/>
  <text x="687" y="170" text-anchor="middle" font-size="14" fill="#1e1b3a">2  Passwort ok: neue Session</text>
  <text x="687" y="200" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#6b6889">id=k3Jq… → user_id: 42</text>
  <line x1="546" y1="250" x2="146" y2="250" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pf)"/>
  <text x="345" y="240" text-anchor="middle" font-size="14" fill="#1e1b3a">3  302 + Set-Cookie mit der Session-ID</text>
  <text x="345" y="272" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#6b6889">laravel_session=k3Jq…; HttpOnly; Secure; SameSite=Lax</text>
  <rect x="40" y="300" width="200" height="40" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2"/>
  <text x="140" y="325" text-anchor="middle" font-size="13" fill="#1e1b3a">Browser speichert Cookie</text>
  <line x1="144" y1="380" x2="544" y2="380" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pf)"/>
  <text x="345" y="370" text-anchor="middle" font-size="14" fill="#1e1b3a">4  GET /dashboard – Cookie geht automatisch mit</text>
  <line x1="554" y1="420" x2="819" y2="420" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pf)"/>
  <text x="687" y="410" text-anchor="middle" font-size="14" fill="#1e1b3a">5  Session k3Jq… nachschlagen</text>
  <line x1="546" y1="470" x2="146" y2="470" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pf)"/>
  <text x="345" y="460" text-anchor="middle" font-size="14" fill="#1e1b3a">6  200 – „Hallo, Ada!“</text>
</svg>
