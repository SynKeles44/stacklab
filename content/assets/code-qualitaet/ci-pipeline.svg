<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="450" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Qualitäts-Pipeline: schnell vor langsam</text>
<rect x="20" y="70" width="150" height="110" rx="12" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-width="2"/>
<text x="95" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">1. Vorbereiten</text>
<text x="95" y="126" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">checkout</text>
<text x="95" y="146" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">composer install</text>
<text x="95" y="166" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">npm ci</text>
<rect x="195" y="70" width="150" height="110" rx="12" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-width="2"/>
<text x="270" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">2. Formatieren</text>
<text x="270" y="126" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">pint --test</text>
<text x="270" y="146" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">biome ci</text>
<text x="270" y="166" text-anchor="middle" font-size="12" fill="#475569">Sekunden</text>
<rect x="370" y="70" width="150" height="110" rx="12" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-width="2"/>
<text x="445" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">3. Umbauten</text>
<text x="445" y="126" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">rector --dry-run</text>
<text x="445" y="166" text-anchor="middle" font-size="12" fill="#475569">Sekunden</text>
<rect x="545" y="70" width="150" height="110" rx="12" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-width="2"/>
<text x="620" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">4. Analyse</text>
<text x="620" y="126" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">phpstan analyse</text>
<text x="620" y="146" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">tsc --noEmit</text>
<text x="620" y="166" text-anchor="middle" font-size="12" fill="#475569">bis 1 Minute</text>
<rect x="720" y="70" width="160" height="110" rx="12" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-width="2"/>
<text x="800" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">5. Tests</text>
<text x="800" y="126" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">pest / vitest</text>
<text x="800" y="166" text-anchor="middle" font-size="12" fill="#475569">Minuten</text>
<line x1="170" y1="125" x2="193" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="345" y1="125" x2="368" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="520" y1="125" x2="543" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="695" y1="125" x2="718" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="195" y="230" width="230" height="80" rx="12" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-width="2"/>
<text x="310" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Exit-Code ≠ 0</text>
<text x="310" y="288" text-anchor="middle" font-size="13" fill="#1e1b3a">Pipeline rot → kein Merge</text>
<rect x="475" y="230" width="230" height="80" rx="12" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-width="2"/>
<text x="590" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Alle Exit-Codes 0</text>
<text x="590" y="288" text-anchor="middle" font-size="13" fill="#1e1b3a">Pipeline grün → Merge erlaubt</text>
<text x="450" y="340" text-anchor="middle" font-size="13" fill="#475569">Bricht ein Schritt ab, laufen die späteren nicht mehr – das spart Zeit.</text>
</svg>
