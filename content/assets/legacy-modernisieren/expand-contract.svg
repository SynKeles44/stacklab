<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1e1b3a">Expand and Contract: Schema ändern ohne Ausfall</text>
  <rect x="30" y="70" width="290" height="320" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="3"/>
  <text x="175" y="105" text-anchor="middle" font-size="21" font-weight="700" fill="#1e1b3a">1. Expand</text>
  <text x="175" y="132" text-anchor="middle" font-size="15" fill="#1e1b3a">Neues hinzufügen, nichts löschen</text>
  <rect x="60" y="155" width="230" height="40" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="175" y="181" text-anchor="middle" font-size="15" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">kiste (TEXT)</text>
  <rect x="60" y="205" width="230" height="40" rx="6" fill="#ffffff" stroke="#34d399" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="175" y="231" text-anchor="middle" font-size="15" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">kiste_id (neu, leer)</text>
  <text x="175" y="290" text-anchor="middle" font-size="15" fill="#1e1b3a">Alter Code läuft weiter</text>
  <text x="175" y="315" text-anchor="middle" font-size="15" fill="#1e1b3a">und ignoriert die</text>
  <text x="175" y="340" text-anchor="middle" font-size="15" fill="#1e1b3a">neue Spalte</text>
  <rect x="355" y="70" width="290" height="320" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/>
  <text x="500" y="105" text-anchor="middle" font-size="21" font-weight="700" fill="#1e1b3a">2. Migrate</text>
  <text x="500" y="132" text-anchor="middle" font-size="15" fill="#1e1b3a">Daten füllen, Code umstellen</text>
  <rect x="385" y="155" width="230" height="40" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="500" y="181" text-anchor="middle" font-size="15" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">kiste (TEXT)</text>
  <rect x="385" y="205" width="230" height="40" rx="6" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  <text x="500" y="231" text-anchor="middle" font-size="15" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">kiste_id (befüllt)</text>
  <text x="500" y="290" text-anchor="middle" font-size="15" fill="#1e1b3a">Backfill der Altdaten,</text>
  <text x="500" y="315" text-anchor="middle" font-size="15" fill="#1e1b3a">Code schreibt beide,</text>
  <text x="500" y="340" text-anchor="middle" font-size="15" fill="#1e1b3a">liest die neue Spalte</text>
  <rect x="680" y="70" width="290" height="320" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
  <text x="825" y="105" text-anchor="middle" font-size="21" font-weight="700" fill="#1e1b3a">3. Contract</text>
  <text x="825" y="132" text-anchor="middle" font-size="15" fill="#1e1b3a">Altes entfernen</text>
  <rect x="710" y="155" width="230" height="40" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="825" y="181" text-anchor="middle" font-size="15" fill="#f87171" font-family="ui-monospace, Menlo, monospace" text-decoration="line-through">kiste (TEXT)</text>
  <rect x="710" y="205" width="230" height="40" rx="6" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  <text x="825" y="231" text-anchor="middle" font-size="15" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">kiste_id NOT NULL</text>
  <text x="825" y="290" text-anchor="middle" font-size="15" fill="#1e1b3a">Erst wenn kein Code</text>
  <text x="825" y="315" text-anchor="middle" font-size="15" fill="#1e1b3a">die alte Spalte mehr</text>
  <text x="825" y="340" text-anchor="middle" font-size="15" fill="#1e1b3a">benutzt</text>
  <line x1="320" y1="230" x2="351" y2="230" stroke="#1e1b3a" stroke-width="3" marker-end="url(#pfeil)"/>
  <line x1="645" y1="230" x2="676" y2="230" stroke="#1e1b3a" stroke-width="3" marker-end="url(#pfeil)"/>
  <text x="500" y="440" text-anchor="middle" font-size="16" fill="#1e1b3a">Jede Phase ist ein eigenes Deployment – nach Phase 1 und 2 ist ein Rollback jederzeit möglich.</text>
</svg>
