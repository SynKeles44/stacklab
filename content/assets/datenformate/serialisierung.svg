<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">Serialisieren und Deserialisieren</text>
  <rect x="30" y="80" width="220" height="170" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="140" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Programm A</text>
  <text x="140" y="128" text-anchor="middle" font-size="12" fill="#1e1b3a">Objekt im Arbeitsspeicher</text>
  <circle cx="140" cy="170" r="16" fill="#22d3ee"/>
  <circle cx="95" cy="215" r="12" fill="#a78bfa"/>
  <circle cx="140" cy="222" r="12" fill="#a78bfa"/>
  <circle cx="185" cy="215" r="12" fill="#a78bfa"/>
  <line x1="140" y1="186" x2="98" y2="204" stroke="#1e1b3a" stroke-width="1.5"/>
  <line x1="140" y1="186" x2="140" y2="210" stroke="#1e1b3a" stroke-width="1.5"/>
  <line x1="140" y1="186" x2="182" y2="204" stroke="#1e1b3a" stroke-width="1.5"/>
  <line x1="255" y1="165" x2="345" y2="165" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="300" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b3a">serialisieren</text>
  <text x="300" y="188" text-anchor="middle" font-size="11" fill="#1e1b3a">JSON.stringify</text>
  <rect x="350" y="80" width="260" height="170" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="480" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Text (Bytes)</text>
  <text x="480" y="128" text-anchor="middle" font-size="12" fill="#1e1b3a">Datei, Netzwerk, Datenbank</text>
  <text x="372" y="162" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">{"name": "Ada",</text>
  <text x="372" y="184" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">&#160;"skills": ["php",</text>
  <text x="372" y="206" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">&#160;&#160;"sql", "js"]}</text>
  <line x1="615" y1="165" x2="705" y2="165" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="660" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b3a">deserialisieren</text>
  <text x="660" y="188" text-anchor="middle" font-size="11" fill="#1e1b3a">json_decode</text>
  <rect x="710" y="80" width="220" height="170" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="820" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Programm B</text>
  <text x="820" y="128" text-anchor="middle" font-size="12" fill="#1e1b3a">neues Objekt im Speicher</text>
  <circle cx="820" cy="170" r="16" fill="#34d399"/>
  <circle cx="775" cy="215" r="12" fill="#a78bfa"/>
  <circle cx="820" cy="222" r="12" fill="#a78bfa"/>
  <circle cx="865" cy="215" r="12" fill="#a78bfa"/>
  <line x1="820" y1="186" x2="778" y2="204" stroke="#1e1b3a" stroke-width="1.5"/>
  <line x1="820" y1="186" x2="820" y2="210" stroke="#1e1b3a" stroke-width="1.5"/>
  <line x1="820" y1="186" x2="862" y2="204" stroke="#1e1b3a" stroke-width="1.5"/>
  <text x="480" y="292" text-anchor="middle" font-size="13" fill="#1e1b3a">Programm A und B können in verschiedenen Sprachen geschrieben sein – sie teilen nur das Format.</text>
</svg>
