<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">Mehrzeilige Strings in YAML</text>
  <rect x="30" y="60" width="430" height="140" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="50" y="88" font-size="16" font-weight="700" fill="#1e1b3a">|  Literal: Zeilenumbrüche bleiben</text>
  <g font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">
    <text x="50" y="122">script: |</text>
    <text x="50" y="146">&#160;&#160;npm ci</text>
    <text x="50" y="170">&#160;&#160;npm test</text>
  </g>
  <rect x="500" y="60" width="430" height="140" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="520" y="88" font-size="16" font-weight="700" fill="#1e1b3a">&gt;  Folded: Zeilen werden zu Leerzeichen</text>
  <g font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">
    <text x="520" y="122">text: &gt;</text>
    <text x="520" y="146">&#160;&#160;Ein langer Satz,</text>
    <text x="520" y="170">&#160;&#160;sauber umbrochen.</text>
  </g>
  <rect x="30" y="220" width="430" height="80" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="50" y="248" font-size="13" fill="#1e1b3a">Ergebnis als String:</text>
  <text x="50" y="278" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">"npm ci\nnpm test\n"</text>
  <rect x="500" y="220" width="430" height="80" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="520" y="248" font-size="13" fill="#1e1b3a">Ergebnis als String:</text>
  <text x="520" y="278" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">"Ein langer Satz, sauber umbrochen.\n"</text>
  <text x="480" y="336" text-anchor="middle" font-size="13" fill="#1e1b3a">Mit |- oder &gt;- entfällt der letzte Zeilenumbruch, mit |+ oder &gt;+ bleiben alle Leerzeilen am Ende erhalten.</text>
</svg>
