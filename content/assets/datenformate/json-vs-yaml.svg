<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">Dieselben Daten – zwei Schreibweisen</text>
  <rect x="30" y="60" width="430" height="270" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="50" y="90" font-size="16" font-weight="700" fill="#1e1b3a">JSON: Klammern und Anführungszeichen</text>
  <g font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">
    <text x="50" y="128">{</text>
    <text x="50" y="152">&#160;&#160;"name": "shop",</text>
    <text x="50" y="176">&#160;&#160;"port": 8080,</text>
    <text x="50" y="200">&#160;&#160;"debug": false,</text>
    <text x="50" y="224">&#160;&#160;"tags": ["web", "api"],</text>
    <text x="50" y="248">&#160;&#160;"db": {</text>
    <text x="50" y="272">&#160;&#160;&#160;&#160;"host": "db.example.com"</text>
    <text x="50" y="296">&#160;&#160;}</text>
    <text x="50" y="320">}</text>
  </g>
  <rect x="500" y="60" width="430" height="270" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="520" y="90" font-size="16" font-weight="700" fill="#1e1b3a">YAML: Einrückung statt Klammern</text>
  <g font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">
    <text x="520" y="128"># Kommentare sind erlaubt</text>
    <text x="520" y="152">name: shop</text>
    <text x="520" y="176">port: 8080</text>
    <text x="520" y="200">debug: false</text>
    <text x="520" y="224">tags:</text>
    <text x="520" y="248">&#160;&#160;- web</text>
    <text x="520" y="272">&#160;&#160;- api</text>
    <text x="520" y="296">db:</text>
    <text x="520" y="320">&#160;&#160;host: db.example.com</text>
  </g>
  <text x="480" y="362" text-anchor="middle" font-size="13" fill="#1e1b3a">Beide Dateien ergeben nach dem Einlesen exakt dieselbe Datenstruktur.</text>
</svg>
