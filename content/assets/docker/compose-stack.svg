<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1e1b3a"/></marker></defs>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">Ein Compose-Projekt: Services in einem gemeinsamen Netzwerk</text>
  <text x="70" y="84" font-size="13" fill="#1e1b3a">Browser</text>
  <text x="70" y="102" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">localhost:8080</text>
  <path d="M120 112 L120 160" stroke="#1e1b3a" stroke-width="2" marker-end="url(#c)"/>
  <rect x="30" y="140" width="740" height="200" rx="14" fill="#f8fafc" stroke="#64748b" stroke-dasharray="8 5"/>
  <text x="760" y="160" text-anchor="end" font-size="13" fill="#1e1b3a">Netzwerk „shop_default“ – Services finden sich per Name</text>
  <g font-size="13" fill="#1e1b3a" text-anchor="middle">
    <rect x="60" y="180" width="130" height="70" rx="8" fill="#ecfeff" stroke="#22d3ee"/>
    <text x="125" y="208" font-weight="700">web</text><text x="125" y="228">nginx · 8080:80</text>
    <rect x="260" y="180" width="130" height="70" rx="8" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="325" y="208" font-weight="700">php</text><text x="325" y="228">php-fpm · 9000</text>
    <rect x="460" y="180" width="130" height="70" rx="8" fill="#ecfdf5" stroke="#34d399"/>
    <text x="525" y="208" font-weight="700">db</text><text x="525" y="228">postgres · healthy</text>
    <rect x="620" y="180" width="130" height="70" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="685" y="208" font-weight="700">mailpit</text><text x="685" y="228">Profil „tools“</text>
    <rect x="460" y="275" width="130" height="44" rx="8" fill="#ffffff" stroke="#34d399"/>
    <text x="525" y="302">Volume pgdata</text>
  </g>
  <path d="M192 215 L256 215" stroke="#1e1b3a" stroke-width="2" marker-end="url(#c)"/>
  <text x="224" y="207" text-anchor="middle" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">php:9000</text>
  <path d="M392 215 L456 215" stroke="#1e1b3a" stroke-width="2" marker-end="url(#c)"/>
  <text x="424" y="207" text-anchor="middle" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">db:5432</text>
  <path d="M525 252 L525 272" stroke="#1e1b3a" stroke-width="2" marker-end="url(#c)"/>
  <text x="400" y="375" text-anchor="middle" font-size="13" fill="#1e1b3a">depends_on mit condition: service_healthy – php startet erst, wenn db wirklich bereit ist.</text>
</svg>
