<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1e1b3a"/></marker></defs>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">Multi-Stage-Build: nur das Ergebnis wandert ins finale Image</text>
  <g font-size="13" fill="#1e1b3a">
    <rect x="30" y="60" width="300" height="250" rx="10" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="50" y="88" font-weight="700">Stage „build“ (wird verworfen)</text>
    <text x="50" y="112" font-family="ui-monospace, Menlo, monospace">FROM node:24-alpine AS build</text>
    <text x="50" y="140">• Compiler, Dev-Abhängigkeiten</text>
    <text x="50" y="162">• Quellcode, Tests</text>
    <text x="50" y="184">• node_modules (mehrere 100 MB)</text>
    <rect x="50" y="220" width="260" height="60" rx="6" fill="#ecfdf5" stroke="#34d399"/>
    <text x="180" y="246" text-anchor="middle" font-weight="700">Build-Ergebnis</text>
    <text x="180" y="266" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">/app/dist</text>
    <rect x="470" y="60" width="300" height="250" rx="10" fill="#ecfeff" stroke="#22d3ee"/>
    <text x="490" y="88" font-weight="700">Finale Stage (wird ausgeliefert)</text>
    <text x="490" y="112" font-family="ui-monospace, Menlo, monospace">FROM nginx:1.30-alpine</text>
    <text x="490" y="140">• nur Laufzeit, kein Compiler</text>
    <text x="490" y="162">• keine Dev-Abhängigkeiten</text>
    <text x="490" y="184">• klein und angriffsarm</text>
    <rect x="490" y="220" width="260" height="60" rx="6" fill="#ecfdf5" stroke="#34d399"/>
    <text x="620" y="246" text-anchor="middle" font-weight="700">kopiertes Ergebnis</text>
    <text x="620" y="266" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">/usr/share/nginx/html</text>
  </g>
  <path d="M312 250 L486 250" stroke="#1e1b3a" stroke-width="2.5" marker-end="url(#m)"/>
  <text x="400" y="238" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">COPY --from=build</text>
  <text x="400" y="350" text-anchor="middle" font-size="14" fill="#1e1b3a">Typisch: aus ca. 1 GB Build-Umgebung wird ein Image mit 50–80 MB.</text>
</svg>
