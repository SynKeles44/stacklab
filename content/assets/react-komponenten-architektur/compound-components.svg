<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/></marker></defs>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">Compound Component: Tabs teilen ihren Zustand über Context</text>
  <rect x="300" y="56" width="300" height="80" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="450" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Tabs (Wurzel)</text>
  <text x="450" y="114" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#1e1b3a">const [value, setValue] = useState()</text>
  <rect x="330" y="166" width="240" height="50" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="197" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">TabsContext.Provider</text>
  <line x1="450" y1="136" x2="450" y2="162" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pf)"/>
  <rect x="40" y="270" width="240" height="80" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="160" y="302" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">TabsList</text>
  <text x="160" y="328" text-anchor="middle" font-size="12" fill="#1e1b3a">role="tablist"</text>
  <rect x="330" y="270" width="240" height="80" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="450" y="302" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">TabsTrigger</text>
  <text x="450" y="328" text-anchor="middle" font-size="12" fill="#1e1b3a">liest value, ruft setValue</text>
  <rect x="620" y="270" width="240" height="80" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="740" y="302" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">TabsContent</text>
  <text x="740" y="328" text-anchor="middle" font-size="12" fill="#1e1b3a">zeigt sich nur, wenn aktiv</text>
  <line x1="400" y1="216" x2="200" y2="266" stroke="#1e1b3a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pf)"/>
  <line x1="450" y1="216" x2="450" y2="266" stroke="#1e1b3a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pf)"/>
  <line x1="500" y1="216" x2="700" y2="266" stroke="#1e1b3a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pf)"/>
  <text x="450" y="384" text-anchor="middle" font-size="13" fill="#1e1b3a">Gestrichelt: useContext(TabsContext) – keine Props nötig, egal wie tief verschachtelt</text>
</svg>
