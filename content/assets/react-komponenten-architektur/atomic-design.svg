<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">Atomic Design: kleine Bausteine bilden größere</text>
  <defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/></marker></defs>
  <!-- Atome -->
  <rect x="20" y="70" width="190" height="220" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="115" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Atome</text>
  <rect x="55" y="120" width="120" height="34" rx="8" fill="#22d3ee"/><text x="115" y="142" text-anchor="middle" font-size="14" fill="#1e1b3a">Button</text>
  <rect x="55" y="166" width="120" height="34" rx="8" fill="#ffffff" stroke="#1e1b3a"/><text x="115" y="188" text-anchor="middle" font-size="14" fill="#1e1b3a">Input</text>
  <circle cx="115" cy="238" r="20" fill="#a78bfa"/><text x="115" y="276" text-anchor="middle" font-size="13" fill="#1e1b3a">Avatar, Badge, Icon</text>
  <line x1="214" y1="180" x2="244" y2="180" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pf)"/>
  <!-- Moleküle -->
  <rect x="250" y="70" width="190" height="220" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="345" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Moleküle</text>
  <rect x="268" y="130" width="154" height="46" rx="8" fill="#ffffff" stroke="#1e1b3a"/>
  <rect x="276" y="140" width="84" height="26" rx="5" fill="#ffffff" stroke="#1e1b3a"/>
  <rect x="366" y="140" width="48" height="26" rx="5" fill="#22d3ee"/>
  <text x="345" y="198" text-anchor="middle" font-size="14" fill="#1e1b3a">Suchfeld</text>
  <text x="345" y="246" text-anchor="middle" font-size="13" fill="#1e1b3a">Formularfeld,</text>
  <text x="345" y="264" text-anchor="middle" font-size="13" fill="#1e1b3a">Benutzer-Chip</text>
  <line x1="444" y1="180" x2="474" y2="180" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pf)"/>
  <!-- Organismen -->
  <rect x="480" y="70" width="190" height="220" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="575" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Organismen</text>
  <rect x="496" y="124" width="158" height="62" rx="8" fill="#ffffff" stroke="#1e1b3a"/>
  <rect x="504" y="134" width="34" height="14" rx="3" fill="#f59e0b"/>
  <rect x="504" y="156" width="80" height="20" rx="4" fill="#ffffff" stroke="#1e1b3a"/>
  <rect x="588" y="156" width="32" height="20" rx="4" fill="#22d3ee"/>
  <circle cx="636" cy="141" r="8" fill="#a78bfa"/>
  <text x="575" y="208" text-anchor="middle" font-size="14" fill="#1e1b3a">Kopfbereich</text>
  <text x="575" y="250" text-anchor="middle" font-size="13" fill="#1e1b3a">Produktliste,</text>
  <text x="575" y="268" text-anchor="middle" font-size="13" fill="#1e1b3a">Warenkorb</text>
  <line x1="674" y1="180" x2="704" y2="180" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pf)"/>
  <!-- Seiten -->
  <rect x="710" y="70" width="170" height="220" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="795" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Seiten</text>
  <rect x="730" y="118" width="130" height="130" rx="6" fill="#ffffff" stroke="#1e1b3a"/>
  <rect x="738" y="126" width="114" height="22" rx="3" fill="#ecfdf5" stroke="#34d399"/>
  <rect x="738" y="156" width="114" height="84" rx="3" fill="#ecfdf5" stroke="#34d399"/>
  <text x="795" y="272" text-anchor="middle" font-size="13" fill="#1e1b3a">Startseite, Checkout</text>
  <text x="450" y="330" text-anchor="middle" font-size="14" fill="#1e1b3a">Importe zeigen nur nach unten: Seite → Organismus → Molekül → Atom</text>
</svg>
