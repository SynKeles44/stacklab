<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Code-first: eine Quelle, viele Ergebnisse</text>
  <rect x="30" y="70" width="190" height="110" rx="10" fill="#f8fafc" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="125" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">PHP-Code</text>
  <text x="44" y="122" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#1e1b3a">#[OA\Get(...)]</text>
  <text x="44" y="140" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#1e1b3a">#[OA\Response(...)]</text>
  <text x="44" y="158" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#1e1b3a">#[OA\Schema]</text>
  <line x1="224" y1="125" x2="286" y2="125" stroke="#1e1b3a" stroke-width="1.5" marker-end="url(#pf)"/>
  <text x="255" y="114" text-anchor="middle" font-size="11" fill="#475569">swagger-php</text>
  <rect x="290" y="90" width="180" height="70" rx="10" fill="#f8fafc" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="380" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">openapi.yaml</text>
  <text x="380" y="140" text-anchor="middle" font-size="11" fill="#475569">pro Version: v1, v2</text>
  <line x1="380" y1="164" x2="380" y2="216" stroke="#1e1b3a" stroke-width="1.5" marker-end="url(#pf)"/>
  <rect x="290" y="220" width="180" height="56" rx="10" fill="#f8fafc" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="380" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">Redocly lint</text>
  <text x="380" y="262" text-anchor="middle" font-size="11" fill="#475569">Fehler → CI rot</text>
  <g font-size="13" fill="#1e1b3a">
    <rect x="560" y="60" width="210" height="44" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
    <text x="665" y="87" text-anchor="middle">Doku-Seite (Redoc, Scalar)</text>
    <rect x="560" y="120" width="210" height="44" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
    <text x="665" y="147" text-anchor="middle">Collection (Postman, Bruno)</text>
    <rect x="560" y="180" width="210" height="44" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
    <text x="665" y="207" text-anchor="middle">Typisierter API-Client</text>
  </g>
  <line x1="474" y1="115" x2="556" y2="82" stroke="#1e1b3a" stroke-width="1.5" marker-end="url(#pf)"/>
  <line x1="474" y1="125" x2="556" y2="142" stroke="#1e1b3a" stroke-width="1.5" marker-end="url(#pf)"/>
  <line x1="474" y1="135" x2="556" y2="200" stroke="#1e1b3a" stroke-width="1.5" marker-end="url(#pf)"/>
  <text x="400" y="330" text-anchor="middle" font-size="12" fill="#475569">Geändert wird nur der Code – alles andere wird daraus neu erzeugt.</text>
</svg>
