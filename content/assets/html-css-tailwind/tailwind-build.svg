<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">So entsteht output.css</text>
<rect x="30" y="70" width="220" height="90" rx="12" fill="#a78bfa" fill-opacity=".15" stroke="#a78bfa" stroke-width="3"/>
<text x="140" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">input.css</text>
<text x="140" y="126" text-anchor="middle" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">@import "tailwindcss";</text>
<text x="140" y="146" text-anchor="middle" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">@theme { … }</text>
<rect x="30" y="190" width="220" height="110" rx="12" fill="#22d3ee" fill-opacity=".15" stroke="#22d3ee" stroke-width="3"/>
<text x="140" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">index.html</text>
<text x="140" y="246" text-anchor="middle" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">class="p-6 text-3xl</text>
<text x="140" y="266" text-anchor="middle" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">md:flex-row"</text>
<text x="140" y="288" text-anchor="middle" font-size="12" fill="#475569">Klassen werden gesucht</text>
<rect x="320" y="125" width="180" height="110" rx="14" fill="#e11d48" fill-opacity=".1" stroke="#e11d48" stroke-width="3"/>
<text x="410" y="165" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Tailwind CLI</text>
<text x="410" y="192" text-anchor="middle" font-size="11" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">npx @tailwindcss/cli</text>
<text x="410" y="210" text-anchor="middle" font-size="11" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">-i input.css -o output.css</text>
<path d="M252 120 L316 160" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<path d="M252 240 L316 205" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<rect x="570" y="110" width="200" height="140" rx="12" fill="#34d399" fill-opacity=".15" stroke="#34d399" stroke-width="3"/>
<text x="670" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">output.css</text>
<text x="670" y="166" text-anchor="middle" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">.p-6 { … }</text>
<text x="670" y="186" text-anchor="middle" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">.text-3xl { … }</text>
<text x="670" y="206" text-anchor="middle" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">@media … .md\:flex-row</text>
<text x="670" y="232" text-anchor="middle" font-size="12" fill="#475569">nur benutzte Klassen</text>
<path d="M502 180 H 566" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<path d="M670 254 V 300 H 260" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#a)"/>
<text x="470" y="322" text-anchor="middle" font-size="13" fill="#475569">index.html bindet output.css ein: &lt;link rel="stylesheet" href="output.css"&gt;</text>
</svg>
