<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#e11d48"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7c3aed"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Flex-Container mit flex-direction: row</text>
<rect x="110" y="70" width="600" height="230" rx="14" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-width="3"/>
<text x="130" y="96" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">display: flex</text>
<rect x="170" y="140" width="120" height="100" rx="10" fill="#34d399" fill-opacity=".25" stroke="#34d399" stroke-width="2"/>
<text x="230" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Item 1</text>
<rect x="340" y="140" width="120" height="100" rx="10" fill="#34d399" fill-opacity=".25" stroke="#34d399" stroke-width="2"/>
<text x="400" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Item 2</text>
<rect x="510" y="140" width="120" height="100" rx="10" fill="#34d399" fill-opacity=".25" stroke="#34d399" stroke-width="2"/>
<text x="570" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Item 3</text>
<text x="315" y="196" text-anchor="middle" font-size="12" fill="#475569">gap</text>
<text x="485" y="196" text-anchor="middle" font-size="12" fill="#475569">gap</text>
<path d="M120 335 H 700" stroke="#e11d48" stroke-width="3" marker-end="url(#a)"/>
<text x="410" y="362" text-anchor="middle" font-size="15" font-weight="700" fill="#e11d48">Hauptachse → justify-content</text>
<path d="M60 75 V 295" stroke="#7c3aed" stroke-width="3" marker-end="url(#b)"/>
<text x="44" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed" transform="rotate(-90 44 185)">Querachse → align-items</text>
<text x="400" y="390" text-anchor="middle" font-size="13" fill="#475569">Bei flex-direction: column tauschen die Achsen ihre Richtung.</text>
