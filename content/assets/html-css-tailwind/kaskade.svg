<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Die Kaskade: Wer setzt den Wert für color?</text>
<rect x="40" y="60" width="220" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="150" y="90" text-anchor="middle" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">p { color: black }</text>
<text x="150" y="112" text-anchor="middle" font-size="12" fill="#475569">Browser-Standard</text>
<rect x="290" y="60" width="220" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="400" y="90" text-anchor="middle" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">p { color: gray }</text>
<text x="400" y="112" text-anchor="middle" font-size="12" fill="#475569">style.css, Zeile 4</text>
<rect x="540" y="60" width="220" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="650" y="90" text-anchor="middle" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">.hinweis { color: orange }</text>
<text x="650" y="112" text-anchor="middle" font-size="12" fill="#475569">style.css, Zeile 9</text>
<path d="M400 134 V156" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<rect x="120" y="160" width="560" height="56" rx="12" fill="#22d3ee" fill-opacity=".16" stroke="#22d3ee" stroke-width="3"/>
<text x="140" y="186" font-size="16" font-weight="700" fill="#1e1b3a">1. Herkunft und Wichtigkeit</text>
<text x="140" y="205" font-size="13" fill="#475569">Dein CSS schlägt den Browser-Standard → black fällt raus</text>
<path d="M400 218 V240" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<rect x="120" y="244" width="560" height="56" rx="12" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa" stroke-width="3"/>
<text x="140" y="270" font-size="16" font-weight="700" fill="#1e1b3a">2. Spezifität</text>
<text x="140" y="289" font-size="13" fill="#475569">.hinweis (0,1,0) schlägt p (0,0,1) → gray fällt raus</text>
<path d="M400 302 V324" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<rect x="120" y="328" width="560" height="56" rx="12" fill="#f59e0b" fill-opacity=".16" stroke="#f59e0b" stroke-width="3"/>
<text x="140" y="354" font-size="16" font-weight="700" fill="#1e1b3a">3. Reihenfolge im Code</text>
<text x="140" y="373" font-size="13" fill="#475569">nur bei Gleichstand: die spätere Deklaration gewinnt</text>
<text x="400" y="420" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Ergebnis: color = orange</text>
</svg>
