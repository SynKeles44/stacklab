<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="860" height="300" fill="#ffffff"/>
<text x="430" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Log-Level: von gesprächig bis dringend</text>
<path d="M30 200 H 830" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<text x="830" y="226" text-anchor="end" font-size="13" fill="#475569">wichtiger, seltener</text>
<g font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700" fill="#1e1b3a" text-anchor="middle">
<rect x="40" y="110" width="140" height="56" rx="10" fill="#64748b" fill-opacity=".12" stroke="#64748b" stroke-width="2"/>
<text x="110" y="144">DEBUG</text>
<rect x="200" y="110" width="140" height="56" rx="10" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-width="2"/>
<text x="270" y="144">INFO</text>
<rect x="360" y="110" width="140" height="56" rx="10" fill="#f59e0b" fill-opacity=".16" stroke="#f59e0b" stroke-width="2"/>
<text x="430" y="144">WARNING</text>
<rect x="520" y="110" width="140" height="56" rx="10" fill="#f87171" fill-opacity=".16" stroke="#f87171" stroke-width="2"/>
<text x="590" y="144">ERROR</text>
<rect x="680" y="110" width="140" height="56" rx="10" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa" stroke-width="2"/>
<text x="750" y="144">CRITICAL</text>
</g>
<g font-size="12" fill="#475569" text-anchor="middle">
<text x="110" y="186">Details zum Nachvollziehen</text>
<text x="270" y="186">normale Ereignisse</text>
<text x="430" y="186">ungewöhnlich, läuft weiter</text>
<text x="590" y="186">Aktion fehlgeschlagen</text>
<text x="750" y="186">System in Gefahr</text>
</g>
<path d="M350 70 V 250" stroke="#1e1b3a" stroke-width="2" stroke-dasharray="6 5"/>
<text x="356" y="84" font-size="14" font-weight="700" fill="#1e1b3a">Schwelle: LOG_LEVEL=warning</text>
<text x="190" y="270" text-anchor="middle" font-size="13" fill="#475569">wird verworfen</text>
<text x="590" y="270" text-anchor="middle" font-size="13" fill="#475569">wird geschrieben</text>
</svg>
