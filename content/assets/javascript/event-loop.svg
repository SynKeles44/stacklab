<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Die Event Loop im Browser</text>
<rect x="30" y="60" width="200" height="250" rx="12" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-width="2.5"/>
<text x="130" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Call Stack</text>
<rect x="50" y="240" width="160" height="34" rx="6" fill="#ffffff" stroke="#22d3ee" stroke-width="1.5"/>
<text x="130" y="262" text-anchor="middle" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">main()</text>
<rect x="50" y="200" width="160" height="34" rx="6" fill="#ffffff" stroke="#22d3ee" stroke-width="1.5"/>
<text x="130" y="222" text-anchor="middle" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">ladeDaten()</text>
<text x="130" y="296" text-anchor="middle" font-size="11" fill="#475569">läuft immer nur eins</text>
<rect x="300" y="60" width="220" height="150" rx="12" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-width="2.5"/>
<text x="410" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Browser im Hintergrund</text>
<text x="320" y="116" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">setTimeout-Timer</text>
<text x="320" y="138" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">fetch-Anfragen</text>
<text x="320" y="160" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">Klicks, Tastatur</text>
<text x="320" y="190" font-size="11" fill="#475569">eigene Threads, blockieren nicht</text>
<line x1="230" y1="110" x2="296" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="263" y="102" text-anchor="middle" font-size="10" fill="#475569">startet</text>
<rect x="570" y="60" width="200" height="110" rx="12" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-width="2.5"/>
<text x="670" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Microtask-Queue</text>
<text x="590" y="116" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">then / catch</text>
<text x="590" y="138" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">Code nach await</text>
<text x="590" y="158" font-size="11" fill="#475569">wird komplett geleert</text>
<rect x="570" y="210" width="200" height="110" rx="12" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-width="2.5"/>
<text x="670" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Task-Queue</text>
<text x="590" y="266" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">Timer-Callbacks</text>
<text x="590" y="288" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">Event-Listener</text>
<text x="590" y="308" font-size="11" fill="#475569">einer pro Runde</text>
<line x1="520" y1="120" x2="566" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="520" y1="180" x2="566" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="543" y="200" text-anchor="middle" font-size="10" fill="#475569">fertig</text>
<path d="M670 320 C 670 352 300 356 180 314" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#a)"/>
<text x="430" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b3a">Event Loop: Ist der Stack leer?</text>
<text x="430" y="412" text-anchor="middle" font-size="12" fill="#475569">1. alle Microtasks ausführen  2. einen Task ausführen  3. ggf. neu zeichnen  4. von vorn</text>
</svg>
