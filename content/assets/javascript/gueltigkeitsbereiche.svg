<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="400" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Die Scope-Kette: von innen nach außen suchen</text>
<rect x="40" y="56" width="720" height="340" rx="14" fill="#a78bfa" fill-opacity=".10" stroke="#a78bfa" stroke-width="2.5"/>
<text x="60" y="84" font-size="15" font-weight="700" fill="#1e1b3a">Modul-Scope</text>
<text x="60" y="108" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">const satz = 0.19;</text>
<rect x="80" y="126" width="640" height="250" rx="12" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-width="2.5"/>
<text x="100" y="154" font-size="15" font-weight="700" fill="#1e1b3a">Funktions-Scope von brutto(netto)</text>
<text x="100" y="178" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">netto, let ergebnis</text>
<rect x="120" y="196" width="360" height="160" rx="10" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-width="2.5"/>
<text x="140" y="224" font-size="15" font-weight="700" fill="#1e1b3a">Block-Scope von if { }</text>
<text x="140" y="250" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">const rabatt = 5;</text>
<text x="140" y="280" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">ergebnis = netto * (1 + satz)</text>
<text x="140" y="300" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">           - rabatt;</text>
<text x="140" y="336" font-size="12" fill="#475569">Hier sind alle vier Namen sichtbar.</text>
<path d="M485 330 C 690 330 700 300 700 200" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M700 180 C 700 130 715 110 745 92" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="500" y="250" font-size="12" fill="#1e1b3a">1. Block: rabatt</text>
<text x="500" y="268" font-size="12" fill="#1e1b3a">2. Funktion: netto, ergebnis</text>
<text x="500" y="286" font-size="12" fill="#1e1b3a">3. Modul: satz</text>
<text x="400" y="412" text-anchor="middle" font-size="12" fill="#475569">Nicht gefunden bis ganz außen → ReferenceError. Außen sieht nie nach innen.</text>
</svg>
