<text x="45" y="146" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">inhaber: "Ada"</text>
<text x="45" y="166" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">zinssatz: 0.02</text>
<text x="45" y="186" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">#saldo (privat)</text>
