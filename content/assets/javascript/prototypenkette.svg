<text x="695" y="273" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">null</text>
<text x="40" y="250" font-size="13" font-weight="700" fill="#1e1b3a">Suche nach sparkonto.toString():</text>
<text x="40" y="274" font-size="13" fill="#1e1b3a">1. eigene Eigenschaften – nicht da</text>
