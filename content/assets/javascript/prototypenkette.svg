<text x="40" y="340" font-size="13" fill="#1e1b3a">4. Object.prototype – gefunden!</text>
<text x="40" y="374" font-size="12" fill="#475569">Pfeil = „hat als Prototyp“. Methoden liegen einmal auf dem Prototyp und werden von allen Instanzen geteilt.</text>
