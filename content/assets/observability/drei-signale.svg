<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b3a">Die drei Signale der Observability</text>

  <g>
    <rect x="30" y="60" width="260" height="240" rx="14" fill="#ffffff" stroke="#22d3ee" stroke-width="3"/>
    <rect x="30" y="60" width="260" height="48" rx="14" fill="#22d3ee"/>
    <rect x="30" y="90" width="260" height="18" fill="#22d3ee"/>
    <text x="160" y="92" text-anchor="middle" font-size="19" font-weight="700" fill="#1e1b3a">Logs</text>
    <text x="50" y="140" font-size="15" font-weight="600" fill="#1e1b3a">Was ist genau passiert?</text>
    <text x="50" y="166" font-size="13" fill="#1e1b3a">Ein Eintrag pro Ereignis,</text>
    <text x="50" y="184" font-size="13" fill="#1e1b3a">mit allen Details.</text>
    <rect x="45" y="205" width="230" height="74" rx="8" fill="#f1f5f9"/>
    <text x="55" y="228" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">{"level":"error",</text>
    <text x="55" y="246" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a"> "message":"Zahlung",</text>
    <text x="55" y="264" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a"> "trace_id":"4bf9…"}</text>
  </g>

  <g>
    <rect x="320" y="60" width="260" height="240" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="3"/>
    <rect x="320" y="60" width="260" height="48" rx="14" fill="#a78bfa"/>
    <rect x="320" y="90" width="260" height="18" fill="#a78bfa"/>
    <text x="450" y="92" text-anchor="middle" font-size="19" font-weight="700" fill="#1e1b3a">Metriken</text>
    <text x="340" y="140" font-size="15" font-weight="600" fill="#1e1b3a">Wie viel? Wie schnell?</text>
    <text x="340" y="166" font-size="13" fill="#1e1b3a">Zahlen über die Zeit,</text>
    <text x="340" y="184" font-size="13" fill="#1e1b3a">billig zu speichern.</text>
    <polyline points="345,265 380,250 410,258 440,232 470,240 500,214 530,224 555,212" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <line x1="345" y1="279" x2="560" y2="279" stroke="#1e1b3a" stroke-width="1"/>
    <text x="345" y="296" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">http_requests_total</text>
  </g>

  <g>
    <rect x="610" y="60" width="260" height="240" rx="14" fill="#ffffff" stroke="#34d399" stroke-width="3"/>
    <rect x="610" y="60" width="260" height="48" rx="14" fill="#34d399"/>
    <rect x="610" y="90" width="260" height="18" fill="#34d399"/>
    <text x="740" y="92" text-anchor="middle" font-size="19" font-weight="700" fill="#1e1b3a">Traces</text>
    <text x="630" y="140" font-size="15" font-weight="600" fill="#1e1b3a">Wo ging die Zeit hin?</text>
    <text x="630" y="166" font-size="13" fill="#1e1b3a">Der Weg einer Anfrage</text>
    <text x="630" y="184" font-size="13" fill="#1e1b3a">durch alle Dienste.</text>
    <rect x="630" y="205" width="220" height="16" rx="4" fill="#34d399"/>
    <rect x="650" y="227" width="60" height="16" rx="4" fill="#22d3ee"/>
    <rect x="720" y="249" width="120" height="16" rx="4" fill="#f59e0b"/>
    <rect x="735" y="271" width="50" height="16" rx="4" fill="#f87171"/>
  </g>

  <rect x="30" y="325" width="840" height="50" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="356" text-anchor="middle" font-size="15" fill="#1e1b3a">Verbunden über gemeinsame IDs: <tspan font-family="ui-monospace, Menlo, monospace" font-weight="700">trace_id</tspan> / <tspan font-family="ui-monospace, Menlo, monospace" font-weight="700">request_id</tspan> – von der Metrik zum Trace zum Log</text>
</svg>
