<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1e1b3a">Ein Trace als Wasserfall: GET /checkout (480 ms)</text>

  <g font-size="11" fill="#1e1b3a" text-anchor="middle">
    <text x="260" y="62">0 ms</text>
    <text x="410" y="62">120</text>
    <text x="560" y="62">240</text>
    <text x="710" y="62">360</text>
    <text x="860" y="62">480 ms</text>
  </g>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="260" y1="70" x2="260" y2="330"/>
    <line x1="410" y1="70" x2="410" y2="330"/>
    <line x1="560" y1="70" x2="560" y2="330"/>
    <line x1="710" y1="70" x2="710" y2="330"/>
    <line x1="860" y1="70" x2="860" y2="330"/>
  </g>

  <g font-size="13" fill="#1e1b3a">
    <text x="20" y="99" font-weight="700">GET /checkout</text>
    <text x="36" y="135">auth-middleware</text>
    <text x="36" y="171">SELECT carts</text>
    <text x="36" y="207">POST payment-api/charges</text>
    <text x="52" y="243">payment-api: charge</text>
    <text x="68" y="279">SELECT fraud_rules</text>
    <text x="36" y="315">dispatch SendReceipt</text>
  </g>

  <rect x="260" y="84" width="600" height="22" rx="5" fill="#a78bfa"/>
  <rect x="266" y="120" width="25" height="22" rx="5" fill="#22d3ee"/>
  <rect x="297" y="156" width="50" height="22" rx="5" fill="#34d399"/>
  <rect x="360" y="192" width="425" height="22" rx="5" fill="#f59e0b"/>
  <rect x="379" y="228" width="394" height="22" rx="5" fill="#f87171"/>
  <rect x="385" y="264" width="50" height="22" rx="5" fill="#34d399"/>
  <rect x="797" y="300" width="19" height="22" rx="5" fill="#22d3ee"/>

  <g font-size="11" fill="#1e1b3a">
    <text x="296" y="136">20 ms</text>
    <text x="352" y="172">40 ms</text>
    <text x="790" y="208">340 ms</text>
    <text x="440" y="280">40 ms</text>
  </g>

  <rect x="20" y="345" width="860" height="44" rx="10" fill="#f1f5f9"/>
  <text x="450" y="365" text-anchor="middle" font-size="12.5" fill="#1e1b3a">Jeder Balken ist ein Span. Eingerückt = Kind-Span. Alle teilen dieselbe trace_id –</text>
  <text x="450" y="382" text-anchor="middle" font-size="12.5" fill="#1e1b3a">auch über die Grenze zur payment-api hinweg (Kontext-Weitergabe per traceparent-Header).</text>
</svg>
