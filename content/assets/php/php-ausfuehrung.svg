<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#1e1b3a">Wie PHP ausgeführt wird</text>

  <text x="30" y="85" font-size="16" font-weight="700" fill="#a78bfa">Im Web</text>
  <rect x="30" y="100" width="150" height="80" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="105" y="135" font-size="16" font-weight="700" fill="#1e1b3a" text-anchor="middle">Browser</text>
  <text x="105" y="158" font-size="13" fill="#1e1b3a" text-anchor="middle">GET /index.php</text>

  <rect x="250" y="100" width="150" height="80" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="325" y="135" font-size="16" font-weight="700" fill="#1e1b3a" text-anchor="middle">nginx</text>
  <text x="325" y="158" font-size="13" fill="#1e1b3a" text-anchor="middle">Webserver</text>

  <rect x="470" y="100" width="170" height="80" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="555" y="135" font-size="16" font-weight="700" fill="#1e1b3a" text-anchor="middle">php-fpm</text>
  <text x="555" y="158" font-size="13" fill="#1e1b3a" text-anchor="middle">Pool von PHP-Prozessen</text>

  <rect x="710" y="100" width="160" height="80" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="790" y="135" font-size="16" font-weight="700" fill="#1e1b3a" text-anchor="middle">index.php</text>
  <text x="790" y="158" font-size="13" fill="#1e1b3a" text-anchor="middle">läuft von vorn</text>

  <line x1="180" y1="125" x2="246" y2="125" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="400" y1="125" x2="466" y2="125" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="640" y1="125" x2="706" y2="125" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="433" y="117" font-size="12" fill="#1e1b3a" text-anchor="middle">FastCGI</text>

  <path d="M790,180 L790,225 L105,225 L105,184" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pfeil)"/>
  <text x="450" y="248" font-size="13" fill="#1e1b3a" text-anchor="middle">Antwort (HTML oder JSON) – danach ist der Speicher wieder leer</text>

  <line x1="30" y1="280" x2="870" y2="280" stroke="#e5e7eb" stroke-width="2"/>

  <text x="30" y="315" font-size="16" font-weight="700" fill="#a78bfa">Auf der Kommandozeile (CLI)</text>
  <rect x="30" y="330" width="230" height="70" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="145" y="362" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a" text-anchor="middle">$ php skript.php</text>
  <text x="145" y="384" font-size="13" fill="#1e1b3a" text-anchor="middle">Terminal</text>

  <rect x="330" y="330" width="230" height="70" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="445" y="362" font-size="16" font-weight="700" fill="#1e1b3a" text-anchor="middle">PHP-Interpreter</text>
  <text x="445" y="384" font-size="13" fill="#1e1b3a" text-anchor="middle">liest, übersetzt, führt aus</text>

  <rect x="630" y="330" width="240" height="70" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="750" y="362" font-size="16" font-weight="700" fill="#1e1b3a" text-anchor="middle">Ausgabe + Exit-Code</text>
  <text x="750" y="384" font-size="13" fill="#1e1b3a" text-anchor="middle">STDOUT, STDERR, 0 oder 1</text>

  <line x1="260" y1="365" x2="326" y2="365" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="560" y1="365" x2="626" y2="365" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
</svg>
