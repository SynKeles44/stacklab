<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#1e1b3a">Die Throwable-Hierarchie (Auswahl)</text>

  <rect x="350" y="65" width="200" height="56" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="450" y="91" font-size="17" font-weight="700" fill="#1e1b3a" text-anchor="middle">Throwable</text>
  <text x="450" y="110" font-size="12" fill="#1e1b3a" text-anchor="middle">Interface – fängt alles</text>

  <path d="M450,121 L450,145 L225,145 L225,168" fill="none" stroke="#1e1b3a" stroke-width="2"/>
  <path d="M450,145 L675,145 L675,168" fill="none" stroke="#1e1b3a" stroke-width="2"/>

  <rect x="110" y="168" width="230" height="60" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="225" y="195" font-size="17" font-weight="700" fill="#1e1b3a" text-anchor="middle">Error</text>
  <text x="225" y="215" font-size="12" fill="#1e1b3a" text-anchor="middle">Programmierfehler, meldet PHP</text>

  <rect x="560" y="168" width="230" height="60" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="675" y="195" font-size="17" font-weight="700" fill="#1e1b3a" text-anchor="middle">Exception</text>
  <text x="675" y="215" font-size="12" fill="#1e1b3a" text-anchor="middle">erwartbare Fehlersituation</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#1e1b3a">
    <path d="M140,228 L140,430" fill="none" stroke="#f87171" stroke-width="2"/>
    <line x1="140" y1="265" x2="165" y2="265" stroke="#f87171" stroke-width="2"/>
    <text x="172" y="270">TypeError</text>
    <line x1="140" y1="300" x2="165" y2="300" stroke="#f87171" stroke-width="2"/>
    <text x="172" y="305">ValueError</text>
    <line x1="140" y1="335" x2="165" y2="335" stroke="#f87171" stroke-width="2"/>
    <text x="172" y="340">ArithmeticError</text>
    <line x1="190" y1="345" x2="190" y2="370" stroke="#f87171" stroke-width="2"/>
    <line x1="190" y1="370" x2="210" y2="370" stroke="#f87171" stroke-width="2"/>
    <text x="216" y="375">DivisionByZeroError</text>
    <line x1="140" y1="405" x2="165" y2="405" stroke="#f87171" stroke-width="2"/>
    <text x="172" y="410">UnhandledMatchError</text>

    <path d="M590,228 L590,440" fill="none" stroke="#34d399" stroke-width="2"/>
    <line x1="590" y1="265" x2="615" y2="265" stroke="#34d399" stroke-width="2"/>
    <text x="622" y="270">JsonException</text>
    <line x1="590" y1="300" x2="615" y2="300" stroke="#34d399" stroke-width="2"/>
    <text x="622" y="305">LogicException</text>
    <line x1="640" y1="310" x2="640" y2="335" stroke="#34d399" stroke-width="2"/>
    <line x1="640" y1="335" x2="660" y2="335" stroke="#34d399" stroke-width="2"/>
    <text x="666" y="340">InvalidArgumentException</text>
    <line x1="590" y1="370" x2="615" y2="370" stroke="#34d399" stroke-width="2"/>
    <text x="622" y="375">RuntimeException</text>
    <line x1="640" y1="380" x2="640" y2="405" stroke="#34d399" stroke-width="2"/>
    <line x1="640" y1="405" x2="660" y2="405" stroke="#34d399" stroke-width="2"/>
    <text x="666" y="410">deine BuchungsFehler</text>
    <line x1="590" y1="440" x2="615" y2="440" stroke="#34d399" stroke-width="2"/>
    <text x="622" y="445">DateMalformedStringException</text>
  </g>
  <text x="30" y="460" font-size="13" fill="#1e1b3a">catch (Exception $e) fängt nur den rechten Ast – Error-Objekte rutschen durch.</text>
</svg>
