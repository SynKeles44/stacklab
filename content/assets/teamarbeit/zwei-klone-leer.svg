<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b3a">Zwei Personen, ein gemeinsames Remote</text>
  <rect x="330" y="60" width="240" height="110" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="3"/>
  <rect x="40" y="290" width="260" height="130" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/>
  <rect x="600" y="290" width="260" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
  <g stroke="#1e1b3a" stroke-width="2.5" fill="none" marker-end="url(#pfeil)">
    <path d="M150 288 L360 174"/>
    <path d="M400 174 L200 288"/>
    <path d="M750 288 L540 174"/>
    <path d="M500 174 L700 288"/>
