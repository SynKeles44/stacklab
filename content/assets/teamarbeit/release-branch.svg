<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b3a">Release-Branch mit Tags und Hotfix</text>
  <line x1="140" y1="120" x2="860" y2="120" stroke="#22d3ee" stroke-width="5"/>
  <text x="30" y="125" font-size="15" font-weight="700" fill="#1e1b3a">main</text>
  <text x="860" y="100" text-anchor="end" font-size="12" fill="#1e1b3a">neue Features laufen weiter</text>
  <path d="M300 120 Q330 220 370 220 L860 220" fill="none" stroke="#f59e0b" stroke-width="5"/>
  <text x="30" y="225" font-size="15" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">release/1.4</text>
  <path d="M560 120 Q600 180 640 220" fill="none" stroke="#f87171" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="640" y="170" font-size="12" fill="#1e1b3a">Bugfix wird übernommen</text>
  <text x="640" y="186" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">git cherry-pick</text>
  <g fill="#ffffff" stroke="#1e1b3a" stroke-width="2">
    <circle cx="170" cy="120" r="9"/><circle cx="240" cy="120" r="9"/><circle cx="300" cy="120" r="9"/><circle cx="380" cy="120" r="9"/>
    <circle cx="460" cy="120" r="9"/><circle cx="560" cy="120" r="9"/><circle cx="660" cy="120" r="9"/><circle cx="760" cy="120" r="9"/>
    <circle cx="430" cy="220" r="9"/><circle cx="640" cy="220" r="9"/>
  </g>
  <rect x="400" y="240" width="64" height="26" rx="6" fill="#f59e0b"/>
  <text x="432" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b3a">v1.4.0</text>
  <rect x="608" y="240" width="64" height="26" rx="6" fill="#f87171"/>
  <text x="640" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b3a">v1.4.1</text>
  <rect x="30" y="300" width="840" height="60" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="50" y="326" font-size="14" fill="#1e1b3a">Der Release-Branch friert einen Stand ein: Dort landen nur noch Fehlerbehebungen.</text>
  <text x="50" y="348" font-size="14" fill="#1e1b3a">Jede ausgelieferte Version bekommt einen Tag. main entwickelt sich unabhängig weiter.</text>
</svg>
