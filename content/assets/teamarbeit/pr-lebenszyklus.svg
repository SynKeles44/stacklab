<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b3a">Der Lebenszyklus eines Pull Requests</text>
  <g font-size="14" fill="#1e1b3a" text-anchor="middle">
    <rect x="30" y="70" width="150" height="70" rx="10" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="105" y="100" font-weight="700">1. Ticket</text><text x="105" y="122">verstehen</text>
    <rect x="240" y="70" width="150" height="70" rx="10" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="315" y="100" font-weight="700">2. Branch</text><text x="315" y="122">anlegen</text>
    <rect x="450" y="70" width="150" height="70" rx="10" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="525" y="100" font-weight="700">3. Commits</text><text x="525" y="122">klein und sauber</text>
    <rect x="660" y="70" width="190" height="70" rx="10" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="755" y="100" font-weight="700">4. Selbst-Review</text><text x="755" y="122">eigenen Diff lesen</text>

    <rect x="660" y="190" width="190" height="70" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="755" y="220" font-weight="700">5. PR öffnen</text><text x="755" y="242">Beschreibung, Ticket-Link</text>
    <rect x="420" y="190" width="190" height="70" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="515" y="220" font-weight="700">6. CI und Preview</text><text x="515" y="242">automatische Checks</text>
    <rect x="180" y="190" width="190" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="275" y="220" font-weight="700">7. Code-Review</text><text x="275" y="242">Kommentare, Fragen</text>

    <rect x="180" y="320" width="190" height="70" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
    <text x="275" y="350" font-weight="700">8. Änderungen</text><text x="275" y="372">Feedback einarbeiten</text>
    <rect x="460" y="320" width="170" height="70" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="545" y="350" font-weight="700">9. Freigabe</text><text x="545" y="372">Approval</text>
    <rect x="680" y="320" width="170" height="70" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="765" y="350" font-weight="700">10. Merge</text><text x="765" y="372">Branch löschen</text>
  </g>
  <g stroke="#1e1b3a" stroke-width="2" fill="none" marker-end="url(#pfeil)">
    <line x1="182" y1="105" x2="236" y2="105"/>
    <line x1="392" y1="105" x2="446" y2="105"/>
    <line x1="602" y1="105" x2="656" y2="105"/>
    <line x1="755" y1="142" x2="755" y2="186"/>
    <line x1="658" y1="225" x2="614" y2="225"/>
    <line x1="418" y1="225" x2="374" y2="225"/>
    <line x1="250" y1="262" x2="250" y2="316"/>
    <line x1="372" y1="355" x2="456" y2="355"/>
    <line x1="632" y1="355" x2="676" y2="355"/>
    <path d="M300 318 Q330 290 300 264"/>
  </g>
  <text x="345" y="296" font-size="12" fill="#1e1b3a">neue Runde</text>
  <text x="120" y="296" font-size="12" fill="#1e1b3a">„Changes requested“</text>
</svg>
