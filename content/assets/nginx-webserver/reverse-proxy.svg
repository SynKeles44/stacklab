<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">nginx als Reverse Proxy</text>
  <rect x="16" y="165" width="160" height="70" rx="12" fill="#e0f7fb" stroke="#22d3ee" stroke-width="2"/>
  <rect x="248" y="140" width="160" height="120" rx="12" fill="#ede7fe" stroke="#a78bfa" stroke-width="2"/>
  <rect x="555" y="58" width="170" height="60" rx="10" fill="#e3f9ef" stroke="#34d399" stroke-width="2"/>
  <rect x="555" y="170" width="170" height="60" rx="10" fill="#fef3dc" stroke="#f59e0b" stroke-width="2"/>
  <rect x="555" y="282" width="170" height="60" rx="10" fill="#feeaea" stroke="#f87171" stroke-width="2"/>
  <line x1="178" y1="200" x2="244" y2="200" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)" marker-start="url(#pfeil)"/>
  <text x="211" y="190" text-anchor="middle" font-size="12" fill="#1e1b3a">HTTPS</text>
  <line x1="410" y1="175" x2="551" y2="92" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="470" y="118" text-anchor="middle" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">root</text>
  <line x1="410" y1="200" x2="551" y2="200" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="480" y="190" text-anchor="middle" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">proxy_pass</text>
  <line x1="410" y1="225" x2="551" y2="308" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="468" y="292" text-anchor="middle" font-size="12" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">fastcgi_pass</text>
  <text x="400" y="385" text-anchor="middle" font-size="12" fill="#1e1b3a">Der Browser sieht nur nginx. Die Programme rechts lauschen nur lokal.</text>
  <text x="96" y="197" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Browser</text>
  <text x="96" y="217" text-anchor="middle" font-size="11" fill="#1e1b3a">example.com</text>
  <text x="328" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">nginx</text>
  <text x="328" y="215" text-anchor="middle" font-size="11" fill="#1e1b3a">Port 80 / 443</text>
  <text x="640" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b3a">Statische Dateien</text>
  <text x="640" y="102" text-anchor="middle" font-size="11" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">/srv/app/dist</text>
  <text x="640" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b3a">Node.js-App</text>
  <text x="640" y="214" text-anchor="middle" font-size="11" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">127.0.0.1:3000</text>
  <text x="640" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b3a">PHP-FPM</text>
  <text x="640" y="326" text-anchor="middle" font-size="11" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">nur /index.php</text>
</svg>
