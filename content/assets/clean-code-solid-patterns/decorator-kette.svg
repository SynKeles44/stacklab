<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Decorator-Kette: Protokoll umhüllt Cache, Cache umhüllt die echte API-Quelle">
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="20" y="118" width="140" height="64" rx="12" fill="#f8fafc" stroke="#1e1b3a" stroke-width="2"/>
  <text x="90" y="145" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Aufrufer</text>
  <text x="90" y="166" text-anchor="middle" font-size="12" fill="#4b4870" font-family="ui-monospace, Menlo, monospace">kurs('USD')</text>
  <line x1="160" y1="150" x2="198" y2="150" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <rect x="200" y="30" width="580" height="240" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="218" y="56" font-size="15" font-weight="700" fill="#1e1b3a" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">ProtokollierendeQuelle</text>
  <text x="218" y="76" font-size="13" fill="#4b4870" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">gibt weiter, schreibt danach ins Log</text>
  <rect x="240" y="90" width="500" height="160" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="258" y="116" font-size="15" font-weight="700" fill="#1e1b3a" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">CachendeQuelle</text>
  <text x="258" y="136" font-size="13" fill="#4b4870" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">antwortet aus dem Speicher – oder fragt weiter</text>
  <rect x="290" y="152" width="410" height="80" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="495" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">ApiKursquelle</text>
  <text x="495" y="208" text-anchor="middle" font-size="13" fill="#4b4870" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">fragt die echte, langsame API</text>
  <text x="400" y="292" text-anchor="middle" font-size="13" fill="#4b4870" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Alle drei implementieren dasselbe Interface Kursquelle – deshalb lassen sie sich stapeln.</text>
</svg>
