<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-label="Die fünf SOLID-Prinzipien">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="20" y="20" width="160" height="230" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="100" y="88" text-anchor="middle" font-size="56" font-weight="800" fill="#22d3ee" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">S</text>
  <text x="100" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Single</text>
  <text x="100" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Responsibility</text>
  <line x1="45" y1="166" x2="155" y2="166" stroke="#22d3ee" stroke-width="2"/>
  <text x="100" y="194" text-anchor="middle" font-size="13" fill="#4b4870" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Ein Grund</text>
  <text x="100" y="214" text-anchor="middle" font-size="13" fill="#4b4870" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">zur Änderung</text>
  <rect x="195" y="20" width="160" height="230" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="275" y="88" text-anchor="middle" font-size="56" font-weight="800" fill="#a78bfa" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">O</text>
  <text x="275" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Open-</text>
  <text x="275" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">Closed</text>
