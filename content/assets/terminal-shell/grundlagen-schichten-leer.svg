<text x="918.0" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Dateien &amp; Programme</text>
<text x="918.0" y="175" text-anchor="middle" font-size="13" fill="#475569">Festplatte, Prozesse</text>
<text x="918.0" y="205" text-anchor="middle" font-size="12" fill="#475569" font-family="ui-monospace, Menlo, monospace">/usr/bin/ls</text>
<text x="500" y="280" text-anchor="middle" font-size="14" fill="#1e1b3a">Durchgezogene Pfeile: dein Befehl wandert nach rechts. Gestrichelt: die Ausgabe kommt zurück.</text>
<text x="500" y="308" text-anchor="middle" font-size="13" fill="#475569">Das Terminal zeigt nur an – verstehen und ausführen lassen tut die Shell.</text>
