<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="900" height="400" fill="#ffffff"/>
<text x="450" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Die drei Datenströme eines Befehls</text>
<rect x="30" y="160" width="150" height="80" rx="14" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-width="3"/>
<text x="105" y="196" text-anchor="middle" font-size="16" font-weight="600" fill="#1e1b3a">Tastatur</text>
<text x="105" y="220" text-anchor="middle" font-size="13" fill="#475569">oder Datei mit &lt;</text>
<rect x="360" y="80" width="180" height="250" rx="16" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-width="3"/>
<text x="450" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Befehl</text>
<text x="450" y="222" text-anchor="middle" font-size="14" fill="#475569" font-family="ui-monospace, Menlo, monospace">z. B. grep</text>
<rect x="720" y="80" width="150" height="80" rx="14" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-width="3"/>
<text x="795" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#1e1b3a">Bildschirm</text>
<text x="795" y="140" text-anchor="middle" font-size="13" fill="#475569">oder Datei mit &gt;</text>
<rect x="720" y="250" width="150" height="80" rx="14" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-width="3"/>
<text x="795" y="286" text-anchor="middle" font-size="16" font-weight="600" fill="#1e1b3a">Bildschirm</text>
<text x="795" y="310" text-anchor="middle" font-size="13" fill="#475569">oder Datei mit 2&gt;</text>
<path d="M182 200 H 356" stroke="#22d3ee" stroke-width="4" marker-end="url(#a)"/>
<path d="M542 120 H 716" stroke="#34d399" stroke-width="4" marker-end="url(#a)"/>
<path d="M542 290 H 716" stroke="#f87171" stroke-width="4" marker-end="url(#a)"/>
<rect x="177" y="150" width="176" height="36" rx="18" fill="#ffffff" stroke="#1e1b3a" stroke-width="1.5"/>
<text x="265" y="173" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b3a">Standardeingabe</text>
<circle cx="265" cy="220" r="14" fill="#1e1b3a"/>
<text x="265" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="ui-monospace, Menlo, monospace">0</text>
<text x="289" y="225" font-size="13" fill="#475569" font-family="ui-monospace, Menlo, monospace">stdin</text>
<rect x="542" y="70" width="176" height="36" rx="18" fill="#ffffff" stroke="#1e1b3a" stroke-width="1.5"/>
<text x="630" y="93" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b3a">Standardausgabe</text>
<circle cx="630" cy="140" r="14" fill="#1e1b3a"/>
<text x="630" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="ui-monospace, Menlo, monospace">1</text>
<text x="654" y="145" font-size="13" fill="#475569" font-family="ui-monospace, Menlo, monospace">stdout</text>
<rect x="542" y="240" width="176" height="36" rx="18" fill="#ffffff" stroke="#1e1b3a" stroke-width="1.5"/>
<text x="630" y="263" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b3a">Standardfehlerausgabe</text>
<circle cx="630" cy="310" r="14" fill="#1e1b3a"/>
<text x="630" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="ui-monospace, Menlo, monospace">2</text>
<text x="654" y="315" font-size="13" fill="#475569" font-family="ui-monospace, Menlo, monospace">stderr</text>
<text x="450" y="375" text-anchor="middle" font-size="13" fill="#475569">Die Zahlen 0, 1 und 2 sind die Dateideskriptoren der drei Kanäle.</text>
