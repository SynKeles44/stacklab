<text x="709.75" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Argument</text>
<text x="709.75" y="224" text-anchor="middle" font-size="12" fill="#475569">Womit? Worauf?</text>
<text x="450" y="270" text-anchor="middle" font-size="14" fill="#1e1b3a">Leerzeichen trennen die Teile. Die Shell zerlegt die Zeile, bevor das Programm startet.</text>
