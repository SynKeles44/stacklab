<text x="224.5" y="224" text-anchor="middle" font-size="12" fill="#475569">ein Strich, ein Buchstabe</text>
<text x="330" y="112" font-size="24" fill="#ffffff" font-family="ui-monospace, Menlo, monospace">--all</text>
