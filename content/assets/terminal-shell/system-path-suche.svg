<text x="125" y="318" text-anchor="middle" font-size="11" fill="#475569">getrennt durch Doppelpunkte</text>
<path d="M222 105 H 300" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<text x="261" y="94" text-anchor="middle" font-size="12" fill="#475569">von links</text>
<g font-family="ui-monospace, Menlo, monospace" font-size="15">
<rect x="305" y="70" width="300" height="56" rx="10" fill="#f87171" fill-opacity=".10" stroke="#f87171" stroke-width="2"/>
