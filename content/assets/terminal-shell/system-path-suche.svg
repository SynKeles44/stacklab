<path d="M455 198 V 208" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M455 268 V 278" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="400" y="376" text-anchor="middle" font-size="13" fill="#475569">Findet die Shell in keinem Ordner eine ausführbare Datei, meldet sie: bash: gruss: command not found</text>
