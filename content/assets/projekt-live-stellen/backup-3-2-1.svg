<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <text x="400" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a">Die 3-2-1-Regel – und die Probe, die alles entscheidet</text>
  <rect x="30" y="60" width="200" height="110" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="130" y="95" text-anchor="middle" font-size="34" font-weight="700" fill="#1e1b3a">3</text>
  <text x="130" y="125" text-anchor="middle" font-size="13" fill="#1e1b3a">Kopien der Daten</text>
  <text x="130" y="145" text-anchor="middle" font-size="12" fill="#1e1b3a">Original + 2 Backups</text>
  <rect x="300" y="60" width="200" height="110" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="400" y="95" text-anchor="middle" font-size="34" font-weight="700" fill="#1e1b3a">2</text>
  <text x="400" y="125" text-anchor="middle" font-size="13" fill="#1e1b3a">verschiedene Speicher</text>
  <text x="400" y="145" text-anchor="middle" font-size="12" fill="#1e1b3a">z. B. Server-Disk + Objektspeicher</text>
  <rect x="570" y="60" width="200" height="110" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="670" y="95" text-anchor="middle" font-size="34" font-weight="700" fill="#1e1b3a">1</text>
  <text x="670" y="125" text-anchor="middle" font-size="13" fill="#1e1b3a">Kopie außer Haus</text>
  <text x="670" y="145" text-anchor="middle" font-size="12" fill="#1e1b3a">anderer Anbieter / Standort</text>
  <rect x="30" y="215" width="160" height="60" rx="10" fill="#ffffff" stroke="#1e1b3a" stroke-width="1.5"/>
  <text x="110" y="250" text-anchor="middle" font-size="13" fill="#1e1b3a">Dump + Dateien</text>
  <rect x="230" y="215" width="160" height="60" rx="10" fill="#ffffff" stroke="#1e1b3a" stroke-width="1.5"/>
  <text x="310" y="242" text-anchor="middle" font-size="13" fill="#1e1b3a">Archiv + Prüfsumme</text>
  <text x="310" y="260" text-anchor="middle" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#1e1b3a">.tar.gz  .sha256</text>
  <rect x="430" y="215" width="160" height="60" rx="10" fill="#ffffff" stroke="#1e1b3a" stroke-width="1.5"/>
  <text x="510" y="250" text-anchor="middle" font-size="13" fill="#1e1b3a">kopieren + rotieren</text>
  <rect x="630" y="205" width="150" height="80" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="2.5"/>
  <text x="705" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">Restore-Probe</text>
  <text x="705" y="258" text-anchor="middle" font-size="11" fill="#1e1b3a">auspacken, prüfen,</text>
  <text x="705" y="273" text-anchor="middle" font-size="11" fill="#1e1b3a">Zeilen zählen</text>
  <path d="M190 245 L228 245" stroke="#1e1b3a" stroke-width="2" fill="none" marker-end="url(#pb)"/>
  <path d="M390 245 L428 245" stroke="#1e1b3a" stroke-width="2" fill="none" marker-end="url(#pb)"/>
  <path d="M590 245 L628 245" stroke="#1e1b3a" stroke-width="2" fill="none" marker-end="url(#pb)"/>
  <text x="400" y="325" text-anchor="middle" font-size="14" fill="#1e1b3a">Ein Backup, dessen Wiederherstellung nie geprobt wurde, ist nur eine Hoffnung.</text>
</svg>
