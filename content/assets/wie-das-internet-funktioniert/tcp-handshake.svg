<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">Der TCP-Drei-Wege-Handshake</text>
<rect x="80" y="45" width="140" height="40" rx="10" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-width="3"/>
<text x="150" y="71" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Client</text>
<rect x="580" y="45" width="140" height="40" rx="10" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-width="3"/>
<text x="650" y="71" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b3a">Server</text>
<path d="M150 88 V 385" stroke="#64748b" stroke-width="2" stroke-dasharray="4 5"/>
<path d="M650 88 V 385" stroke="#64748b" stroke-width="2" stroke-dasharray="4 5"/>
<path d="M152 120 L 646 170" fill="none" stroke="#0891b2" stroke-width="3" marker-end="url(#a)"/>
<path d="M648 190 L 154 240" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#a)"/>
<path d="M152 260 L 646 310" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#a)"/>
<text x="400" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">SYN</text>
<text x="400" y="202" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">SYN-ACK</text>
<text x="400" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">ACK</text>
<text x="400" y="365" text-anchor="middle" font-size="15" font-weight="600" fill="#475569">Verbindung steht – jetzt fließen die eigentlichen Daten</text>
</svg>
