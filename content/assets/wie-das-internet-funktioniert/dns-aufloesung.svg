<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<rect width="900" height="460" fill="#ffffff"/>
<text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b3a">So findet ein Resolver die IP-Adresse von www.example.com</text>
<rect x="30" y="190" width="150" height="70" rx="14" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-width="3"/>
<text x="105" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Dein Rechner</text>
<text x="105" y="243" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Stub-Resolver</text>
<rect x="330" y="190" width="170" height="70" rx="14" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-width="3"/>
<text x="415" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Rekursiver Resolver</text>
<text x="415" y="243" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">z. B. beim Provider</text>
<rect x="680" y="60" width="190" height="64" rx="14" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-width="3"/>
<text x="775" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Root-Server</text>
<text x="775" y="110" text-anchor="middle" font-size="12" font-weight="400" fill="#475569" font-family="ui-monospace, Menlo, monospace">"."</text>
<rect x="680" y="193" width="190" height="64" rx="14" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-width="3"/>
<text x="775" y="223" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">TLD-Server</text>
<text x="775" y="243" text-anchor="middle" font-size="12" font-weight="400" fill="#475569" font-family="ui-monospace, Menlo, monospace">.com</text>
<rect x="680" y="326" width="190" height="64" rx="14" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-width="3"/>
<text x="775" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a">Autoritativer Server</text>
<text x="775" y="372" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">für example.com</text>
<path d="M182 212 H 326" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<text x="254" y="205" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b3a">1  Frage</text>
<path d="M326 240 H 184" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/>
<text x="254" y="262" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b3a">8  Antwort: 192.0.2.10</text>
<path d="M502 200 L 676 100" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<text x="560" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">2</text>
<path d="M676 118 L 506 214" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/>
<text x="612" y="182" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">3  frag .com</text>
<path d="M504 222 H 676" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<text x="590" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">4</text>
<path d="M676 246 H 504" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/>
<text x="590" y="265" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">5  frag ns1.example.com</text>
<path d="M502 252 L 676 344" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<text x="560" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b3a">6</text>
<path d="M676 370 L 480 262" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/>
<text x="520" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">7  192.0.2.10</text>
<text x="450" y="440" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Durchgezogen = Frage · gestrichelt = Antwort/Verweis. Der Resolver merkt sich alles im Cache.</text>
</svg>
