  <text x="115" y="180" text-anchor="middle" font-size="12" fill="#1e1b3a">JavaScript + Typen</text>
  <rect x="260" y="30" width="210" height="95" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
