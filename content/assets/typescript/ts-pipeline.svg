  <path d="M200,135 C230,120 230,85 258,80" fill="none" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <path d="M200,165 C230,180 230,215 258,220" fill="none" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
