<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <rect x="240" y="20" width="320" height="56" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="400" y="45" text-anchor="middle" font-size="14" fill="#1e1b3a">value hat den Typ</text>
  <text x="400" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">string | number | undefined</text>
  <line x1="400" y1="76" x2="400" y2="110" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <rect x="250" y="112" width="300" height="44" rx="10" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="400" y="140" text-anchor="middle" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">if (value === undefined)</text>
  <line x1="300" y1="156" x2="160" y2="200" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="500" y1="156" x2="560" y2="200" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="205" y="172" text-anchor="middle" font-size="12" fill="#1e1b3a">ja</text>
  <text x="550" y="172" text-anchor="middle" font-size="12" fill="#1e1b3a">nein</text>
  <rect x="40" y="202" width="220" height="56" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="150" y="226" text-anchor="middle" font-size="13" fill="#1e1b3a">hier ist value nur noch</text>
  <text x="150" y="247" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">undefined</text>
  <rect x="420" y="202" width="300" height="44" rx="10" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="570" y="230" text-anchor="middle" font-size="14" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">typeof value === "string"</text>
  <line x1="500" y1="246" x2="450" y2="272" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="640" y1="246" x2="690" y2="272" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <rect x="340" y="274" width="200" height="50" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="440" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">string</text>
  <rect x="590" y="274" width="200" height="50" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="690" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">number</text>
  <text x="415" y="268" text-anchor="end" font-size="12" fill="#1e1b3a">ja</text>
  <text x="720" y="268" font-size="12" fill="#1e1b3a">nein</text>
  <text x="150" y="300" text-anchor="middle" font-size="12" fill="#1e1b3a">Jede Prüfung schneidet</text>
  <text x="150" y="318" text-anchor="middle" font-size="12" fill="#1e1b3a">Möglichkeiten weg.</text>
</svg>
