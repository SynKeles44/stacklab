<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1b3a"/>
    </marker>
  </defs>
  <rect x="20" y="90" width="200" height="140" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="120" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">User</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#1e1b3a">
    <text x="40" y="148">id: number</text>
    <text x="40" y="170">name: string</text>
    <text x="40" y="192">email: string</text>
    <text x="40" y="214">password: string</text>
  </g>
  <line x1="220" y1="130" x2="316" y2="60" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="220" y1="160" x2="316" y2="160" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="220" y1="190" x2="316" y2="262" stroke="#1e1b3a" stroke-width="2" marker-end="url(#pfeil)"/>
  <rect x="320" y="20" width="460" height="80" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="340" y="48" font-size="14" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">Pick&lt;User, "id" | "name"&gt;</text>
  <text x="340" y="78" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">{ id: number; name: string }</text>
  <rect x="320" y="120" width="460" height="80" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="340" y="148" font-size="14" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">Omit&lt;User, "password"&gt;</text>
  <text x="340" y="178" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">{ id: number; name: string; email: string }</text>
  <rect x="320" y="220" width="460" height="80" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="340" y="248" font-size="14" font-weight="700" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">Partial&lt;User&gt;</text>
  <text x="340" y="278" font-size="13" fill="#1e1b3a" font-family="ui-monospace, Menlo, monospace">{ id?: number; name?: string; email?: …; password?: … }</text>
  <text x="120" y="262" text-anchor="middle" font-size="12" fill="#1e1b3a">Ein Typ als Quelle,</text>
  <text x="120" y="280" text-anchor="middle" font-size="12" fill="#1e1b3a">viele abgeleitete Typen</text>
</svg>
