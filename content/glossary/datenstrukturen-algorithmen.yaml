- slug: basisfall
  term: Basisfall
  short: Der Fall einer rekursiven Funktion, der direkt beantwortet wird, ohne dass sie sich erneut aufruft.
  explanation: >
    Der Basisfall beendet die Rekursion. Fehlt er oder wird er nicht für jede Eingabe erreicht, ruft sich die
    Funktion endlos selbst auf, bis der Call Stack überläuft.
  example: "In `fakultaet(n)` ist `if (n <= 1) return 1;` der Basisfall."
  category: algorithmen
  aliases: [Abbruchbedingung, Rekursionsanker, Base Case]
  related: [rekursion, stack-overflow]
  lesson: datenstrukturen-algorithmen/rekursion-und-memoisierung

- slug: stack-overflow
  term: Stack Overflow
  short: Ein Fehler, der entsteht, wenn zu viele verschachtelte Funktionsaufrufe den Call Stack füllen.
  explanation: >
    Jeder Aufruf belegt einen Rahmen auf dem begrenzten Call Stack. Bei endloser oder sehr tiefer Rekursion ist er
    irgendwann voll. JavaScript wirft dann `RangeError: Maximum call stack size exceeded`. Abhilfe schafft eine
    Schleife mit eigenem Stack.
  example: "Eine rekursive Funktion über einen Baum mit 100 000 Ebenen löst in Node.js einen Stack Overflow aus."
  category: algorithmen
  aliases: [Stapelüberlauf, Maximum call stack size exceeded]
  related: [call-stack, rekursion, basisfall]
  lesson: datenstrukturen-algorithmen/rekursion-und-memoisierung

- slug: dynamische-programmierung
  term: Dynamische Programmierung
  short: Eine Technik, die ein Problem aus den Lösungen kleinerer, sich überlappender Teilprobleme zusammensetzt.
  explanation: >
    Jedes Teilproblem wird nur einmal gelöst und das Ergebnis gespeichert – von oben nach unten mit Memoisierung
    oder von unten nach oben mit einer Tabelle oder Schleife. So wird aus exponentiellem oft linearer Aufwand.
  example: "Die kleinste Münzanzahl für 99 Cent berechnest du aus den Lösungen für 0 bis 98 Cent."
  category: algorithmen
  aliases: [DP, Dynamic Programming, Bottom-up]
  related: [memoisierung, rekursion]
  lesson: datenstrukturen-algorithmen/rekursion-und-memoisierung
