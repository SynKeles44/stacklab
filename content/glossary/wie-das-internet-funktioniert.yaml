- slug: wlan
  term: WLAN
  short: 'Ein drahtloses lokales Netzwerk, in dem Geräte per Funk verbunden sind.'
  explanation: |
    WLAN steht für „Wireless Local Area Network“. Geräte wie Laptop und Handy verbinden sich per Funk mit einem Router oder Access Point. Im TCP/IP-Modell gehört WLAN zur Netzzugangsschicht – es überträgt die Bits, ohne zu wissen, was darin steckt.
  example: 'Dein Laptop ist per WLAN mit dem Heimrouter verbunden, der Fernseher per Netzwerkkabel – beide sind im selben lokalen Netz.'
  category: internet
  aliases:
    - WiFi
    - Wi-Fi
    - WLANs
  related:
    - netzwerk
    - router
    - ethernet
  lesson: wie-das-internet-funktioniert/ip-adressen-und-pakete
- slug: smtp
  term: SMTP
  short: 'Das Protokoll, mit dem E-Mails von Server zu Server verschickt werden.'
  explanation: |
    SMTP steht für „Simple Mail Transfer Protocol“. Es gehört zur Anwendungsschicht des TCP/IP-Modells. Dein Mail-Programm übergibt eine Nachricht per SMTP an einen Mail-Server, der sie per SMTP an den Server des Empfängers weiterreicht.
  example: 'Eine E-Mail an `user@example.com` wird per SMTP an den Mail-Server von example.com zugestellt.'
  category: internet
  aliases:
    - 'Simple Mail Transfer Protocol'
  related:
    - e-mail
    - protokoll
  lesson: wie-das-internet-funktioniert/ip-adressen-und-pakete
- slug: ethernet
  term: Ethernet
  short: 'Die verbreitetste Technik für kabelgebundene lokale Netzwerke.'
  explanation: |
    Ethernet legt fest, wie Geräte über Netzwerkkabel Daten austauschen. Die Daten werden dabei in Rahmen (Frames) verpackt, die die Hardware-Adresse des nächsten Geräts tragen. Im TCP/IP-Modell gehört Ethernet zur Netzzugangsschicht.
  example: 'Ein Desktop-Rechner, der per Netzwerkkabel am Router hängt, nutzt Ethernet.'
  category: internet
  aliases:
    - Netzwerkkabel
    - LAN-Kabel
  related:
