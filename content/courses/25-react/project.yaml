title: Dein Gewohnheits-Tracker
description: |
  In diesem Projekt baust du mit Vite, React 19 und TypeScript einen Gewohnheits-Tracker: eine Liste
  täglicher Gewohnheiten, die du abhaken, ergänzen und löschen kannst. Die Daten überleben ein Neuladen
  der Seite, und am Ende sichern automatische Tests das Verhalten ab.

  Du gehst dabei genau die Schritte, die du in einem echten React-Projekt gehst: Komponenten schneiden,
  Props typisieren, Logik in einen Reducer ziehen, ein kontrolliertes Formular bauen, einen eigenen Hook
  mit Effekt schreiben, Werte ableiten statt speichern und alles mit Vitest testen.

  Klicke zuerst auf **Projekt vorbereiten**: Das legt im Ordner `tracker` ein frisches Vite-Projekt
  (Vorlage `react-ts`) an und installiert die Abhängigkeiten. Öffne dann das Übungs-Terminal und wechsle
  mit `cd tracker` hinein. Dateien bearbeitest du mit `nano`, `vim` oder per `cat > datei <<'EOF'`.

  Nach jedem Schritt prüft Stacklab deinen Code – fast immer auch mit `npm run build`. Dieser Befehl
  startet zuerst den TypeScript-Compiler (`tsc -b`) und dann den Vite-Build. Schlägt er fehl, zeigt er dir
  Datei und Zeile des Fehlers. Häufigste Ursache: ein ungenutzter Import.

  Zum Ausprobieren im Browser kannst du jederzeit `npm run dev -- --host` starten und mit `Strg+C` beenden.
goal: >
  Ein Vite-React-Projekt `tracker` mit den Komponenten `App` und `Gewohnheit`, einem typisierten Reducer,
  einem eigenen Hook `useGewohnheiten`, der im localStorage speichert, einer abgeleiteten Statistik und
  grünen Vitest-Tests für Reducer und Oberfläche – und einem erfolgreichen Produktions-Build.
workdir: tracker
setup: |
  npm create vite@latest . -- --template react-ts --no-interactive >/dev/null 2>&1
  npm install --no-audit --no-fund >/dev/null 2>&1
steps:
  - id: app-aufraeumen
    title: Die Vorlage aufräumen
    description: |
      Die Vite-Vorlage enthält einen Demo-Zähler mit Logos. Den brauchst du nicht – du startest mit einer
      leeren Oberfläche.

      1. Ersetze den gesamten Inhalt von `src/App.tsx` durch eine Komponente `App`, die ein `<main>` mit der
         Überschrift `<h1>Gewohnheits-Tracker</h1>` zurückgibt.
      2. Exportiere sie wie bisher mit `export default App`.
      3. Entferne alle alten Imports (Logos, `useState`, `App.css`) – sonst meldet TypeScript ungenutzte Imports.
      4. Prüfe mit `npm run build`, dass alles kompiliert.
    checklist:
      - src/App.tsx enthält nur noch die neue Komponente
      - Keine ungenutzten Imports mehr
      - "`npm run build` läuft ohne Fehler"
    hints:
      - Am einfachsten überschreibst du die Datei komplett mit `cat > src/App.tsx <<'EOF'` … `EOF`.
      - "Die ganze Datei: `function App() { return <main><h1>Gewohnheits-Tracker</h1></main> }` und `export default App`."
    checks:
      - type: file_contains
        path: src/App.tsx
        pattern: "<h1>\\s*Gewohnheits-Tracker\\s*</h1>"
        message: src/App.tsx soll die Überschrift <h1>Gewohnheits-Tracker</h1> rendern.
      - type: command
        run: "! grep -q 'reactLogo\\|viteLogo' src/App.tsx"
        message: In src/App.tsx stehen noch die Logos der Vorlage. Ersetze die Datei komplett.
      - type: command
        run: npm run build >/dev/null 2>&1
        message: npm run build schlägt fehl. Führe den Befehl aus und lies die Fehlermeldung – oft ist es ein übrig gebliebener Import.
    solution: |
      ```tsx title="src/App.tsx"
      function App() {
        return (
          <main>
            <h1>Gewohnheits-Tracker</h1>
          </main>
        )
      }

      export default App
      ```
    solve: |
      cat > src/App.tsx <<'EOF'
      function App() {
        return (
          <main>
            <h1>Gewohnheits-Tracker</h1>
          </main>
        )
      }

      export default App
      EOF

  - id: komponente-gewohnheit
    title: Die Komponente Gewohnheit
    description: |
      Jede Gewohnheit ist eine Zeile mit Checkbox, Name und Löschen-Button. Diese Zeile wird eine eigene
      Komponente mit typisierten Props.

      1. Lege `src/Gewohnheit.tsx` an und exportiere daraus `function Gewohnheit` (benannter Export).
      2. Typisiere die Props: `name: string`, `erledigt: boolean`, `onUmschalten: () => void` und
         `onEntfernen: () => void`.
      3. Die Komponente rendert ein `<li>` mit einem `<label>`, darin eine Checkbox
         (`checked={erledigt}`, `onChange={onUmschalten}`) und den Namen. Daneben steht ein Button `×` mit
         `aria-label={name + ' entfernen'}`, der `onEntfernen` aufruft.
      4. Lege in `src/App.tsx` außerhalb der Komponente ein Array `startGewohnheiten` mit drei Einträgen
         `{ id, name, erledigt }` an: `Wasser trinken` (nicht erledigt), `20 Minuten lesen` (erledigt) und
         `Spazieren gehen` (nicht erledigt), IDs 1 bis 3.
      5. `App` rendert sie unter der Überschrift in einer `<ul>` mit `map` und der `id` als `key`.
         Als Handler reichst du vorerst leere Funktionen `() => {}` weiter.
    checklist:
      - src/Gewohnheit.tsx mit typisierten Props
      - Checkbox, Name und Löschen-Button in einem li
      - App rendert drei Gewohnheiten mit map und key
    hints:
      - "Props-Typ: `type GewohnheitProps = { name: string; erledigt: boolean; onUmschalten: () => void; onEntfernen: () => void }`."
      - "Signatur: `export function Gewohnheit({ name, erledigt, onUmschalten, onEntfernen }: GewohnheitProps)`."
      - "In App: `import { Gewohnheit } from './Gewohnheit'` und `{startGewohnheiten.map((g) => <Gewohnheit key={g.id} name={g.name} erledigt={g.erledigt} onUmschalten={() => {}} onEntfernen={() => {}} />)}`."
    checks:
      - type: file_contains
        path: src/Gewohnheit.tsx
        pattern: "export\\s+function\\s+Gewohnheit"
        message: In src/Gewohnheit.tsx fehlt export function Gewohnheit.
      - type: file_contains
        path: src/Gewohnheit.tsx
        pattern: "onUmschalten:\\s*\\(\\)\\s*=>\\s*void"
        message: Typisiere die Prop onUmschalten als () => void.
      - type: file_contains
        path: src/Gewohnheit.tsx
        pattern: "type=\"checkbox\""
        message: Die Komponente braucht eine Checkbox (input type="checkbox").
      - type: file_contains
        path: src/App.tsx
        pattern: "Spazieren gehen"
        message: In src/App.tsx fehlen die drei Start-Gewohnheiten (z. B. Spazieren gehen).
      - type: file_contains
        path: src/App.tsx
        pattern: "key=\\{"
        message: Gib jeder Gewohnheit in der Liste ein key – am besten ihre id.
      - type: command
        run: npm run build >/dev/null 2>&1
        message: npm run build schlägt fehl. Prüfe die Fehlermeldung – passen die Props-Typen zu dem, was App übergibt?
    solution: |
      ```tsx title="src/Gewohnheit.tsx"
      type GewohnheitProps = {
        name: string
        erledigt: boolean
        onUmschalten: () => void
        onEntfernen: () => void
      }

      export function Gewohnheit({ name, erledigt, onUmschalten, onEntfernen }: GewohnheitProps) {
        return (
          <li className={erledigt ? 'erledigt' : undefined}>
            <label>
              <input type="checkbox" checked={erledigt} onChange={onUmschalten} />
              {name}
            </label>
            <button aria-label={name + ' entfernen'} onClick={onEntfernen}>×</button>
          </li>
        )
      }
      ```

      In `src/App.tsx` importierst du `Gewohnheit`, legst `startGewohnheiten` an und renderst die Liste mit
      `map` und `key={g.id}`.
    solve: |
      cat > src/Gewohnheit.tsx <<'EOF'
      type GewohnheitProps = {
        name: string
        erledigt: boolean
        onUmschalten: () => void
        onEntfernen: () => void
      }

      export function Gewohnheit({ name, erledigt, onUmschalten, onEntfernen }: GewohnheitProps) {
        return (
          <li className={erledigt ? 'erledigt' : undefined}>
            <label>
              <input type="checkbox" checked={erledigt} onChange={onUmschalten} />
              {name}
            </label>
            <button aria-label={name + ' entfernen'} onClick={onEntfernen}>×</button>
          </li>
        )
      }
      EOF
      cat > src/App.tsx <<'EOF'
      import { Gewohnheit } from './Gewohnheit'

      const startGewohnheiten = [
        { id: 1, name: 'Wasser trinken', erledigt: false },
        { id: 2, name: '20 Minuten lesen', erledigt: true },
        { id: 3, name: 'Spazieren gehen', erledigt: false },
      ]

      function App() {
        return (
          <main>
            <h1>Gewohnheits-Tracker</h1>
            <ul>
              {startGewohnheiten.map((g) => (
                <Gewohnheit
                  key={g.id}
                  name={g.name}
                  erledigt={g.erledigt}
