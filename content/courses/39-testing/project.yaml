      sed -i 's/^use App\\VoucherRepository;$/use App\\VoucherRepository;\n\nmutates(RedeemVoucher::class);/' tests/Unit/RedeemVoucherTest.php
      XDEBUG_MODE=coverage ./vendor/bin/pest --mutate --min=100
      ```
    solve: |
