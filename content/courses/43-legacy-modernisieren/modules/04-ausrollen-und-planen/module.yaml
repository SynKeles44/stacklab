title: Ausrollen und planen
description: Neuen Code mit Feature-Flags und Parallelbetrieb sicher live bringen, Daten nach Expand-and-Contract migrieren und eine Modernisierung in Etappen planen und kommunizieren.
exercise:
  id: modul-uebung-schattenbetrieb
  type: terminal
  title: Der neue Preisrechner im Schattenbetrieb
  description: |
    Im Ordner `schattenbetrieb` liegt die Gemüsekiste mit Composer und Golden Master. Ein Kollege hat in
    `src/Preisrechner.php` einen neuen `Gruenfeld\Preisrechner` geschrieben. Ob er wirklich gleich rechnet, weiß
    niemand. Baue in `seiten/preis.php` ein Feature-Flag mit drei Modi ein, gesteuert über die Umgebungsvariable
    `NEUE_PREISE`:

    | Wert | Verhalten |
    |---|---|
    | nicht gesetzt oder `aus` | nur der alte Weg (`berechne_preis()`) |
    | `schatten` | beide rechnen, **ausgeliefert wird der alte Preis**; weichen die Preise ab, wird eine Zeile an `data/abweichungen.log` angehängt, die Kiste, Menge, Typ, alten und neuen Preis enthält |
    | `an` | nur der neue Preisrechner |

    Den neuen Rechner baust du so: `new \Gruenfeld\Preisrechner($PREISE, fn () => (int) date('N'))`, seine Methode
    ist `preis(string $kiste, int $menge, string $typ)`. Rufe ihn im Schattenmodus in `try/catch` auf.

    Probiere danach `NEUE_PREISE=schatten php tests/golden.php` aus und sieh dir das Protokoll an – findest du den
    Fehler des Kollegen? (Du musst ihn nicht beheben.) Klicke zuerst auf **Aufgabe vorbereiten**.
  workdir: schattenbetrieb
  setup: |
    mkdir -p inc classes seiten tools data
    cat > config.php <<'EOF'
    <?php
    $DB_PFAD = dirname(__FILE__) . '/data/app.db';
    $SHOP_NAME = 'Gemüsekiste Grünfeld';
    $PREISE = array('klein' => 14.9, 'mittel' => 21.5, 'gross' => 29.9);
    EOF
    cat > inc/db.php <<'EOF'
    <?php
    function db() {
        global $DB_PFAD, $DB;
        if (!$DB) {
            $DB = new PDO('sqlite:' . $DB_PFAD);
        }
        return $DB;
    }

    function lade_bestellungen($kunde) {
        $sql = "SELECT * FROM bestellungen";
        if ($kunde != '') {
            $sql .= " WHERE kunde = '" . $kunde . "'";
        }
        $sql .= " ORDER BY id";
        $liste = array();
        foreach (db()->query($sql) as $row) {
            $liste[] = new Bestellung($row);
        }
        return $liste;
    }
    EOF
    cat > inc/functions.php <<'EOF'
    <?php
    function berechne_preis($kiste, $menge, $typ) {
        global $PREISE;
        $preis = $PREISE[$kiste] * $menge;
        if ($typ == 'stamm') {
            $preis = $preis * 0.9;
        }
        if ($menge > 5) {
            $preis = $preis - 2;
        }
        if (date('N') == 6) {
            $preis = $preis + 1.5;
        }
        return round($preis, 2);
    }

    function formatiere_preis($preis) {
        return number_format($preis, 2, ',', '.') . ' EUR';
    }
    EOF
    cat > classes/Bestellung.php <<'EOF'
    <?php
    class Bestellung {
        var $id;
        var $kunde;
        var $kiste;
        var $menge;
        var $typ;

        function __construct($row) {
            $this->id = $row['id'];
            $this->kunde = $row['kunde'];
            $this->kiste = $row['kiste'];
            $this->menge = $row['menge'];
            $this->typ = $row['typ'];
        }

        function preis() {
            return berechne_preis($this->kiste, $this->menge, $this->typ);
        }
    }
    EOF
    cat > index.php <<'EOF'
    <?php
    require_once 'config.php';
    require_once 'inc/db.php';
    require_once 'inc/functions.php';
    require_once 'classes/Bestellung.php';

    $seite = isset($_GET['seite']) ? $_GET['seite'] : 'start';

    if ($seite == 'start') {
        include 'seiten/start.php';
    } elseif ($seite == 'bestellungen') {
        include 'seiten/bestellungen.php';
    } elseif ($seite == 'preis') {
        include 'seiten/preis.php';
    } else {
        echo "<h1>Seite nicht gefunden</h1>\n";
    }
    EOF
    cat > seiten/start.php <<'EOF'
    <h1><?php echo $SHOP_NAME; ?></h1>
    <p>Willkommen! Frisches Gemüse jede Woche.</p>
    EOF
    cat > seiten/bestellungen.php <<'EOF'
    <?php
    $kunde = isset($_GET['kunde']) ? $_GET['kunde'] : '';
    echo "<h1>Bestellungen</h1>\n<ul>\n";
    foreach (lade_bestellungen($kunde) as $b) {
        echo "<li>" . $b->kunde . ": " . $b->menge . "x " . $b->kiste . " = " . formatiere_preis($b->preis()) . "</li>\n";
    }
    echo "</ul>\n";
    EOF
    cat > seiten/preis.php <<'EOF'
    <?php
    $typ = isset($_GET['typ']) ? $_GET['typ'] : 'neu';
    echo formatiere_preis(berechne_preis($_GET['kiste'], $_GET['menge'], $typ)) . "\n";
    EOF
    cat > tools/anfrage.php <<'EOF'
    <?php
    $url = $argv[1] ?? '/index.php';
    parse_str((string) parse_url($url, PHP_URL_QUERY), $_GET);
    $_SERVER['REQUEST_URI'] = $url;
    $_SERVER['REQUEST_METHOD'] = 'GET';
    chdir(dirname(__DIR__));
    require dirname(__DIR__) . '/index.php';
    EOF
    sqlite3 data/app.db "CREATE TABLE bestellungen (id INTEGER PRIMARY KEY, kunde TEXT, kiste TEXT, menge INTEGER, typ TEXT);
    INSERT INTO bestellungen (kunde, kiste, menge, typ) VALUES ('Ada', 'klein', 2, 'stamm'), ('Linus', 'gross', 1, 'neu'), ('Grace', 'mittel', 7, 'stamm'), ('Ada', 'mittel', 1, 'stamm'), ('Margaret', 'gross', 12, 'neu'), ('Alan', 'klein', 3, 'neu');"
    mkdir -p tests
    cat > tests/golden.php <<'EOF'
    <?php
    $urls = array(
        '/index.php',
        '/index.php?seite=bestellungen',
        '/index.php?seite=bestellungen&kunde=Ada',
        '/index.php?seite=preis&kiste=klein&menge=1',
        '/index.php?seite=preis&kiste=mittel&menge=6&typ=stamm',
        '/index.php?seite=preis&kiste=gross&menge=12',
        '/index.php?seite=gibtsnicht',
    );
    foreach ($urls as $url) {
        echo "### " . $url . "\n";
        echo shell_exec('php ' . escapeshellarg(__DIR__ . '/../tools/anfrage.php') . ' ' . escapeshellarg($url));
    }
    EOF
    php tests/golden.php > tests/golden-master.txt
    cat > composer.json <<'EOF'
    {
        "name": "gruenfeld/gemuesekiste",
        "description": "Bestellsystem der Gemüsekiste Grünfeld",
        "type": "project",
        "require": {
            "php": "^8.4"
        },
        "autoload": {
            "psr-4": {
                "Gruenfeld\\": "src/"
            },
            "classmap": ["classes/"],
            "files": ["inc/db.php", "inc/functions.php"]
        }
    }
    EOF
    mkdir -p src
    composer dump-autoload -q
    sed -i "/require_once 'inc\/db.php';/d; /require_once 'inc\/functions.php';/d; s#require_once 'classes/Bestellung.php';#require __DIR__ . '/vendor/autoload.php';#" index.php
    cat > src/Preisrechner.php <<'EOF'
    <?php
    declare(strict_types=1);

    namespace Gruenfeld;

    use Closure;

    final class Preisrechner
    {
        public function __construct(
            private array $preise,
            private Closure $wochentag,
        ) {
        }

        public function preis(string $kiste, int $menge, string $typ): float
        {
            $preis = ($this->preise[$kiste] ?? 0.0) * $menge;
            if ($menge > 5) {
                $preis -= 2;
            }
            if ($typ === 'stamm') {
                $preis *= 0.9;
            }
            if (($this->wochentag)() === 6) {
                $preis += 1.5;
            }

            return round($preis, 2);
        }
    }
    EOF
  checks:
    - type: file_contains
      path: seiten/preis.php
      pattern: "getenv\\(\\s*['\"]NEUE_PREISE['\"]\\s*\\)"
      message: seiten/preis.php soll den Modus mit getenv('NEUE_PREISE') lesen.
    - type: file_contains
      path: seiten/preis.php
      pattern: "catch\\s*\\("
      message: Rufe den neuen Preisrechner im Schattenmodus in try/catch auf, damit ein Fehler die Anfrage nicht abbricht.
    - type: command
      run: env -u NEUE_PREISE php tests/golden.php | diff -q - tests/golden-master.txt
      message: Ohne gesetztes Flag weicht die Ausgabe vom Golden Master ab. Der Standard muss der alte Weg sein.
    - type: command
      run: rm -f data/abweichungen.log; NEUE_PREISE=schatten php tests/golden.php | diff -q - tests/golden-master.txt
      message: Im Schattenmodus weicht die Ausgabe vom Golden Master ab. Ausgeliefert werden muss der alte Preis.
    - type: command
      run: |
        rm -f data/abweichungen.log
        NEUE_PREISE=schatten php tools/anfrage.php "/index.php?seite=preis&kiste=mittel&menge=6&typ=stamm" > /dev/null
        grep -c "mittel" data/abweichungen.log
      stdout_matches: "^[1-9]"
      message: Im Schattenmodus fehlt der Eintrag in data/abweichungen.log für mittel, 6 Kisten, stamm. Hängst du mit FILE_APPEND an und steht die Kiste in der Zeile?
    - type: command
      run: |
        rm -f data/abweichungen.log
        NEUE_PREISE=schatten php tools/anfrage.php "/index.php?seite=preis&kiste=klein&menge=1" > /dev/null
        test ! -s data/abweichungen.log
      message: Für kiste=klein&menge=1 rechnen alt und neu gleich – trotzdem wurde etwas protokolliert. Schreibe nur bei einer Abweichung.
    - type: command
      run: |
        a=$(env -u NEUE_PREISE php tools/anfrage.php "/index.php?seite=preis&kiste=mittel&menge=6&typ=stamm")
        n=$(NEUE_PREISE=an php tools/anfrage.php "/index.php?seite=preis&kiste=mittel&menge=6&typ=stamm")
        test "$a" != "$n" && echo "$n" | grep -qE "^[0-9]+,[0-9]{2} EUR$"
      message: Im Modus an soll der neue Preisrechner liefern (für mittel/6/stamm rechnet er anders als der alte), formatiert wie bisher.
  hints:
    - "Am Anfang: `$modus = getenv('NEUE_PREISE') ?: 'aus';` – `getenv()` liefert `false`, wenn die Variable fehlt."
    - "Den Rechner brauchst du nur in den Modi schatten und an. `global $PREISE;` ist in seiten/preis.php nicht nötig, weil die Datei im globalen Gültigkeitsbereich eingebunden wird."
    - "Protokoll: `file_put_contents('data/abweichungen.log', \"$kiste|$menge|$typ alt=$alt neu=$neu\\n\", FILE_APPEND);`"
  solution: |
    ```bash
    cd schattenbetrieb
    cat > seiten/preis.php <<'EOF'
    <?php
    $kiste = $_GET['kiste'];
    $menge = $_GET['menge'];
    $typ = isset($_GET['typ']) ? $_GET['typ'] : 'neu';
    $modus = getenv('NEUE_PREISE') ?: 'aus';

    if ($modus === 'an') {
        $rechner = new \Gruenfeld\Preisrechner($PREISE, fn () => (int) date('N'));
        $preis = $rechner->preis((string) $kiste, (int) $menge, (string) $typ);
    } else {
        $preis = berechne_preis($kiste, $menge, $typ);
        if ($modus === 'schatten') {
            try {
                $rechner = new \Gruenfeld\Preisrechner($PREISE, fn () => (int) date('N'));
                $neu = $rechner->preis((string) $kiste, (int) $menge, (string) $typ);
                if ($neu !== $preis) {
                    file_put_contents('data/abweichungen.log', "$kiste|$menge|$typ alt=$preis neu=$neu\n", FILE_APPEND);
                }
            } catch (Throwable $e) {
                file_put_contents('data/abweichungen.log', "$kiste|$menge|$typ fehler=" . $e->getMessage() . "\n", FILE_APPEND);
            }
        }
    }

    echo formatiere_preis($preis) . "\n";
    EOF
    env -u NEUE_PREISE php tests/golden.php | diff - tests/golden-master.txt && echo "aus: grün"
    NEUE_PREISE=schatten php tests/golden.php | diff - tests/golden-master.txt && echo "schatten: grün"
    cat data/abweichungen.log
    ```
