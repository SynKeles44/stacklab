title: Modernisieren
description: Die PHP-Version Schritt für Schritt mit Rector anheben, die Anwendung nach dem Strangler-Fig-Pattern Route für Route ersetzen und dabei Illuminate-Komponenten ohne Laravel nutzen.
exercise:
  id: modul-uebung-bestellseite
  type: terminal
  title: Die Bestellliste zieht in den neuen Code
  description: |
    Im Ordner `bestellseite` liegt die Gemüsekiste mit Composer, Golden Master und bereits eingerichtetem
    `illuminate/database` (`bootstrap/datenbank.php`, eingebunden in `index.php`). Jetzt ist die Bestellliste dran.

    1. Lege `src/Seiten/BestellungenSeite.php` an: Klasse `Gruenfeld\Seiten\BestellungenSeite` mit
       `antwort(array $query): string`. Sie liefert **exakt** die Ausgabe von `seiten/bestellungen.php` –
       Überschrift, Liste, Zeilenumbrüche.
    2. Die Klasse lädt die Bestellungen selbst mit `Capsule::table('bestellungen')` (sortiert nach `id`,
       optional gefiltert nach `kunde`). Für den Preis darf sie noch `berechne_preis()` und `formatiere_preis()`
       benutzen. `lade_bestellungen()` und die Klasse `Bestellung` braucht sie nicht mehr.
    3. Leite in `index.php` die Route `seite=bestellungen` an die neue Klasse um.
    4. Golden Master grün? Dann lösche `seiten/bestellungen.php`.

    Klicke zuerst auf **Aufgabe vorbereiten** (Composer installiert dabei `illuminate/database`, das dauert etwas).
  workdir: bestellseite
  setup: |
    mkdir -p inc classes seiten tools data
    cat > config.php <<'EOF'
    <?php
    $DB_PFAD = dirname(__FILE__) . '/data/app.db';
    $SHOP_NAME = 'Gemüsekiste Grünfeld';
    $PREISE = array('klein' => 14.9, 'mittel' => 21.5, 'gross' => 29.9);
    EOF
    cat > inc/db.php <<'EOF'
    <?php
    function db() {
        global $DB_PFAD, $DB;
        if (!$DB) {
            $DB = new PDO('sqlite:' . $DB_PFAD);
        }
        return $DB;
    }

    function lade_bestellungen($kunde) {
        $sql = "SELECT * FROM bestellungen";
        if ($kunde != '') {
            $sql .= " WHERE kunde = '" . $kunde . "'";
        }
        $sql .= " ORDER BY id";
        $liste = array();
        foreach (db()->query($sql) as $row) {
            $liste[] = new Bestellung($row);
        }
        return $liste;
    }
    EOF
    cat > inc/functions.php <<'EOF'
    <?php
    function berechne_preis($kiste, $menge, $typ) {
        global $PREISE;
        $preis = $PREISE[$kiste] * $menge;
        if ($typ == 'stamm') {
            $preis = $preis * 0.9;
        }
        if ($menge > 5) {
            $preis = $preis - 2;
        }
        if (date('N') == 6) {
            $preis = $preis + 1.5;
        }
        return round($preis, 2);
    }

    function formatiere_preis($preis) {
        return number_format($preis, 2, ',', '.') . ' EUR';
    }
    EOF
    cat > classes/Bestellung.php <<'EOF'
    <?php
    class Bestellung {
        var $id;
        var $kunde;
        var $kiste;
        var $menge;
        var $typ;

        function __construct($row) {
            $this->id = $row['id'];
            $this->kunde = $row['kunde'];
            $this->kiste = $row['kiste'];
            $this->menge = $row['menge'];
            $this->typ = $row['typ'];
        }

        function preis() {
            return berechne_preis($this->kiste, $this->menge, $this->typ);
        }
    }
    EOF
    cat > index.php <<'EOF'
    <?php
    require_once 'config.php';
    require_once 'inc/db.php';
    require_once 'inc/functions.php';
    require_once 'classes/Bestellung.php';

    $seite = isset($_GET['seite']) ? $_GET['seite'] : 'start';

    if ($seite == 'start') {
        include 'seiten/start.php';
    } elseif ($seite == 'bestellungen') {
        include 'seiten/bestellungen.php';
    } elseif ($seite == 'preis') {
        include 'seiten/preis.php';
    } else {
        echo "<h1>Seite nicht gefunden</h1>\n";
    }
    EOF
    cat > seiten/start.php <<'EOF'
    <h1><?php echo $SHOP_NAME; ?></h1>
    <p>Willkommen! Frisches Gemüse jede Woche.</p>
    EOF
    cat > seiten/bestellungen.php <<'EOF'
    <?php
    $kunde = isset($_GET['kunde']) ? $_GET['kunde'] : '';
    echo "<h1>Bestellungen</h1>\n<ul>\n";
    foreach (lade_bestellungen($kunde) as $b) {
        echo "<li>" . $b->kunde . ": " . $b->menge . "x " . $b->kiste . " = " . formatiere_preis($b->preis()) . "</li>\n";
    }
    echo "</ul>\n";
    EOF
    cat > seiten/preis.php <<'EOF'
    <?php
    $typ = isset($_GET['typ']) ? $_GET['typ'] : 'neu';
    echo formatiere_preis(berechne_preis($_GET['kiste'], $_GET['menge'], $typ)) . "\n";
    EOF
    cat > tools/anfrage.php <<'EOF'
    <?php
    $url = $argv[1] ?? '/index.php';
    parse_str((string) parse_url($url, PHP_URL_QUERY), $_GET);
    $_SERVER['REQUEST_URI'] = $url;
    $_SERVER['REQUEST_METHOD'] = 'GET';
    chdir(dirname(__DIR__));
    require dirname(__DIR__) . '/index.php';
    EOF
    sqlite3 data/app.db "CREATE TABLE bestellungen (id INTEGER PRIMARY KEY, kunde TEXT, kiste TEXT, menge INTEGER, typ TEXT);
    INSERT INTO bestellungen (kunde, kiste, menge, typ) VALUES ('Ada', 'klein', 2, 'stamm'), ('Linus', 'gross', 1, 'neu'), ('Grace', 'mittel', 7, 'stamm'), ('Ada', 'mittel', 1, 'stamm'), ('Margaret', 'gross', 12, 'neu'), ('Alan', 'klein', 3, 'neu');"
    mkdir -p tests
    cat > tests/golden.php <<'EOF'
    <?php
    $urls = array(
        '/index.php',
        '/index.php?seite=bestellungen',
        '/index.php?seite=bestellungen&kunde=Ada',
        '/index.php?seite=preis&kiste=klein&menge=1',
        '/index.php?seite=preis&kiste=mittel&menge=6&typ=stamm',
        '/index.php?seite=preis&kiste=gross&menge=12',
        '/index.php?seite=gibtsnicht',
    );
    foreach ($urls as $url) {
        echo "### " . $url . "\n";
        echo shell_exec('php ' . escapeshellarg(__DIR__ . '/../tools/anfrage.php') . ' ' . escapeshellarg($url));
    }
    EOF
    php tests/golden.php > tests/golden-master.txt
    cat > composer.json <<'EOF'
    {
        "name": "gruenfeld/gemuesekiste",
        "description": "Bestellsystem der Gemüsekiste Grünfeld",
        "type": "project",
        "require": {
            "php": "^8.4"
        },
        "autoload": {
            "psr-4": {
                "Gruenfeld\\": "src/"
            },
            "classmap": ["classes/"],
            "files": ["inc/db.php", "inc/functions.php"]
        }
    }
    EOF
    mkdir -p src
    composer dump-autoload -q
    sed -i "/require_once 'inc\/db.php';/d; /require_once 'inc\/functions.php';/d; s#require_once 'classes/Bestellung.php';#require __DIR__ . '/vendor/autoload.php';#" index.php
    timeout 170 composer require -n -q illuminate/database </dev/null
    mkdir -p bootstrap
    cat > bootstrap/datenbank.php <<'EOF'
    <?php
    use Illuminate\Database\Capsule\Manager as Capsule;

    $capsule = new Capsule();
    $capsule->addConnection([
        'driver' => 'sqlite',
        'database' => __DIR__ . '/../data/app.db',
    ]);
    $capsule->setAsGlobal();
    EOF
    sed -i "s#require __DIR__ . '/vendor/autoload.php';#&\nrequire __DIR__ . '/bootstrap/datenbank.php';#" index.php
  checks:
    - type: file_exists
      path: src/Seiten/BestellungenSeite.php
      message: Lege src/Seiten/BestellungenSeite.php an.
    - type: file_contains
      path: src/Seiten/BestellungenSeite.php
      pattern: "::table\\(\\s*'bestellungen'\\s*\\)"
      message: BestellungenSeite soll die Bestellungen mit Capsule::table('bestellungen') laden.
    - type: command
      run: grep -cE "lade_bestellungen|new \\\\?Bestellung\\(" src/Seiten/BestellungenSeite.php || true
      stdout_equals: "0"
      message: BestellungenSeite benutzt noch lade_bestellungen() oder die alte Klasse Bestellung. Lade die Daten direkt mit dem Query Builder.
    - type: file_contains
      path: index.php
      pattern: "BestellungenSeite"
      message: index.php soll seite=bestellungen an Gruenfeld\Seiten\BestellungenSeite weitergeben.
    - type: file_absent
      path: seiten/bestellungen.php
      message: seiten/bestellungen.php existiert noch. Lösche sie, sobald der Golden Master grün ist.
    - type: command
      run: php tools/anfrage.php "/index.php?seite=bestellungen&kunde=x' OR '1'='1" | grep -c '<li>' || true
      stdout_equals: "0"
      message: Der SQL-Injection-Versuch liefert Bestellungen. Filtere mit where('kunde', $kunde).
    - type: command
      run: php tests/golden.php | diff -q - tests/golden-master.txt
      message: Der Golden Master ist rot. Vergleiche mit php tests/golden.php | diff - tests/golden-master.txt.
  hints:
    - "Baue die Ausgabe in einer Variable `$html` auf und gib sie am Ende mit `return $html;` zurück – statt `echo`."
    - "`$zeilen = Capsule::table('bestellungen')->orderBy('id'); if (($query['kunde'] ?? '') !== '') { $zeilen->where('kunde', $query['kunde']); }`"
    - "Die Zeile pro Bestellung: `'<li>' . $b->kunde . ': ' . $b->menge . 'x ' . $b->kiste . ' = ' . formatiere_preis(berechne_preis($b->kiste, $b->menge, $b->typ)) . \"</li>\\n\"`"
  solution: |
    ```bash
    cd bestellseite
    mkdir -p src/Seiten
    cat > src/Seiten/BestellungenSeite.php <<'EOF'
    <?php
    declare(strict_types=1);

    namespace Gruenfeld\Seiten;

    use Illuminate\Database\Capsule\Manager as Capsule;

    final class BestellungenSeite
    {
        public function antwort(array $query): string
        {
            $kunde = $query['kunde'] ?? '';
            $zeilen = Capsule::table('bestellungen')->orderBy('id');
            if ($kunde !== '') {
                $zeilen->where('kunde', $kunde);
            }

            $html = "<h1>Bestellungen</h1>\n<ul>\n";
            foreach ($zeilen->get() as $b) {
                $preis = formatiere_preis(berechne_preis($b->kiste, $b->menge, $b->typ));
                $html .= '<li>' . $b->kunde . ': ' . $b->menge . 'x ' . $b->kiste . ' = ' . $preis . "</li>\n";
            }

            return $html . "</ul>\n";
        }
    }
    EOF
    sed -i "s#include 'seiten/bestellungen.php';#echo (new \\\\Gruenfeld\\\\Seiten\\\\BestellungenSeite())->antwort(\$_GET);#" index.php
    php tests/golden.php | diff - tests/golden-master.txt && rm seiten/bestellungen.php
    php tests/golden.php | diff - tests/golden-master.txt && echo "Golden Master grün"
    ```
