      }
      echo "</ul>\n";
      EOF
      cat > seiten/preis.php <<'EOF'
      <?php
      $typ = isset($_GET['typ']) ? $_GET['typ'] : 'neu';
      echo formatiere_preis(berechne_preis($_GET['kiste'], $_GET['menge'], $typ)) . "\n";
      EOF
      cat > tools/anfrage.php <<'EOF'
      <?php
      $url = $argv[1] ?? '/index.php';
      parse_str((string) parse_url($url, PHP_URL_QUERY), $_GET);
      $_SERVER['REQUEST_URI'] = $url;
      $_SERVER['REQUEST_METHOD'] = 'GET';
      chdir(dirname(__DIR__));
      require dirname(__DIR__) . '/index.php';
      EOF
      sqlite3 data/app.db "CREATE TABLE bestellungen (id INTEGER PRIMARY KEY, kunde TEXT, kiste TEXT, menge INTEGER, typ TEXT);
      INSERT INTO bestellungen (kunde, kiste, menge, typ) VALUES ('Ada', 'klein', 2, 'stamm'), ('Linus', 'gross', 1, 'neu'), ('Grace', 'mittel', 7, 'stamm'), ('Ada', 'mittel', 1, 'stamm'), ('Margaret', 'gross', 12, 'neu'), ('Alan', 'klein', 3, 'neu');"
      mkdir -p tests
      cat > tests/golden.php <<'EOF'
      <?php
      $urls = array(
          '/index.php',
          '/index.php?seite=bestellungen',
          '/index.php?seite=bestellungen&kunde=Ada',
          '/index.php?seite=preis&kiste=klein&menge=1',
          '/index.php?seite=preis&kiste=mittel&menge=6&typ=stamm',
          '/index.php?seite=preis&kiste=gross&menge=12',
          '/index.php?seite=gibtsnicht',
      );
      foreach ($urls as $url) {
          echo "### " . $url . "\n";
          echo shell_exec('php ' . escapeshellarg(__DIR__ . '/../tools/anfrage.php') . ' ' . escapeshellarg($url));
      }
      EOF
      php tests/golden.php > tests/golden-master.txt
      cat > composer.json <<'EOF'
      {
          "name": "gruenfeld/gemuesekiste",
          "description": "Bestellsystem der Gemüsekiste Grünfeld",
          "type": "project",
          "require": {
              "php": "^8.4"
          },
          "autoload": {
              "psr-4": {
                  "Gruenfeld\\": "src/"
              },
              "classmap": ["classes/"],
              "files": ["inc/db.php", "inc/functions.php"]
          }
      }
      EOF
      mkdir -p src
      composer dump-autoload -q
      sed -i "/require_once 'inc\/db.php';/d; /require_once 'inc\/functions.php';/d; s#require_once 'classes/Bestellung.php';#require __DIR__ . '/vendor/autoload.php';#" index.php
    checks:
      - type: command
        run: php -r 'require "vendor/autoload.php"; echo (new Gruenfeld\Seiten\StartSeite("Testladen"))->antwort();'
        stdout_matches: "<h1>Testladen</h1>"
        message: StartSeite soll den Shopnamen aus dem Konstruktor in der Überschrift ausgeben.
      - type: file_contains
        path: index.php
        pattern: "StartSeite"
        message: index.php soll die Startseite an Gruenfeld\Seiten\StartSeite geben.
      - type: file_absent
        path: seiten/start.php
        message: seiten/start.php existiert noch.
      - type: command
        run: php tests/golden.php | diff -q - tests/golden-master.txt
        message: Der Golden Master ist rot – stimmen Zeilenumbrüche und Text exakt?
    hints:
      - "Schau dir `seiten/start.php` mit `cat -A` an – so siehst du jeden Zeilenumbruch."
      - "`return '<h1>' . $this->shopName . \"</h1>\\n<p>Willkommen! Frisches Gemüse jede Woche.</p>\\n\";`"
    solution: |
      ```bash
      cd pruefung-strangler
      mkdir -p src/Seiten
      cat > src/Seiten/StartSeite.php <<'EOF'
      <?php
      declare(strict_types=1);

      namespace Gruenfeld\Seiten;

      final class StartSeite
      {
          public function __construct(private string $shopName)
          {
          }

          public function antwort(): string
          {
              return '<h1>' . $this->shopName . "</h1>\n<p>Willkommen! Frisches Gemüse jede Woche.</p>\n";
          }
      }
      EOF
      sed -i "s#include 'seiten/start.php';#echo (new \\\\Gruenfeld\\\\Seiten\\\\StartSeite(\$SHOP_NAME))->antwort();#" index.php
      php tests/golden.php | diff - tests/golden-master.txt && rm seiten/start.php
      php tests/golden.php | diff - tests/golden-master.txt && echo "Golden Master grün"
      ```
  - module: ausrollen-und-planen
    id: pruefung-feature-flag
    type: code
    language: php
    title: Ein Feature-Flag mit schrittweiser Freischaltung
    description: |
      Schreib die Funktion `ist_aktiv(string $flag, int $nutzerId, array $konfiguration): bool`. Die Konfiguration
      sieht so aus:

      ```php
      ['neue-preise' => ['modus' => 'prozent', 'prozent' => 10], 'neue-suche' => ['modus' => 'an']]
      ```

      - Modus `an` → immer `true`, Modus `aus` → immer `false`.
      - Ein Flag, das nicht in der Konfiguration steht, ist **aus** (sicherer Standard).
      - Modus `prozent` → aktiv, wenn `crc32($flag . ':' . $nutzerId) % 100` kleiner als `prozent` ist. So bekommt
        derselbe Nutzer immer dasselbe Ergebnis, und ungefähr der eingestellte Anteil aller Nutzer ist dabei.
    starter: |
      <?php
      declare(strict_types=1);

      function ist_aktiv(string $flag, int $nutzerId, array $konfiguration): bool
      {
          return false;
      }
    tests:
      - name: Modus an und aus
        code: |
          $k = ['a' => ['modus' => 'an'], 'b' => ['modus' => 'aus']];
          assert_same(true, ist_aktiv('a', 1, $k));
          assert_same(false, ist_aktiv('b', 1, $k));
      - name: Unbekanntes Flag ist aus
        code: |
          assert_same(false, ist_aktiv('gibt-es-nicht', 7, []));
      - name: 0 und 100 Prozent
        code: |
          $k = ['null' => ['modus' => 'prozent', 'prozent' => 0], 'alle' => ['modus' => 'prozent', 'prozent' => 100]];
          for ($id = 1; $id <= 200; $id++) {
              assert_same(false, ist_aktiv('null', $id, $k));
              assert_same(true, ist_aktiv('alle', $id, $k));
          }
      - name: Gleicher Nutzer, gleiches Ergebnis
        code: |
          $k = ['neue-preise' => ['modus' => 'prozent', 'prozent' => 30]];
          for ($id = 1; $id <= 50; $id++) {
              assert_same(ist_aktiv('neue-preise', $id, $k), ist_aktiv('neue-preise', $id, $k));
          }
      - name: Ungefähr der eingestellte Anteil
        code: |
          $k = ['neue-preise' => ['modus' => 'prozent', 'prozent' => 10]];
          $aktiv = 0;
          for ($id = 1; $id <= 2000; $id++) {
              if (ist_aktiv('neue-preise', $id, $k)) {
                  $aktiv++;
              }
          }
          assert_true($aktiv > 120 && $aktiv < 280);
    solution: |
      <?php
      declare(strict_types=1);

      function ist_aktiv(string $flag, int $nutzerId, array $konfiguration): bool
      {
          $eintrag = $konfiguration[$flag] ?? ['modus' => 'aus'];

          return match ($eintrag['modus'] ?? 'aus') {
              'an' => true,
              'prozent' => crc32($flag . ':' . $nutzerId) % 100 < ($eintrag['prozent'] ?? 0),
              default => false,
          };
      }
    hints:
      - "Mit `$konfiguration[$flag] ?? ['modus' => 'aus']` bekommst du für unbekannte Flags den sicheren Standard."
      - "`match` passt gut für die drei Modi."
