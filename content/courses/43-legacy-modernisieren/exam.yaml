title: Abschlussprüfung Legacy-Code modernisieren
description: |
  Die Prüfung deckt alle vier Module ab: Legacy-Code verstehen und absichern, sicher umbauen, modernisieren sowie
  ausrollen und planen. Zu den Fragen kommen drei Praxisaufgaben – zwei im Übungs-Terminal an der Gemüsekiste und eine
  Programmieraufgabe. Du bestehst mit 70 Prozent.
time_limit_minutes: 75
pass_percent: 70
questions:
  - module: verstehen-und-absichern
    type: single
    question: Welche Definition von Legacy-Code hilft dir im Alltag am meisten?
    options:
      - Code, der älter als zehn Jahre ist.
      - Code, den du nicht sicher ändern kannst, weil ein Sicherheitsnetz aus Tests fehlt.
      - Code in einer Programmiersprache, die nicht mehr modern ist.
    answer: 1
    explanation: Entscheidend ist die fehlende Rückmeldung nach einer Änderung – nicht Alter oder Sprache.
  - module: verstehen-und-absichern
    type: multiple
    question: Warum scheitern Big-Bang-Rewrites so häufig?
    options:
      - Verborgene Regeln im Altcode werden übersehen.
      - Das Geschäft ändert sich während des Rewrites weiter.
      - Lange Zeit entsteht kein nutzbares Ergebnis.
      - Neue Frameworks sind grundsätzlich fehlerhaft.
    answers: [0, 1, 2]
    explanation: Verborgenes Wissen, bewegliche Ziele und fehlender Zwischennutzen sind die Hauptgründe. Am Framework liegt es selten.
  - module: verstehen-und-absichern
    type: single
    question: Ein Charakterisierungstest zeigt, dass eine Funktion für negative Mengen einen negativen Preis liefert. Was tust du zuerst?
    options:
      - Das Verhalten als Erwartung festhalten und den Befund notieren.
      - Den Fehler sofort im selben Schritt beheben.
      - Den Testfall löschen, weil er einen Fehler zeigt.
    answer: 0
    explanation: Ein Charakterisierungstest beschreibt das Ist. Verhaltensänderungen folgen später in einem eigenen, sichtbaren Schritt.
  - module: verstehen-und-absichern
    type: cloze
    text: "Ein Golden Master speichert die komplette Ausgabe für feste ___. Damit er funktioniert, muss die Ausgabe ___ sein – zwei Läufe ohne Codeänderung liefern dasselbe."
    blanks:
      - [Eingaben, Eingabewerte]
      - [deterministisch, stabil, reproduzierbar]
    explanation: Feste Eingaben und eine deterministische Ausgabe sind die beiden Voraussetzungen.
  - module: verstehen-und-absichern
    type: find-bug
    question: Welche Zeile macht diesen Golden Master unzuverlässig?
    language: php
    code: |
      <?php
      $urls = array('/index.php', '/index.php?seite=bestellungen');
      echo "Erzeugt am " . date('Y-m-d H:i') . "\n";
      foreach ($urls as $url) {
          echo "### " . $url . "\n";
          echo shell_exec('php tools/anfrage.php ' . escapeshellarg($url));
      }
    bug_line: 3
    explanation: Die Uhrzeit ändert sich bei jedem Lauf – der Vergleich meldet immer einen Unterschied, auch ohne Codeänderung.
  - module: sicher-umbauen
    type: match
    question: Ordne jeder Technik ihre Beschreibung zu.
    pairs:
      - { left: "Parameter-Naht", right: "Neuer Parameter mit Standardwert ersetzt eine versteckte Abhängigkeit" }
      - { left: "Objekt-Naht", right: "Abhängigkeit kommt über den Konstruktor herein" }
      - { left: "Sprout-Methode", right: "Neue Logik getestet daneben schreiben und einhängen" }
      - { left: "Wrap-Methode", right: "Alte Funktion umbenennen und eine neue drumherum legen" }
    explanation: Alle vier schaffen Testbarkeit, ohne den Altcode auf einen Schlag umzuschreiben.
  - module: sicher-umbauen
    type: single
    question: Nach einem Refactoring-Schritt ist der Golden Master rot. Was ist richtig?
    options:
      - Den Golden Master neu erzeugen.
      - Den Schritt zurücknehmen und kleiner neu ansetzen.
      - Weitere Schritte machen und am Ende alles gemeinsam prüfen.
    answer: 1
    explanation: Ein Refactoring darf das Verhalten nicht ändern. Rot heißt, der Schritt war falsch oder zu groß.
  - module: sicher-umbauen
    type: find-bug
    question: Welche Zeile ist eine Sicherheitslücke?
    language: php
    code: |
      function suche_kunde(PDO $db, string $name): array
      {
          $sql = "SELECT * FROM kunden WHERE name LIKE '%" . $name . "%'";
          return $db->query($sql)->fetchAll();
      }
    bug_line: 3
    explanation: Der Name wird in das SQL geklebt. Richtig ist ein Prepared Statement mit `LIKE ?` und dem Wert `'%' . $name . '%'` in execute().
  - module: sicher-umbauen
    type: single
    question: Warum sollte `config.php` mit globalen Variablen nicht über `autoload.files` geladen werden?
    options:
      - Composer bindet files innerhalb einer Funktion ein – die Variablen wären danach nicht global.
      - Composer darf nur Dateien aus `src/` laden.
      - files-Dateien werden nur einmal pro Tag geladen.
    answer: 0
    explanation: Variablen aus einer files-Datei landen im Gültigkeitsbereich der ladenden Funktion. `global $PREISE` fände sie nicht.
  - module: sicher-umbauen
    type: cloze
    text: "Alte Klassen ohne Namespace lädt Composer über ___, neue Klassen mit Namespace über ___. Nach Änderungen an der Autoload-Konfiguration führst du `composer ___` aus."
    blanks:
      - [classmap]
      - [psr-4, PSR-4, psr4]
      - [dump-autoload, dumpautoload]
    explanation: classmap für Altbestand, psr-4 für Neues, dump-autoload erzeugt vendor/autoload.php neu.
  - module: modernisieren
    type: single
    question: Ein Projekt läuft auf PHP 7.2. Was ist der sicherste Weg zu PHP 8.4?
    options:
      - Version für Version mit Rector-Stufen, Tests und Ausrollen nach jeder Stufe.
      - Direkt auf 8.4 wechseln und die Fehlermeldungen abarbeiten.
      - Den Code einfrieren und nicht mehr aktualisieren.
    answer: 0
    explanation: Kleine Stufen halten jede Fehlerliste überschaubar. Stillstand bedeutet fehlende Sicherheitsupdates.
  - module: modernisieren
    type: multiple
    question: Welche Aussagen zu Rector stimmen?
    options:
      - "`rector process --dry-run` zeigt Änderungen, ohne Dateien zu verändern."
      - "`withPhpSets(php74: true)` aktiviert alle Regeln bis einschließlich PHP 7.4."
      - Rector findet zuverlässig jede stille Verhaltensänderung zwischen PHP-Versionen.
      - Rector wird als Dev-Abhängigkeit über Composer installiert.
    answers: [0, 1, 3]
    explanation: Stille Verhaltensänderungen wie neue Vergleichsregeln findet nur dein Sicherheitsnetz, nicht Rector.
  - module: modernisieren
    type: single
    question: Was macht die Fassade im Strangler-Fig-Pattern?
    options:
      - Sie verteilt jede Anfrage entweder an alten oder an neuen Code.
      - Sie übersetzt alten Code automatisch in neuen.
      - Sie sperrt alte Seiten, bis der neue Code fertig ist.
    answer: 0
    explanation: Die Fassade (Front-Controller, Reverse Proxy oder neuer Router) entscheidet pro Anfrage, wer sie bearbeitet.
  - module: modernisieren
    type: cloze
    text: "Mit `illuminate/database` ohne Laravel richtest du die Verbindung über den ___ Manager ein. `->___()` macht ihn über statische Aufrufe wie `Capsule::table()` verfügbar."
    blanks:
      - [Capsule]
      - [setAsGlobal]
    explanation: Capsule ersetzt die Laravel-Konfiguration, setAsGlobal() erlaubt statische Aufrufe.
  - module: modernisieren
    type: find-bug
    question: Welche Zeile hebt den Schutz des Query Builders wieder auf?
    language: php
    code: |
      $abfrage = Capsule::table('bestellungen')->orderBy('id');
      if ($kunde !== '') {
          $abfrage->whereRaw("kunde = '$kunde'");
      }
      $zeilen = $abfrage->get();
    bug_line: 3
    explanation: whereRaw() mit eingesetztem Wert ist eine SQL-Injection. Richtig ist `->where('kunde', $kunde)`.
  - module: ausrollen-und-planen
    type: single
    question: Was wird im Parallelbetrieb an die Nutzer ausgeliefert?
    options:
      - Das Ergebnis des alten Codes; der neue wird nur verglichen.
      - Das Ergebnis des neuen Codes; der alte wird nur verglichen.
      - Abwechselnd das alte und das neue Ergebnis.
    answer: 0
    explanation: Im Schattenbetrieb bleibt der alte Code die Wahrheit, Abweichungen werden protokolliert.
  - module: ausrollen-und-planen
    type: multiple
    question: Was gehört zu einer sicheren Datenmigration?
    options:
      - Ein Backup vor der Migration
      - Eine Transaktion mit BEGIN und COMMIT
      - Prüfabfragen auf Anzahl und NULL-Werte danach
      - Die alte Spalte im selben Schritt löschen, damit niemand sie mehr nutzt
    answers: [0, 1, 2]
    explanation: Die alte Spalte wird erst in der Contract-Phase entfernt, wenn kein Code sie mehr liest.
  - module: ausrollen-und-planen
    type: single
    question: Wo beginnst du eine Modernisierung sinnvollerweise?
    options:
      - Bei Code, der oft geändert wird und schwer verständlich ist.
      - Bei Code, den seit Jahren niemand angefasst hat.
      - Bei der Datei mit den meisten Zeilen.
    answer: 0
    explanation: Hotspots kosten bei jeder Änderung Zeit – dort bringt Modernisierung sofort Nutzen.
tasks:
  - module: sicher-umbauen
    id: pruefung-absichern-und-reparieren
    type: terminal
    title: Absichern, dann reparieren
    description: |
      Im Ordner `pruefung-sql` liegt die Gemüsekiste im Originalzustand – ohne Tests.

      1. Lege einen Golden Master an: `tests/golden.php` mit mindestens sieben URLs (inklusive `kunde=Ada` und einer
         unbekannten Seite) und `tests/golden-master.txt`.
      2. Schließe danach die SQL-Injection in `lade_bestellungen()` mit einem Prepared Statement.
      3. Der Golden Master muss grün bleiben, der Angriff `kunde=x' OR '1'='1` darf keine Bestellung liefern.

      Klicke zuerst auf **Aufgabe vorbereiten**.
    workdir: pruefung-sql
    setup: |
      mkdir -p inc classes seiten tools data
      cat > config.php <<'EOF'
      <?php
      $DB_PFAD = dirname(__FILE__) . '/data/app.db';
      $SHOP_NAME = 'Gemüsekiste Grünfeld';
      $PREISE = array('klein' => 14.9, 'mittel' => 21.5, 'gross' => 29.9);
      EOF
      cat > inc/db.php <<'EOF'
      <?php
      function db() {
          global $DB_PFAD, $DB;
          if (!$DB) {
              $DB = new PDO('sqlite:' . $DB_PFAD);
          }
          return $DB;
      }

      function lade_bestellungen($kunde) {
          $sql = "SELECT * FROM bestellungen";
          if ($kunde != '') {
              $sql .= " WHERE kunde = '" . $kunde . "'";
          }
          $sql .= " ORDER BY id";
          $liste = array();
          foreach (db()->query($sql) as $row) {
              $liste[] = new Bestellung($row);
          }
          return $liste;
      }
      EOF
      cat > inc/functions.php <<'EOF'
      <?php
      function berechne_preis($kiste, $menge, $typ) {
          global $PREISE;
          $preis = $PREISE[$kiste] * $menge;
          if ($typ == 'stamm') {
              $preis = $preis * 0.9;
          }
          if ($menge > 5) {
              $preis = $preis - 2;
          }
          if (date('N') == 6) {
              $preis = $preis + 1.5;
          }
          return round($preis, 2);
      }

      function formatiere_preis($preis) {
          return number_format($preis, 2, ',', '.') . ' EUR';
      }
      EOF
      cat > classes/Bestellung.php <<'EOF'
      <?php
      class Bestellung {
          var $id;
          var $kunde;
          var $kiste;
          var $menge;
          var $typ;

          function __construct($row) {
              $this->id = $row['id'];
              $this->kunde = $row['kunde'];
              $this->kiste = $row['kiste'];
              $this->menge = $row['menge'];
              $this->typ = $row['typ'];
          }

          function preis() {
              return berechne_preis($this->kiste, $this->menge, $this->typ);
          }
      }
      EOF
      cat > index.php <<'EOF'
      <?php
      require_once 'config.php';
      require_once 'inc/db.php';
      require_once 'inc/functions.php';
      require_once 'classes/Bestellung.php';

      $seite = isset($_GET['seite']) ? $_GET['seite'] : 'start';

      if ($seite == 'start') {
          include 'seiten/start.php';
      } elseif ($seite == 'bestellungen') {
          include 'seiten/bestellungen.php';
      } elseif ($seite == 'preis') {
          include 'seiten/preis.php';
      } else {
          echo "<h1>Seite nicht gefunden</h1>\n";
      }
      EOF
      cat > seiten/start.php <<'EOF'
      <h1><?php echo $SHOP_NAME; ?></h1>
      <p>Willkommen! Frisches Gemüse jede Woche.</p>
      EOF
      cat > seiten/bestellungen.php <<'EOF'
      <?php
      $kunde = isset($_GET['kunde']) ? $_GET['kunde'] : '';
      echo "<h1>Bestellungen</h1>\n<ul>\n";
      foreach (lade_bestellungen($kunde) as $b) {
          echo "<li>" . $b->kunde . ": " . $b->menge . "x " . $b->kiste . " = " . formatiere_preis($b->preis()) . "</li>\n";
      }
      echo "</ul>\n";
      EOF
      cat > seiten/preis.php <<'EOF'
      <?php
      $typ = isset($_GET['typ']) ? $_GET['typ'] : 'neu';
      echo formatiere_preis(berechne_preis($_GET['kiste'], $_GET['menge'], $typ)) . "\n";
      EOF
      cat > tools/anfrage.php <<'EOF'
      <?php
      $url = $argv[1] ?? '/index.php';
      parse_str((string) parse_url($url, PHP_URL_QUERY), $_GET);
      $_SERVER['REQUEST_URI'] = $url;
      $_SERVER['REQUEST_METHOD'] = 'GET';
      chdir(dirname(__DIR__));
      require dirname(__DIR__) . '/index.php';
      EOF
      sqlite3 data/app.db "CREATE TABLE bestellungen (id INTEGER PRIMARY KEY, kunde TEXT, kiste TEXT, menge INTEGER, typ TEXT);
      INSERT INTO bestellungen (kunde, kiste, menge, typ) VALUES ('Ada', 'klein', 2, 'stamm'), ('Linus', 'gross', 1, 'neu'), ('Grace', 'mittel', 7, 'stamm'), ('Ada', 'mittel', 1, 'stamm'), ('Margaret', 'gross', 12, 'neu'), ('Alan', 'klein', 3, 'neu');"
    checks:
      - type: command
        run: grep -c '^### ' tests/golden-master.txt
        stdout_matches: "^([7-9]|[1-9][0-9]+)$"
        message: Der Golden Master fehlt oder enthält weniger als sieben URLs.
      - type: file_contains
        path: tests/golden-master.txt
        pattern: "kunde=Ada"
        message: Die gefilterte Bestellliste fehlt im Golden Master.
      - type: command
        run: grep -F '. $kunde .' inc/db.php
        expect_exit: 1
        message: $kunde wird noch per Verkettung in das SQL geklebt.
      - type: command
        run: php tools/anfrage.php "/index.php?seite=bestellungen&kunde=x' OR '1'='1" | grep -c '<li>' || true
        stdout_equals: "0"
        message: Der Angriff liefert noch Bestellungen.
      - type: command
        run: php tests/golden.php | diff -q - tests/golden-master.txt
        message: Der Golden Master ist rot.
    hints:
      - Erst den Golden Master, dann die Reparatur – sonst sicherst du schon den veränderten Stand.
      - "Platzhalter: `\" WHERE kunde = ?\"` und `$stmt->execute($werte)`."
    solution: |
      ```bash
      cd pruefung-sql
      mkdir -p tests
      cat > tests/golden.php <<'EOF'
      <?php
      $urls = array(
          '/index.php',
          '/index.php?seite=bestellungen',
          '/index.php?seite=bestellungen&kunde=Ada',
          '/index.php?seite=preis&kiste=klein&menge=1',
          '/index.php?seite=preis&kiste=mittel&menge=6&typ=stamm',
          '/index.php?seite=preis&kiste=gross&menge=12',
          '/index.php?seite=gibtsnicht',
      );
      foreach ($urls as $url) {
          echo "### " . $url . "\n";
          echo shell_exec('php ' . escapeshellarg(__DIR__ . '/../tools/anfrage.php') . ' ' . escapeshellarg($url));
      }
      EOF
      php tests/golden.php > tests/golden-master.txt
      cat > inc/db.php <<'EOF'
      <?php
      function db() {
          global $DB_PFAD, $DB;
          if (!$DB) {
              $DB = new PDO('sqlite:' . $DB_PFAD);
          }
          return $DB;
      }

      function lade_bestellungen($kunde) {
          $sql = "SELECT * FROM bestellungen";
          $werte = array();
          if ($kunde != '') {
              $sql .= " WHERE kunde = ?";
              $werte[] = $kunde;
          }
          $sql .= " ORDER BY id";
          $stmt = db()->prepare($sql);
          $stmt->execute($werte);
          $liste = array();
          foreach ($stmt as $row) {
              $liste[] = new Bestellung($row);
          }
          return $liste;
      }
      EOF
      php tests/golden.php | diff - tests/golden-master.txt && echo "Golden Master grün"
      ```
  - module: modernisieren
    id: pruefung-startseite-erwuergen
    type: terminal
    title: Die Startseite zieht um
    description: |
      Im Ordner `pruefung-strangler` liegt die Gemüsekiste mit Composer-Autoloading (`Gruenfeld\` → `src/`) und Golden
      Master.

      1. Lege `Gruenfeld\Seiten\StartSeite` in `src/Seiten/StartSeite.php` an. Der Konstruktor bekommt den Shopnamen
         (`string $shopName`), `antwort(): string` liefert exakt die Ausgabe von `seiten/start.php`.
      2. Leite in `index.php` die Route `start` an `new \Gruenfeld\Seiten\StartSeite($SHOP_NAME)` weiter.
      3. Golden Master grün? Dann `seiten/start.php` löschen.

      Klicke zuerst auf **Aufgabe vorbereiten**.
    workdir: pruefung-strangler
    setup: |
      mkdir -p inc classes seiten tools data
      cat > config.php <<'EOF'
      <?php
      $DB_PFAD = dirname(__FILE__) . '/data/app.db';
      $SHOP_NAME = 'Gemüsekiste Grünfeld';
      $PREISE = array('klein' => 14.9, 'mittel' => 21.5, 'gross' => 29.9);
      EOF
