  - id: strangler-preise
    title: Die Preisseite zieht in den neuen Code
    description: |
      Jetzt wird die erste Route nach dem Strangler-Fig-Pattern abgelöst – diesmal samt neuer Innereien.

      1. Lege `src/Preisrechner.php` an (`Gruenfeld\Preisrechner`, Konstruktor `(array $preise, Closure $wochentag)`,
         Methode `preis(string $kiste, int $menge, string $typ): float`, gleiche Regeln wie `berechne_preis()`).
      2. Lege `src/Seiten/PreisSeite.php` an: `Gruenfeld\Seiten\PreisSeite` bekommt einen `Preisrechner` im Konstruktor;
         `antwort(array $query): string` liefert den formatierten Preis plus Zeilenumbruch – **ohne** `berechne_preis()`.
      3. `index.php` baut für `seite=preis` die Seite mit
         `new \Gruenfeld\Preisrechner($PREISE, fn () => (int) date('N'))` und gibt die Antwort aus.
      4. Golden Master grün? Dann `seiten/preis.php` löschen.
    checklist:
      - "`Gruenfeld\\Preisrechner` mit Objekt-Naht"
      - "`Gruenfeld\\Seiten\\PreisSeite` nutzt den Preisrechner"
      - Route umgestellt, alte Datei gelöscht
      - Golden Master grün
    hints:
      - "Den Preisrechner kennst du aus der Code-Aufgabe „Baue einen Preisrechner mit Nahtstellen“ – er braucht nur `namespace Gruenfeld;` und `use Closure;`."
      - "In PreisSeite: `(string) ($query['kiste'] ?? '')`, `(int) ($query['menge'] ?? 0)`, `(string) ($query['typ'] ?? 'neu')`."
    checks:
      - type: command
        run: php -r 'require "vendor/autoload.php"; $s = new Gruenfeld\Seiten\PreisSeite(new Gruenfeld\Preisrechner(["klein" => 10.0], fn () => 6)); echo $s->antwort(["kiste" => "klein", "menge" => "2"]);'
        stdout_equals: "21,50 EUR"
        message: PreisSeite mit einem Preisrechner (klein = 10.0, Samstag) soll für zwei kleine Kisten "21,50 EUR" liefern.
      - type: command
        run: grep -c "berechne_preis" src/Seiten/PreisSeite.php || true
        stdout_equals: "0"
        message: PreisSeite soll den Preisrechner benutzen, nicht mehr berechne_preis().
      - type: file_absent
        path: seiten/preis.php
        message: seiten/preis.php existiert noch.
      - type: file_contains
        path: index.php
        pattern: "PreisSeite"
        message: index.php soll seite=preis an die PreisSeite geben.
      - type: command
        run: php tests/golden.php | diff -q - tests/golden-master.txt
        message: Der Golden Master ist rot – stimmt der Zeilenumbruch am Ende der Preisausgabe?
    solution: |
      ```bash
      mkdir -p src/Seiten
      cat > src/Preisrechner.php <<'EOF'
      <?php
      declare(strict_types=1);

      namespace Gruenfeld;

      use Closure;

      final class Preisrechner
      {
          public function __construct(
              private array $preise,
              private Closure $wochentag,
          ) {
          }

          public function preis(string $kiste, int $menge, string $typ): float
          {
              $preis = ($this->preise[$kiste] ?? 0.0) * $menge;
              if ($typ === 'stamm') {
                  $preis = $preis * 0.9;
              }
              if ($menge > 5) {
                  $preis = $preis - 2;
              }
              if (($this->wochentag)() === 6) {
                  $preis = $preis + 1.5;
              }

              return round($preis, 2);
          }
      }
      EOF
      cat > src/Seiten/PreisSeite.php <<'EOF'
      <?php
      declare(strict_types=1);

      namespace Gruenfeld\Seiten;

      use Gruenfeld\Preisrechner;

      final class PreisSeite
      {
          public function __construct(private Preisrechner $rechner)
          {
          }

          public function antwort(array $query): string
          {
              $preis = $this->rechner->preis(
                  (string) ($query['kiste'] ?? ''),
                  (int) ($query['menge'] ?? 0),
                  (string) ($query['typ'] ?? 'neu'),
              );

              return formatiere_preis($preis) . "\n";
          }
      }
      EOF
      sed -i "s#include 'seiten/preis.php';#echo (new \\\\Gruenfeld\\\\Seiten\\\\PreisSeite(new \\\\Gruenfeld\\\\Preisrechner(\$PREISE, fn () => (int) date('N'))))->antwort(\$_GET);#" index.php
      php tests/golden.php | diff - tests/golden-master.txt && rm seiten/preis.php
      ```
