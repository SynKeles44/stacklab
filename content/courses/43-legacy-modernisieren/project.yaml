  - id: query-builder
    title: Datenzugriff über illuminate/database
    description: |
      1. Installiere `illuminate/database` mit `timeout 170 composer require illuminate/database`.
      2. Lege `bootstrap/datenbank.php` mit einem Capsule Manager (SQLite, `data/app.db`, `setAsGlobal()`) an und binde
         ihn in `index.php` direkt nach `vendor/autoload.php` ein.
      3. Schreib `lade_bestellungen()` auf `Capsule::table('bestellungen')` um – ohne eigenes SQL.
      4. Golden Master grün, Angriff weiterhin wirkungslos.
    checklist:
      - illuminate/database installiert
      - Capsule eingerichtet und eingebunden
      - "`lade_bestellungen()` nutzt den Query Builder"
      - Golden Master grün
    hints:
      - "Die Vorlagen stehen in der Lektion „Illuminate-Komponenten ohne Laravel“."
      - "Die Zeilen des Query Builders sind Objekte: `new Bestellung((array) $row)`."
    checks:
      - type: command
        run: jq -r '.packages[].name' composer.lock
        stdout_matches: "^illuminate/database$"
        message: illuminate/database ist noch nicht installiert.
      - type: file_contains
        path: index.php
        pattern: "bootstrap/datenbank\\.php"
        message: index.php soll bootstrap/datenbank.php einbinden.
      - type: file_contains
        path: inc/db.php
        pattern: "::table\\(\\s*'bestellungen'\\s*\\)"
        message: lade_bestellungen() soll Capsule::table('bestellungen') verwenden.
      - type: command
        run: grep -ci "select" inc/db.php || true
        stdout_equals: "0"
        message: In inc/db.php steht noch SQL.
      - type: command
        run: php tools/anfrage.php "/index.php?seite=bestellungen&kunde=x' OR '1'='1" | grep -c '<li>' || true
        stdout_equals: "0"
        message: Der Angriff liefert wieder Bestellungen – nutze where('kunde', $kunde).
      - type: command
        run: php tests/golden.php | diff -q - tests/golden-master.txt
        message: Der Golden Master ist rot.
    solution: |
      ```bash
      timeout 170 composer require illuminate/database
      mkdir -p bootstrap
      cat > bootstrap/datenbank.php <<'EOF'
      <?php
      use Illuminate\Database\Capsule\Manager as Capsule;

      $capsule = new Capsule();
      $capsule->addConnection([
          'driver' => 'sqlite',
          'database' => __DIR__ . '/../data/app.db',
      ]);
      $capsule->setAsGlobal();
      EOF
      sed -i "s#require __DIR__ . '/vendor/autoload.php';#&\nrequire __DIR__ . '/bootstrap/datenbank.php';#" index.php
      cat > inc/db.php <<'EOF'
      <?php
      use Illuminate\Database\Capsule\Manager as Capsule;

      function lade_bestellungen($kunde) {
          $abfrage = Capsule::table('bestellungen')->orderBy('id');
          if ($kunde != '') {
              $abfrage->where('kunde', $kunde);
          }
          $liste = [];
          foreach ($abfrage->get() as $row) {
              $liste[] = new Bestellung((array) $row);
          }
          return $liste;
      }
      EOF
      php tests/golden.php | diff - tests/golden-master.txt && echo "Golden Master grün"
      ```
    solve: |
      timeout 170 composer require -n -q illuminate/database </dev/null
      mkdir -p bootstrap
      cat > bootstrap/datenbank.php <<'EOF'
      <?php
      use Illuminate\Database\Capsule\Manager as Capsule;

      $capsule = new Capsule();
      $capsule->addConnection([
          'driver' => 'sqlite',
          'database' => __DIR__ . '/../data/app.db',
      ]);
      $capsule->setAsGlobal();
      EOF
      sed -i "s#require __DIR__ . '/vendor/autoload.php';#&\nrequire __DIR__ . '/bootstrap/datenbank.php';#" index.php
      cat > inc/db.php <<'EOF'
      <?php
      use Illuminate\Database\Capsule\Manager as Capsule;

      function lade_bestellungen($kunde) {
          $abfrage = Capsule::table('bestellungen')->orderBy('id');
          if ($kunde != '') {
              $abfrage->where('kunde', $kunde);
          }
          $liste = [];
          foreach ($abfrage->get() as $row) {
              $liste[] = new Bestellung((array) $row);
          }
          return $liste;
      }
      EOF
  - id: plan
    title: Den Plan festhalten
    description: |
      Zum Schluss dokumentierst du, wo die Modernisierung steht und wie es weitergeht. Lege `MODERNISIERUNG.md` an mit:

      1. `## Erledigt` – mindestens fünf Punkte (Zeilen mit `- `) aus diesem Projekt.
      2. `## Routen` – eine Tabelle mit den Routen `start`, `bestellungen` und `preis` und ihrem Status
         (`alt`, `in Arbeit`, `neu`). `preis` ist `neu`.
      3. `## Nächste Etappen` – mindestens drei Etappen mit prüfbarem Ergebnis.
      4. `## Risiken` – mindestens zwei Risiken, zum Beispiel die Datenmigration der Kisten.
