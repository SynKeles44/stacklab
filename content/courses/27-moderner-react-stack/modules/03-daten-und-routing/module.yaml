title: Daten und Routing
description: Daten an der Grenze mit Zod prüfen, Seiten mit React Router im Data Mode aufbauen, mit loader und action lesen und schreiben, Fehler abfangen und Routen lazy laden.
exercise:
  id: modul-uebung-buecher
  type: terminal
  title: Bücherliste mit Detailseite
  description: |
    Im Ordner `buecher-routing` liegt ein Projekt mit Tailwind, Alias `@`, `react-router` und `zod`. Die Datei
    `src/data/raw-books.ts` simuliert eine API-Antwort (`rawBooks` hat den Typ `unknown`). Baue daraus eine kleine
    App mit Liste und Detailseite.

    1. `src/lib/schemas.ts`: Exportiere `BookSchema` (`id`, `title`, `author` als nicht leere Texte, `year` als
       ganze Zahl, `tags` als Text-Array mit Standardwert `[]`), `BookListSchema` und den Typ `Book` über `z.infer`.
    2. `src/lib/books.ts`: Exportiere `getBooks(): Book[]`, die `rawBooks` mit `BookListSchema.parse` prüft.
    3. `src/routes/books.tsx`: Exportiere `booksLoader` (liefert `{ books }`) und `BooksPage`, die jedes Buch als
       `Link` auf `/buecher/<id>` auflistet.
    4. `src/routes/book-detail.tsx`: Exportiere `bookLoader`, der das Buch zu `params.bookId` liefert (`{ book }`)
       oder `throw data('Dieses Buch gibt es nicht.', { status: 404 })`, und `BookDetailPage` mit Titel, Jahr und Tags.
    5. `src/routes/error-page.tsx`: Exportiere `RootErrorBoundary` mit `useRouteError` und `isRouteErrorResponse`.
    6. `src/router.tsx`: Root-Route mit `RootLayout` (liegt schon in `src/routes/root.tsx`), `ErrorBoundary`,
       Index-Route mit `booksLoader` und Route `buecher/:bookId` mit `bookLoader`.
    7. Baue mit `bun run build`.

    Klicke zuerst auf **Aufgabe vorbereiten** (das dauert einige Sekunden).
  workdir: buecher-routing
  setup: |
    cat > package.json <<'EOF'
    {
      "name": "app",
      "private": true,
      "version": "0.0.0",
      "type": "module",
      "scripts": {
        "dev": "vite",
        "build": "tsc -b && vite build",
        "preview": "vite preview"
      },
      "dependencies": {
        "react": "^19.2.8",
        "react-dom": "^19.2.8"
      },
      "devDependencies": {
        "@types/node": "^24.13.3",
        "@types/react": "^19.2.18",
        "@types/react-dom": "^19.2.7",
        "@vitejs/plugin-react": "^6.1.1",
        "typescript": "^7.0.2",
        "vite": "^8.3.0"
      }
    }
    EOF
    cat > tsconfig.json <<'EOF'
    {
      "files": [],
      "references": [
        { "path": "./tsconfig.app.json" },
        { "path": "./tsconfig.node.json" }
      ]
    }
    EOF
    cat > tsconfig.app.json <<'EOF'
    {
      "compilerOptions": {
        "tsBuildInfoFile": "./node_modules/.tmp/tsconfig.app.tsbuildinfo",
        "target": "es2023",
        "lib": ["ES2023", "DOM"],
        "module": "esnext",
        "types": ["vite/client"],
        "skipLibCheck": true,
        "moduleResolution": "bundler",
        "allowImportingTsExtensions": true,
        "verbatimModuleSyntax": true,
        "moduleDetection": "force",
        "noEmit": true,
        "jsx": "react-jsx",
        "strict": true,
        "noUnusedLocals": true,
        "noUnusedParameters": true
      },
      "include": ["src"]
    }
    EOF
    cat > tsconfig.node.json <<'EOF'
    {
      "compilerOptions": {
        "tsBuildInfoFile": "./node_modules/.tmp/tsconfig.node.tsbuildinfo",
        "target": "es2023",
        "lib": ["ES2023"],
        "types": ["node"],
        "skipLibCheck": true,
        "module": "nodenext",
        "allowImportingTsExtensions": true,
        "verbatimModuleSyntax": true,
        "moduleDetection": "force",
        "noEmit": true,
        "strict": true
      },
      "include": ["vite.config.ts"]
    }
    EOF
    cat > vite.config.ts <<'EOF'
    import react from '@vitejs/plugin-react'
    import { defineConfig } from 'vite'

    export default defineConfig({
      plugins: [react()],
    })
    EOF
    cat > index.html <<'EOF'
    <!doctype html>
    <html lang="de">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Stacklab App</title>
      </head>
      <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
      </body>
    </html>
    EOF
    printf 'node_modules\ndist\n*.local\n' > .gitignore
    mkdir -p src
    cat > src/main.tsx <<'EOF'
    import { StrictMode } from 'react'
    import { createRoot } from 'react-dom/client'
    import './index.css'
    import App from './App.tsx'

    createRoot(document.getElementById('root')!).render(
      <StrictMode>
        <App />
      </StrictMode>,
    )
    EOF
    cat > src/App.tsx <<'EOF'
    export default function App() {
      return <h1>Hallo Stack</h1>
    }
    EOF
    printf 'body {\n  font-family: system-ui, sans-serif;\n}\n' > src/index.css
    bun install >/dev/null 2>&1
    bun add tailwindcss @tailwindcss/vite >/dev/null 2>&1
    cat > vite.config.ts <<'EOF'
    import path from 'node:path'
    import tailwindcss from '@tailwindcss/vite'
    import react from '@vitejs/plugin-react'
    import { defineConfig } from 'vite'

    export default defineConfig({
      plugins: [react(), tailwindcss()],
      resolve: {
        alias: {
          '@': path.resolve(import.meta.dirname, './src'),
        },
      },
    })
    EOF
    cat > tsconfig.json <<'EOF'
    {
      "files": [],
      "references": [
        { "path": "./tsconfig.app.json" },
        { "path": "./tsconfig.node.json" }
      ],
      "compilerOptions": {
        "paths": {
          "@/*": ["./src/*"]
        }
      }
    }
    EOF
    jq '.compilerOptions.paths = {"@/*": ["./src/*"]}' tsconfig.app.json > tsconfig.app.tmp && mv tsconfig.app.tmp tsconfig.app.json
    printf '@import "tailwindcss";\n' > src/index.css
    cat > src/App.tsx <<'EOF'
    export default function App() {
      return <h1 className="p-8 text-3xl font-bold">Hallo Stack</h1>
    }
    EOF
    bun add react-router zod >/dev/null 2>&1
    mkdir -p src/routes src/lib src/data
    cat > src/data/raw-books.ts <<'EOF'
    export const rawBooks: unknown = [
      { id: 'momo', title: 'Momo', author: 'Michael Ende', year: 1973, tags: ['Klassiker', 'Zeit'] },
      { id: 'tschick', title: 'Tschick', author: 'Wolfgang Herrndorf', year: 2010, tags: ['Roadtrip'] },
      { id: 'krabat', title: 'Krabat', author: 'Otfried Preußler', year: 1971 },
    ]
    EOF
    cat > src/routes/root.tsx <<'EOF'
    import { NavLink, Outlet } from 'react-router'

    export function RootLayout() {
      return (
        <div className="mx-auto max-w-3xl p-6">
          <nav className="mb-6 flex gap-4">
            <NavLink to="/" end>Bücher</NavLink>
          </nav>
          <Outlet />
        </div>
      )
    }
    EOF
    cat > src/main.tsx <<'EOF'
    import { StrictMode } from 'react'
    import { createRoot } from 'react-dom/client'
    import { RouterProvider } from 'react-router/dom'
    import { router } from '@/router'
    import './index.css'

    createRoot(document.getElementById('root')!).render(
      <StrictMode>
        <RouterProvider router={router} />
      </StrictMode>,
    )
    EOF
    rm -f src/App.tsx
  checks:
    - type: command
      run: |
        d=$(mktemp -d "$PWD/.pruefung-XXXXXX")
        cat > "$d/t.ts" <<'EOF'
        import { BookSchema } from '../src/lib/schemas'
        const wrongYear = BookSchema.safeParse({ id: 'x', title: 'T', author: 'A', year: '1973' }).success
        const emptyTitle = BookSchema.safeParse({ id: 'x', title: '', author: 'A', year: 1973 }).success
        const ok = BookSchema.parse({ id: 'x', title: 'T', author: 'A', year: 1973 })
        console.log(wrongYear, emptyTitle, JSON.stringify(ok.tags))
        EOF
        bun "$d/t.ts"; status=$?; rm -rf "$d"; exit $status
      stdout_equals: "false false []"
      message: BookSchema stimmt noch nicht – year muss eine Zahl sein, title darf nicht leer sein und tags braucht den Standardwert [].
    - type: command
      run: |
        d=$(mktemp -d "$PWD/.pruefung-XXXXXX")
        cat > "$d/t.ts" <<'EOF'
        import { booksLoader } from '../src/routes/books'
        import { bookLoader } from '../src/routes/book-detail'
        const args = (bookId?: string) => ({ params: { bookId }, request: new Request('http://localhost/'), context: {} }) as never
        const list = (await booksLoader(args())) as any
        const krabat = (await bookLoader(args('krabat'))) as any
        let status = 'kein Fehler'
        try { await bookLoader(args('gibtsnicht')) } catch (error: any) { status = String(error?.init?.status ?? error?.status) }
        console.log(list.books.length, krabat.book.title, JSON.stringify(krabat.book.tags), status)
        EOF
        bun "$d/t.ts"; status=$?; rm -rf "$d"; exit $status
      stdout_equals: "3 Krabat [] 404"
      message: booksLoader soll { books } mit allen drei geprüften Büchern liefern, bookLoader { book } – und für unbekannte IDs eine 404 werfen.
    - type: file_contains
      path: src/lib/books.ts
      pattern: "BookListSchema\\.parse\\("
      message: getBooks in src/lib/books.ts soll rawBooks mit BookListSchema.parse prüfen.
    - type: file_contains
      path: src/routes/error-page.tsx
      pattern: "isRouteErrorResponse\\("
      message: RootErrorBoundary soll isRouteErrorResponse benutzen.
    - type: file_contains
      path: src/router.tsx
      pattern: "ErrorBoundary\\s*:\\s*RootErrorBoundary"
      message: Die Root-Route in src/router.tsx braucht ErrorBoundary RootErrorBoundary.
    - type: file_contains
      path: src/router.tsx
      pattern: "path\\s*:\\s*['\"]buecher/:bookId['\"][^}]*loader\\s*:\\s*bookLoader"
      message: In src/router.tsx fehlt die Route { path 'buecher/:bookId', loader bookLoader, … }.
    - type: file_contains
      path: src/routes/books.tsx
      pattern: "useLoaderData"
      message: BooksPage soll die Daten mit useLoaderData() lesen.
    - type: command
      run: bun run build >/dev/null 2>&1
      message: bun run build schlägt fehl. Führe ihn aus und lies die Fehlermeldung.
  hints:
    - "Arbeite von innen nach außen: erst Schema, dann getBooks, dann Loader, dann Router. `bun run build` zeigt dir nach jedem Schritt, ob die Typen passen."
    - "Standardwert: `tags: z.array(z.string()).default([])`. Ganze Zahl: `z.int()`."
    - "Im bookLoader: `const book = getBooks().find((entry) => entry.id === params.bookId)`."
  solution: |
    ```bash
    cd buecher-routing
    cat > src/lib/schemas.ts <<'EOF'
    import { z } from 'zod'

    export const BookSchema = z.object({
      id: z.string().min(1),
      title: z.string().min(1),
      author: z.string().min(1),
      year: z.int(),
      tags: z.array(z.string()).default([]),
    })

    export const BookListSchema = z.array(BookSchema)

    export type Book = z.infer<typeof BookSchema>
    EOF
    cat > src/lib/books.ts <<'EOF'
    import { rawBooks } from '@/data/raw-books'
    import { BookListSchema, type Book } from '@/lib/schemas'

    export function getBooks(): Book[] {
      return BookListSchema.parse(rawBooks)
    }
    EOF
    cat > src/routes/books.tsx <<'EOF'
    import { Link, useLoaderData } from 'react-router'
    import { getBooks } from '@/lib/books'

    export async function booksLoader() {
      return { books: getBooks() }
    }

    export function BooksPage() {
      const { books } = useLoaderData<typeof booksLoader>()
      return (
        <ul className="space-y-2">
          {books.map((book) => (
            <li key={book.id}>
              <Link to={`/buecher/${book.id}`} className="underline">{book.title}</Link>
            </li>
          ))}
        </ul>
      )
    }
    EOF
    cat > src/routes/book-detail.tsx <<'EOF'
    import { data, useLoaderData, type LoaderFunctionArgs } from 'react-router'
    import { getBooks } from '@/lib/books'

    export async function bookLoader({ params }: LoaderFunctionArgs) {
      const book = getBooks().find((entry) => entry.id === params.bookId)
      if (!book) {
        throw data('Dieses Buch gibt es nicht.', { status: 404 })
      }
      return { book }
    }

    export function BookDetailPage() {
      const { book } = useLoaderData<typeof bookLoader>()
      return (
        <article>
          <h1 className="text-2xl font-bold">{book.title} ({book.year})</h1>
          <p>{book.tags.length > 0 ? book.tags.join(', ') : 'Keine Schlagwörter'}</p>
        </article>
      )
    }
    EOF
    cat > src/routes/error-page.tsx <<'EOF'
    import { isRouteErrorResponse, useRouteError } from 'react-router'

    export function RootErrorBoundary() {
      const error = useRouteError()
      if (isRouteErrorResponse(error)) {
        return <h1 className="p-6 text-2xl font-bold">{error.status} – {String(error.data)}</h1>
      }
      return <h1 className="p-6 text-2xl font-bold">Unerwarteter Fehler</h1>
    }
    EOF
    cat > src/router.tsx <<'EOF'
    import { createBrowserRouter } from 'react-router'
    import { RootLayout } from '@/routes/root'
    import { RootErrorBoundary } from '@/routes/error-page'
    import { BooksPage, booksLoader } from '@/routes/books'
    import { BookDetailPage, bookLoader } from '@/routes/book-detail'

    export const router = createBrowserRouter([
      {
        path: '/',
        Component: RootLayout,
        ErrorBoundary: RootErrorBoundary,
        children: [
          { index: true, loader: booksLoader, Component: BooksPage },
          { path: 'buecher/:bookId', loader: bookLoader, Component: BookDetailPage },
        ],
      },
    ])
    EOF
    bun run build
    ```
