      EOF
      cat > src/routes/suggest.tsx <<'EOF'
      import { z } from 'zod'
      import { data, Form, redirect, useActionData, useNavigation, type ActionFunctionArgs } from 'react-router'
      import { Button } from '@/components/ui/button'
      import { SuggestionSchema } from '@/lib/schemas'
      import { addSuggestion } from '@/lib/suggestions'

      export async function suggestAction({ request }: ActionFunctionArgs) {
        const formData = await request.formData()
        const result = SuggestionSchema.safeParse(Object.fromEntries(formData))
        if (!result.success) {
          return data({ errors: z.flattenError(result.error).fieldErrors }, { status: 400 })
        }
        addSuggestion(result.data)
        return redirect('/')
      }

      export function SuggestPage() {
        const actionData = useActionData<typeof suggestAction>()
        const navigation = useNavigation()
        const errors = actionData?.errors
        const busy = navigation.state === 'submitting'

        return (
          <Form method="post" className="space-y-4">
            <label className="block">
              Titel
              <input name="title" className="mt-1 block w-full rounded-md border border-border p-2" />
              {errors?.title && <span className="text-sm text-destructive">{errors.title[0]}</span>}
            </label>
            <label className="block">
              Autor:in
              <input name="author" className="mt-1 block w-full rounded-md border border-border p-2" />
              {errors?.author && <span className="text-sm text-destructive">{errors.author[0]}</span>}
            </label>
            <label className="block">
              Deine E-Mail
              <input name="email" type="email" className="mt-1 block w-full rounded-md border border-border p-2" />
              {errors?.email && <span className="text-sm text-destructive">{errors.email[0]}</span>}
            </label>
            <Button type="submit" disabled={busy}>{busy ? 'Wird gesendet …' : 'Vorschlagen'}</Button>
          </Form>
        )
      }
      EOF
      cat > src/router.tsx <<'EOF'
