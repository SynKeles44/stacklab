      cat > src/routes/error-page.tsx <<'EOF'
      import { isRouteErrorResponse, Link, useRouteError } from 'react-router'

      export function RootErrorBoundary() {
        const error = useRouteError()
        let title = 'Unerwarteter Fehler'
        let message = 'Bitte lade die Seite neu.'
        if (isRouteErrorResponse(error)) {
          title = `${error.status} ${error.statusText}`
          message = typeof error.data === 'string' ? error.data : message
        } else if (error instanceof Error) {
          message = error.message
        }
        return (
          <main className="mx-auto max-w-3xl space-y-2 p-6">
            <h1 className="text-2xl font-bold text-destructive">{title}</h1>
            <p>{message}</p>
            <Link to="/" className="underline">Zur Startseite</Link>
          </main>
        )
      }
