            <h1 className="text-2xl font-bold">{book.title}</h1>
            <p>{book.author}, {book.year}</p>
            <p className="text-sm text-muted-foreground">{book.tags.join(', ') || 'Keine Schlagwörter'}</p>
            <Link to="/" className="underline">Zurück zur Liste</Link>
          </article>
        )
      }
