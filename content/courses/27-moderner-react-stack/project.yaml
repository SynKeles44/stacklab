    solve: |
      mkdir -p src/lib src/routes
      cat > src/lib/suggestions.ts <<'EOF'
      import type { Suggestion } from './schemas'

      const suggestions: Suggestion[] = []

      export function addSuggestion(suggestion: Suggestion) {
        suggestions.push(suggestion)
      }

      export function listSuggestions(): Suggestion[] {
