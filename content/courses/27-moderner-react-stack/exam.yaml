      ]
      EOF
    checks:
      - type: command
        run: |
          d=$(mktemp -d "$PWD/.pruefung-XXXXXX")
          cat > "$d/t.ts" <<'EOF'
          import { searchLoader } from '../src/routes/search'
          const run = async (query: string) => {
            try {
              const result = (await searchLoader({ request: new Request(`http://localhost/${query}`), params: {}, context: {} } as never)) as any
              return result.books.map((book: { id: string }) => book.id).join('+') || 'leer'
            } catch (error: any) {
              return `fehler${error?.init?.status ?? ''}`
            }
          }
          console.log([await run(''), await run('?q=MO'), await run('?q=mo&limit=2'), await run('?limit=abc'), await run('?limit=99')].join(' '))
          EOF
          bun "$d/t.ts"; status=$?; rm -rf "$d"; exit $status
        stdout_equals: "momo+monster+tschick+krabat+moby momo+monster+moby momo+monster fehler400 fehler400"
        message: searchLoader liefert noch nicht die erwarteten Ergebnisse. Ohne Parameter alle Bücher, q filtert ohne Rücksicht auf Groß-/Kleinschreibung, limit begrenzt, ungültige limit-Werte werfen data(…, { status 400 }).
      - type: file_contains
        path: src/routes/search.tsx
        pattern: "z\\.coerce\\.number\\(\\)"
        message: limit kommt als Text aus der URL – nutze z.coerce.number().
      - type: file_contains
        path: src/routes/search.tsx
        pattern: "useLoaderData"
        message: SearchPage soll die Ergebnisse mit useLoaderData lesen.
      - type: command
        run: bun run build >/dev/null 2>&1
        message: bun run build schlägt fehl. Führe ihn aus und lies die Fehlermeldung.
    hints:
      - "`const url = new URL(request.url)` und `url.searchParams.get('q') ?? undefined` – null würde das Schema ablehnen, undefined greift auf den Standardwert zurück."
      - "Filtern: `books.filter((book) => book.title.toLowerCase().includes(q.toLowerCase())).slice(0, limit)`."
    solution: |
      ```bash
      cd pruefung-suche
      cat > src/routes/search.tsx <<'EOF'
      import { z } from 'zod'
      import { data, useLoaderData, type LoaderFunctionArgs } from 'react-router'
      import { books } from '@/data/books'

      export const SearchSchema = z.object({
        q: z.string().trim().default(''),
        limit: z.coerce.number().int().min(1).max(20).default(10),
      })

      export async function searchLoader({ request }: LoaderFunctionArgs) {
        const url = new URL(request.url)
        const result = SearchSchema.safeParse({
          q: url.searchParams.get('q') ?? undefined,
          limit: url.searchParams.get('limit') ?? undefined,
        })
        if (!result.success) {
          throw data('Ungültige Suche', { status: 400 })
        }
        const { q, limit } = result.data
        const found = books.filter((book) => book.title.toLowerCase().includes(q.toLowerCase())).slice(0, limit)
        return { books: found }
      }

      export function SearchPage() {
        const { books: found } = useLoaderData<typeof searchLoader>()
        return (
          <ul>
            {found.map((book) => (
              <li key={book.id}>{book.title}</li>
            ))}
          </ul>
        )
      }
      EOF
      bun run build
      ```
  - module: auslieferung
    id: pruefung-client-env
    type: code
    language: ts
    title: Was landet im Browser?
    description: |
      Baue im Kleinen nach, welche Umgebungsvariablen Vite an den Browser-Code weitergibt. Schreibe
      `clientEnv(env, mode)`:

      - Nur Schlüssel, die mit `VITE_` beginnen, werden übernommen. Werte, die `undefined` sind, fallen weg.
      - Zusätzlich enthält das Ergebnis immer `MODE` (der übergebene Modus), `DEV` (`true`, wenn der Modus nicht
        `production` ist) und `PROD` (das Gegenteil von `DEV`).
    starter: |
      type ClientEnv = Record<string, string | boolean>

      function clientEnv(env: Record<string, string | undefined>, mode: string): ClientEnv {
        // dein Code
        return {}
      }
    tests:
      - name: nur VITE_-Variablen werden übernommen
        code: |
          assertDeepEqual(clientEnv({ VITE_API_URL: 'https://api.example.com', DB_PASSWORD: 'geheim' }, 'production'), { VITE_API_URL: 'https://api.example.com', MODE: 'production', DEV: false, PROD: true })
      - name: leere Umgebung im Entwicklungsmodus
        code: |
          assertDeepEqual(clientEnv({}, 'development'), { MODE: 'development', DEV: true, PROD: false })
      - name: undefined-Werte und ähnliche Namen fallen weg
        code: |
          assertDeepEqual(clientEnv({ VITE_TITLE: 'Buchclub', VITE_EMPTY: undefined, VITEX: 'x', vite_lower: 'y' }, 'staging'), { VITE_TITLE: 'Buchclub', MODE: 'staging', DEV: true, PROD: false })
    hints:
      - "`Object.entries(env)` liefert Paare aus Schlüssel und Wert. Prüfe mit `key.startsWith('VITE_')` und `value !== undefined`."
      - "`const prod = mode === 'production'`"
    solution: |
      ```ts
      function clientEnv(env: Record<string, string | undefined>, mode: string): ClientEnv {
        const result: ClientEnv = {}
        for (const [key, value] of Object.entries(env)) {
          if (key.startsWith('VITE_') && value !== undefined) {
            result[key] = value
          }
        }
        const prod = mode === 'production'
        result.MODE = mode
        result.DEV = !prod
        result.PROD = prod
        return result
      }
      ```
