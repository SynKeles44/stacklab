    solve: |
      cat > README.md <<'MD'
      # Notizen-API

      Eine kleine REST-API für Notizen. Start: `php -S 127.0.0.1:8080 index.php`

      | Methode | Pfad | Status |
      |---|---|---|
      | GET | `GET /notes?page=1&per_page=10` | 200 |
      | POST | `POST /notes` | 201, 400, 422 |
      | GET | `GET /notes/{id}` | 200, 404 |
      | PATCH | `PATCH /notes/{id}` | 200, 400, 404, 422 |
      | DELETE | `DELETE /notes/{id}` | 204, 404 |

      Fehler kommen als `application/problem+json`:

      ```json
      {"type": "about:blank", "title": "Ungültige Eingabe", "status": 422, "detail": "Mindestens ein Feld ist ungültig.",
       "errors": [{"field": "title", "message": "Der Titel ist ein Pflichtfeld mit höchstens 120 Zeichen."}]}
      ```

      ```bash
      curl -X POST http://127.0.0.1:8080/notes -H 'Content-Type: application/json' -d '{"title": "Einkaufen"}'
      ```
