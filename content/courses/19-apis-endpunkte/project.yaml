         `GET /notes`, `POST /notes`, `GET /notes/{id}`, `PATCH /notes/{id}` und `DELETE /notes/{id}`.
      3. Ein Beispiel für eine Fehlerantwort mit `application/problem+json`.
      4. Ein `curl`-Beispiel zum Anlegen einer Notiz.

