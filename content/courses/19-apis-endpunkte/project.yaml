title: Deine eigene Notizen-API
description: |
  Du baust eine kleine, aber vollständige REST-API für Notizen – nur mit PHP und dem eingebauten
  Entwicklungsserver, ganz ohne Framework. Sie kann Notizen auflisten (mit Paginierung), anlegen, lesen,
  ändern und löschen, prüft Eingaben und meldet Fehler einheitlich als Problem Details (RFC 9457).

  Alles läuft in **einer** Datei `index.php`, die als Router-Skript für `php -S` dient. Die Notizen
  speicherst du als JSON-Datei. Nach jedem Schritt startet Stacklab deine API in einer eigenen,
  leeren Testumgebung und prüft sie mit `curl` und `jq` – so wie ein echter Client.

  **Wichtig für die Prüfungen:** Deine API liest den Pfad der Datendatei aus der Umgebungsvariablen
  `NOTES_FILE` und nimmt nur, wenn sie fehlt, `data/notes.json`:

  ```php
  $file = getenv('NOTES_FILE') ?: __DIR__ . '/data/notes.json';
  ```

  Zum Ausprobieren startest du die API mit `php -S 127.0.0.1:8080 index.php &` und beendest sie mit `kill %1`.
goal: Eine lauffähige Notizen-API in `notizen-api/index.php` mit CRUD, Validierung, Problem Details, Paginierung und einer README, die alle Endpunkte beschreibt.
workdir: notizen-api
steps:
  - id: grundgeruest
    title: Grundgerüst mit Health-Endpunkt
    description: |
      Lege im Ordner `notizen-api` die Datei `index.php` an. Sie ist das Router-Skript für `php -S`: Jeder
      Request landet dort.

      1. Lies Methode und Pfad: `$_SERVER['REQUEST_METHOD']` und `parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH)`.
      2. Schreibe eine Hilfsfunktion `json(int $status, ?array $body, array $headers = [])`, die Statuscode,
         Header und JSON ausgibt (Standard-Content-Type `application/json`) und dann `exit` aufruft.
      3. Schreibe eine Hilfsfunktion `problem(int $status, string $title, string $detail, …)`, die Problem
         Details mit `type`, `title`, `status` und `detail` und dem Content-Type `application/problem+json` ausgibt.
      4. `GET /health` antwortet mit `200` und `{"status": "ok"}`.
      5. Jeder unbekannte Pfad antwortet mit `404` als Problem Details.

      Probiere es aus: `php -S 127.0.0.1:8080 index.php &` und `curl -i http://127.0.0.1:8080/health`.
    checklist:
      - index.php existiert
      - GET /health liefert 200 und {"status":"ok"} als application/json
      - Unbekannte Pfade liefern 404 mit application/problem+json
    hints:
      - "`http_response_code($status)` setzt den Status, `header('Content-Type: application/json')` den Header, `echo json_encode($body)` den Body."
      - "Für Problem Details übergibst du `json()` einen eigenen Header: `['Content-Type' => 'application/problem+json']`. Setze den Standard-Header nur, wenn keiner übergeben wurde."
    checks:
      - type: file_exists
        path: index.php
        message: Lege die Datei index.php im Ordner notizen-api an.
      - type: command
        run: |
          d=$(mktemp -d "$PWD/.pruefung-XXXXXX"); p=$((20000 + RANDOM % 20000)); trap 'kill $s 2>/dev/null; rm -rf "$d"' EXIT
          NOTES_FILE="$d/notes.json" php -S 127.0.0.1:$p index.php >/dev/null 2>&1 & s=$!
          for i in $(seq 30); do curl -s -o /dev/null "http://127.0.0.1:$p/" && break; sleep 0.1; done; B="http://127.0.0.1:$p"
          curl -s -o /dev/null -w '%{http_code} %{content_type}' "$B/health"; echo; curl -s "$B/health" | jq -r '.status'
        stdout_matches: "^200 application/json[^\\n]*\\nok$"
        message: GET /health soll mit 200, dem Content-Type application/json und dem Body {"status":"ok"} antworten.
      - type: command
        run: |
          d=$(mktemp -d "$PWD/.pruefung-XXXXXX"); p=$((20000 + RANDOM % 20000)); trap 'kill $s 2>/dev/null; rm -rf "$d"' EXIT
          NOTES_FILE="$d/notes.json" php -S 127.0.0.1:$p index.php >/dev/null 2>&1 & s=$!
          for i in $(seq 30); do curl -s -o /dev/null "http://127.0.0.1:$p/" && break; sleep 0.1; done; B="http://127.0.0.1:$p"
          curl -s -o /dev/null -w '%{http_code} %{content_type}' "$B/gibt-es-nicht"
        stdout_matches: "^404 application/problem\\+json"
        message: Ein unbekannter Pfad soll mit 404 und dem Content-Type application/problem+json antworten.
    solution: |
      ```php
      <?php
      declare(strict_types=1);

      function json(int $status, ?array $body = null, array $headers = []): never
      {
          http_response_code($status);
          foreach ($headers as $name => $value) {
              header("{$name}: {$value}");
          }
          if ($body !== null) {
              if (!isset($headers['Content-Type'])) {
                  header('Content-Type: application/json');
              }
              echo json_encode($body, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES);
          }
          exit;
      }

      function problem(int $status, string $title, string $detail, array $extra = [], array $headers = []): never
      {
          json($status, array_merge(['type' => 'about:blank', 'title' => $title, 'status' => $status, 'detail' => $detail], $extra),
              array_merge(['Content-Type' => 'application/problem+json'], $headers));
      }

      $method = $_SERVER['REQUEST_METHOD'];
      $path = (string) parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH);

      if ($path === '/health') {
          json(200, ['status' => 'ok']);
      }

      problem(404, 'Not Found', "Den Endpunkt {$method} {$path} gibt es nicht.");
      ```
    solve: |
      cat > index.php <<'PHP'
      <?php
