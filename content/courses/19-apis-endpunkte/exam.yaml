      curl -s $B/books/3 | jq -r '.title' > fehler.txt
      curl -s -o /dev/null -w '%{http_code}' -X POST $B/books -H 'Authorization: Bearer test-token' \
        -H 'Content-Type: application/json' -d '{"title": "Ohne Jahr", "genre": "krimi"}' > anlegen-status.txt
      kill %1
