      - "Löschen: `curl -s -X DELETE http://127.0.0.1:8080/books/3 -H 'Authorization: Bearer test-token'`"
      - "Zahlen aus JSON: `curl -s \"…/books?genre=krimi\" | jq -r '.meta.total' > krimis.txt`"
      - "Statuscode: `curl -s -o /dev/null -w '%{http_code}' …`"
    solution: |
      ```bash
      php -S 127.0.0.1:8080 api.php > server.log 2>&1 &
      B=http://127.0.0.1:8080
      curl -s -X DELETE $B/books/3 -H 'Authorization: Bearer test-token'
