  - id: how-to
    title: Eine How-to-Anleitung und ein Doku-Index
    description: |
      Wer eine neue Einheit ergänzen will, braucht eine kurze Anleitung. Leg sie nach Diátaxis in `docs/how-to/` ab.

      1. Lege `docs/how-to/neue-einheit.md` an. Titel: `# Neue Einheit hinzufügen`.
      2. Darunter nummerierte Schritte (mindestens drei), z. B. Faktor eintragen, ausprobieren, Doku und Changelog ergänzen.
      3. Ein `js`-Codeblock zeigt, wie die neue Einheit in `FACTORS` eingetragen wird, z. B. `in: 0.0254`.
      4. Lege `docs/README.md` als Inhaltsverzeichnis an: `# Dokumentation`, darunter `## How-to-Anleitungen` mit dem
         Link `[Neue Einheit hinzufügen](how-to/neue-einheit.md)` und `## Entscheidungen` mit dem Link auf deinen ADR
         `(adr/0001-keine-laufzeit-abhaengigkeiten.md)`.
    checklist:
      - How-to mit nummerierten Schritten
      - Codeblock mit Sprachangabe js
      - Inhaltsverzeichnis docs/README.md mit relativen Links
    hints:
