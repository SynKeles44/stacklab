  - id: lint-und-links
    title: Doku automatisch prüfen
    description: |
      Jetzt sorgst du dafür, dass die Doku sauber bleibt. Richte markdownlint ein und prüfe alle Links.

      1. `npm install --save-dev markdownlint-cli2@0.23.3`
      2. Lege `.markdownlint-cli2.jsonc` an:

         ```json
         {
           "config": { "MD013": false, "MD024": { "siblings_only": true }, "MD060": false },
           "ignores": ["node_modules/**"]
         }
         ```

      3. `npm pkg set 'scripts.lint:docs=markdownlint-cli2 "**/*.md"'`
      4. Führe `npm run lint:docs` aus und behebe alle Meldungen in deinen Markdown-Dateien.
      5. Stacklab prüft zusätzlich, ob jeder relative Link in deinen Markdown-Dateien auf eine existierende Datei zeigt.
    checklist:
      - markdownlint-cli2 als devDependency installiert
      - Konfiguration und npm-Skript lint:docs angelegt
      - npm run lint:docs läuft ohne Fehler
      - Alle relativen Links zeigen auf existierende Dateien
    hints:
      - "Die meisten Meldungen betreffen fehlende Leerzeilen um Überschriften, Listen und Codeblöcke."
      - "Prüfe die Links selbst: `grep -oE '\\]\\([^)]+\\)' -r --include='*.md' --exclude-dir=node_modules .` zeigt alle Linkziele."
    checks:
      - type: command
        run: jq -r '.devDependencies["markdownlint-cli2"] // empty' package.json
        stdout_matches: "\\d"
        message: markdownlint-cli2 fehlt in den devDependencies.
      - type: command
        run: jq -r '.scripts["lint:docs"] // empty' package.json
        stdout_matches: "^markdownlint-cli2\\s"
        message: Es fehlt das npm-Skript `lint:docs`.
      - type: command
        run: npm run --silent lint:docs
        message: "`npm run lint:docs` meldet noch Fehler. Behebe jede Meldung."
      - type: command
        run: npx --no-install markdownlint-cli2 README.md CONTRIBUTING.md CHANGELOG.md "docs/**/*.md"
        message: Die Doku-Dateien dürfen nicht über `ignores` vom Linter ausgeschlossen werden.
      - type: command
        run: |
          find . -name '*.md' -not -path './node_modules/*' | while read -r f; do
            d=$(dirname "$f")
            grep -oE '\]\([^)]+\)' "$f" | sed -E 's/^\]\((.*)\)$/\1/' | while read -r l; do
              t="${l%%#*}"
              case "$t" in ''|http://*|https://*|mailto:*) continue ;; esac
              [ -e "$d/$t" ] || echo "$f -> $l"
            done
          done
        stdout_equals: ""
        message: Mindestens ein relativer Link zeigt ins Leere. Die Ausgabe zeigt Datei und Linkziel.
    solution: |
      ~~~bash
      npm install --save-dev markdownlint-cli2@0.23.3
      cat > .markdownlint-cli2.jsonc <<'EOF'
      {
        "config": { "MD013": false, "MD024": { "siblings_only": true }, "MD060": false },
        "ignores": ["node_modules/**"]
      }
      EOF
      npm pkg set 'scripts.lint:docs=markdownlint-cli2 "**/*.md"'
      npm run lint:docs
      ~~~
    solve: |
      npm install --save-dev --silent --no-audit --no-fund markdownlint-cli2@0.23.3
      cat > .markdownlint-cli2.jsonc <<'EOF'
      {
        "config": { "MD013": false, "MD024": { "siblings_only": true }, "MD060": false },
        "ignores": ["node_modules/**"]
      }
      EOF
      npm pkg set 'scripts.lint:docs=markdownlint-cli2 "**/*.md"'
      npm run --silent lint:docs > /dev/null 2>&1
  - id: commit
    title: Alles sauber committen
    description: |
      Zum Schluss landet die Doku im Repository – als eigener, sauberer Commit.

      1. Prüf mit `git status`, was neu ist. `node_modules/` darf **nicht** auftauchen (dafür sorgt die .gitignore).
      2. Committe alle neuen und geänderten Dateien in **einem** Commit vom Typ `docs`, z. B.
         `docs: add readme, contributing guide, changelog and adr`.
      3. Am Ende ist das Arbeitsverzeichnis sauber: `git status --porcelain` gibt nichts aus.
    checklist:
      - Ein docs-Commit mit der kompletten Doku
      - package.json und package-lock.json mit committet
      - Keine Dateien aus node_modules im Repository
      - Arbeitsverzeichnis sauber
    hints:
      - "`git add .` ist hier in Ordnung, weil die .gitignore node_modules ausschließt – prüf trotzdem vorher `git status`."
      - "Auch `package-lock.json` gehört in den Commit, damit alle dieselbe Linter-Version bekommen."
    checks:
      - type: command
        run: git status --porcelain
        stdout_equals: ""
        message: Es gibt noch nicht committete Änderungen. Committe alles mit einem docs-Commit.
      - type: command
        run: git log -1 --format=%s
        stdout_matches: "^docs(\\([^)]+\\))?!?: \\S"
        message: "Der letzte Commit braucht eine Nachricht vom Typ docs."
      - type: command
        run: git ls-files README.md CONTRIBUTING.md CHANGELOG.md docs/README.md docs/how-to/neue-einheit.md docs/adr/0001-keine-laufzeit-abhaengigkeiten.md .markdownlint-cli2.jsonc package-lock.json | wc -l
        stdout_matches: "^\\s*8\\s*$"
        message: Nicht alle Doku-Dateien sind committet. Prüfe README, CONTRIBUTING, CHANGELOG, docs/, die Linter-Konfiguration und package-lock.json.
      - type: command
        run: git ls-files | grep -c '^node_modules/' || true
        stdout_equals: "0"
        message: node_modules gehört nicht ins Repository. Entferne es mit `git rm -r --cached node_modules` und prüfe die .gitignore.
    solution: |
      ```bash
      git status
      git add .
      git commit -m "docs: add readme, contributing guide, changelog and adr"
      git status --porcelain
      ```
    solve: |
      git add .
      git commit -q -m "docs: add readme, contributing guide, changelog and adr"
