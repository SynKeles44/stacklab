title: Abschlussprüfung API-Dokumentation
description: |
  Die Prüfung deckt alle vier Module ab: OpenAPI-Grundlagen, Schemas und Authentifizierung, Linting und
  Doku-Ansichten, Erzeugung aus PHP-Code sowie Versionierung, CI und Clients. Zum Bestehen brauchst du
  70 %. Die Praxis-Aufgaben laufen im echten Übungs-Terminal bzw. im Code-Editor.
time_limit_minutes: 50
pass_percent: 70
questions:
  - module: openapi-grundlagen
    type: single
    question: Was ist das Hauptproblem handgepflegter API-Dokumentation?
    options:
      - Sie ist zu teuer im Hosting.
      - Sie läuft unbemerkt vom Code weg, wenn bei Änderungen niemand an die Doku denkt.
      - Sie kann keine Tabellen enthalten.
      - Sie ist immer auf Englisch.
    answer: 1
    explanation: Das ist Dokumentations-Drift. Erzeugte und in der CI geprüfte Doku verhindert sie.
  - module: openapi-grundlagen
    type: multiple
    question: Welche Schlüssel sind auf oberster Ebene einer OpenAPI-3.1-Datei Pflicht?
    options: [openapi, info, servers, security]
    answers: [0, 1]
    explanation: openapi und info sind Pflicht, dazu mindestens eins von paths, components oder webhooks.
  - module: openapi-grundlagen
    type: match
    question: Ordne jede Eingabe der passenden OpenAPI-Beschreibung zu.
    pairs:
      - { left: "/orders/{id}", right: "Parameter mit in: path und required: true" }
      - { left: "?page=2", right: "Parameter mit in: query" }
      - { left: "JSON-Objekt bei POST", right: "requestBody mit content application/json" }
    explanation: Pfad- und Query-Parameter stehen in parameters, der Body im requestBody.
  - module: openapi-grundlagen
    type: cloze
    text: "Pfad und HTTP-Methode zusammen bilden eine ___. Ihr eindeutiger Name steht im Feld ___."
    blanks:
      - [Operation]
      - [operationId]
    explanation: Aus der operationId machen Generatoren Funktionsnamen.
  - module: openapi-grundlagen
    type: find-bug
    question: In welcher Zeile steckt der Fehler?
    language: yaml
    code: |
      /books/{id}:
        get:
          operationId: getBook
          responses:
            "200":
              description: Das Buch
            "404": {}
    bug_line: 7
    explanation: Jede Antwort braucht eine description. Außerdem fehlt hier der Pfadparameter id – das wäre der nächste Lint-Fehler.
  - module: spezifikation-pruefen
    type: single
    question: Wie schreibst du in OpenAPI 3.1 ein Feld, das ein String oder null sein darf?
    options:
      - "nullable: true"
      - "type: [string, \"null\"]"
      - "type: string?"
      - "required: false"
    answer: 1
    explanation: In 3.1 ist null ein eigener Typ in einer Typliste. nullable gab es nur in 3.0, required regelt etwas anderes.
  - module: spezifikation-pruefen
    type: single
    question: "Was bewirkt `$ref: '#/components/schemas/Book'`?"
    options:
      - Es lädt Book von einem Server.
      - Es ersetzt das Objekt durch das Schema Book aus components in derselben Datei.
      - Es kopiert die Datei book.yaml.
      - Es erzeugt eine PHP-Klasse Book.
    answer: 1
    explanation: "# steht für diese Datei, danach folgt der Pfad zum Baustein."
  - module: spezifikation-pruefen
    type: multiple
    question: Welche Aussagen über security stimmen?
    options:
      - security auf oberster Ebene gilt für alle Operationen.
      - "security: [] an einer Operation macht sie öffentlich."
      - In securitySchemes steht ein echtes Token zum Testen.
      - Mehrere Einträge in der security-Liste sind Alternativen (ODER).
    answers: [0, 1, 3]
    explanation: Echte Zugangsdaten gehören nie in die Spezifikation.
  - module: spezifikation-pruefen
    type: single
    question: Wann endet `npx redocly lint` mit einem Exit-Code ungleich 0?
    options:
      - Bei mindestens einer Warnung
      - Bei mindestens einem Fehler
      - Nur bei fehlender Datei
      - Nie
    answer: 1
    explanation: Fehler brechen die CI ab, Warnungen sind Hinweise.
  - module: spezifikation-pruefen
    type: match
    question: Ordne jedem Werkzeug seine Doku-Ansicht zu.
    pairs:
      - { left: "Swagger UI", right: "Aufklappbare Operationen mit Try it out" }
      - { left: "redocly build-docs", right: "Eine einzelne statische HTML-Datei mit Redoc" }
      - { left: "Scalar", right: "Moderne Doku mit API-Client, per CDN einbindbar" }
    explanation: Alle drei zeigen dieselbe OpenAPI-Datei an.
  - module: doku-aus-code
    type: single
    question: swagger-php meldet „Skipping unknown App\BookController“. Was ist die wahrscheinlichste Ursache?
    options:
      - Ein Tippfehler in der Lizenz
      - Die Klasse ist nicht per Composer-Autoloading ladbar.
      - Redocly ist nicht installiert.
      - Es fehlt eine 404-Antwort.
    answer: 1
    explanation: swagger-php muss die Klassen laden, um ihre Attribute zu lesen – PSR-4 und dump-autoload prüfen.
  - module: doku-aus-code
    type: multiple
    question: Was erkennt swagger-php selbst aus dem PHP-Code?
    options:
      - Dass `int $id` ein integer ist
      - Dass `?string $note` auch null sein darf
      - Den Elementtyp von `array $tags`
      - Dass eine Eigenschaft vom Typ Status auf das Schema Status verweist
    answers: [0, 1, 3]
    explanation: Den Elementtyp eines Arrays kennt PHP nicht – den gibst du mit items an.
  - module: doku-aus-code
    type: match
    question: Ordne jedes Werkzeug seiner Arbeitsweise zu.
    pairs:
      - { left: "swagger-php", right: "Explizite OA-Attribute in jedem PHP-Projekt" }
      - { left: "Scramble", right: "Code-Analyse von Routen, FormRequests und Resources in Laravel" }
      - { left: "Scribe", right: "Docblocks oder Attribute plus echte Beispielaufrufe in Laravel" }
    explanation: Alle drei erzeugen OpenAPI – mit unterschiedlich viel Handarbeit.
  - module: automatisieren
    type: single
    question: Wie trennst du mit swagger-php die Spezifikationen von v1 und v2?
    options:
      - Ein Aufruf für src, danach von Hand aufteilen
      - Pro Version nur den passenden Ordner scannen, jeweils mit eigener OA\Info
      - Zwei Server in einer Info-Angabe
      - Gar nicht, eine Datei für alle Versionen ist Pflicht
    answer: 1
    explanation: z. B. `openapi src/V1 -o docs/v1/openapi.yaml` und `openapi src/V2 -o docs/v2/openapi.yaml`.
  - module: automatisieren
    type: cloze
    text: "Der Drift-Wächter erzeugt die Doku neu und prüft dann mit git diff --___ -- docs, ob sie sich verändert hat."
    blanks:
      - [exit-code]
    explanation: Ohne --exit-code endet git diff immer mit 0.
  - module: automatisieren
    type: multiple
    question: Welche Aussagen über generierte API-Clients stimmen?
    options:
      - Funktionsnamen entstehen aus den operationIds.
      - Generierten Code passt man von Hand an, damit er besser passt.
      - Nach einer API-Änderung zeigt der Compiler nach dem Neu-Erzeugen die betroffenen Stellen.
      - Hey API kann Query-Optionen für TanStack Query erzeugen.
    answers: [0, 2, 3]
    explanation: Generierter Code wird nur neu erzeugt – Änderungen gehören in die Spezifikation.
  - module: automatisieren
    type: single
    question: Was ist der Vorteil einer Bruno-Collection gegenüber einer Collection in einem Cloud-Workspace?
    options:
      - Sie ist automatisch schneller.
      - Sie besteht aus Textdateien und kann im Git-Repository versioniert werden.
      - Sie braucht keine OpenAPI-Datei.
      - Sie enthält automatisch echte Tokens.
    answer: 1
    explanation: Dateien im Repository lassen sich reviewen und in der CI neu erzeugen.
tasks:
  - module: spezifikation-pruefen
    id: pruefung-lint
    type: terminal
    title: Eine Spezifikation reparieren
    description: |
      Im Ordner `pruefung-lint` liegt die Spezifikation einer Kunden-API, die Redocly ablehnt. Redocly CLI
      ist installiert. Klicke zuerst auf **Aufgabe vorbereiten**.

      1. Führe `npx redocly lint openapi.yaml` aus.
      2. Behebe alle Fehler in `openapi.yaml`, **ohne** `redocly.yaml` zu ändern:
         - Der Pfadparameter von `/customers/{id}` ist nicht beschrieben.
         - Ein `$ref` zeigt auf ein Schema, das es nicht gibt.
         - Die Anmeldung (`bearerAuth`) ist definiert, wird aber nirgends angewendet – sie soll global gelten.
      3. Lint erneut, bis keine Fehler mehr übrig sind.
    workdir: pruefung-lint
    setup: |
      npm init -y >/dev/null
      timeout 170 npm install --no-audit --no-fund --silent @redocly/cli@2.62.1
      cat > redocly.yaml <<'EOF'
      extends:
        - recommended
      rules:
        no-server-example.com: off
      EOF
      cat > openapi.yaml <<'EOF'
      openapi: 3.1.0
      info:
        title: Kunden-API
        version: 1.0.0
        license:
          name: MIT
          identifier: MIT
      servers:
        - url: https://api.example.com/v1
      paths:
        /customers/{id}:
          get:
            operationId: getCustomer
            summary: Einen Kunden laden
            responses:
              "200":
                description: Der Kunde
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/Customers"
              "404":
                description: Kunde nicht gefunden
      components:
        securitySchemes:
          bearerAuth:
            type: http
            scheme: bearer
        schemas:
          Customer:
            type: object
            required: [id, email]
            properties:
              id:
                type: integer
              email:
                type: string
                format: email
      EOF
      cp redocly.yaml .redocly.original
    checks:
      - type: command
        run: cmp -s redocly.yaml .redocly.original
        message: redocly.yaml wurde verändert. Behebe die Fehler in openapi.yaml.
      - type: command
        run: npx redocly lint openapi.yaml >/dev/null 2>&1
        message: "`npx redocly lint openapi.yaml` meldet noch Fehler."
      - type: command
        run: "d=$(mktemp -d \"$PWD/.pruefung-XXXXXX\"); npx redocly bundle openapi.yaml --ext json -o \"$d/s.json\" >/dev/null 2>&1; jq -c '[(.security[0] | keys[0]), .paths[\"/customers/{id}\"].get.responses[\"200\"].content[\"application/json\"].schema[\"$ref\"]]' \"$d/s.json\"; rm -rf \"$d\""
        stdout_equals: '["bearerAuth","#/components/schemas/Customer"]'
        message: Die globale security-Angabe mit bearerAuth fehlt, oder der $ref zeigt nicht auf #/components/schemas/Customer.
    hints:
      - Lies bei jedem Fehler den Regelnamen – er sagt dir, was fehlt.
      - "Global gilt die Anmeldung mit `security:` und darunter `- bearerAuth: []` auf oberster Ebene."
    solution: |
      ```yaml title="openapi.yaml (Ergänzungen)"
      security:
        - bearerAuth: []
      paths:
        /customers/{id}:
          get:
            operationId: getCustomer
            summary: Einen Kunden laden
            parameters:
              - name: id
                in: path
                required: true
                schema:
                  type: integer
            responses:
              "200":
                description: Der Kunde
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/Customer"
      ```
  - module: doku-aus-code
    id: pruefung-swagger-php
    type: terminal
    title: Einen Endpunkt mit Attributen beschreiben
    description: |
      Im Ordner `pruefung-php` liegt eine kleine Kunden-API mit installiertem swagger-php. Die Klasse
      `App\Model\Customer` und die Methode `CustomerController::show()` haben noch keine Attribute.
      Klicke zuerst auf **Aufgabe vorbereiten**.

      1. Mach `Customer` zu einem Schema mit `required: ["id", "email"]` und `#[OA\Property]` an allen Eigenschaften.
      2. Beschreibe `show()` als `GET /customers/{id}` mit `operationId: "getCustomer"`, Pfadparameter `id`
         (integer), Antwort `200` mit dem Schema `Customer` und Antwort `404`.
      3. Erzeuge `openapi.yaml` mit `./vendor/bin/openapi src -o openapi.yaml`.
    workdir: pruefung-php
    setup: |
      mkdir -p src/Controller src/Model
      cat > composer.json <<'EOF'
      {
          "name": "stacklab/kunden-api",
          "type": "project",
          "autoload": {
              "psr-4": {
                  "App\\": "src/"
              }
          }
      }
      EOF
      timeout 170 composer require -q --no-interaction zircote/swagger-php:^6.12
      cat > src/OpenApi.php <<'EOF'
      <?php

      declare(strict_types=1);

      namespace App;

      use OpenApi\Attributes as OA;

      #[OA\OpenApi(openapi: "3.1.0")]
      #[OA\Info(version: "1.0.0", title: "Kunden-API")]
      final class OpenApi
      {
      }
      EOF
      cat > src/Model/Customer.php <<'EOF'
      <?php

      declare(strict_types=1);

      namespace App\Model;

      use OpenApi\Attributes as OA;

      final class Customer
      {
          public function __construct(
              public int $id,
              public string $email,
              public ?string $company = null,
          ) {
          }
      }
      EOF
      cat > src/Controller/CustomerController.php <<'EOF'
      <?php

      declare(strict_types=1);

      namespace App\Controller;

      use App\Model\Customer;
      use OpenApi\Attributes as OA;

      final class CustomerController
      {
          public function show(int $id): ?Customer
          {
              return new Customer($id, 'user@example.com');
          }
      }
      EOF
    checks:
      - type: file_exists
        path: openapi.yaml
        message: openapi.yaml fehlt. Erzeuge sie mit ./vendor/bin/openapi src -o openapi.yaml.
      - type: command
        run: "./vendor/bin/openapi src --format json 2>/dev/null | jq -r '.components.schemas.Customer | [(.required|sort|join(\",\")), (.properties|keys|sort|join(\",\")), (.properties.company.type|tostring)] | join(\"|\")'"
        stdout_equals: 'email,id|company,email,id|["string","null"]'
        message: Das Schema Customer fehlt oder ist unvollständig (required id und email, Properties id, email, company).
      - type: command
        run: "./vendor/bin/openapi src --format json 2>/dev/null | jq -r '.paths[\"/customers/{id}\"].get | [.operationId, (.parameters[0].in), .responses[\"200\"].content[\"application/json\"].schema[\"$ref\"], (.responses|keys|join(\",\"))] | join(\"|\")'"
        stdout_equals: "getCustomer|path|#/components/schemas/Customer|200,404"
        message: GET /customers/{id} braucht operationId getCustomer, den Pfadparameter id, eine 200-Antwort mit Customer und eine 404-Antwort.
      - type: command
        run: "d=$(mktemp -d \"$PWD/.pruefung-XXXXXX\"); ./vendor/bin/openapi src -o \"$d/neu.yaml\" >/dev/null 2>&1; cmp -s \"$d/neu.yaml\" openapi.yaml; e=$?; rm -rf \"$d\"; exit $e"
        message: openapi.yaml ist nicht aktuell. Erzeuge sie nach deinen Änderungen neu.
    hints:
      - "Schema an der Klasse: `#[OA\\Schema(required: [\"id\", \"email\"])]`"
      - 'Antwort mit Schema: `#[OA\Response(response: 200, description: "Der Kunde", content: new OA\JsonContent(ref: Customer::class))]`'
    solution: |
      ```php title="src/Model/Customer.php"
      #[OA\Schema(required: ["id", "email"])]
      final class Customer
      {
          public function __construct(
              #[OA\Property]
              public int $id,
              #[OA\Property(format: "email")]
              public string $email,
              #[OA\Property]
              public ?string $company = null,
          ) {
          }
      }
      ```

      ```php title="src/Controller/CustomerController.php"
      #[OA\Get(path: "/customers/{id}", operationId: "getCustomer", summary: "Einen Kunden laden")]
      #[OA\Parameter(name: "id", in: "path", required: true, schema: new OA\Schema(type: "integer"))]
      #[OA\Response(response: 200, description: "Der Kunde", content: new OA\JsonContent(ref: Customer::class))]
      #[OA\Response(response: 404, description: "Kunde nicht gefunden")]
      public function show(int $id): ?Customer
      ```

      ```bash
      ./vendor/bin/openapi src -o openapi.yaml
      ```
  - module: openapi-grundlagen
    id: pruefung-fehlende-beschreibungen
    type: code
    language: php
    title: Antworten ohne description finden
    description: |
      Eine OpenAPI-Spezifikation liegt als PHP-Array vor (so, wie `json_decode($json, true)` sie liefert).
      Schreib die Funktion `findMissingDescriptions(array $spec): array`. Sie gibt für jede Antwort ohne
      (oder mit leerer) `description` einen Eintrag im Format `"GET /books 404"` zurück.

      - Die Methode steht in Großbuchstaben, dann der Pfad, dann der Statuscode.
      - Reihenfolge: wie im Array.
      - Einträge unter einem Pfad, die keine HTTP-Methode sind (z. B. `parameters`), ignorierst du.
      - Antworten mit `$ref` gelten als beschrieben.
      - Ohne `paths` ist das Ergebnis ein leeres Array.
    starter: |
      <?php

      declare(strict_types=1);

      function findMissingDescriptions(array $spec): array
      {
          $missing = [];

          // Gehe alle Pfade und ihre Operationen durch.

          return $missing;
      }
    tests:
      - name: findet eine fehlende description
        code: |
          $spec = ['paths' => ['/books' => ['get' => ['responses' => [
              '200' => ['description' => 'Liste'],
              '404' => [],
          ]]]]];
          assert_same(['GET /books 404'], findMissingDescriptions($spec));
      - name: leere Spezifikation
        code: |
          assert_same([], findMissingDescriptions(['openapi' => '3.1.0']));
      - name: ignoriert parameters und akzeptiert $ref
        code: |
          $spec = ['paths' => [
              '/books/{id}' => [
                  'parameters' => [['name' => 'id', 'in' => 'path']],
                  'get' => ['responses' => [
                      '200' => ['description' => ''],
                      '404' => ['$ref' => '#/components/responses/NotFound'],
                  ]],
                  'delete' => ['responses' => ['204' => []]],
              ],
          ]];
          assert_same(['GET /books/{id} 200', 'DELETE /books/{id} 204'], findMissingDescriptions($spec));
    solution: |
      <?php

      declare(strict_types=1);

      function findMissingDescriptions(array $spec): array
      {
          $methods = ['get', 'put', 'post', 'delete', 'options', 'head', 'patch', 'trace'];
          $missing = [];

          foreach ($spec['paths'] ?? [] as $path => $item) {
              foreach ($item as $method => $operation) {
                  if (! in_array($method, $methods, true)) {
                      continue;
                  }

                  foreach ($operation['responses'] ?? [] as $status => $response) {
                      if (isset($response['$ref'])) {
                          continue;
                      }

                      if (($response['description'] ?? '') === '') {
                          $missing[] = strtoupper($method) . ' ' . $path . ' ' . $status;
                      }
                  }
              }
          }

          return $missing;
      }
    hints:
      - Zwei verschachtelte foreach-Schleifen über paths und Methoden, eine dritte über responses.
      - "Achtung: PHP macht aus dem Array-Schlüssel '404' eine Zahl. Mit `. ' ' . $status` wird daraus wieder Text."
