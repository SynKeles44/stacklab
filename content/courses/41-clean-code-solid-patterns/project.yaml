  - id: testmodus-decorator
    title: Ein Testmodus als Decorator
    description: |
      Auf dem Testsystem dürfen keine echten Kund:innen Rechnungen bekommen. Statt `DateiVersender` mit einem
      `if` zu verunstalten, legst du einen **Decorator** darum:

      1. `src/UmleitenderVersender.php`: `final class UmleitenderVersender implements Versender` bekommt im
         Konstruktor einen anderen `Versender` und eine Test-Adresse. `sende()` ruft den inneren Versender
         mit der **Test-Adresse** statt des echten Empfängers auf – der Betrag bleibt gleich.
      2. `bin/rechnung.php`: Ist die Umgebungsvariable `RECHNUNG_TESTEMPFAENGER` gesetzt und nicht leer, wird
         der `DateiVersender` in einen `UmleitenderVersender` gewickelt.
      3. Probier es aus: `RECHNUNG_TESTEMPFAENGER=test@example.com php bin/rechnung.php fixtures/normal.json`
         und dann `tail -1 var/mails.log`.
      4. Tests grün? Committen. Schau dir zum Abschluss `git log --oneline` an – das ist die Geschichte deines
         Refactorings.
    checklist:
      - Decorator UmleitenderVersender
      - Testmodus über eine Umgebungsvariable
      - DateiVersender unverändert
      - Tests grün und committet
    hints:
      - "Der Decorator speichert den inneren Versender: `public function __construct(private Versender $innerer, private string $testEmpfaenger) {}`."
