    solve: |
      cat > src/UngueltigeMenge.php <<'PHP'
      <?php

      declare(strict_types=1);

      final class UngueltigeMenge extends InvalidArgumentException
      {
      }
      PHP
      cat > src/rechnung.php <<'PHP'
      <?php

      declare(strict_types=1);

      const MEHRWERTSTEUER_SATZ = 0.19;
      const STAMMKUNDEN_RABATT = 0.05;
      const FIRMEN_RABATT_GROSS = 0.10;
      const FIRMEN_RABATT_KLEIN = 0.03;
      const FIRMEN_SCHWELLE_CENT = 50000;

      function nettoSumme(array $positionen): int
      {
          $summe = 0;
          foreach ($positionen as $position) {
              if ($position['m'] <= 0) {
                  throw new UngueltigeMenge(sprintf(
                      'Menge für "%s" muss größer als 0 sein, ist %d.',
                      $position['name'],
                      $position['m'],
                  ));
              }
              $summe += $position['p'] * $position['m'];
          }

          return $summe;
      }

      function rabattAbziehen(string $kundentyp, int $netto): int
      {
          $satz = match (true) {
              $kundentyp === 'stamm' => STAMMKUNDEN_RABATT,
              $kundentyp === 'firma' && $netto > FIRMEN_SCHWELLE_CENT => FIRMEN_RABATT_GROSS,
              $kundentyp === 'firma' => FIRMEN_RABATT_KLEIN,
              default => 0.0,
          };

          return (int) round($netto - $netto * $satz);
      }

      function formatiereBetrag(int $cent): string
      {
          return number_format($cent / 100, 2, ',', '.') . ' EUR';
      }

      function versendeRechnung(string $empfaenger, int $bruttoCent): void
      {
          file_put_contents(__DIR__ . '/../var/mails.log', $empfaenger . ': ' . $bruttoCent . "\n", FILE_APPEND);
      }

      function rechnungErstellen(array $bestellung): string
      {
          $netto = rabattAbziehen($bestellung['typ'], nettoSumme($bestellung['pos']));
          $steuer = (int) round($netto * MEHRWERTSTEUER_SATZ);
          $brutto = $netto + $steuer;
          versendeRechnung($bestellung['email'], $brutto);

          return 'Netto:  ' . formatiereBetrag($netto) . "\n"
              . 'MwSt:   ' . formatiereBetrag($steuer) . "\n"
              . 'Brutto: ' . formatiereBetrag($brutto) . "\n";
      }
      PHP
      cat > bin/rechnung.php <<'PHP'
      <?php

      declare(strict_types=1);

      require __DIR__ . '/../src/autoload.php';

      $bestellung = json_decode((string) file_get_contents($argv[1]), true);

      try {
          echo rechnungErstellen($bestellung);
      } catch (UngueltigeMenge $fehler) {
          echo "FEHLER\n";
          fwrite(STDERR, $fehler->getMessage() . "\n");
          exit(1);
      }
      PHP
      bash tests/run.sh
      git add -A
      git commit -q -m "refactor: signal invalid quantity with an exception"

