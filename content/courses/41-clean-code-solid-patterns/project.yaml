title: Die Rechnungs-App aufräumen
description: |
  Du übernimmst eine kleine PHP-Anwendung, die aus einer Bestellung (JSON) eine Rechnung berechnet und den
  Betrag „per Mail verschickt“ (sie schreibt ihn in eine Log-Datei). Sie funktioniert – aber der Code ist ein
  Paradebeispiel für alles, was dieser Kurs anspricht: kryptische Namen, magische Zahlen, eine einzige lange
  Funktion, ein Fehler als Rückgabe-String, ein verschachteltes `if` für Rabatte und ein fest eingebauter
  Dateizugriff.

  Du räumst die App **Schritt für Schritt** auf, genau wie im echten Projekt: Erst baust du ein
  Sicherheitsnetz aus Golden-Master-Tests, dann refactorst du in kleinen Schritten. Nach **jedem** Schritt
  laufen die Tests grün, und du committest. Am Ende hast du eine Git-Historie, die die Verwandlung erzählt.

  Arbeite im Übungs-Terminal im Ordner `rechnungs-app`. Klicke zuerst auf **Projekt vorbereiten** – dann liegt
  die App mit Tests und einem ersten Commit bereit. Die Tests startest du jederzeit mit `bash tests/run.sh`.
goal: >
  Eine Rechnungs-App mit sprechenden Namen, kleinen Funktionen, einer eigenen Exception, austauschbaren
  Rabattregeln (Strategy + Factory), einem per Dependency Injection übergebenen Versender und einem Decorator
  für den Testmodus – abgesichert durch Golden-Master-Tests und mit einem Commit pro Refactoring-Schritt.
workdir: rechnungs-app
setup: |
  git init -q -b main
  git config user.name "Stacklab"
  git config user.email "stacklab@example.com"
  mkdir -p bin src tests fixtures var
  printf 'var/*.log\n' > .gitignore

  cat > src/autoload.php <<'PHP'
  <?php

  declare(strict_types=1);

  spl_autoload_register(function (string $klasse): void {
      $datei = __DIR__ . '/' . $klasse . '.php';
      if (is_file($datei)) {
          require $datei;
      }
  });

  require_once __DIR__ . '/rechnung.php';
  PHP

  cat > src/rechnung.php <<'PHP'
  <?php

  // Rechnung berechnen
  function calc($d)
  {
      $s = 0;
      // Positionen durchgehen
      foreach ($d['pos'] as $p) {
          if ($p['m'] <= 0) {
              return "FEHLER\n";
          }
          $s = $s + $p['p'] * $p['m'];
      }
      // Rabatt
      if ($d['typ'] == 'stamm') {
          $s = $s - $s * 0.05;
      } else {
          if ($d['typ'] == 'firma') {
              if ($s > 50000) {
                  $s = $s - $s * 0.1;
              } else {
                  $s = $s - $s * 0.03;
              }
          }
      }
      $s = (int) round($s);
      $t = (int) round($s * 0.19);
      $out = "Netto:  " . number_format($s / 100, 2, ',', '.') . " EUR\n";
      $out .= "MwSt:   " . number_format($t / 100, 2, ',', '.') . " EUR\n";
      $out .= "Brutto: " . number_format(($s + $t) / 100, 2, ',', '.') . " EUR\n";
      // Mail
      $f = fopen(__DIR__ . '/../var/mails.log', 'a');
      fwrite($f, $d['email'] . ': ' . ($s + $t) . "\n");
      fclose($f);
      return $out;
  }
  PHP

  cat > bin/rechnung.php <<'PHP'
  <?php

  require __DIR__ . '/../src/autoload.php';

  $d = json_decode(file_get_contents($argv[1]), true);
  echo calc($d);
  PHP

  cat > tests/run.sh <<'SH'
  #!/usr/bin/env bash
  # Golden Master: Die Ausgabe jeder Bestellung in fixtures/ muss der freigegebenen .txt-Datei entsprechen.
  set -u
  cd "$(dirname "$0")/.."
  fehler=0
  for bestellung in fixtures/*.json; do
    erwartet="${bestellung%.json}.txt"
    if [ ! -f "$erwartet" ]; then
      echo "FEHLT $erwartet (freigegebene Ausgabe fehlt)"
      fehler=1
      continue
    fi
    if diff -u "$erwartet" <(php bin/rechnung.php "$bestellung" 2>/dev/null) > /dev/null; then
      echo "GRÜN  $bestellung"
    else
      echo "ROT   $bestellung"
      diff -u "$erwartet" <(php bin/rechnung.php "$bestellung" 2>/dev/null)
      fehler=1
    fi
  done
  exit "$fehler"
  SH

  printf '%s\n' '{"typ": "normal", "email": "ada@example.com", "pos": [{"name": "Kaffee", "p": 350, "m": 2}, {"name": "Croissant", "p": 280, "m": 1}]}' > fixtures/normal.json
  printf '%s\n' '{"typ": "stamm", "email": "grace@example.com", "pos": [{"name": "Tee", "p": 300, "m": 4}]}' > fixtures/stamm.json
  printf '%s\n' '{"typ": "firma", "email": "einkauf@example.com", "pos": [{"name": "Druckerpapier", "p": 2000, "m": 10}]}' > fixtures/firma-klein.json
  printf '%s\n' '{"typ": "normal", "email": "linus@example.com", "pos": [{"name": "Kaffee", "p": 350, "m": 0}]}' > fixtures/fehler.json

  for bestellung in fixtures/*.json; do
    php bin/rechnung.php "$bestellung" > "${bestellung%.json}.txt"
  done
  rm -f var/mails.log

  git add -A
  git commit -q -m "chore: import legacy invoice app"
steps:
  - id: sicherheitsnetz
    title: Das Sicherheitsnetz spannen
    description: |
      Bevor du auch nur eine Zeile umbaust, brauchst du Tests. Die App hat schon einen **Golden Master**:
      `tests/run.sh` schickt jede Bestellung aus `fixtures/` durch die App und vergleicht die Ausgabe mit der
      freigegebenen Datei daneben (`normal.json` → `normal.txt`).

      Schau dir den Code an (`cat src/rechnung.php`) und vergleiche ihn mit den Fixtures. Ein Zweig ist noch
      **nicht** abgedeckt: der große Firmenrabatt (über 500 Euro netto gibt es 10 % statt 3 %).

      1. Starte die Tests: `bash tests/run.sh` – alles muss grün sein.
      2. Lege `fixtures/firma-gross.json` an: Kundentyp `firma`, Nettosumme **über 50000 Cent**.
      3. Gib die aktuelle Ausgabe frei: `php bin/rechnung.php fixtures/firma-gross.json > fixtures/firma-gross.txt`.
      4. Prüfe, dass die Tests grün sind, und committe (z. B. `test: cover large business discount`).
    checklist:
      - Tests laufen grün
      - Neue Fixture für Firmen über 500 Euro
      - Freigegebene Ausgabe daneben gespeichert
      - Schritt committet
    hints:
      - "Kopiere eine vorhandene Fixture als Vorlage: `cat fixtures/firma-klein.json`."
      - "Damit die Summe über 50000 Cent liegt, reichen z. B. 4 Positionen à 15000 Cent: `{\"name\": \"Monitor\", \"p\": 15000, \"m\": 4}`."
      - "Am Ende: `bash tests/run.sh && git add -A && git commit -m \"test: cover large business discount\"`."
    checks:
      - type: command
        run: bash tests/run.sh
        message: Die Tests sind nicht grün. Starte `bash tests/run.sh` und lies die Ausgabe – fehlt eine .txt-Datei?
      - type: command
        run: |-
          for f in fixtures/*.json; do jq -r 'select(.typ == "firma") | [.pos[] | .p * .m] | add' "$f"; done | awk '$1 > 50000' | wc -l
        stdout_matches: "^\\s*[1-9][0-9]*\\s*$"
        message: Es fehlt noch eine Fixture mit typ "firma" und einer Nettosumme über 50000 Cent.
      - type: command
        run: git status --porcelain
        stdout_equals: ""
        message: Es gibt noch nicht committete Änderungen. Committe deinen Schritt mit git add -A und git commit.
    solution: |
      ```bash
      cd rechnungs-app
      bash tests/run.sh
      cat > fixtures/firma-gross.json <<'JSON'
      {"typ": "firma", "email": "einkauf@example.com", "pos": [{"name": "Monitor", "p": 15000, "m": 4}]}
      JSON
      php bin/rechnung.php fixtures/firma-gross.json > fixtures/firma-gross.txt
      cat fixtures/firma-gross.txt
      bash tests/run.sh
      git add -A
      git commit -m "test: cover large business discount"
      ```

      Wichtig: Du gibst hier das **aktuelle** Verhalten frei, nicht das, was du für richtig hältst. Ein
      Golden Master dokumentiert, was der Code heute tut.
    solve: |
      printf '%s\n' '{"typ": "firma", "email": "einkauf@example.com", "pos": [{"name": "Monitor", "p": 15000, "m": 4}]}' > fixtures/firma-gross.json
      php bin/rechnung.php fixtures/firma-gross.json > fixtures/firma-gross.txt
      rm -f var/mails.log
      bash tests/run.sh
      git add -A
      git commit -q -m "test: cover large business discount"

  - id: namen-und-konstanten
    title: Sprechende Namen und benannte Konstanten
    description: |
      Jetzt der erste, risikoarme Umbau: Namen. Ändere **nur** Namen und Zahlen, nicht die Logik.

      1. Benenne `calc` in `rechnungErstellen` um und passe den Aufruf in `bin/rechnung.php` an. Gib dem
         Parameter einen Typ: `array $bestellung`.
      2. Ersetze die Ein-Buchstaben-Variablen `$d`, `$s`, `$t`, `$p`, `$f` durch sprechende Namen wie
         `$bestellung`, `$netto`, `$steuer`, `$position`.
      3. Ersetze die magischen Zahlen durch Konstanten am Dateianfang, mindestens
         `const MEHRWERTSTEUER_SATZ = 0.19;`. Für die Rabatte bieten sich `STAMMKUNDEN_RABATT`,
         `FIRMEN_RABATT_GROSS`, `FIRMEN_RABATT_KLEIN` und `FIRMEN_SCHWELLE_CENT` an.
      4. Lösche die Kommentare, die nur wiederholen, was der Code tut.
      5. Tests grün? Dann committen (z. B. `refactor: rename invoice variables and extract constants`).
    checklist:
      - Funktion heißt rechnungErstellen
      - Keine Ein-Buchstaben-Variablen mehr
      - 0.19 steht nur noch in einer Konstante
      - Tests grün und committet
    hints:
      - "Benenne immer **eine** Sache um, starte die Tests, dann die nächste. So weißt du bei Rot sofort, was es war."
      - "Konstanten außerhalb einer Klasse schreibst du mit `const NAME = wert;` direkt unter `<?php`."
      - "Das verschachtelte `if/else { if }` darf zu `if … elseif …` werden – das ändert keine Logik."
    checks:
      - type: command
        run: bash tests/run.sh
        message: Die Tests sind rot – ein Umbenennen hat das Verhalten verändert oder ein Aufruf zeigt noch auf calc.
      - type: command
        run: |-
          php -r 'require "src/autoload.php"; echo (function_exists("rechnungErstellen") && !function_exists("calc")) ? "ok" : "fehlt";'
        stdout_equals: ok
        message: Die Funktion soll rechnungErstellen heißen, und calc soll es nicht mehr geben.
      - type: command
        run: |-
          php -r 'require "src/autoload.php"; echo defined("MEHRWERTSTEUER_SATZ") ? var_export(MEHRWERTSTEUER_SATZ, true) : "fehlt";'
        stdout_equals: "0.19"
        message: Lege die Konstante MEHRWERTSTEUER_SATZ mit dem Wert 0.19 an.
      - type: command
        run: grep -cE '\$(s|t|d|p|f)\b' src/rechnung.php || true
        stdout_equals: "0"
        message: In src/rechnung.php stehen noch Ein-Buchstaben-Variablen wie $s, $t oder $d.
      - type: command
        run: grep -c '0\.19' src/rechnung.php || true
        stdout_equals: "1"
        message: Die Zahl 0.19 soll genau einmal vorkommen – in der Konstante MEHRWERTSTEUER_SATZ.
      - type: command
        run: git status --porcelain
        stdout_equals: ""
        message: Es gibt noch nicht committete Änderungen. Committe deinen Schritt.
    solution: |
      ```php title="src/rechnung.php"
      <?php

      declare(strict_types=1);

      const MEHRWERTSTEUER_SATZ = 0.19;
      const STAMMKUNDEN_RABATT = 0.05;
      const FIRMEN_RABATT_GROSS = 0.10;
      const FIRMEN_RABATT_KLEIN = 0.03;
      const FIRMEN_SCHWELLE_CENT = 50000;

      function rechnungErstellen(array $bestellung): string
      {
          $netto = 0;
          foreach ($bestellung['pos'] as $position) {
              if ($position['m'] <= 0) {
                  return "FEHLER\n";
              }
              $netto += $position['p'] * $position['m'];
          }

          if ($bestellung['typ'] === 'stamm') {
              $netto -= $netto * STAMMKUNDEN_RABATT;
          } elseif ($bestellung['typ'] === 'firma') {
              $netto -= $netto * ($netto > FIRMEN_SCHWELLE_CENT ? FIRMEN_RABATT_GROSS : FIRMEN_RABATT_KLEIN);
          }

          $netto = (int) round($netto);
          $steuer = (int) round($netto * MEHRWERTSTEUER_SATZ);
          $brutto = $netto + $steuer;

          $ausgabe = 'Netto:  ' . number_format($netto / 100, 2, ',', '.') . " EUR\n";
          $ausgabe .= 'MwSt:   ' . number_format($steuer / 100, 2, ',', '.') . " EUR\n";
          $ausgabe .= 'Brutto: ' . number_format($brutto / 100, 2, ',', '.') . " EUR\n";

          $protokoll = fopen(__DIR__ . '/../var/mails.log', 'a');
          fwrite($protokoll, $bestellung['email'] . ': ' . $brutto . "\n");
          fclose($protokoll);

          return $ausgabe;
      }
      ```

      In `bin/rechnung.php` wird aus `echo calc($d);` dann `echo rechnungErstellen($bestellung);`. Danach
      `bash tests/run.sh`, `git add -A` und `git commit -m "refactor: rename invoice variables and extract constants"`.
    solve: |
      cat > src/rechnung.php <<'PHP'
      <?php

