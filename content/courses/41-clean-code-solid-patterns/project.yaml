      bash tests/run.sh
      git add -A
      git commit -q -m "refactor: rename invoice variables and extract constants"

  - id: funktionen-zerlegen
    title: Die lange Funktion zerlegen
    description: |
      `rechnungErstellen` macht noch fünf Dinge auf einmal. Zieh jede Aufgabe in eine eigene, kleine Funktion
      (Refactoring **Extract Function**). Die Signaturen sind vorgegeben, damit die Prüfung sie findet:

      1. `nettoSumme(array $positionen): ?int` – Summe aus Preis × Menge; bei einer Menge ≤ 0 vorerst `null`.
      2. `rabattAbziehen(string $kundentyp, int $netto): int` – Netto nach Rabatt, gerundet.
      3. `formatiereBetrag(int $cent): string` – z. B. `123456` → `1.234,56 EUR`.
      4. `versendeRechnung(string $empfaenger, int $bruttoCent): void` – schreibt die Log-Zeile.
      5. `rechnungErstellen` ruft nur noch diese Funktionen auf und liest sich wie eine Inhaltsangabe.

      Zieh eine Funktion nach der anderen heraus und starte nach jeder die Tests. Zum Schluss committen.
    checklist:
      - Vier neue, kleine Funktionen
      - rechnungErstellen liest sich wie eine Inhaltsangabe
      - Tests grün und committet
    hints:
      - "Beginne mit `formatiereBetrag` – die Zeile kommt dreimal vor, das ist die einfachste Extraktion."
      - "Für den Rabatt passt ein `match (true) { … }`, das den Satz wählt; danach `return (int) round($netto - $netto * $satz);`."
      - "In `rechnungErstellen`: `$summe = nettoSumme($bestellung['pos']); if ($summe === null) { return \"FEHLER\\n\"; }`."
    checks:
      - type: command
        run: bash tests/run.sh
        message: Die Tests sind rot – eine Extraktion hat das Verhalten verändert. Vergleiche die Ausgabe im Diff.
      - type: command
        run: |-
          php -r 'require "src/autoload.php"; echo nettoSumme([["p" => 350, "m" => 2], ["p" => 280, "m" => 1]]), "|", formatiereBetrag(123456), "|", formatiereBetrag(5);'
        stdout_equals: "980|1.234,56 EUR|0,05 EUR"
        message: nettoSumme oder formatiereBetrag fehlt oder liefert ein falsches Ergebnis (erwartet z. B. 1.234,56 EUR).
      - type: command
        run: |-
          php -r 'require "src/autoload.php"; echo rabattAbziehen("stamm", 1200), "|", rabattAbziehen("firma", 60000), "|", rabattAbziehen("firma", 20000), "|", rabattAbziehen("normal", 980);'
        stdout_equals: "1140|54000|19400|980"
        message: rabattAbziehen(string $kundentyp, int $netto) fehlt oder rechnet anders als vorher.
      - type: command
        run: |-
          php -r 'require "src/autoload.php"; echo function_exists("versendeRechnung") ? "ok" : "fehlt";'
        stdout_equals: ok
        message: Es fehlt die Funktion versendeRechnung(string $empfaenger, int $bruttoCent).
      - type: command
        run: git status --porcelain
        stdout_equals: ""
        message: Es gibt noch nicht committete Änderungen. Committe deinen Schritt.
    solution: |
      ```php title="src/rechnung.php (Ausschnitt)"
      function nettoSumme(array $positionen): ?int
      {
          $summe = 0;
          foreach ($positionen as $position) {
              if ($position['m'] <= 0) {
                  return null;
              }
              $summe += $position['p'] * $position['m'];
          }

          return $summe;
      }

      function rabattAbziehen(string $kundentyp, int $netto): int
      {
          $satz = match (true) {
              $kundentyp === 'stamm' => STAMMKUNDEN_RABATT,
              $kundentyp === 'firma' && $netto > FIRMEN_SCHWELLE_CENT => FIRMEN_RABATT_GROSS,
              $kundentyp === 'firma' => FIRMEN_RABATT_KLEIN,
              default => 0.0,
          };

          return (int) round($netto - $netto * $satz);
      }

      function formatiereBetrag(int $cent): string
      {
          return number_format($cent / 100, 2, ',', '.') . ' EUR';
      }

      function versendeRechnung(string $empfaenger, int $bruttoCent): void
      {
          file_put_contents(__DIR__ . '/../var/mails.log', $empfaenger . ': ' . $bruttoCent . "\n", FILE_APPEND);
      }

      function rechnungErstellen(array $bestellung): string
      {
          $summe = nettoSumme($bestellung['pos']);
          if ($summe === null) {
              return "FEHLER\n";
          }

          $netto = rabattAbziehen($bestellung['typ'], $summe);
          $steuer = (int) round($netto * MEHRWERTSTEUER_SATZ);
          $brutto = $netto + $steuer;
          versendeRechnung($bestellung['email'], $brutto);

          return 'Netto:  ' . formatiereBetrag($netto) . "\n"
              . 'MwSt:   ' . formatiereBetrag($steuer) . "\n"
              . 'Brutto: ' . formatiereBetrag($brutto) . "\n";
      }
      ```

      Dann `bash tests/run.sh` und `git commit -am "refactor: extract invoice helper functions"`.
    solve: |
      cat > src/rechnung.php <<'PHP'
      <?php

      declare(strict_types=1);

      const MEHRWERTSTEUER_SATZ = 0.19;
      const STAMMKUNDEN_RABATT = 0.05;
      const FIRMEN_RABATT_GROSS = 0.10;
      const FIRMEN_RABATT_KLEIN = 0.03;
      const FIRMEN_SCHWELLE_CENT = 50000;

      function nettoSumme(array $positionen): ?int
      {
          $summe = 0;
          foreach ($positionen as $position) {
              if ($position['m'] <= 0) {
                  return null;
              }
              $summe += $position['p'] * $position['m'];
          }

          return $summe;
      }

      function rabattAbziehen(string $kundentyp, int $netto): int
      {
          $satz = match (true) {
              $kundentyp === 'stamm' => STAMMKUNDEN_RABATT,
              $kundentyp === 'firma' && $netto > FIRMEN_SCHWELLE_CENT => FIRMEN_RABATT_GROSS,
              $kundentyp === 'firma' => FIRMEN_RABATT_KLEIN,
              default => 0.0,
          };

          return (int) round($netto - $netto * $satz);
      }

      function formatiereBetrag(int $cent): string
      {
          return number_format($cent / 100, 2, ',', '.') . ' EUR';
      }

      function versendeRechnung(string $empfaenger, int $bruttoCent): void
      {
          file_put_contents(__DIR__ . '/../var/mails.log', $empfaenger . ': ' . $bruttoCent . "\n", FILE_APPEND);
      }

      function rechnungErstellen(array $bestellung): string
      {
          $summe = nettoSumme($bestellung['pos']);
          if ($summe === null) {
              return "FEHLER\n";
          }

          $netto = rabattAbziehen($bestellung['typ'], $summe);
          $steuer = (int) round($netto * MEHRWERTSTEUER_SATZ);
          $brutto = $netto + $steuer;
          versendeRechnung($bestellung['email'], $brutto);

          return 'Netto:  ' . formatiereBetrag($netto) . "\n"
              . 'MwSt:   ' . formatiereBetrag($steuer) . "\n"
              . 'Brutto: ' . formatiereBetrag($brutto) . "\n";
      }
      PHP
      bash tests/run.sh
      git add -A
      git commit -q -m "refactor: extract invoice helper functions"

  - id: fehlerbehandlung
    title: Fehler als Exception statt als Rückgabewert
    description: |
      `nettoSumme` meldet eine ungültige Menge mit `null`, und `rechnungErstellen` übersetzt das in den
      String `"FEHLER"`. Jeder Aufrufer muss daran denken, das zu prüfen. Ersetze das durch eine eigene
      Exception:

      1. Lege `src/UngueltigeMenge.php` an: `final class UngueltigeMenge extends InvalidArgumentException {}`.
         Der Autoloader findet sie automatisch über den Dateinamen.
      2. `nettoSumme(array $positionen): int` wirft bei einer Menge ≤ 0 eine `UngueltigeMenge` mit einer
         hilfreichen Nachricht (welches Produkt, welche Menge).
      3. `rechnungErstellen` enthält keine Fehlerprüfung mehr.
