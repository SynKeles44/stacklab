      Beachte: `RechnungsService` und `DateiVersender` hast du dafür **nicht** angefasst. Neues Verhalten kam
      durch eine neue Klasse dazu – das ist das Open-Closed-Prinzip in Aktion.
    solve: |
      cat > src/UmleitenderVersender.php <<'PHP'
      <?php

      declare(strict_types=1);

      final class UmleitenderVersender implements Versender
      {
          public function __construct(
              private Versender $innerer,
              private string $testEmpfaenger,
          ) {
          }

          public function sende(string $empfaenger, int $bruttoCent): void
          {
              $this->innerer->sende($this->testEmpfaenger, $bruttoCent);
          }
      }
      PHP
      cat > bin/rechnung.php <<'PHP'
      <?php

      declare(strict_types=1);

      require __DIR__ . '/../src/autoload.php';

      $bestellung = json_decode((string) file_get_contents($argv[1]), true);

      $versender = new DateiVersender(__DIR__ . '/../var/mails.log');
      $testEmpfaenger = getenv('RECHNUNG_TESTEMPFAENGER');
      if (is_string($testEmpfaenger) && $testEmpfaenger !== '') {
          $versender = new UmleitenderVersender($versender, $testEmpfaenger);
      }
      $service = new RechnungsService($versender);

      try {
          echo $service->erstelle($bestellung);
      } catch (UngueltigeMenge $fehler) {
          echo "FEHLER\n";
          fwrite(STDERR, $fehler->getMessage() . "\n");
          exit(1);
      }
      PHP
      bash tests/run.sh
      git add -A
      git commit -q -m "feat: redirect invoices to a test recipient"
