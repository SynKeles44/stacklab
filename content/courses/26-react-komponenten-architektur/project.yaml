      1. Schreibe `src/components/atoms/button.test.jsx` mit mindestens **zwei** Tests (z. B. `onClick` wird
         aufgerufen, eine übergebene Klasse gewinnt).
      2. Schreibe `src/components/molecules/tabs.test.jsx` mit mindestens **zwei** Tests (z. B. Standard-Panel,
         Wechsel per Klick, kontrollierter Modus).
      3. Nutze `getByRole` und `userEvent`. Starte alles mit `npm test` – alle Tests müssen grün sein.
    checklist:
