  - id: tabs-compound
    title: Tabs als Compound Component
    description: |
      Das Herzstück: Tabs, deren Teile sich über Context verständigen und die kontrolliert **und**
      unkontrolliert funktionieren.

      1. Schreibe `src/lib/use-controllable-state.js` und exportiere
         `useControllableState(value, defaultValue, onChange)` wie in Modul 3.
      2. Schreibe `src/components/molecules/tabs.jsx` und exportiere `Tabs`, `TabsList`, `TabsTrigger` und
         `TabsContent`:
         - `Tabs` nimmt `value`, `defaultValue`, `onValueChange` und `children`, nutzt `useControllableState`
           und stellt `{ value, setValue }` über einen privaten Context bereit. Element: `<div data-slot="tabs">`.
         - `TabsList`: `<div role="tablist" data-slot="tabs-list">`.
         - `TabsTrigger` (`value`): `<button role="tab" data-slot="tabs-trigger">` mit `aria-selected`, Klick
           setzt den Wert.
         - `TabsContent` (`value`): `<div role="tabpanel" data-slot="tabs-content">`, nur wenn aktiv.
         - Ein Hook `useTabs()` wirft einen Fehler, wenn ein Teil außerhalb von `Tabs` steht.
    checklist:
      - "`useControllableState` in eigener Datei"
      - Vier Teile in einer Datei, Context nicht exportiert
      - Kontrollierter und unkontrollierter Modus funktionieren
    hints:
      - "Context anlegen: `const TabsContext = createContext(null)` mit `import { createContext, useContext, useState } from 'react'`."
      - "In `Tabs`: `const [aktiv, setAktiv] = useControllableState(value, defaultValue, onValueChange)` und `<TabsContext value={{ value: aktiv, setValue: setAktiv }}>`."
      - "Im unkontrollierten Modus speichert `setze` den Wert selbst, im kontrollierten ruft es nur `onChange` auf."
    checks:
      - type: file_exists
        path: src/lib/use-controllable-state.js
        message: Die Datei src/lib/use-controllable-state.js fehlt noch.
      - type: file_exists
        path: src/components/molecules/tabs.jsx
        message: Die Datei src/components/molecules/tabs.jsx fehlt noch.
      - type: command
        run: |
          d=$(mktemp -d "$PWD/pruefung-XXXXXX")
          cat > "$d/tabs.test.jsx" <<'EOF'
          import { useState } from 'react'
          import { render, screen } from '@testing-library/react'
          import userEvent from '@testing-library/user-event'
          import { Tabs, TabsList, TabsTrigger, TabsContent } from '../src/components/molecules/tabs.jsx'

          function Teile() {
            return (
              <>
                <TabsList>
                  <TabsTrigger value="a">Alpha</TabsTrigger>
                  <TabsTrigger value="b">Beta</TabsTrigger>
                </TabsList>
                <TabsContent value="a">Inhalt A</TabsContent>
                <TabsContent value="b">Inhalt B</TabsContent>
              </>
            )
          }

          test('unkontrolliert', async () => {
            const meldung = vi.fn()
            const { container } = render(<Tabs defaultValue="a" onValueChange={meldung}><Teile /></Tabs>)
            expect(container.querySelector('[data-slot="tabs"]')).not.toBeNull()
            expect(screen.getByRole('tablist').getAttribute('data-slot')).toBe('tabs-list')
            expect(screen.getByRole('tabpanel').textContent).toBe('Inhalt A')
            await userEvent.click(screen.getByRole('tab', { name: 'Beta' }))
            expect(screen.getByRole('tabpanel').textContent).toBe('Inhalt B')
            expect(screen.getByRole('tab', { name: 'Beta' }).getAttribute('aria-selected')).toBe('true')
            expect(meldung).toHaveBeenCalledWith('b')
          })

          test('kontrolliert ohne Handler bleibt stehen', async () => {
            render(<Tabs value="a"><Teile /></Tabs>)
            await userEvent.click(screen.getByRole('tab', { name: 'Beta' }))
            expect(screen.getByRole('tabpanel').textContent).toBe('Inhalt A')
          })

          test('kontrolliert mit State der Eltern', async () => {
            function Eltern() {
              const [tab, setTab] = useState('b')
              return (
                <>
                  <button onClick={() => setTab('a')}>Zurück</button>
                  <Tabs value={tab} onValueChange={setTab}><Teile /></Tabs>
                </>
              )
            }
            render(<Eltern />)
            expect(screen.getByRole('tabpanel').textContent).toBe('Inhalt B')
            await userEvent.click(screen.getByRole('button', { name: 'Zurück' }))
            expect(screen.getByRole('tabpanel').textContent).toBe('Inhalt A')
            await userEvent.click(screen.getByRole('tab', { name: 'Beta' }))
            expect(screen.getByRole('tabpanel').getAttribute('data-slot')).toBe('tabs-content')
            expect(screen.getByRole('tabpanel').textContent).toBe('Inhalt B')
          })

          test('Teile außerhalb von Tabs werfen einen Fehler', () => {
            const stumm = vi.spyOn(console, 'error').mockImplementation(() => {})
            expect(() => render(<TabsTrigger value="x">X</TabsTrigger>)).toThrow()
            stumm.mockRestore()
          })
          EOF
          npx vitest run "$d" --reporter=json --outputFile="$d/ergebnis.json" >/dev/null 2>&1 || true
          jq -r '"\(.numPassedTests) \(.numFailedTests + .numFailedTestSuites)"' "$d/ergebnis.json" 2>/dev/null || echo "kein Ergebnis"
          rm -rf "$d"
        stdout_matches: "^4 0\\s*$"
        message: Die Tabs bestehen die Prüftests noch nicht. Prüfe Rollen, data-slot-Werte, aria-selected, beide Modi (value/defaultValue/onValueChange) und den Fehler in useTabs().
    solution: |
      ```js
      // src/lib/use-controllable-state.js
      import { useState } from 'react'

      export function useControllableState(value, defaultValue, onChange) {
        const [intern, setIntern] = useState(defaultValue)
        const kontrolliert = value !== undefined
        const aktuell = kontrolliert ? value : intern
        const setze = (neu) => {
          if (!kontrolliert) setIntern(neu)
          onChange?.(neu)
        }
        return [aktuell, setze]
      }
      ```

      ```jsx
      // src/components/molecules/tabs.jsx
      import { createContext, useContext } from 'react'
      import { useControllableState } from '../../lib/use-controllable-state'

      const TabsContext = createContext(null)

      function useTabs() {
        const ctx = useContext(TabsContext)
        if (!ctx) throw new Error('Tabs-Teile müssen innerhalb von <Tabs> stehen.')
        return ctx
      }

      export function Tabs({ value, defaultValue, onValueChange, children }) {
        const [aktiv, setAktiv] = useControllableState(value, defaultValue, onValueChange)
        return (
          <TabsContext value={{ value: aktiv, setValue: setAktiv }}>
            <div data-slot="tabs">{children}</div>
