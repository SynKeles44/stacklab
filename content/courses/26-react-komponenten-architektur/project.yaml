title: Dein eigenes UI-Kit
description: |
  In diesem Projekt baust du eine kleine, aber echte Komponentenbibliothek – so, wie sie in einem Team
  entsteht. Du legst eine Atomic-Design-Struktur an, schreibst die Hilfsfunktion `cn()`, definierst
  Button-Varianten mit `cva`, baust eine Card aus Teil-Komponenten und Tabs als Compound Component, die
  kontrolliert und unkontrolliert funktionieren. Zum Schluss schreibst du Tests und Stories und räumst auf.

  Alles passiert im Ordner `ui-kit` in deinem Workspace. Klicke zuerst auf **Projekt vorbereiten**: Dann
  werden `package.json`, `vitest.config.js` und alle Pakete (React, Vitest, Testing Library, clsx,
  tailwind-merge, class-variance-authority) angelegt und installiert. Öffne danach das Übungs-Terminal und
  wechsle mit `cd ui-kit` hinein.

  Stacklab prüft deine Komponenten nach jedem Schritt mit eigenen, versteckten Tests. Halte dich deshalb
  genau an die Dateinamen, Exporte und `data-slot`-Werte aus der Beschreibung. Die Schritte bauen
  aufeinander auf – lösche nichts, was ein früherer Schritt angelegt hat.
goal: >
  Ein Projekt `ui-kit` mit Atomic-Design-Ordnern, `cn()`, einem Button mit cva-Varianten, einer Card aus
  Teil-Komponenten, Tabs als Compound Component mit kontrolliertem und unkontrolliertem Modus, eigenen
  Tests, Stories im CSF-Format und ohne Barrel-Dateien.
workdir: ui-kit
setup: |
  cat > package.json <<'EOF'
  {
    "name": "ui-kit",
    "private": true,
    "type": "module",
    "scripts": { "test": "vitest run" },
    "dependencies": {
      "class-variance-authority": "^0.7.1",
      "clsx": "^2.1.1",
      "tailwind-merge": "^3.7.0"
    },
    "devDependencies": {
      "@testing-library/dom": "^10.4.2",
      "@testing-library/react": "^16.3.3",
      "@testing-library/user-event": "^14.6.7",
      "happy-dom": "^20.14.6",
      "react": "^19.3.0",
      "react-dom": "^19.3.0",
      "vitest": "^5.0.3"
    }
  }
  EOF
  cat > vitest.config.js <<'EOF'
  import { defineConfig } from 'vitest/config'

  export default defineConfig({
    test: { environment: 'happy-dom', globals: true },
  })
  EOF
  npm install --no-audit --no-fund --silent
steps:
  - id: struktur-und-cn
    title: Ordnerstruktur und cn()
    description: |
      Jede Bibliothek beginnt mit einer klaren Struktur und der Hilfsfunktion für Klassen.

      1. Lege die Ordner `src/lib`, `src/components/atoms`, `src/components/molecules` und
         `src/components/organisms` an.
      2. Schreibe `src/lib/cn.js`. Sie exportiert `cn(...inputs)` und gibt `twMerge(clsx(inputs))` zurück.
      3. Probiere sie aus:
         `node --input-type=module -e 'import { cn } from "./src/lib/cn.js"; console.log(cn("px-4", "px-2"))'`
         muss `px-2` ausgeben.
    checklist:
      - Ordner für Atome, Moleküle und Organismen angelegt
      - "`src/lib/cn.js` exportiert `cn`"
      - "`cn` kombiniert clsx und tailwind-merge"
    hints:
      - "`mkdir -p src/lib src/components/atoms src/components/molecules src/components/organisms`"
      - "Importe: `import { clsx } from 'clsx'` und `import { twMerge } from 'tailwind-merge'`."
    checks:
      - type: dir_exists
        path: src/components/atoms
        message: Der Ordner src/components/atoms fehlt noch.
      - type: dir_exists
        path: src/components/molecules
        message: Der Ordner src/components/molecules fehlt noch.
      - type: dir_exists
        path: src/components/organisms
        message: Der Ordner src/components/organisms fehlt noch.
      - type: file_exists
        path: src/lib/cn.js
        message: Die Datei src/lib/cn.js fehlt noch.
      - type: command
        run: |
          node --input-type=module -e 'import { cn } from "./src/lib/cn.js"; console.log(cn("px-4 py-2", false, { "font-bold": true }, "px-2"))'
        stdout_matches: "^py-2 font-bold px-2\\s*$"
        message: "cn() liefert noch nicht das erwartete Ergebnis – sie soll twMerge(clsx(inputs)) zurückgeben."
    solution: |
      ```bash
      mkdir -p src/lib src/components/atoms src/components/molecules src/components/organisms
      cat > src/lib/cn.js <<'EOF'
      import { clsx } from 'clsx'
      import { twMerge } from 'tailwind-merge'

      export function cn(...inputs) {
        return twMerge(clsx(inputs))
      }
      EOF
      ```
    solve: |
      mkdir -p src/lib src/components/atoms src/components/molecules src/components/organisms
      cat > src/lib/cn.js <<'EOF'
      import { clsx } from 'clsx'
      import { twMerge } from 'tailwind-merge'

      export function cn(...inputs) {
        return twMerge(clsx(inputs))
      }
      EOF
  - id: button-varianten
    title: Button-Varianten mit cva
    description: |
      Lege die Varianten des Buttons als Tabelle an – in einer eigenen Datei, damit später auch Links sie
      nutzen können.

      Schreibe `src/components/atoms/button-variants.js` und exportiere `buttonVariants`, erstellt mit `cva`:

      | Teil | Klassen |
      |---|---|
      | Basis | `inline-flex items-center justify-center rounded-md text-sm font-medium` |
      | `variant: default` | `bg-blue-600 text-white hover:bg-blue-700` |
      | `variant: outline` | `border border-gray-300 bg-white` |
      | `variant: ghost` | `hover:bg-gray-100` |
      | `size: sm` | `h-8 px-3` |
      | `size: md` | `h-10 px-4` |
      | `size: lg` | `h-12 px-6` |

      Standard ist `default` und `md`.
    checklist:
      - "`buttonVariants` mit drei Varianten und drei Größen"
      - "`defaultVariants` gesetzt"
    hints:
      - "`import { cva } from 'class-variance-authority'`"
      - "Aufbau: `cva('basis', { variants: { variant: { … }, size: { … } }, defaultVariants: { variant: 'default', size: 'md' } })`."
    checks:
      - type: file_exists
        path: src/components/atoms/button-variants.js
        message: Die Datei src/components/atoms/button-variants.js fehlt noch.
      - type: command
        run: |
          node --input-type=module -e 'import { buttonVariants } from "./src/components/atoms/button-variants.js"; console.log(buttonVariants())'
        stdout_matches: "^inline-flex items-center justify-center rounded-md text-sm font-medium bg-blue-600 text-white hover:bg-blue-700 h-10 px-4\\s*$"
        message: buttonVariants() ohne Angaben liefert noch nicht Basis + default + md.
      - type: command
        run: |
          node --input-type=module -e 'import { buttonVariants } from "./src/components/atoms/button-variants.js"; console.log(buttonVariants({ variant: "outline", size: "lg" }))'
        stdout_matches: "border border-gray-300 bg-white h-12 px-6\\s*$"
        message: Die Variante outline oder die Größe lg stimmt noch nicht.
      - type: command
        run: |
          node --input-type=module -e 'import { buttonVariants } from "./src/components/atoms/button-variants.js"; console.log(buttonVariants({ variant: "ghost", size: "sm" }))'
        stdout_matches: "hover:bg-gray-100 h-8 px-3\\s*$"
        message: Die Variante ghost oder die Größe sm stimmt noch nicht.
    solution: |
      ```js
      // src/components/atoms/button-variants.js
      import { cva } from 'class-variance-authority'

      export const buttonVariants = cva('inline-flex items-center justify-center rounded-md text-sm font-medium', {
        variants: {
          variant: {
            default: 'bg-blue-600 text-white hover:bg-blue-700',
            outline: 'border border-gray-300 bg-white',
            ghost: 'hover:bg-gray-100',
          },
          size: {
            sm: 'h-8 px-3',
            md: 'h-10 px-4',
            lg: 'h-12 px-6',
          },
        },
        defaultVariants: { variant: 'default', size: 'md' },
      })
      ```
    solve: |
      cat > src/components/atoms/button-variants.js <<'EOF'
      import { cva } from 'class-variance-authority'

      export const buttonVariants = cva('inline-flex items-center justify-center rounded-md text-sm font-medium', {
        variants: {
          variant: {
            default: 'bg-blue-600 text-white hover:bg-blue-700',
            outline: 'border border-gray-300 bg-white',
            ghost: 'hover:bg-gray-100',
          },
          size: {
            sm: 'h-8 px-3',
            md: 'h-10 px-4',
            lg: 'h-12 px-6',
          },
        },
        defaultVariants: { variant: 'default', size: 'md' },
      })
      EOF
  - id: button-komponente
    title: Das Button-Atom
    description: |
      Jetzt bekommt der Button seine Props-API.

      Schreibe `src/components/atoms/button.jsx` und exportiere `Button`:

      1. Props: `variant`, `size`, `className` und alle übrigen Button-Attribute.
      2. Gerendert wird ein `<button data-slot="button">`.
      3. Die Klasse ist `cn(buttonVariants({ variant, size }), className)` – so gewinnt eine übergebene Klasse
         wie `px-2` gegen `px-4`.
      4. Alle übrigen Props (auch `onClick`, `type`, `disabled` und `ref`) werden durchgereicht.

      Importiere direkt aus den Dateien (`../../lib/cn`, `./button-variants`) – keine Barrel-Datei.
    checklist:
      - "`data-slot=\"button\"` gesetzt"
      - Varianten und übergebene Klasse mit `cn()` zusammengeführt
      - Alle übrigen Props durchgereicht
    hints:
      - "`export function Button({ variant, size, className, ...props }) { … }`"
      - "`className={cn(buttonVariants({ variant, size }), className)}` und danach `{...props}`."
    checks:
      - type: file_exists
        path: src/components/atoms/button.jsx
        message: Die Datei src/components/atoms/button.jsx fehlt noch.
      - type: command
        run: |
          d=$(mktemp -d "$PWD/pruefung-XXXXXX")
          cat > "$d/button.test.jsx" <<'EOF'
          import { render, screen } from '@testing-library/react'
          import userEvent from '@testing-library/user-event'
          import { Button } from '../src/components/atoms/button.jsx'

          test('data-slot und Standardvariante', () => {
            render(<Button>Speichern</Button>)
            const b = screen.getByRole('button', { name: 'Speichern' })
            expect(b.getAttribute('data-slot')).toBe('button')
            expect(b.className).toContain('bg-blue-600')
            expect(b.className).toContain('px-4')
          })

          test('Variante und className werden zusammengeführt', () => {
            render(<Button variant="outline" className="w-full px-2">X</Button>)
            const b = screen.getByRole('button', { name: 'X' })
            expect(b.className).toContain('border-gray-300')
            expect(b.className).toContain('w-full')
            expect(b.className).toContain('px-2')
            expect(b.className).not.toContain('px-4')
          })

          test('Props werden durchgereicht', async () => {
            const onClick = vi.fn()
            render(<Button type="submit" aria-label="Senden" onClick={onClick}>Los</Button>)
            const b = screen.getByRole('button', { name: 'Senden' })
            expect(b.getAttribute('type')).toBe('submit')
            await userEvent.click(b)
            expect(onClick).toHaveBeenCalledTimes(1)
          })
          EOF
          npx vitest run "$d" --reporter=json --outputFile="$d/ergebnis.json" >/dev/null 2>&1 || true
          jq -r '"\(.numPassedTests) \(.numFailedTests + .numFailedTestSuites)"' "$d/ergebnis.json" 2>/dev/null || echo "kein Ergebnis"
          rm -rf "$d"
        stdout_matches: "^3 0\\s*$"
        message: Der Button besteht die Prüftests noch nicht. Prüfe data-slot, cn(buttonVariants({ variant, size }), className) und das Durchreichen aller Props.
    solution: |
      ```jsx
      // src/components/atoms/button.jsx
      import { cn } from '../../lib/cn'
      import { buttonVariants } from './button-variants'

      export function Button({ variant, size, className, ...props }) {
        return (
          <button
            data-slot="button"
            className={cn(buttonVariants({ variant, size }), className)}
            {...props}
          />
        )
      }
      ```
    solve: |
      cat > src/components/atoms/button.jsx <<'EOF'
      import { cn } from '../../lib/cn'
      import { buttonVariants } from './button-variants'

      export function Button({ variant, size, className, ...props }) {
        return (
          <button
            data-slot="button"
            className={cn(buttonVariants({ variant, size }), className)}
            {...props}
          />
        )
      }
      EOF
  - id: card-teile
    title: Die Card aus Teil-Komponenten
    description: |
      Statt einer Card mit vielen Props baust du Teil-Komponenten, die sich frei kombinieren lassen.

      Schreibe `src/components/molecules/card.jsx` und exportiere aus **dieser einen Datei** `Card`,
      `CardHeader`, `CardTitle` und `CardContent`:

      | Komponente | Element | data-slot | Basisklassen |
      |---|---|---|---|
      | `Card` | `div` | `card` | `rounded-xl border bg-white` |
      | `CardHeader` | `div` | `card-header` | `grid gap-1 p-6` |
      | `CardTitle` | `h3` | `card-title` | `font-semibold` |
      | `CardContent` | `div` | `card-content` | `px-6 pb-6` |

      Jede Komponente führt ihre Basisklassen mit `cn()` und einer übergebenen `className` zusammen und reicht
      alle übrigen Props samt `children` durch.
    checklist:
      - Vier Teil-Komponenten in einer Datei
      - Jede mit eigenem data-slot und Basisklassen
      - "`className` mit `cn()` zusammengeführt"
    hints:
      - "Jede Komponente hat dieselbe Form: `export function Card({ className, ...props }) { return <div data-slot=\"card\" className={cn('…', className)} {...props} /> }`."
      - "Der Import lautet `import { cn } from '../../lib/cn'`."
    checks:
      - type: file_exists
        path: src/components/molecules/card.jsx
        message: Die Datei src/components/molecules/card.jsx fehlt noch.
      - type: command
        run: |
          d=$(mktemp -d "$PWD/pruefung-XXXXXX")
          cat > "$d/card.test.jsx" <<'EOF'
          import { render, screen } from '@testing-library/react'
          import { Card, CardHeader, CardTitle, CardContent } from '../src/components/molecules/card.jsx'

          test('Teile setzen data-slot und Inhalt', () => {
            const { container } = render(
              <Card className="shadow-sm" id="karte">
                <CardHeader>
                  <CardTitle>Bestellung</CardTitle>
                  <button>Menü</button>
                </CardHeader>
                <CardContent>3 Artikel</CardContent>
              </Card>,
            )
            const card = container.querySelector('[data-slot="card"]')
            expect(card.getAttribute('id')).toBe('karte')
            expect(card.className).toContain('rounded-xl')
            expect(card.className).toContain('shadow-sm')
            expect(container.querySelector('[data-slot="card-header"] button').textContent).toBe('Menü')
            expect(screen.getByRole('heading', { name: 'Bestellung' }).getAttribute('data-slot')).toBe('card-title')
            expect(container.querySelector('[data-slot="card-content"]').textContent).toBe('3 Artikel')
          })

          test('cn löst Konflikte zugunsten des Aufrufers', () => {
            const { container } = render(<CardContent className="px-2">X</CardContent>)
            const el = container.querySelector('[data-slot="card-content"]')
            expect(el.className).toContain('px-2')
            expect(el.className).not.toContain('px-6')
          })
          EOF
          npx vitest run "$d" --reporter=json --outputFile="$d/ergebnis.json" >/dev/null 2>&1 || true
          jq -r '"\(.numPassedTests) \(.numFailedTests + .numFailedTestSuites)"' "$d/ergebnis.json" 2>/dev/null || echo "kein Ergebnis"
          rm -rf "$d"
        stdout_matches: "^2 0\\s*$"
        message: Die Card besteht die Prüftests noch nicht. Prüfe die vier Exporte, die data-slot-Werte, CardTitle als h3 und cn() mit className.
    solution: |
      ```jsx
      // src/components/molecules/card.jsx
      import { cn } from '../../lib/cn'

      export function Card({ className, ...props }) {
        return <div data-slot="card" className={cn('rounded-xl border bg-white', className)} {...props} />
      }

      export function CardHeader({ className, ...props }) {
        return <div data-slot="card-header" className={cn('grid gap-1 p-6', className)} {...props} />
      }

      export function CardTitle({ className, ...props }) {
        return <h3 data-slot="card-title" className={cn('font-semibold', className)} {...props} />
      }

      export function CardContent({ className, ...props }) {
        return <div data-slot="card-content" className={cn('px-6 pb-6', className)} {...props} />
      }
      ```
    solve: |
      cat > src/components/molecules/card.jsx <<'EOF'
      import { cn } from '../../lib/cn'

      export function Card({ className, ...props }) {
        return <div data-slot="card" className={cn('rounded-xl border bg-white', className)} {...props} />
      }

      export function CardHeader({ className, ...props }) {
        return <div data-slot="card-header" className={cn('grid gap-1 p-6', className)} {...props} />
      }

      export function CardTitle({ className, ...props }) {
        return <h3 data-slot="card-title" className={cn('font-semibold', className)} {...props} />
      }

      export function CardContent({ className, ...props }) {
        return <div data-slot="card-content" className={cn('px-6 pb-6', className)} {...props} />
      }
