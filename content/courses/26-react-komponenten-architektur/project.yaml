      Das Projekt-Setup hat dir dabei absichtlich zwei Fallen gestellt, die du jetzt beseitigst – lege sie
      zuerst mit dem folgenden Befehl an (so sieht es in vielen gewachsenen Projekten aus):

      ```bash
      printf "export * from './atoms/button'\nexport * from './molecules/card'\n" > src/components/index.js
      cp src/components/molecules/card.jsx src/components/molecules/InfoCard.jsx
      ```

      1. Lösche die Barrel-Datei `src/components/index.js`.
      2. Die Kopie `InfoCard.jsx` ist doppelt **und** nicht in kebab-case – lösche sie.
      3. Prüfe, dass alle Dateinamen unter `src/` nur aus Kleinbuchstaben, Ziffern, Punkten und Bindestrichen
         bestehen: `find src -type f | grep -vE '^[a-z0-9/._-]+$'` darf nichts ausgeben.
      4. Lass zum Schluss `npm test` laufen – alles grün.
