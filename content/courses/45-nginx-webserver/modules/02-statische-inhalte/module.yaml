title: Statische Inhalte ausliefern
description: Wie nginx den passenden location-Block wählt, wie aus URLs Dateipfade werden und wie du Dateien mit sinnvollen Cache-Headern und Kompression auslieferst.
exercise:
  id: modul-uebung-website
  type: terminal
  title: Eine schnelle statische Website
  description: |
    Im Ordner `statische-website` liegt `site.conf` mit einem server-Block für `docs.example.com`.
    Die Website hat Vite-Assets mit Hash im Namen, Bilder ohne Hash und PDF-Handbücher, die auf der
    Platte in einem ganz anderen Ordner liegen. Ergänze den server-Block:

    1. `root /srv/docs/dist;` und `index index.html;`
    2. `location /` mit `try_files $uri $uri/ =404;` (es ist **keine** SPA)
    3. `location ^~ /assets/` mit `expires 1y;` und `add_header Cache-Control "public, immutable";`
       – `^~`, damit die Bilder-Regex unten diese Dateien nicht übernimmt.
    4. `location ~* \.(png|jpg|webp|svg)$` mit `expires 7d;`
    5. `location /handbuecher/` mit `alias /srv/pdf/;`
    6. `error_page 404 /404.html;`

    Prüfe mit `bash pruefe.sh site.conf`. Klicke zuerst auf **Aufgabe vorbereiten**.
  workdir: statische-website
  setup: |
    cat > pruefe.sh <<'PRUEFE'
    #!/usr/bin/env bash
    # Stacklab-Mini-Pruefung fuer nginx-Konfigurationen.
    # Ersetzt NICHT "nginx -t": Es findet nur Klammer- und Semikolonfehler.
    #   bash pruefe.sh datei.conf ...        Syntax pruefen
    #   bash pruefe.sh --baum datei.conf     jede Direktive mit ihrem Kontext zeigen
    modus=pruefen
    if [ "$1" = "--baum" ]; then modus=baum; shift; fi
    [ $# -eq 0 ] && set -- nginx.conf
    status=0
    for datei in "$@"; do
      if [ ! -f "$datei" ]; then echo "FEHLER: $datei gibt es nicht"; status=1; continue; fi
      awk -v modus="$modus" -v q="'" '
        { roh = $0; sub(/#.*/, ""); zeile = $0; sub(/[ \t]+$/, "", zeile)
          ende = substr(zeile, length(zeile), 1)
          if (zeile ~ /[^ \t]/ && index(";{}\"" q, ende) == 0) { print FILENAME ":" NR ": Semikolon fehlt -> " roh; fehler = 1 }
          rest = $0
          while (length(rest) > 0) {
            if (match(rest, /[{};]/) == 0) { puffer = puffer " " rest; break }
            teil = puffer " " substr(rest, 1, RSTART - 1); zeichen = substr(rest, RSTART, 1)
            rest = substr(rest, RSTART + 1); puffer = ""
            gsub(/^[ \t]+|[ \t]+$/, "", teil); gsub(/[ \t]+/, " ", teil)
            if (zeichen == "{") { stapel[++tiefe] = teil }
            else if (zeichen == "}") { tiefe--; if (tiefe < 0) { print FILENAME ":" NR ": } ohne passende {"; fehler = 1; tiefe = 0 } }
            else if (teil != "" && modus == "baum") { pfad = ""; for (i = 1; i <= tiefe; i++) pfad = pfad stapel[i] " > "; print pfad teil }
          } }
        END { if (tiefe > 0) { print FILENAME ": " tiefe " Block/Bloecke nicht mit } geschlossen"; fehler = 1 }
              if (modus == "pruefen" && !fehler) print FILENAME ": Syntax sieht gut aus (Stacklab-Mini-Pruefung)"
              exit fehler }' "$datei" || status=1
    done
    exit $status
    PRUEFE
    cat > site.conf <<'EOF'
    server {
        listen 80;
        server_name docs.example.com;

    }
    EOF
  checks:
    - type: command
      run: bash pruefe.sh site.conf
      message: site.conf hat noch Syntaxfehler. Führe bash pruefe.sh site.conf aus.
    - type: command
      run: bash pruefe.sh --baum site.conf | grep -Eq '^server > root /srv/docs/dist/?$' && bash pruefe.sh --baum site.conf | grep -Eq '^server > index index\.html$'
      message: Im server-Block fehlen root /srv/docs/dist; oder index index.html;
    - type: command
      run: bash pruefe.sh --baum site.conf | grep -Eq '^server > location / > try_files \$uri \$uri/ =404$'
      message: "location / braucht try_files $uri $uri/ =404;"
    - type: command
      run: bash pruefe.sh --baum site.conf | grep -Eq '^server > location \^~ /assets/ > expires 1y$' && bash pruefe.sh --baum site.conf | grep -Eq '^server > location \^~ /assets/ > add_header Cache-Control "public, immutable"$'
      message: 'location ^~ /assets/ braucht expires 1y; und add_header Cache-Control "public, immutable";'
    - type: command
      run: bash pruefe.sh --baum site.conf | grep -Eq '^server > location ~\* .*png.* > expires 7d$'
      message: "Es fehlt die Regex-location ~* für Bilder (png, jpg, webp, svg) mit expires 7d;"
    - type: command
      run: bash pruefe.sh --baum site.conf | grep -Eq '^server > location /handbuecher/ > alias /srv/pdf/$'
      message: "location /handbuecher/ braucht alias /srv/pdf/; – beide mit Schrägstrich am Ende."
    - type: command
      run: bash pruefe.sh --baum site.conf | grep -Eq '^server > error_page 404 /404\.html$'
      message: Im server-Block fehlt error_page 404 /404.html;
  hints:
    - Jede location ist ein eigener Block im server-Block. Die Reihenfolge der Präfixe ist egal, die Regex prüft nginx nach den Präfixen.
    - "Die Regex für Bilder: `location ~* \\.(png|jpg|webp|svg)$ { expires 7d; }`"
    - "Bei alias müssen location und Ordner auf `/` enden."
  solution: |
    ```nginx title="site.conf"
    server {
        listen 80;
        server_name docs.example.com;
        root /srv/docs/dist;
        index index.html;
        error_page 404 /404.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(png|jpg|webp|svg)$ {
            expires 7d;
        }

        location /handbuecher/ {
            alias /srv/pdf/;
        }
    }
    ```
