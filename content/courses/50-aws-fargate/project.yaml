title: Deployment-Paket für einen Laravel-Shop auf Fargate
description: |
  In diesem Projekt schreibst du alle Dateien, die ein Laravel-Shop braucht, um auf AWS Fargate zu laufen: die
  ECR-Konfiguration, die IAM-Rollen, die Task-Definitionen für Web, Worker und Scheduler, die
  Service-Definitionen, das Autoscaling, das Override für Migrationen und den GitHub-Actions-Workflow mit OIDC.

  Das Übungs-Terminal hat keinen Zugang zu AWS. Du erzeugst deshalb genau die JSON- und YAML-Dateien, die du in
  einem echten Projekt ins Repository legst und an die AWS CLI oder die Pipeline übergibst. Stacklab prüft nach
  jedem Schritt mit `jq` und einem YAML-Parser, ob sie vollständig und stimmig sind.

  Klicke zuerst auf **Projekt vorbereiten**. Dann liegt im Ordner `projekt` deines Workspaces eine kleine
  Laravel-App mit `Dockerfile`. Wechsle im Übungs-Terminal mit `cd projekt` hinein. Alle Platzhalter:
  Konto `123456789012`, Region `eu-central-1`, Cluster `shop`, Repository `beispiel-org/shop` auf GitHub.

  Die Schritte bauen aufeinander auf. Lösche zwischendurch keine Dateien früherer Schritte.
goal: >
  Ein Ordner `projekt` mit `infra/` (ECR, IAM, ECS-Services, Autoscaling), `.aws/` (drei Task-Definitionen) und
  `.github/workflows/deploy.yml` – ein vollständiges, geprüftes Deployment-Paket für Laravel auf Fargate.
workdir: projekt
setup: |
  mkdir -p public app
  cat > Dockerfile <<'EOF'
  FROM php:8.5-fpm-alpine AS base
  RUN apk add --no-cache nginx curl libpq-dev && docker-php-ext-install pdo_pgsql
  WORKDIR /var/www/html
  COPY . .
  EXPOSE 8080
  CMD ["sh", "-c", "php-fpm -D && nginx -g 'daemon off;'"]
  EOF
  printf 'vendor\nnode_modules\n.git\n.env\n' > .dockerignore
  printf '<?php\necho "Shop";\n' > public/index.php
  printf '# Shop\n\nLaravel-Shop, der auf AWS Fargate läuft.\n' > README.md
steps:
  - id: ecr
    title: ECR-Repository und Lifecycle-Policy
    description: |
      Lege die Konfiguration für das Image-Repository an.

      1. `infra/ecr/repository.json` mit `repositoryName` `shop`, `imageTagMutability` `IMMUTABLE` und
         `imageScanningConfiguration.scanOnPush` `true`.
      2. `infra/ecr/lifecycle-policy.json` mit zwei Regeln: Priorität 1 löscht `untagged` Images nach 7 Tagen
         (`sinceImagePushed`, `days`), Priorität 2 behält von `any` die neuesten 30 (`imageCountMoreThan`).
         Beide mit `"action": {"type": "expire"}`.
    checklist:
      - repository.json mit IMMUTABLE und scanOnPush
      - lifecycle-policy.json mit zwei Regeln
      - beide Dateien mit jq geprüft
    hints:
      - "`mkdir -p infra/ecr` legt den Ordner an."
      - Die Lifecycle-Policy kennst du aus der Lektion „Images in Amazon ECR ablegen“.
      - "Zahlen und `true` ohne Anführungszeichen."
    checks:
      - type: command
        run: jq -e '.repositoryName == "shop" and .imageTagMutability == "IMMUTABLE" and .imageScanningConfiguration.scanOnPush == true' infra/ecr/repository.json
        message: infra/ecr/repository.json fehlt oder repositoryName, IMMUTABLE bzw. scanOnPush true stimmen nicht.
      - type: command
        run: jq -e '(.rules | length == 2) and any(.rules[]; .rulePriority == 1 and .selection.tagStatus == "untagged" and .selection.countType == "sinceImagePushed" and .selection.countNumber == 7) and any(.rules[]; .rulePriority == 2 and .selection.tagStatus == "any" and .selection.countType == "imageCountMoreThan" and .selection.countNumber == 30) and all(.rules[]; .action.type == "expire")' infra/ecr/lifecycle-policy.json
        message: infra/ecr/lifecycle-policy.json braucht genau die zwei Regeln (untagged nach 7 Tagen, neueste 30 behalten) mit Aktion expire.
    solution: |
      ```bash
      mkdir -p infra/ecr
      cat > infra/ecr/repository.json <<'JSON'
      { "repositoryName": "shop", "imageTagMutability": "IMMUTABLE", "imageScanningConfiguration": { "scanOnPush": true } }
      JSON
      cat > infra/ecr/lifecycle-policy.json <<'JSON'
      {
        "rules": [
          { "rulePriority": 1, "description": "untagged nach 7 Tagen",
            "selection": { "tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 7 },
            "action": { "type": "expire" } },
          { "rulePriority": 2, "description": "neueste 30 behalten",
            "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 30 },
            "action": { "type": "expire" } }
        ]
      }
      JSON
      ```
    solve: |
      mkdir -p infra/ecr
      cat > infra/ecr/repository.json <<'JSON'
      { "repositoryName": "shop", "imageTagMutability": "IMMUTABLE", "imageScanningConfiguration": { "scanOnPush": true } }
      JSON
      cat > infra/ecr/lifecycle-policy.json <<'JSON'
      {
        "rules": [
          { "rulePriority": 1, "description": "untagged nach 7 Tagen",
            "selection": { "tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 7 },
            "action": { "type": "expire" } },
          { "rulePriority": 2, "description": "neueste 30 behalten",
            "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 30 },
            "action": { "type": "expire" } }
        ]
      }
      JSON

  - id: rollen
    title: Execution-Rolle und Task-Rolle
    description: |
      Lege im Ordner `infra/iam` drei Dokumente an:

      1. `ecs-tasks-trust.json`: Trust Policy für **beide** ECS-Rollen – Principal `{"Service": "ecs-tasks.amazonaws.com"}`,
         Aktion `sts:AssumeRole`.
      2. `execution-secrets-policy.json`: Zusatz für die Execution-Rolle. Ein Statement mit
         `secretsmanager:GetSecretValue` auf `arn:aws:secretsmanager:eu-central-1:123456789012:secret:shop/production-*`.
      3. `task-policy.json`: Rechte für die App zur Laufzeit. Ein Statement mit `s3:GetObject`, `s3:PutObject`,
         `s3:DeleteObject` auf `arn:aws:s3:::shop-uploads-production/*` und ein zweites mit `sqs:SendMessage`,
         `sqs:ReceiveMessage`, `sqs:DeleteMessage`, `sqs:ChangeMessageVisibility`, `sqs:GetQueueAttributes` auf
         `arn:aws:sqs:eu-central-1:123456789012:shop-jobs`.

      Alle mit `"Version": "2012-10-17"`, keine Wildcard-Aktionen.
    checklist:
      - Trust Policy für ecs-tasks.amazonaws.com
      - Secrets-Zusatz für die Execution-Rolle
      - Task-Policy mit S3 und SQS, ohne Wildcard-Aktionen
    hints:
      - Die Execution-Rolle holt Secrets, die Task-Rolle spricht mit S3 und SQS.
      - "Jedes Statement: `{ \"Effect\": \"Allow\", \"Action\": [...], \"Resource\": \"...\" }`."
      - "Prüfe: `jq '.Statement[].Action' infra/iam/task-policy.json`."
    checks:
      - type: command
        run: jq -e '.Version == "2012-10-17" and .Statement[0].Principal.Service == "ecs-tasks.amazonaws.com" and .Statement[0].Action == "sts:AssumeRole"' infra/iam/ecs-tasks-trust.json
        message: infra/iam/ecs-tasks-trust.json fehlt oder erlaubt ecs-tasks.amazonaws.com nicht sts:AssumeRole.
      - type: command
        run: jq -e '.Version == "2012-10-17" and ([.Statement[].Action] | flatten) == ["secretsmanager:GetSecretValue"] and ([.Statement[].Resource] | flatten) == ["arn:aws:secretsmanager:eu-central-1:123456789012:secret:shop/production-*"]' infra/iam/execution-secrets-policy.json
        message: infra/iam/execution-secrets-policy.json soll nur secretsmanager:GetSecretValue auf die Secrets shop/production-* erlauben.
      - type: command
        run: jq -e 'any(.Statement[]; ([.Action] | flatten | sort) == ["s3:DeleteObject","s3:GetObject","s3:PutObject"] and ([.Resource] | flatten) == ["arn:aws:s3:::shop-uploads-production/*"])' infra/iam/task-policy.json
        message: In infra/iam/task-policy.json fehlt das S3-Statement (GetObject, PutObject, DeleteObject auf shop-uploads-production/*).
      - type: command
        run: jq -e 'any(.Statement[]; ([.Action] | flatten | sort) == ["sqs:ChangeMessageVisibility","sqs:DeleteMessage","sqs:GetQueueAttributes","sqs:ReceiveMessage","sqs:SendMessage"] and ([.Resource] | flatten) == ["arn:aws:sqs:eu-central-1:123456789012:shop-jobs"])' infra/iam/task-policy.json
        message: In infra/iam/task-policy.json fehlt das SQS-Statement mit den fünf Aktionen auf die Queue shop-jobs.
      - type: command
        run: jq -e '[.Statement[] | [.Action] | flatten | .[] | select(endswith("*"))] | length == 0' infra/iam/task-policy.json
        message: infra/iam/task-policy.json enthält eine Wildcard-Aktion wie s3:* – liste die Aktionen einzeln auf.
    solution: |
      Siehe die Lektion „Task-Rolle und Execution-Rolle“. Das Ergebnis:

      ```bash
      mkdir -p infra/iam
      cat > infra/iam/ecs-tasks-trust.json <<'JSON'
      { "Version": "2012-10-17", "Statement": [ { "Effect": "Allow", "Principal": { "Service": "ecs-tasks.amazonaws.com" }, "Action": "sts:AssumeRole" } ] }
      JSON
      cat > infra/iam/execution-secrets-policy.json <<'JSON'
      { "Version": "2012-10-17", "Statement": [ { "Effect": "Allow", "Action": "secretsmanager:GetSecretValue",
        "Resource": "arn:aws:secretsmanager:eu-central-1:123456789012:secret:shop/production-*" } ] }
      JSON
      cat > infra/iam/task-policy.json <<'JSON'
      {
        "Version": "2012-10-17",
        "Statement": [
          { "Effect": "Allow", "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
            "Resource": "arn:aws:s3:::shop-uploads-production/*" },
          { "Effect": "Allow",
            "Action": ["sqs:SendMessage", "sqs:ReceiveMessage", "sqs:DeleteMessage", "sqs:ChangeMessageVisibility", "sqs:GetQueueAttributes"],
            "Resource": "arn:aws:sqs:eu-central-1:123456789012:shop-jobs" }
        ]
      }
      JSON
      ```
    solve: |
      mkdir -p infra/iam
      cat > infra/iam/ecs-tasks-trust.json <<'JSON'
      { "Version": "2012-10-17", "Statement": [ { "Effect": "Allow", "Principal": { "Service": "ecs-tasks.amazonaws.com" }, "Action": "sts:AssumeRole" } ] }
      JSON
      cat > infra/iam/execution-secrets-policy.json <<'JSON'
      { "Version": "2012-10-17", "Statement": [ { "Effect": "Allow", "Action": "secretsmanager:GetSecretValue",
        "Resource": "arn:aws:secretsmanager:eu-central-1:123456789012:secret:shop/production-*" } ] }
      JSON
      cat > infra/iam/task-policy.json <<'JSON'
      {
        "Version": "2012-10-17",
        "Statement": [
          { "Effect": "Allow", "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
            "Resource": "arn:aws:s3:::shop-uploads-production/*" },
          { "Effect": "Allow",
            "Action": ["sqs:SendMessage", "sqs:ReceiveMessage", "sqs:DeleteMessage", "sqs:ChangeMessageVisibility", "sqs:GetQueueAttributes"],
            "Resource": "arn:aws:sqs:eu-central-1:123456789012:shop-jobs" }
        ]
      }
      JSON

  - id: web-taskdef
    title: Task-Definition für die Web-App
    description: |
      Schreibe `.aws/web.json` – die Vorlage, die die Pipeline später mit dem neuen Image füllt.

      1. `family` `shop-web`, Fargate, `awsvpc`, `cpu` `"512"`, `memory` `"1024"`,
         `runtimePlatform` mit `LINUX` und `ARM64`.
      2. `executionRoleArn` `arn:aws:iam::123456789012:role/shop-execution`, `taskRoleArn`
         `arn:aws:iam::123456789012:role/shop-task`.
      3. Container `app`, `image` vorerst `PLATZHALTER` (die Pipeline ersetzt ihn), `essential: true`,
         Port `8080`.
      4. `environment`: `APP_ENV=production`, `LOG_CHANNEL=stderr`, `SESSION_DRIVER=redis`, `CACHE_STORE=redis`,
         `QUEUE_CONNECTION=sqs`, `FILESYSTEM_DISK=s3`.
      5. `secrets`: `APP_KEY` und `DB_PASSWORD` aus
         `arn:aws:secretsmanager:eu-central-1:123456789012:secret:shop/production-AbCdEf` (jeweils `:SCHLÜSSEL::`).
      6. `healthCheck` auf `http://localhost:8080/up` mit `startPeriod` 60.
      7. `logConfiguration` mit `awslogs`, Gruppe `/ecs/shop`, Region `eu-central-1`, Präfix `web`.
    checklist:
      - Task-Einstellungen mit ARM64 und beiden Rollen
      - Container app mit Port 8080 und Platzhalter-Image
      - Zustandslose Laravel-Einstellungen in environment
      - APP_KEY und DB_PASSWORD als secrets
      - Health-Check und CloudWatch-Logs
    hints:
      - Setze die Datei aus den Bausteinen der Lektionen in Modul 2 zusammen.
      - Kein Passwort und kein APP_KEY in environment!
      - "Teste Teile gezielt: `jq '.containerDefinitions[0].secrets' .aws/web.json`."
    checks:
      - type: command
        run: jq -e '.family == "shop-web" and .requiresCompatibilities == ["FARGATE"] and .networkMode == "awsvpc" and .cpu == "512" and .memory == "1024" and .runtimePlatform.cpuArchitecture == "ARM64" and .runtimePlatform.operatingSystemFamily == "LINUX"' .aws/web.json
        message: .aws/web.json fehlt oder family, Fargate, awsvpc, cpu "512", memory "1024" bzw. runtimePlatform LINUX/ARM64 stimmen nicht.
      - type: command
        run: jq -e '(.executionRoleArn | endswith(":role/shop-execution")) and (.taskRoleArn | endswith(":role/shop-task"))' .aws/web.json
        message: executionRoleArn bzw. taskRoleArn fehlen oder zeigen auf die falschen Rollen.
      - type: command
        run: jq -e '.containerDefinitions[0] | .name == "app" and .essential == true and .image == "PLATZHALTER" and .portMappings[0].containerPort == 8080' .aws/web.json
        message: Der Container app braucht essential true, image PLATZHALTER und containerPort 8080.
      - type: command
        run: jq -e '.containerDefinitions[0].environment | from_entries | .APP_ENV == "production" and .LOG_CHANNEL == "stderr" and .SESSION_DRIVER == "redis" and .CACHE_STORE == "redis" and .QUEUE_CONNECTION == "sqs" and .FILESYSTEM_DISK == "s3"' .aws/web.json
        message: In environment fehlen Einträge oder Werte stimmen nicht (APP_ENV, LOG_CHANNEL, SESSION_DRIVER, CACHE_STORE, QUEUE_CONNECTION, FILESYSTEM_DISK).
      - type: command
        run: jq -e '.containerDefinitions[0] | ([.secrets[].name] | sort) == ["APP_KEY","DB_PASSWORD"] and all(.secrets[]; .valueFrom == ("arn:aws:secretsmanager:eu-central-1:123456789012:secret:shop/production-AbCdEf:" + .name + "::")) and ([.environment[].name] | index("APP_KEY") == null and index("DB_PASSWORD") == null)' .aws/web.json
        message: "APP_KEY und DB_PASSWORD müssen als secrets mit valueFrom <ARN>:<NAME>:: eingetragen sein – und dürfen nicht in environment stehen."
      - type: command
        run: jq -e '.containerDefinitions[0].healthCheck | (.command | join(" ") | test("localhost:8080/up")) and .startPeriod == 60' .aws/web.json
        message: Der healthCheck soll http://localhost:8080/up prüfen und startPeriod 60 haben.
      - type: command
        run: jq -e '.containerDefinitions[0].logConfiguration | .logDriver == "awslogs" and .options["awslogs-group"] == "/ecs/shop" and .options["awslogs-region"] == "eu-central-1" and .options["awslogs-stream-prefix"] == "web"' .aws/web.json
        message: logConfiguration braucht awslogs mit Gruppe /ecs/shop, Region eu-central-1 und Präfix web.
    solution: |
      ```bash
      mkdir -p .aws
      cat > .aws/web.json <<'JSON'
      {
        "family": "shop-web",
        "requiresCompatibilities": ["FARGATE"],
        "networkMode": "awsvpc",
        "cpu": "512",
        "memory": "1024",
        "runtimePlatform": { "operatingSystemFamily": "LINUX", "cpuArchitecture": "ARM64" },
        "executionRoleArn": "arn:aws:iam::123456789012:role/shop-execution",
        "taskRoleArn": "arn:aws:iam::123456789012:role/shop-task",
        "containerDefinitions": [
          {
            "name": "app",
            "image": "PLATZHALTER",
            "essential": true,
            "portMappings": [{ "containerPort": 8080, "protocol": "tcp" }],
            "environment": [
              { "name": "APP_ENV", "value": "production" },
              { "name": "LOG_CHANNEL", "value": "stderr" },
              { "name": "SESSION_DRIVER", "value": "redis" },
              { "name": "CACHE_STORE", "value": "redis" },
              { "name": "QUEUE_CONNECTION", "value": "sqs" },
              { "name": "FILESYSTEM_DISK", "value": "s3" }
            ],
            "secrets": [
              { "name": "APP_KEY", "valueFrom": "arn:aws:secretsmanager:eu-central-1:123456789012:secret:shop/production-AbCdEf:APP_KEY::" },
              { "name": "DB_PASSWORD", "valueFrom": "arn:aws:secretsmanager:eu-central-1:123456789012:secret:shop/production-AbCdEf:DB_PASSWORD::" }
            ],
            "healthCheck": {
              "command": ["CMD-SHELL", "curl -fsS http://localhost:8080/up || exit 1"],
              "interval": 30, "timeout": 5, "retries": 3, "startPeriod": 60
            },
            "logConfiguration": {
              "logDriver": "awslogs",
              "options": { "awslogs-group": "/ecs/shop", "awslogs-region": "eu-central-1", "awslogs-stream-prefix": "web" }
            }
          }
        ]
      }
      JSON
      ```
    solve: |
      mkdir -p .aws
      cat > .aws/web.json <<'JSON'
      {
        "family": "shop-web",
        "requiresCompatibilities": ["FARGATE"],
        "networkMode": "awsvpc",
        "cpu": "512",
        "memory": "1024",
        "runtimePlatform": { "operatingSystemFamily": "LINUX", "cpuArchitecture": "ARM64" },
        "executionRoleArn": "arn:aws:iam::123456789012:role/shop-execution",
        "taskRoleArn": "arn:aws:iam::123456789012:role/shop-task",
        "containerDefinitions": [
          {
            "name": "app",
            "image": "PLATZHALTER",
            "essential": true,
            "portMappings": [{ "containerPort": 8080, "protocol": "tcp" }],
            "environment": [
              { "name": "APP_ENV", "value": "production" },
              { "name": "LOG_CHANNEL", "value": "stderr" },
              { "name": "SESSION_DRIVER", "value": "redis" },
              { "name": "CACHE_STORE", "value": "redis" },
              { "name": "QUEUE_CONNECTION", "value": "sqs" },
              { "name": "FILESYSTEM_DISK", "value": "s3" }
            ],
            "secrets": [
              { "name": "APP_KEY", "valueFrom": "arn:aws:secretsmanager:eu-central-1:123456789012:secret:shop/production-AbCdEf:APP_KEY::" },
              { "name": "DB_PASSWORD", "valueFrom": "arn:aws:secretsmanager:eu-central-1:123456789012:secret:shop/production-AbCdEf:DB_PASSWORD::" }
            ],
            "healthCheck": {
              "command": ["CMD-SHELL", "curl -fsS http://localhost:8080/up || exit 1"],
              "interval": 30, "timeout": 5, "retries": 3, "startPeriod": 60
            },
            "logConfiguration": {
              "logDriver": "awslogs",
              "options": { "awslogs-group": "/ecs/shop", "awslogs-region": "eu-central-1", "awslogs-stream-prefix": "web" }
            }
          }
        ]
      }
      JSON

  - id: worker-scheduler
    title: Worker und Scheduler aus derselben Vorlage
    description: |
      Erzeuge aus `.aws/web.json` zwei weitere Task-Definitionen – am besten mit `jq`, damit Image, Rollen,
      Secrets und Logs garantiert gleich bleiben.

      1. `.aws/worker.json`: `family` `shop-worker`, `command` `["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]`,
         `stopTimeout` `120`, Log-Präfix `worker`, **ohne** `portMappings` und `healthCheck`.
      2. `.aws/scheduler.json`: `family` `shop-scheduler`, `cpu` `"256"`, `memory` `"512"`,
         `command` `["php", "artisan", "schedule:work"]`, Log-Präfix `scheduler`, **ohne** `portMappings` und `healthCheck`.
    checklist:
      - worker.json mit queue:work, stopTimeout und eigenem Log-Präfix
      - scheduler.json mit schedule:work und kleinerer Größe
      - Secrets und Rollen identisch zur Web-Vorlage
    hints:
      - "`jq '.family = \"shop-worker\" | del(.containerDefinitions[0].portMappings, .containerDefinitions[0].healthCheck)' .aws/web.json > .aws/worker.json`"
      - "Das Log-Präfix: `.containerDefinitions[0].logConfiguration.options[\"awslogs-stream-prefix\"] = \"worker\"`."
      - 256 CPU-Einheiten mit 512 MiB ist die kleinste Fargate-Größe – für den Scheduler reicht sie.
    checks:
      - type: command
        run: jq -e '.family == "shop-worker" and .containerDefinitions[0].command == ["php","artisan","queue:work","--tries=3","--max-time=3600"] and .containerDefinitions[0].stopTimeout == 120 and .containerDefinitions[0].logConfiguration.options["awslogs-stream-prefix"] == "worker"' .aws/worker.json
        message: .aws/worker.json fehlt oder family, command, stopTimeout 120 bzw. Log-Präfix worker stimmen nicht.
      - type: command
        run: jq -e '.family == "shop-scheduler" and .cpu == "256" and .memory == "512" and .containerDefinitions[0].command == ["php","artisan","schedule:work"] and .containerDefinitions[0].logConfiguration.options["awslogs-stream-prefix"] == "scheduler"' .aws/scheduler.json
        message: .aws/scheduler.json fehlt oder family, cpu "256", memory "512", command bzw. Log-Präfix scheduler stimmen nicht.
      - type: command
        run: for f in .aws/worker.json .aws/scheduler.json; do jq -e '.containerDefinitions[0] | (has("portMappings") or has("healthCheck")) | not' "$f" > /dev/null || exit 1; done
        message: Worker und Scheduler brauchen weder portMappings noch healthCheck – entferne beides.
      - type: command
        run: for f in .aws/worker.json .aws/scheduler.json; do jq -e --slurpfile web .aws/web.json '.taskRoleArn == $web[0].taskRoleArn and .executionRoleArn == $web[0].executionRoleArn and .containerDefinitions[0].secrets == $web[0].containerDefinitions[0].secrets and .containerDefinitions[0].environment == $web[0].containerDefinitions[0].environment' "$f" > /dev/null || exit 1; done
        message: Rollen, environment und secrets von Worker und Scheduler sollen genau wie in .aws/web.json sein.
    solution: |
      ```bash
      jq '.family = "shop-worker"
          | .containerDefinitions[0].command = ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
          | .containerDefinitions[0].stopTimeout = 120
          | .containerDefinitions[0].logConfiguration.options["awslogs-stream-prefix"] = "worker"
          | del(.containerDefinitions[0].portMappings, .containerDefinitions[0].healthCheck)' .aws/web.json > .aws/worker.json

      jq '.family = "shop-scheduler" | .cpu = "256" | .memory = "512"
          | .containerDefinitions[0].command = ["php", "artisan", "schedule:work"]
          | .containerDefinitions[0].logConfiguration.options["awslogs-stream-prefix"] = "scheduler"
          | del(.containerDefinitions[0].portMappings, .containerDefinitions[0].healthCheck)' .aws/web.json > .aws/scheduler.json
      ```
    solve: |
      jq '.family = "shop-worker"
          | .containerDefinitions[0].command = ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
          | .containerDefinitions[0].stopTimeout = 120
          | .containerDefinitions[0].logConfiguration.options["awslogs-stream-prefix"] = "worker"
          | del(.containerDefinitions[0].portMappings, .containerDefinitions[0].healthCheck)' .aws/web.json > .aws/worker.json
      jq '.family = "shop-scheduler" | .cpu = "256" | .memory = "512"
          | .containerDefinitions[0].command = ["php", "artisan", "schedule:work"]
          | .containerDefinitions[0].logConfiguration.options["awslogs-stream-prefix"] = "scheduler"
          | del(.containerDefinitions[0].portMappings, .containerDefinitions[0].healthCheck)' .aws/web.json > .aws/scheduler.json

  - id: services
    title: Drei Services definieren
    description: |
      Lege in `infra/ecs` die Eingaben für `aws ecs create-service --cli-input-json` an. Alle drei: `cluster` `shop`,
      `launchType` `FARGATE`, private Subnetze `subnet-0aaa1111` und `subnet-0bbb2222`, `assignPublicIp` `DISABLED`.

      1. `web-service.json`: `serviceName` `web`, `taskDefinition` `shop-web`, `desiredCount` 2, Security Group
         `sg-0app3333bbbb4444`, ein Eintrag in `loadBalancers` (Target Group
         `arn:aws:elasticloadbalancing:eu-central-1:123456789012:targetgroup/shop-web/6d0ecf831eec9f09`, Container `app`,
         Port 8080), `healthCheckGracePeriodSeconds` 60 und
         `deploymentConfiguration` mit `deploymentCircuitBreaker` `{"enable": true, "rollback": true}`.
      2. `worker-service.json`: `serviceName` `worker`, `taskDefinition` `shop-worker`, `desiredCount` 1, Security Group
         `sg-0work5555cccc6666`, ohne Load Balancer, ebenfalls mit Circuit Breaker.
      3. `scheduler-service.json`: `serviceName` `scheduler`, `taskDefinition` `shop-scheduler`, `desiredCount` 1, Security
         Group `sg-0work5555cccc6666`, ohne Load Balancer. Damit beim Deployment **nie zwei** Scheduler gleichzeitig laufen:
         `deploymentConfiguration` mit `minimumHealthyPercent` 0 und `maximumPercent` 100.
    checklist:
      - Web-Service mit Load Balancer und Circuit Breaker
      - Worker-Service ohne Load Balancer
      - Scheduler-Service, bei dem nie zwei Tasks gleichzeitig laufen
    hints:
      - Starte mit `web-service.json` und kopiere sie dann für Worker und Scheduler, um Load Balancer und Grace Period zu entfernen.
      - Bei `maximumPercent` 100 und `desiredCount` 1 darf höchstens ein Task laufen – ECS muss den alten erst stoppen.
      - "Prüfe alle drei auf einmal: `jq '{serviceName, desiredCount, deploymentConfiguration}' infra/ecs/*-service.json`."
    checks:
      - type: command
        run: for f in web worker scheduler; do jq -e '.cluster == "shop" and .launchType == "FARGATE" and (.networkConfiguration.awsvpcConfiguration | (.subnets | sort) == ["subnet-0aaa1111","subnet-0bbb2222"] and .assignPublicIp == "DISABLED")' "infra/ecs/$f-service.json" > /dev/null || exit 1; done
        message: Mindestens eine der drei Dateien infra/ecs/{web,worker,scheduler}-service.json fehlt oder cluster, launchType, Subnetze bzw. assignPublicIp DISABLED stimmen nicht.
      - type: command
        run: jq -e '.serviceName == "web" and .taskDefinition == "shop-web" and .desiredCount == 2 and .networkConfiguration.awsvpcConfiguration.securityGroups == ["sg-0app3333bbbb4444"] and (.loadBalancers | length == 1) and .loadBalancers[0].containerName == "app" and .loadBalancers[0].containerPort == 8080 and (.loadBalancers[0].targetGroupArn | endswith("targetgroup/shop-web/6d0ecf831eec9f09")) and .healthCheckGracePeriodSeconds == 60' infra/ecs/web-service.json
        message: web-service.json braucht serviceName web, shop-web, desiredCount 2, sg-0app3333bbbb4444, den Load-Balancer-Eintrag (app, 8080) und healthCheckGracePeriodSeconds 60.
      - type: command
        run: jq -e '.deploymentConfiguration.deploymentCircuitBreaker | .enable == true and .rollback == true' infra/ecs/web-service.json && jq -e '.deploymentConfiguration.deploymentCircuitBreaker | .enable == true and .rollback == true' infra/ecs/worker-service.json
        message: Web- und Worker-Service brauchen deploymentConfiguration.deploymentCircuitBreaker mit enable und rollback true.
      - type: command
        run: jq -e '.serviceName == "worker" and .taskDefinition == "shop-worker" and .desiredCount == 1 and .networkConfiguration.awsvpcConfiguration.securityGroups == ["sg-0work5555cccc6666"] and ((.loadBalancers // []) | length == 0)' infra/ecs/worker-service.json
        message: worker-service.json braucht serviceName worker, shop-worker, desiredCount 1, sg-0work5555cccc6666 und keinen Load Balancer.
      - type: command
        run: jq -e '.serviceName == "scheduler" and .taskDefinition == "shop-scheduler" and .desiredCount == 1 and ((.loadBalancers // []) | length == 0) and .deploymentConfiguration.minimumHealthyPercent == 0 and .deploymentConfiguration.maximumPercent == 100' infra/ecs/scheduler-service.json
        message: scheduler-service.json braucht serviceName scheduler, shop-scheduler, desiredCount 1, keinen Load Balancer und minimumHealthyPercent 0 / maximumPercent 100.
    solution: |
      ```bash
      mkdir -p infra/ecs
      cat > infra/ecs/web-service.json <<'JSON'
      {
        "cluster": "shop", "serviceName": "web", "taskDefinition": "shop-web",
        "desiredCount": 2, "launchType": "FARGATE",
        "loadBalancers": [{
          "targetGroupArn": "arn:aws:elasticloadbalancing:eu-central-1:123456789012:targetgroup/shop-web/6d0ecf831eec9f09",
          "containerName": "app", "containerPort": 8080 }],
        "healthCheckGracePeriodSeconds": 60,
        "deploymentConfiguration": {
          "minimumHealthyPercent": 100, "maximumPercent": 200,
          "deploymentCircuitBreaker": { "enable": true, "rollback": true } },
        "networkConfiguration": { "awsvpcConfiguration": {
          "subnets": ["subnet-0aaa1111", "subnet-0bbb2222"],
          "securityGroups": ["sg-0app3333bbbb4444"], "assignPublicIp": "DISABLED" } }
      }
      JSON
      # worker-service.json und scheduler-service.json analog, siehe Aufgabenbeschreibung
      ```
    solve: |
      mkdir -p infra/ecs
      cat > infra/ecs/web-service.json <<'JSON'
