  - id: migration-und-scaling
    title: Migrations-Override und Autoscaling
    description: |
      1. `infra/ecs/migrate-overrides.json`: das JSON für `aws ecs run-task --overrides`. Es überschreibt beim Container
         `app` den Befehl mit `["php", "artisan", "migrate", "--force"]`.
      2. `infra/autoscaling/web-cpu.json`: eine Target-Tracking-Konfiguration mit `TargetValue` 60,
         `PredefinedMetricSpecification.PredefinedMetricType` `ECSServiceAverageCPUUtilization`,
         `ScaleOutCooldown` 60 und `ScaleInCooldown` 300.
      3. `infra/autoscaling/limits.txt` mit genau zwei Zeilen: `min=2` und `max=10`.
    checklist:
      - Override für die Migration
      - Target-Tracking auf 60 Prozent CPU
      - Grenzen für das Autoscaling notiert
    hints:
      - Das Override kennst du aus der Lektion „Laravel auf Fargate betreiben“.
      - "`printf 'min=2\\nmax=10\\n' > infra/autoscaling/limits.txt`"
      - Die Grenzen übergibst du in echt an `register-scalable-target` mit `--min-capacity` und `--max-capacity`.
    checks:
      - type: command
        run: jq -e '.containerOverrides == [{"name":"app","command":["php","artisan","migrate","--force"]}]' infra/ecs/migrate-overrides.json
        message: infra/ecs/migrate-overrides.json braucht genau containerOverrides mit name app und command ["php", "artisan", "migrate", "--force"].
      - type: command
        run: jq -e '.TargetValue == 60 and .PredefinedMetricSpecification.PredefinedMetricType == "ECSServiceAverageCPUUtilization" and .ScaleOutCooldown == 60 and .ScaleInCooldown == 300' infra/autoscaling/web-cpu.json
        message: infra/autoscaling/web-cpu.json braucht TargetValue 60, die Metrik ECSServiceAverageCPUUtilization und die Cooldowns 60 und 300.
      - type: command
        run: tr -d '\r' < infra/autoscaling/limits.txt | sort | tr '\n' ' '
        stdout_matches: "^max=10 min=2 ?$"
        message: infra/autoscaling/limits.txt soll genau die Zeilen min=2 und max=10 enthalten.
    solution: |
      ```bash
      cat > infra/ecs/migrate-overrides.json <<'JSON'
      { "containerOverrides": [ { "name": "app", "command": ["php", "artisan", "migrate", "--force"] } ] }
      JSON
      mkdir -p infra/autoscaling
      cat > infra/autoscaling/web-cpu.json <<'JSON'
      {
        "TargetValue": 60.0,
        "PredefinedMetricSpecification": { "PredefinedMetricType": "ECSServiceAverageCPUUtilization" },
        "ScaleOutCooldown": 60,
        "ScaleInCooldown": 300
      }
      JSON
      printf 'min=2\nmax=10\n' > infra/autoscaling/limits.txt
      ```
    solve: |
      cat > infra/ecs/migrate-overrides.json <<'JSON'
      { "containerOverrides": [ { "name": "app", "command": ["php", "artisan", "migrate", "--force"] } ] }
      JSON
      mkdir -p infra/autoscaling
      cat > infra/autoscaling/web-cpu.json <<'JSON'
      {
        "TargetValue": 60.0,
        "PredefinedMetricSpecification": { "PredefinedMetricType": "ECSServiceAverageCPUUtilization" },
        "ScaleOutCooldown": 60,
        "ScaleInCooldown": 300
      }
      JSON
      printf 'min=2\nmax=10\n' > infra/autoscaling/limits.txt

  - id: deploy-rolle
    title: Die Deploy-Rolle für GitHub Actions
    description: |
      1. `infra/iam/github-deploy-trust.json`: Principal `Federated` mit
         `arn:aws:iam::123456789012:oidc-provider/token.actions.githubusercontent.com`, Aktion
         `sts:AssumeRoleWithWebIdentity`, unter `StringEquals` die Bedingungen `aud` = `sts.amazonaws.com` und
         `sub` = `repo:beispiel-org/shop:environment:production`.
      2. `infra/iam/github-deploy-policy.json` mit vier Statements:
         - `ecr:GetAuthorizationToken` auf `"*"`,
         - die fünf ECR-Push-Aktionen auf `arn:aws:ecr:eu-central-1:123456789012:repository/shop`,
         - `ecs:RegisterTaskDefinition`, `ecs:DescribeTaskDefinition`, `ecs:UpdateService`, `ecs:DescribeServices`,
           `ecs:RunTask`, `ecs:DescribeTasks` auf `"*"`,
         - `iam:PassRole` auf `shop-execution` und `shop-task` mit `iam:PassedToService` = `ecs-tasks.amazonaws.com`.
    checklist:
      - Trust Policy nur für das Environment production
      - ECR-Rechte für den Push
      - ECS-Rechte für Deploy und Migration
      - iam:PassRole eingeschränkt auf ECS
    hints:
      - Die Modul-Übung „Die Deploy-Rolle für GitHub Actions“ hat fast denselben Inhalt.
      - "`ecs:RunTask` und `ecs:DescribeTasks` braucht die Pipeline für den Migrations-Task."
      - "Prüfe die Aktionen: `jq '[.Statement[].Action] | flatten' infra/iam/github-deploy-policy.json`."
    checks:
      - type: command
        run: jq -e '.Statement[0] | .Principal.Federated == "arn:aws:iam::123456789012:oidc-provider/token.actions.githubusercontent.com" and .Action == "sts:AssumeRoleWithWebIdentity" and .Condition.StringEquals["token.actions.githubusercontent.com:aud"] == "sts.amazonaws.com" and .Condition.StringEquals["token.actions.githubusercontent.com:sub"] == "repo:beispiel-org/shop:environment:production"' infra/iam/github-deploy-trust.json
        message: infra/iam/github-deploy-trust.json fehlt oder Principal, Aktion bzw. die aud- und sub-Bedingungen stimmen nicht.
      - type: command
        run: jq -e '(.Statement | length == 4) and any(.Statement[]; ([.Action] | flatten) == ["ecr:GetAuthorizationToken"]) and any(.Statement[]; ([.Action] | flatten | sort) == ["ecr:BatchCheckLayerAvailability","ecr:CompleteLayerUpload","ecr:InitiateLayerUpload","ecr:PutImage","ecr:UploadLayerPart"] and ([.Resource] | flatten) == ["arn:aws:ecr:eu-central-1:123456789012:repository/shop"])' infra/iam/github-deploy-policy.json
        message: infra/iam/github-deploy-policy.json braucht vier Statements, darunter GetAuthorizationToken und die fünf Push-Aktionen auf das Repository shop.
      - type: command
        run: jq -e 'any(.Statement[]; ([.Action] | flatten | sort) == ["ecs:DescribeServices","ecs:DescribeTaskDefinition","ecs:DescribeTasks","ecs:RegisterTaskDefinition","ecs:RunTask","ecs:UpdateService"])' infra/iam/github-deploy-policy.json
        message: Es fehlt das ECS-Statement mit genau den sechs Aktionen (RegisterTaskDefinition, DescribeTaskDefinition, UpdateService, DescribeServices, RunTask, DescribeTasks).
      - type: command
        run: jq -e 'any(.Statement[]; ([.Action] | flatten) == ["iam:PassRole"] and ([.Resource] | flatten | sort) == ["arn:aws:iam::123456789012:role/shop-execution","arn:aws:iam::123456789012:role/shop-task"] and .Condition.StringEquals["iam:PassedToService"] == "ecs-tasks.amazonaws.com")' infra/iam/github-deploy-policy.json
        message: Es fehlt das iam:PassRole-Statement auf shop-execution und shop-task mit der Bedingung iam:PassedToService.
    solution: |
      Wie in der Modul-Übung, ergänzt um ein viertes Statement:

      ```json
      {
        "Effect": "Allow",
        "Action": ["ecs:RegisterTaskDefinition", "ecs:DescribeTaskDefinition", "ecs:UpdateService",
                   "ecs:DescribeServices", "ecs:RunTask", "ecs:DescribeTasks"],
        "Resource": "*"
      }
      ```
    solve: |
      cat > infra/iam/github-deploy-trust.json <<'JSON'
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": { "Federated": "arn:aws:iam::123456789012:oidc-provider/token.actions.githubusercontent.com" },
            "Action": "sts:AssumeRoleWithWebIdentity",
            "Condition": { "StringEquals": {
              "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
              "token.actions.githubusercontent.com:sub": "repo:beispiel-org/shop:environment:production" } }
          }
        ]
      }
      JSON
      cat > infra/iam/github-deploy-policy.json <<'JSON'
      {
        "Version": "2012-10-17",
        "Statement": [
          { "Effect": "Allow", "Action": "ecr:GetAuthorizationToken", "Resource": "*" },
          { "Effect": "Allow",
            "Action": ["ecr:BatchCheckLayerAvailability", "ecr:InitiateLayerUpload", "ecr:UploadLayerPart", "ecr:CompleteLayerUpload", "ecr:PutImage"],
            "Resource": "arn:aws:ecr:eu-central-1:123456789012:repository/shop" },
          { "Effect": "Allow",
            "Action": ["ecs:RegisterTaskDefinition", "ecs:DescribeTaskDefinition", "ecs:UpdateService", "ecs:DescribeServices", "ecs:RunTask", "ecs:DescribeTasks"],
            "Resource": "*" },
          { "Effect": "Allow", "Action": "iam:PassRole",
            "Resource": ["arn:aws:iam::123456789012:role/shop-execution", "arn:aws:iam::123456789012:role/shop-task"],
            "Condition": { "StringEquals": { "iam:PassedToService": "ecs-tasks.amazonaws.com" } } }
        ]
      }
      JSON

  - id: workflow
    title: Der Deploy-Workflow
    description: |
      Zum Schluss verbindest du alles in `.github/workflows/deploy.yml`.

      1. Trigger `push` auf `main`, `permissions` mit `id-token: write` und `contents: read`.
      2. Job `deploy` auf `ubuntu-latest`, `environment: production`.
      3. Schritte: `actions/checkout@v5`, `aws-actions/configure-aws-credentials@v6` (Rolle
         `arn:aws:iam::123456789012:role/github-deploy`, Region `eu-central-1`), `aws-actions/amazon-ecr-login@v2`
         mit `id: ecr`, ein `run`-Schritt, der mit `docker build` und `docker push` das Image
         `${{ steps.ecr.outputs.registry }}/shop:${{ github.sha }}` erzeugt.
      4. Für **jede** der drei Task-Definitionen (`.aws/web.json`, `.aws/worker.json`, `.aws/scheduler.json`) einen
         Schritt `aws-actions/amazon-ecs-render-task-definition@v1` (Container `app`, neues Image) und einen Schritt
         `aws-actions/amazon-ecs-deploy-task-definition@v2` mit `cluster: shop` und dem passenden `service`
         (`web`, `worker`, `scheduler`).
      5. Der **erste** Deploy-Schritt (für `web`) startet vorher die Migration: `run-task: true`,
         `wait-for-task-stopped: true`, `run-task-subnets: subnet-0aaa1111,subnet-0bbb2222`,
         `run-task-security-groups: sg-0app3333bbbb4444` und `run-task-container-overrides` mit
         `[{"name":"app","command":["php","artisan","migrate","--force"]}]`.

      Prüfe die Syntax mit
      `bun -e 'console.log(JSON.stringify(Bun.YAML.parse(await Bun.file(".github/workflows/deploy.yml").text()), null, 2))'`.
    checklist:
      - OIDC-Anmeldung ohne gespeicherte Schlüssel
      - Ein Image mit dem Commit-Hash als Tag
      - Migration vor dem Web-Rollout
      - Drei Render- und drei Deploy-Schritte
    hints:
      - Beginne mit dem Workflow aus der Lektion „Deployen mit GitHub Actions und OIDC“ und ergänze Worker und Scheduler.
      - Jeder Render-Schritt braucht eine eigene `id` (z. B. `render-web`), damit der Deploy-Schritt `${{ steps.render-web.outputs.task-definition }}` nutzen kann.
      - "`run-task-container-overrides` ist ein String – setze den JSON-Text in einfache Anführungszeichen."
    checks:
      - type: command
        run: bun -e 'console.log(JSON.stringify(Bun.YAML.parse(await Bun.file(".github/workflows/deploy.yml").text())))' | jq -e '.on.push.branches == ["main"] and .permissions["id-token"] == "write" and .permissions.contents == "read" and .jobs.deploy["runs-on"] == "ubuntu-latest" and .jobs.deploy.environment == "production"'
        message: .github/workflows/deploy.yml fehlt, ist kein gültiges YAML, oder Trigger, permissions, runs-on bzw. environment stimmen nicht.
      - type: command
        run: bun -e 'console.log(JSON.stringify(Bun.YAML.parse(await Bun.file(".github/workflows/deploy.yml").text())))' | jq -e '[.jobs.deploy.steps[] | select((.uses // "") | startswith("aws-actions/configure-aws-credentials@")) | .with] | length == 1 and .[0]["role-to-assume"] == "arn:aws:iam::123456789012:role/github-deploy" and .[0]["aws-region"] == "eu-central-1"'
        message: Es braucht genau einen Schritt configure-aws-credentials mit der Rolle github-deploy und der Region eu-central-1.
      - type: command
        run: bun -e 'console.log(JSON.stringify(Bun.YAML.parse(await Bun.file(".github/workflows/deploy.yml").text())))' | jq -e 'any(.jobs.deploy.steps[]; (.run // "") | test("docker build") and test("docker push") and test("github.sha"))'
        message: Ein run-Schritt muss das Image mit docker build und docker push und dem Tag github.sha bauen.
      - type: command
        run: bun -e 'console.log(JSON.stringify(Bun.YAML.parse(await Bun.file(".github/workflows/deploy.yml").text())))' | jq -e '[.jobs.deploy.steps[] | select((.uses // "") | startswith("aws-actions/amazon-ecs-render-task-definition@")) | .with["task-definition"]] | sort == [".aws/scheduler.json", ".aws/web.json", ".aws/worker.json"]'
        message: Es braucht drei Render-Schritte für .aws/web.json, .aws/worker.json und .aws/scheduler.json.
      - type: command
        run: bun -e 'console.log(JSON.stringify(Bun.YAML.parse(await Bun.file(".github/workflows/deploy.yml").text())))' | jq -e '[.jobs.deploy.steps[] | select((.uses // "") | startswith("aws-actions/amazon-ecs-deploy-task-definition@")) | .with] | length == 3 and ([.[].service] | sort) == ["scheduler","web","worker"] and all(.[]; .cluster == "shop")'
        message: Es braucht drei Deploy-Schritte im Cluster shop für die Services web, worker und scheduler.
      - type: command
        run: bun -e 'console.log(JSON.stringify(Bun.YAML.parse(await Bun.file(".github/workflows/deploy.yml").text())))' | jq -e '[.jobs.deploy.steps[] | select((.uses // "") | startswith("aws-actions/amazon-ecs-deploy-task-definition@")) | .with][0] | .service == "web" and (.["run-task"] | tostring) == "true" and (.["wait-for-task-stopped"] | tostring) == "true" and (.["run-task-container-overrides"] | tostring | test("migrate")) and (.["run-task-subnets"] | tostring | test("subnet-0aaa1111"))'
        message: Der erste Deploy-Schritt soll web sein und vorher die Migration starten (run-task, wait-for-task-stopped, run-task-subnets, run-task-container-overrides mit migrate).
      - type: command
        run: grep -Eiq "aws-access-key-id|aws-secret-access-key|AKIA" .github/workflows/deploy.yml
        expect_exit: 1
        message: Im Workflow stehen AWS-Schlüssel – mit OIDC brauchst du keine.
    solution: |
      ```yaml title=".github/workflows/deploy.yml (Ausschnitt ab dem Build)"
            - name: Build and push image
              run: |
                IMAGE=${{ steps.ecr.outputs.registry }}/shop:${{ github.sha }}
                docker build -t "$IMAGE" .
                docker push "$IMAGE"

            - uses: aws-actions/amazon-ecs-render-task-definition@v1
              id: render-web
              with:
                task-definition: .aws/web.json
                container-name: app
                image: ${{ steps.ecr.outputs.registry }}/shop:${{ github.sha }}

            - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
              with:
                task-definition: ${{ steps.render-web.outputs.task-definition }}
                cluster: shop
                service: web
                wait-for-service-stability: true
                run-task: true
                wait-for-task-stopped: true
                run-task-subnets: subnet-0aaa1111,subnet-0bbb2222
                run-task-security-groups: sg-0app3333bbbb4444
                run-task-container-overrides: '[{"name":"app","command":["php","artisan","migrate","--force"]}]'

            # danach render-worker / deploy worker und render-scheduler / deploy scheduler nach demselben Muster
      ```
    solve: |
      mkdir -p .github/workflows
      cat > .github/workflows/deploy.yml <<'YAML'
      name: Deploy

      on:
        push:
          branches: [main]

      permissions:
        id-token: write
        contents: read

      jobs:
        deploy:
          runs-on: ubuntu-latest
          environment: production
          steps:
            - uses: actions/checkout@v5

            - uses: aws-actions/configure-aws-credentials@v6
              with:
                role-to-assume: arn:aws:iam::123456789012:role/github-deploy
                aws-region: eu-central-1

            - uses: aws-actions/amazon-ecr-login@v2
              id: ecr

            - name: Build and push image
              run: |
                IMAGE=${{ steps.ecr.outputs.registry }}/shop:${{ github.sha }}
                docker build -t "$IMAGE" .
                docker push "$IMAGE"

            - uses: aws-actions/amazon-ecs-render-task-definition@v1
              id: render-web
              with:
                task-definition: .aws/web.json
                container-name: app
                image: ${{ steps.ecr.outputs.registry }}/shop:${{ github.sha }}

            - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
              with:
                task-definition: ${{ steps.render-web.outputs.task-definition }}
                cluster: shop
                service: web
                wait-for-service-stability: true
                run-task: true
                wait-for-task-stopped: true
                run-task-subnets: subnet-0aaa1111,subnet-0bbb2222
                run-task-security-groups: sg-0app3333bbbb4444
                run-task-container-overrides: '[{"name":"app","command":["php","artisan","migrate","--force"]}]'

            - uses: aws-actions/amazon-ecs-render-task-definition@v1
              id: render-worker
              with:
                task-definition: .aws/worker.json
                container-name: app
                image: ${{ steps.ecr.outputs.registry }}/shop:${{ github.sha }}

            - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
              with:
                task-definition: ${{ steps.render-worker.outputs.task-definition }}
                cluster: shop
                service: worker
                wait-for-service-stability: true

            - uses: aws-actions/amazon-ecs-render-task-definition@v1
              id: render-scheduler
              with:
                task-definition: .aws/scheduler.json
                container-name: app
                image: ${{ steps.ecr.outputs.registry }}/shop:${{ github.sha }}

            - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
              with:
                task-definition: ${{ steps.render-scheduler.outputs.task-definition }}
                cluster: shop
                service: scheduler
                wait-for-service-stability: true
      YAML
