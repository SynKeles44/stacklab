steps:
  - id: setup-notieren
    title: Notizen anlegen und die Ausgangslage festhalten
    description: |
      Jede Einarbeitung beginnt mit der Ausgangslage: Wie startet man die Tests, und was ist schon rot?

      1. Wechsle mit `cd kiezladen-projekt` in den Projektordner und lies README und Makefile.
      2. Führe die Tests aus.
      3. Lege `NOTES.md` an. Die erste Zeile ist eine Überschrift, z. B. `# Onboarding-Notizen Kiezladen`.
      4. Schreibe einen Abschnitt `## Setup` mit dem Befehl, mit dem du die Tests startest, und dem Ergebnis
         des ersten Testlaufs (wie viele bestanden, wie viele fehlgeschlagen).
    checklist:
      - README und Makefile gelesen
      - Tests einmal ausgeführt
      - NOTES.md mit Überschrift und Abschnitt Setup
    hints:
      - "`make test` ruft `php tests/run.php` auf. Die letzte Zeile der Ausgabe ist dein Ergebnis."
      - "Schreibe Markdown: `## Setup` als eigene Zeile, darunter Stichpunkte mit `- `."
    checks:
      - type: file_contains
        path: NOTES.md
        pattern: "^# \\S"
        message: NOTES.md fehlt oder beginnt nicht mit einer Überschrift wie „# Onboarding-Notizen Kiezladen“.
      - type: command
        run: awk '/^## Setup/{f=1;next} /^## /{f=0} f' NOTES.md | grep -cE 'make test|php tests/run\.php'
        stdout_matches: "^\\s*[1-9]"
        message: Im Abschnitt „## Setup“ fehlt der Befehl, mit dem du die Tests startest (make test oder php tests/run.php).
      - type: command
        run: awk '/^## Setup/{f=1;next} /^## /{f=0} f' NOTES.md | grep -cE '5 bestanden|1 fehlgeschlagen|1 (roter|rot|Test)'
        stdout_matches: "^\\s*[1-9]"
        message: Notiere im Abschnitt „## Setup“ auch das Ergebnis des ersten Testlaufs, z. B. „5 bestanden, 1 fehlgeschlagen“.
    solution: |
      ```bash
      cd kiezladen-projekt
      cat README.md Makefile
      make test
      cat > NOTES.md <<'EOF'
      # Onboarding-Notizen Kiezladen

      ## Setup
      - Tests: make test (ruft php tests/run.php auf)
      - Erster Lauf: 5 bestanden, 1 fehlgeschlagen
      EOF
      ```
    solve: |
      ergebnis=$(php tests/run.php 2>&1 | tail -n 1 || true)
      cat > NOTES.md <<MD
      # Onboarding-Notizen Kiezladen

      ## Setup
      - Tests: make test (ruft php tests/run.php auf)
      - Erster Lauf: ${ergebnis}
      MD
  - id: einstiegspunkte
    title: Einstiegspunkte festhalten
    description: |
      Jetzt notierst du, wo Anfragen in die Anwendung kommen.

      1. Lies `public/index.php` und `src/routes.php`.
      2. Ergänze in `NOTES.md` einen Abschnitt `## Einstiegspunkte`. Nenne darin den Front Controller
         (`public/index.php`), die Routen-Datei (`src/routes.php`) und den Ordner der Tests (`tests/`), denn
         auch der Test-Runner ist ein Einstiegspunkt.
      3. Liste alle fünf Routen mit Methode und Pfad auf, z. B. `GET /products → ProductController::index`.
    checklist:
      - Front Controller und Routen-Datei notiert
      - Alle fünf Routen mit Methode, Pfad und Handler aufgelistet
    hints:
      - "`grep -nE 'router->(get|post)' src/routes.php` zeigt alle Routen auf einen Blick."
      - "Hänge mit `cat >> NOTES.md <<'EOF'` … `EOF` einen neuen Abschnitt an die Datei an."
    checks:
      - type: command
        run: |
          s=$(awk '/^## Einstiegspunkte/{f=1;next} /^## /{f=0} f' NOTES.md)
          echo "$s" | grep -q 'public/index\.php' && echo "$s" | grep -q 'src/routes\.php' && echo ok
        stdout_equals: ok
        message: Im Abschnitt „## Einstiegspunkte“ sollen public/index.php und src/routes.php vorkommen.
      - type: command
        run: |
          s=$(awk '/^## Einstiegspunkte/{f=1;next} /^## /{f=0} f' NOTES.md)
          n=0
          for r in 'GET /products' 'GET /cart' 'POST /cart/add' 'POST /checkout'; do
            echo "$s" | grep -qF "$r" && n=$((n+1))
          done
          echo "$s" | grep -qE 'GET /( |$|→|-)' && n=$((n+1))
          echo $n
        stdout_equals: "5"
        message: "Im Abschnitt „## Einstiegspunkte“ fehlen Routen. Erwartet werden alle fünf im Format „METHODE /pfad“: GET /, GET /products, GET /cart, POST /cart/add und POST /checkout."
    solution: |
      ```bash
      cat >> NOTES.md <<'EOF'

      ## Einstiegspunkte
      - Web: public/index.php (Front Controller), Routen in src/routes.php
      - Tests: tests/run.php startet alle *Test.php-Dateien
      - GET / → Begrüßungstext
      - GET /products → ProductController::index
      - GET /cart → CartController::show
      - POST /cart/add → CartController::add
      - POST /checkout → CheckoutController::store
      EOF
      ```
    solve: |
      cat >> NOTES.md <<'MD'

      ## Einstiegspunkte
      - Web: public/index.php (Front Controller), Routen in src/routes.php
      - Tests: tests/run.php startet alle *Test.php-Dateien in tests/
      - GET / → Begrüßungstext
      - GET /products → ProductController::index
      - GET /cart → CartController::show
      - POST /cart/add → CartController::add
      - POST /checkout → CheckoutController::store
      MD
  - id: request-ablauf
    title: Einen Checkout von Anfang bis Ende verfolgen
    description: |
      Verfolge `POST /checkout` durch den Code und halte die Stationen fest.

      1. Beginne bei `public/index.php` und folge dem Request über die Route bis in den `CheckoutController`.
      2. Lies `store()` und folge jedem Aufruf bis zur Bestellbestätigung.
      3. Ergänze den Abschnitt `## Request-Ablauf: POST /checkout` mit den Stationen **in dieser Reihenfolge**:
         `index.php`, `routes.php`, `CheckoutController`, `PriceCalculator`, `OrderPlaced`,
         `SendOrderConfirmation` – gern mit Zwischenschritten und einem Satz pro Station.
    checklist:
      - Stationen in der richtigen Reihenfolge
      - Pro Station ein kurzer Satz, was dort passiert
    hints:
      - "Eine Zeile pro Station, nummeriert mit `1.`, `2.` … ist am übersichtlichsten."
      - "Nach `summarize()` erzeugt der Controller ein `OrderPlaced`-Event, auf das `SendOrderConfirmation` reagiert."
    checks:
      - type: command
        run: |
          s=$(awk '/^## Request-Ablauf/{f=1;next} /^## /{f=0} f' NOTES.md)
          prev=0
          for w in index.php routes.php CheckoutController PriceCalculator OrderPlaced SendOrderConfirmation; do
            n=$(echo "$s" | grep -n -m1 -F "$w" | cut -d: -f1)
            [ -n "$n" ] && [ "$n" -gt "$prev" ] || { echo "$w"; exit 1; }
            prev=$n
          done
          echo ok
        stdout_equals: ok
        message: "Im Abschnitt „## Request-Ablauf“ fehlt eine Station oder die Reihenfolge stimmt nicht (jede Station in einer eigenen Zeile): index.php, routes.php, CheckoutController, PriceCalculator, OrderPlaced, SendOrderConfirmation."
    solution: |
      ```bash
      cat >> NOTES.md <<'EOF'

      ## Request-Ablauf: POST /checkout
      1. public/index.php lädt den Autoloader (bootstrap.php)
      2. routes.php liefert den Router mit allen Routen
      3. CheckoutController::store holt den Warenkorb aus der Session
      4. PriceCalculator berechnet Rabatt, Versand und Summe (gibt OrderSummary zurück)
      5. Der Controller meldet das Event OrderPlaced
      6. SendOrderConfirmation reagiert und protokolliert die Bestätigung
      EOF
      ```
    solve: |
      cat >> NOTES.md <<'MD'

      ## Request-Ablauf: POST /checkout
      1. public/index.php lädt den Autoloader (bootstrap.php)
      2. routes.php liefert den Router mit allen Routen
      3. CheckoutController::store holt den Warenkorb aus der Session
      4. PriceCalculator berechnet Rabatt, Versand und Summe (gibt OrderSummary zurück)
      5. Der Controller meldet das Event OrderPlaced
      6. SendOrderConfirmation reagiert und protokolliert die Bestätigung
      MD
  - id: muster
    title: Die Muster benennen
    description: |
      Ergänze einen Abschnitt `## Muster`. Erkläre in je einem Satz die Rolle dieser drei Klassen und nenne das
      Muster dahinter:

      - `OrderSummary` (DTO)
      - `OrderPlaced` (Event)
      - `SendOrderConfirmation` (Listener)
    checklist:
      - Drei Klassen mit ihrem Muster
      - Je ein Satz zur Rolle
    hints:
      - Ein DTO transportiert Daten ohne Logik, ein Event meldet etwas, ein Listener reagiert.
    checks:
      - type: command
        run: |
