  - id: herkunft
    title: Den verursachenden Commit finden
    description: |
      Ein guter Fix erklärt, woher ein Fehler kommt. Finde den Commit, der ihn eingeführt hat.

      1. Nutze `git blame` auf die Zeile mit dem Vergleich oder `git log -S FREE_SHIPPING_FROM`.
      2. Sieh dir den Commit mit `git show` an.
      3. Ergänze einen Abschnitt `## Herkunft` mit dem Hash des Commits (mindestens 7 Zeichen), seiner
         Ticket-ID und einem Satz, was in diesem Commit schiefging.
    checklist:
      - Commit mit blame oder log -S gefunden
      - Diff mit git show gelesen
      - Hash und Ticket-ID notiert
    hints:
      - "`git blame -L 21,21 src/Service/PriceCalculator.php` zeigt den Commit der letzten Änderung."
      - "Die Ticket-ID steht unter dem Betreff: `git show -s <hash>`."
    checks:
      - type: command
        run: |
          s=$(awk '/^## Herkunft/{f=1;next} /^## /{f=0} f' NOTES.md)
          h=$(git log -S FREE_SHIPPING_FROM --reverse --format=%H | head -n 1)
          for w in $(echo "$s" | grep -oE '[0-9a-f]{7,40}'); do
            case "$h" in "$w"*) echo ok; exit 0;; esac
          done
          exit 1
        stdout_equals: ok
        message: Im Abschnitt „## Herkunft“ fehlt der Hash des verursachenden Commits (mindestens 7 Zeichen, kleingeschrieben). Der Commit mit dem roten Test hat den Fehler nur sichtbar gemacht.
      - type: command
        run: awk '/^## Herkunft/{f=1;next} /^## /{f=0} f' NOTES.md | grep -c 'KIEZ-17'
        stdout_matches: "^\\s*[1-9]"
        message: Im Abschnitt „## Herkunft“ fehlt die Ticket-ID aus der Commit-Message des verursachenden Commits.
    solution: |
      ```bash
      git blame -L 21,21 src/Service/PriceCalculator.php
      git show 862c991
      cat >> NOTES.md <<'EOF'

      ## Herkunft
      - Commit 862c991 (Tom Muster, 2026-04-08): refactor(pricing): extract shipping constants, Refs: KIEZ-17
      - Beim Auslagern von 5000 in FREE_SHIPPING_FROM wurde aus >= versehentlich >.
      EOF
      ```
    solve: |
      hash=$(git log -S FREE_SHIPPING_FROM --reverse --format=%H | head -n 1 | cut -c1-12)
      betreff=$(git log -1 --format=%s "$hash")
      cat >> NOTES.md <<MD

      ## Herkunft
      - Commit ${hash}: ${betreff}, Refs: KIEZ-17
      - Beim Auslagern von 5000 in FREE_SHIPPING_FROM wurde aus >= versehentlich >.
      MD
  - id: fixen
    title: Den Fehler beheben
    description: |
      Jetzt änderst du endlich Code – genau eine Stelle.

      1. Korrigiere in `src/Service/PriceCalculator.php` den Vergleich, sodass der Versand **ab** 5000 Cent
         kostenlos ist. Die Konstanten `FREE_SHIPPING_FROM` und `SHIPPING_COST` bleiben erhalten.
      2. Führe die Tests aus. Alle sechs müssen grün sein.
      3. Ändere **keine** Tests – der rote Test ist die Anforderung.
    checklist:
      - Vergleich korrigiert, Konstanten erhalten
      - Alle Tests grün
      - Tests unverändert
    hints:
      - Aus `>` muss `>=` werden.
      - "`sed -i 's/> self::FREE_SHIPPING_FROM/>= self::FREE_SHIPPING_FROM/' src/Service/PriceCalculator.php` erledigt das in einem Schritt – oder du nutzt nano."
    checks:
      - type: command
        run: php tests/run.php | tail -n 1
        stdout_equals: "6 bestanden, 0 fehlgeschlagen"
        message: Noch sind nicht alle Tests grün. Führe php tests/run.php aus und prüfe den Vergleich im PriceCalculator.
      - type: command
        run: |
          c=$(git log --format=%H --grep='cover free shipping boundary' | tail -n 1)
          git diff --quiet "$c" -- tests && echo ok
        stdout_equals: ok
        message: Du hast Dateien im Ordner tests geändert. Stelle sie mit git restore tests bzw. git checkout <commit> -- tests wieder her – geändert wird der Code, nicht die Anforderung.
      - type: command
        run: grep -c 'FREE_SHIPPING_FROM' src/Service/PriceCalculator.php
        stdout_matches: "^\\s*([2-9]|[1-9][0-9])\\s*$"
        message: Die Konstante FREE_SHIPPING_FROM soll erhalten bleiben und weiterhin im Vergleich benutzt werden.
    solution: |
      ```bash
      sed -i 's/> self::FREE_SHIPPING_FROM/>= self::FREE_SHIPPING_FROM/' src/Service/PriceCalculator.php
      git diff
      make test
      ```
    solve: |
      sed -i 's/> self::FREE_SHIPPING_FROM/>= self::FREE_SHIPPING_FROM/' src/Service/PriceCalculator.php
      php tests/run.php > /dev/null
  - id: committen
    title: Fix und Notizen committen
    description: |
      Zum Schluss committest du deine Arbeit so, dass die nächste Person sie in der Historie wiederfindet.

      1. Committe den Fix mit einer Nachricht vom Typ `fix`, z. B. `fix(pricing): ship for free from exactly 50 euro`,
         und füge im Nachrichtentext die Zeile `Refs: KIEZ-23` hinzu (zweites `-m`).
      2. Committe auch `NOTES.md` – im selben oder in einem eigenen `docs`-Commit.
      3. Am Ende ist nichts in `src`, `tests` oder `NOTES.md` mehr ungespeichert.
    checklist:
      - fix-Commit mit Verweis auf KIEZ-23
      - NOTES.md committet
      - Arbeitsverzeichnis sauber
    hints:
      - "`git commit -m \"fix(pricing): ship for free from exactly 50 euro\" -m \"Refs: KIEZ-23\"` erzeugt Betreff und Nachrichtentext."
      - "`git status` zeigt, was noch fehlt."
    checks:
      - type: command
        run: |
          c=$(git log --format=%H --grep='cover free shipping boundary' | tail -n 1)
          git merge-base --is-ancestor "$c" HEAD && git log --format=%s "$c"..HEAD -- src/Service/PriceCalculator.php | grep -cE '^fix(\([^()]+\))?!?: \S'
        stdout_matches: "^\\s*[1-9]"
        message: "Es fehlt ein Commit vom Typ fix, der src/Service/PriceCalculator.php ändert – oben auf der bisherigen Historie, z. B. „fix(pricing): ship for free from exactly 50 euro“."
      - type: command
        run: |
          c=$(git log --format=%H --grep='cover free shipping boundary' | tail -n 1)
          git log --format=%B "$c"..HEAD | grep -c 'KIEZ-23'
        stdout_matches: "^\\s*[1-9]"
        message: In deinen neuen Commits fehlt der Verweis auf das Ticket. Ergänze im fix-Commit die Zeile „Refs KIEZ-23“ im Nachrichtentext, z. B. mit git commit --amend.
      - type: command
        run: git ls-files NOTES.md
        stdout_equals: NOTES.md
        message: NOTES.md ist noch nicht committet.
      - type: command
        run: git status --porcelain -- src tests NOTES.md | wc -l
        stdout_matches: "^\\s*0\\s*$"
        message: In src, tests oder NOTES.md gibt es noch ungespeicherte Änderungen. Prüfe mit git status und committe sie.
    solution: |
      ```bash
      git add src/Service/PriceCalculator.php
      git commit -m "fix(pricing): ship for free from exactly 50 euro" -m "Refs: KIEZ-23"
      git add NOTES.md
      git commit -m "docs: add onboarding notes"
      git log --oneline -3
      git status
      ```
    solve: |
      git add src/Service/PriceCalculator.php
      git commit -q -m "fix(pricing): ship for free from exactly 50 euro" -m "Refs: KIEZ-23"
      git add NOTES.md
      git commit -q -m "docs: add onboarding notes"
