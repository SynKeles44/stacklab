  - module: code-archaeologie
    id: pruefung-ticket-ids
    type: code
    language: php
    title: Ticket-IDs aus einer Historie sammeln
    description: |
      Für einen Bericht sollen alle Tickets gesammelt werden, die in einer Git-Historie erwähnt werden.

      Schreibe `ticketIds(string $log): array`. Die Funktion bekommt die Ausgabe von `git log` als Text und gibt
      alle Ticket-IDs der Form `KIEZ-` plus Zahl zurück:

      - jede ID nur einmal,
      - aufsteigend nach der Zahl sortiert,
      - bei keinem Treffer ein leeres Array.
    starter: |
      <?php
      function ticketIds(string $log): array
      {
          return [];
      }
    tests:
      - name: Findet und sortiert IDs
        code: "assert_same(['KIEZ-12', 'KIEZ-17'], ticketIds(\"fix: a\\nRefs: KIEZ-17\\nfeat: b\\nRefs: KIEZ-12\"));"
      - name: Entfernt doppelte IDs
        code: "assert_same(['KIEZ-23'], ticketIds('KIEZ-23 and again KIEZ-23'));"
      - name: Leerer Text ergibt leeres Array
        code: "assert_same([], ticketIds(''));"
      - name: Sortiert numerisch, nicht alphabetisch
        code: "assert_same(['KIEZ-9', 'KIEZ-10'], ticketIds('KIEZ-10 KIEZ-9'));"
    hints:
      - "`preg_match_all('/KIEZ-(\\d+)/', $log, $m)` liefert in `$m[1]` alle Zahlen."
      - "`array_unique`, `sort` mit Zahlen und `array_map` für das Präfix bringen dich ans Ziel."
    solution: |
      <?php
      function ticketIds(string $log): array
      {
          preg_match_all('/KIEZ-(\d+)/', $log, $matches);
          $numbers = array_unique(array_map('intval', $matches[1]));
          sort($numbers);

          return array_map(fn (int $n): string => 'KIEZ-' . $n, $numbers);
      }
