title: Abschlussprüfung – Fremden Code lesen und verstehen
description: |
  Diese Prüfung deckt alle vier Module ab: das Ankommen in einem neuen Projekt, Orientierung und Suche,
  Code-Archäologie mit Git sowie das Erkennen von Mustern und das Festhalten von Wissen. Zuerst beantwortest
  du Fragen, danach löst du drei Praxis-Aufgaben – zwei im echten Übungs-Terminal am Kiezladen, eine als
  Programmieraufgabe.

  Du bestehst mit 70 Prozent. Nach der Auswertung siehst du, in welchen Modulen du noch Lücken hast.
time_limit_minutes: 50
pass_percent: 70
questions:
  # --- Ankommen ---
  - module: ankommen
    type: single
    question: Du übernimmst ein Ticket in einem Projekt, das du nie gesehen hast. Was tust du als Erstes?
    options:
      - Den Code ab der ersten Datei alphabetisch lesen.
      - README lesen, die Befehle zum Testen finden und die Tests einmal ausführen.
      - Die verdächtige Stelle sofort umschreiben.
      - Alle Abhängigkeiten auf die neueste Version aktualisieren.
    answer: 1
    explanation: >
      README, Befehle und ein erster Testlauf geben dir in Minuten Überblick und eine Ausgangslage, gegen die du
      jede spätere Änderung prüfen kannst.
  - module: ankommen
    type: match
    question: Ordne jedem Projekt den Ort zu, an dem du seine Befehle findest.
    pairs:
      - { left: "Node-Projekt", right: "scripts in package.json" }
      - { left: "Projekt mit Makefile", right: "Targets im Makefile" }
      - { left: "Laravel-Projekt", right: "php artisan list" }
      - { left: "PHP-Projekt mit Composer", right: "scripts in composer.json" }
    explanation: Diese Dateien sind die Bedienungsanleitung eines Projekts – dort stehen Starten, Testen und Bauen.
  - module: ankommen
    type: multiple
    question: Welche Dateien sind typische Einstiegspunkte?
    options:
      - "`public/index.php` einer PHP-Webanwendung"
      - "`src/main.tsx` einer React-App mit Vite"
      - "`vendor/autoload.php`"
      - "`artisan` in einem Laravel-Projekt"
    answers: [0, 1, 3]
    explanation: >
      `vendor/autoload.php` wird zwar früh geladen, ist aber Teil der installierten Pakete und kein Einstiegspunkt
      des eigenen Codes.
  - module: ankommen
    type: find-bug
    question: Ein Formular schickt `POST /checkout`. Trotzdem antwortet der Shop mit „Seite nicht gefunden“. In welcher Zeile steckt der Fehler?
    language: php
    code: |
      $router = new Router();
      $router->get("/products", [new Controller\ProductController(), "index"]);
      $router->post("/cart/add", [new Controller\CartController(), "add"]);
      $router->get("/checkout", [new Controller\CheckoutController(), "store"]);
      return $router;
    bug_line: 4
    explanation: Die Route ist für GET registriert. Ein POST-Request findet unter dieser Methode keinen Handler.
  # --- Orientieren ---
  - module: orientieren
    type: single
    question: "Im Browser steht „Zwischensumme: 2829 Cent“. Mit welcher Suche findest du die Stelle im Code am zuverlässigsten?"
    options:
      - "`grep -rn \"Zwischensumme: 2829 Cent\" src`"
      - "`grep -rn \"Zwischensumme\" src`"
      - "`find src -name Zwischensumme`"
      - "`grep -rn \"Cent\" src`"
    answer: 1
    explanation: >
      Die Zahl wird zur Laufzeit eingesetzt und steht nicht im Code. „Cent“ trifft viel zu oft. Der feste, seltene
      Teil „Zwischensumme“ führt direkt zum CartController.
  - module: orientieren
    type: cloze
    text: "`grep -___ \"Gutschein\" src` durchsucht den Ordner rekursiv mit Zeilennummern. Nur Dateien, die Git verfolgt, durchsucht `git ___`."
    blanks:
      - [rn, nr]
      - [grep]
    explanation: "`-r` steht für rekursiv, `-n` für Zeilennummern. `git grep` lässt ignorierte Ordner wie vendor automatisch weg."
  - module: orientieren
    type: single
    question: "„Find Usages“ findet keinen Aufruf von `CartController::add()`. Was folgt daraus?"
    options:
      - Die Methode ist tot und kann gelöscht werden.
      - Nichts Sicheres – sie kann dynamisch aufgerufen werden, etwa über den String "add" in den Routen. Eine Textsuche ergänzt die IDE.
      - Die IDE ist kaputt und muss neu installiert werden.
      - Die Methode wird nur in Tests verwendet.
    answer: 1
    explanation: >
      Methodennamen als String, variable Funktionen und Framework-Magie entgehen der statischen Analyse. Vor dem
      Löschen prüfst du zusätzlich mit grep.
  - module: orientieren
    type: multiple
    question: Was gehört zu einer guten mentalen Landkarte einer Webanwendung?
    options:
      - Die Schichten, die du an den Ordnern erkennst.
      - Ein Request, den du vom Einstiegspunkt bis zur Antwort verfolgt hast.
      - Der Quellcode des Frameworks in vendor/, Zeile für Zeile.
      - Eine Skizze oder ein Sequenzdiagramm der Stationen.
    answers: [0, 1, 3]
    explanation: Fremde Pakete behandelst du als Blackbox. Die Landkarte zeigt die Hauptwege deiner Anwendung.
  # --- Code-Archäologie ---
  - module: code-archaeologie
    type: match
    question: Ordne jeder Frage den passenden Befehl zu.
    pairs:
      - { left: "Wer hat Zeile 21 zuletzt geändert?", right: "git blame -L 21,21 datei.php" }
      - { left: "Welcher Commit hat FREE_SHIPPING_FROM eingeführt?", right: "git log -S FREE_SHIPPING_FROM" }
      - { left: "Wie sah die Datei vor diesem Commit aus?", right: "git show <hash>^:datei.php" }
      - { left: "Welche Commits erwähnen voucher in der Message?", right: "git log --grep=voucher" }
    explanation: blame arbeitet zeilenweise, -S durchsucht Code-Änderungen, --grep die Messages, `<hash>^:pfad` zeigt alte Stände.
  - module: code-archaeologie
    type: single
    question: "`git blame` zeigt für eine fehlerhafte Zeile einen Commit „style: reformat code“. Was tust du?"
    options:
      - Die Person aus diesem Commit verantwortlich machen.
      - Hinter den Commit zurückblicken, z. B. mit `git blame <hash>^ -- datei` oder `git blame -w`.
      - Aufgeben, weil die Historie zerstört ist.
      - Den Commit mit git reset entfernen.
    answer: 1
    explanation: >
      blame zeigt die letzte Änderung – bei reiner Formatierung nicht die eigentliche Entscheidung. Mit `<hash>^`
      oder `-w` gehst du weiter zurück.
  - module: code-archaeologie
    type: cloze
    text: Ein Test, der sicherstellt, dass ein behobener Fehler nicht zurückkommt, heißt ___test. Tests sind meist nach dem Muster Arrange, Act, ___ aufgebaut.
    blanks:
      - [Regressions, Regression]
      - [Assert]
    explanation: Arrange stellt die Ausgangslage her, Act führt die Aktion aus, Assert prüft das Ergebnis.
  - module: code-archaeologie
    type: single
    question: Ein Test erwartet bei 5000 Cent kostenlosen Versand, der Code berechnet 495 Cent. Es gibt keinen Hinweis, dass sich die Regel geändert hat. Was ist richtig?
    options:
      - Den Test auf 495 ändern, damit er grün wird.
      - Den Code ändern – der Test beschreibt die Anforderung.
      - Den Test löschen.
      - Beides so lassen.
    answer: 1
    explanation: >
      Ein Test ist eine ausführbare Anforderung. Bei einem Bug ändert sich der Code. Nur wenn sich die Anforderung
      wirklich geändert hat – geklärt mit dem Team –, passt man den Test an.
  # --- Verstehen und festhalten ---
  - module: verstehen-und-festhalten
    type: match
    question: Ordne jedem Muster seine Rolle zu.
    pairs:
      - { left: "Service", right: "Enthält Geschäftslogik" }
      - { left: "DTO", right: "Transportiert Daten ohne Logik" }
      - { left: "Listener", right: "Reagiert auf ein Ereignis" }
      - { left: "Repository", right: "Lädt und speichert Daten" }
    explanation: Wer die Rolle eines Musters kennt, versteht eine Klasse schon zur Hälfte, bevor er sie liest.
  - module: verstehen-und-festhalten
    type: single
    question: "`public function __construct(private ProductRepository $products) {}` – welches Prinzip siehst du?"
    options:
      - Vererbung
      - Dependency Injection
      - Ein Event
      - Ein Singleton
    answer: 1
    explanation: Die Klasse bekommt ihre Abhängigkeit von außen übergeben, statt sie selbst mit new zu erzeugen.
  - module: verstehen-und-festhalten
    type: multiple
    question: Welche Bestandteile hat eine gute Frage an das Team?
    options:
      - Woran du arbeitest und was du beobachtest.
      - Was du schon herausgefunden hast, mit Fundstelle.
      - Deine Vermutung und eine konkrete, schnell beantwortbare Frage.
      - Wer den Fehler verursacht hat.
    answers: [0, 1, 2]
    explanation: Eine gute Frage ermöglicht eine Antwort ohne Rückfrage. Schuldzuweisungen helfen niemandem.
  - module: verstehen-und-festhalten
    type: single
    question: Welcher Abschnitt eines ADR erklärt späteren Leser:innen, warum eine Entscheidung damals sinnvoll war?
    options:
      - Status
      - Kontext
      - Titel
      - Dateiname
    answer: 1
    explanation: Der Kontext beschreibt Problem und Rahmenbedingungen. Ohne ihn wirkt eine alte Entscheidung oft willkürlich.
tasks:
  - module: code-archaeologie
    id: pruefung-regression
    type: terminal
    title: Die Tests sind wieder rot
    description: |
      Klicke zuerst auf **Aufgabe vorbereiten**. Im Ordner `pruefung-regression` liegt eine neuere Version des
      Kiezladens: Der Versandfehler ist inzwischen behoben, danach kamen weitere Commits. Jetzt ist wieder ein
      Test rot.

      1. Führe die Tests aus und finde heraus, welcher Test fehlschlägt.
      2. Finde den Commit, der den Fehler eingeführt hat, und schreibe seinen Hash (mindestens 7 Zeichen) in
         `antwort.txt`.
      3. Behebe den Fehler im Code, sodass alle Tests grün sind. Ändere keine Tests.
    workdir: pruefung-regression
    setup: |
      # Beispielprojekt "Kiezladen" mit fester Git-Historie (10 Commits)
      git init -q -b main
      git config user.name "Stacklab"
      git config user.email "stacklab@example.com"
      commit() {
        if [ "$1" = tom ]; then n="Tom Muster"; else n="Mira Beispiel"; fi
        git add -A
        GIT_AUTHOR_NAME="$n" GIT_AUTHOR_EMAIL="$1@example.com" GIT_AUTHOR_DATE="$2" \
        GIT_COMMITTER_NAME="$n" GIT_COMMITTER_EMAIL="$1@example.com" GIT_COMMITTER_DATE="$2" \
        git commit -q -m "$3" ${4:+-m "$4"}
      }
      routes() {
        { printf '<?php\ndeclare(strict_types=1);\n\nnamespace Kiez;\n\n$router = new Router();\n'
          printf '%s\n' "$@"; printf '\nreturn $router;\n'; } > src/routes.php
      }
      R1='$router->get("/", fn () => "Willkommen im Kiezladen – versandkostenfrei ab 50 €");'
      R2='$router->get("/products", [new Controller\ProductController(), "index"]);'
      R3='$router->get("/cart", [new Controller\CartController(), "show"]);
      $router->post("/cart/add", [new Controller\CartController(), "add"]);'
      R4='$router->post("/checkout", [new Controller\CheckoutController(), "store"]);'
      mkdir -p public src/Controller src/Service src/Repository src/Dto src/Event src/Listener tests
      printf '# Kiezladen\n\nEin kleiner Online-Shop für den Laden um die Ecke.\n' > README.md
      printf '.PHONY: serve test\n\nserve:\n\tphp -S localhost:8000 -t public\n\ntest:\n\tphp tests/run.php\n' > Makefile
      cat > public/index.php <<'EOF'
      <?php
      declare(strict_types=1);

      require __DIR__ . '/../src/bootstrap.php';

      $router = require __DIR__ . '/../src/routes.php';
      echo $router->dispatch($_SERVER['REQUEST_METHOD'], parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH));
      EOF
      cat > src/bootstrap.php <<'EOF'
      <?php
      declare(strict_types=1);

      spl_autoload_register(function (string $class): void {
          $file = __DIR__ . '/' . str_replace(['Kiez\\', '\\'], ['', '/'], $class) . '.php';
          if (is_file($file)) {
              require $file;
          }
      });
      EOF
      cat > src/Router.php <<'EOF'
      <?php
      declare(strict_types=1);

      namespace Kiez;

      final class Router
      {
          private array $routes = [];

          public function get(string $path, callable $handler): void
          {
              $this->routes['GET'][$path] = $handler;
          }

          public function post(string $path, callable $handler): void
          {
              $this->routes['POST'][$path] = $handler;
          }

          public function dispatch(string $method, string $path): string
          {
              $handler = $this->routes[$method][$path] ?? null;
              if ($handler === null) {
                  http_response_code(404);
                  return 'Seite nicht gefunden';
              }
              return $handler();
          }
      }
      EOF
      routes "$R1"
      commit mira 2026-03-02T09:15:00+01:00 "chore: initial project skeleton"
      cat > src/Repository/ProductRepository.php <<'EOF'
      <?php
      declare(strict_types=1);

      namespace Kiez\Repository;

      final class ProductRepository
      {
          private const PRODUCTS = [
              1 => ['name' => 'Kaffee Hausmischung', 'price' => 1290],
              2 => ['name' => 'Bio-Hafermilch', 'price' => 249],
              3 => ['name' => 'Kiez-Tasse', 'price' => 1500],
          ];

          public function all(): array
          {
              return self::PRODUCTS;
          }

          public function find(int $id): ?array
          {
              return self::PRODUCTS[$id] ?? null;
          }
      }
      EOF
      cat > src/Controller/ProductController.php <<'EOF'
      <?php
      declare(strict_types=1);

      namespace Kiez\Controller;

      use Kiez\Repository\ProductRepository;

      final class ProductController
      {
          public function index(): string
          {
              $lines = [];
              foreach ((new ProductRepository())->all() as $id => $product) {
                  $lines[] = sprintf('%d: %s (%d Cent)', $id, $product['name'], $product['price']);
              }
              return implode("\n", $lines);
          }
      }
      EOF
      routes "$R1" "$R2"
      commit mira 2026-03-04T14:40:00+01:00 "feat(catalog): list products"
      cat > src/Service/Cart.php <<'EOF'
      <?php
      declare(strict_types=1);

      namespace Kiez\Service;

      use Kiez\Repository\ProductRepository;

      final class Cart
      {
          private array $items = [];

          public function __construct(private ProductRepository $products)
          {
          }

          public function add(int $productId, int $quantity = 1): void
          {
              if ($this->products->find($productId) === null) {
                  throw new \InvalidArgumentException('Produkt nicht gefunden');
              }
              $this->items[$productId] = ($this->items[$productId] ?? 0) + $quantity;
          }

          public function subtotal(): int
          {
              $sum = 0;
              foreach ($this->items as $id => $quantity) {
                  $sum += $this->products->find($id)['price'] * $quantity;
              }
              return $sum;
          }
      }
      EOF
      cat > src/Controller/CartController.php <<'EOF'
      <?php
      declare(strict_types=1);

      namespace Kiez\Controller;

      use Kiez\Repository\ProductRepository;
      use Kiez\Service\Cart;

      final class CartController
      {
          public static function cart(): Cart
          {
              session_start();
              return $_SESSION['cart'] ??= new Cart(new ProductRepository());
          }

          public function show(): string
          {
              return sprintf('Zwischensumme: %d Cent', self::cart()->subtotal());
          }

          public function add(): string
          {
              self::cart()->add((int) ($_POST['product_id'] ?? 0));
              return 'Zum Warenkorb hinzugefügt';
          }
      }
      EOF
      routes "$R1" "$R2" "$R3"
      commit tom 2026-03-09T11:05:00+01:00 "feat(cart): add cart and endpoints"
      cat > tests/run.php <<'EOF'
      <?php
      declare(strict_types=1);

      require __DIR__ . '/../src/bootstrap.php';

      function expect_same(mixed $expected, mixed $actual): void
      {
          if ($expected !== $actual) {
              throw new RuntimeException('erwartet ' . var_export($expected, true) . ', bekommen ' . var_export($actual, true));
          }
      }

      $passed = 0;
      $failed = 0;
      foreach (glob(__DIR__ . '/*Test.php') as $file) {
          foreach (require $file as $name => $test) {
              try {
                  $test();
                  $passed++;
                  echo "  ok    $name\n";
              } catch (Throwable $e) {
                  $failed++;
                  echo "  FAIL  $name: {$e->getMessage()}\n";
              }
          }
      }
      echo "\n$passed bestanden, $failed fehlgeschlagen\n";
      exit($failed > 0 ? 1 : 0);
      EOF
      cat > tests/CartTest.php <<'EOF'
      <?php
      declare(strict_types=1);

      use Kiez\Repository\ProductRepository;
      use Kiez\Service\Cart;

      return [
          'cart sums up price times quantity' => function (): void {
              $cart = new Cart(new ProductRepository());
              $cart->add(1, 2);
              $cart->add(2);
              expect_same(2829, $cart->subtotal());
          },
          'cart rejects unknown products' => function (): void {
              try {
                  (new Cart(new ProductRepository()))->add(99);
              } catch (InvalidArgumentException) {
                  return;
              }
              throw new RuntimeException('keine Exception für Produkt 99');
          },
      ];
      EOF
      commit tom 2026-03-12T16:30:00+01:00 "test: add tiny test runner and cart tests"
      cat > src/Dto/OrderSummary.php <<'EOF'
