  checks:
    - type: command
      run: ls docs/adr/0001-*.md | wc -l
      stdout_matches: "^\\s*1\\s*$"
      message: Es fehlt genau eine Datei docs/adr/0001-….md.
    - type: command
      run: head -n 1 docs/adr/0001-*.md
      stdout_matches: "^# \\S"
      message: Die erste Zeile des ADR soll eine Überschrift sein, z. B. „# 1. Bestellbestätigung per Event“.
    - type: command
      run: grep -cE '^Status:\s*angenommen\s*$|^## (Kontext|Entscheidung|Konsequenzen)\s*$' docs/adr/0001-*.md
      stdout_matches: "^\\s*4\\s*$"
      message: "Im ADR fehlen Teile. Nötig sind die Zeile „Status: angenommen“ und die Abschnitte „## Kontext“, „## Entscheidung“ und „## Konsequenzen“ – jeweils genau einmal."
    - type: command
      run: |
        s=$(awk '/^## Entscheidung/{f=1;next} /^## /{f=0} f' docs/adr/0001-*.md)
        echo "$s" | grep -q OrderPlaced && echo "$s" | grep -q SendOrderConfirmation && echo ok
      stdout_equals: ok
      message: Im Abschnitt „## Entscheidung“ müssen beide Namen vorkommen – das Event OrderPlaced und der Listener SendOrderConfirmation.
    - type: command
      run: git log -1 --format=%s
      stdout_matches: "^docs(\\([^()\\s]+\\))?!?: \\S"
      message: 'Der letzte Commit braucht eine Nachricht vom Typ docs, z. B. "docs(adr): record order confirmation via event".'
    - type: command
      run: git status --porcelain -- docs | wc -l
      stdout_matches: "^\\s*0\\s*$"
      message: Das ADR ist noch nicht (vollständig) committet. Prüfe mit git status.
  hints:
    - "`mkdir -p docs/adr` legt beide Ordner auf einmal an."
    - "Orientiere dich an der Vorlage aus der Lektion: Überschrift, Status-Zeile, dann Kontext, Entscheidung, Konsequenzen."
    - "Danach: `git add docs` und `git commit -m \"docs(adr): record order confirmation via event\"`."
  solution: |
    ```bash
    cd kiezladen-adr
    mkdir -p docs/adr
    cat > docs/adr/0001-bestellbestaetigung-per-event.md <<'EOF'
    # 1. Bestellbestätigung per Event

    Status: angenommen

    ## Kontext
    Nach einer Bestellung sollen Nebenwirkungen passieren, zum Beispiel eine Bestätigung.
    Der Checkout soll davon nichts wissen müssen und übersichtlich bleiben.

    ## Entscheidung
    Der CheckoutController meldet das Event OrderPlaced. Der Listener SendOrderConfirmation
    reagiert darauf und verschickt die Bestätigung.

    ## Konsequenzen
    Neue Reaktionen auf Bestellungen brauchen nur einen weiteren Listener.
    Wer den Ablauf verstehen will, muss nach den Listenern eines Events suchen.
    EOF
    git add docs
    git commit -m "docs(adr): record order confirmation via event"
    ```
