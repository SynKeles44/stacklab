    commit tom 2026-04-22T15:00:00+02:00 "test(pricing): cover free shipping boundary" "Customer report: orders of exactly 50.00 EUR are charged shipping. Refs: KIEZ-23"
  checks:
    - type: file_exists
      path: befund.md
      message: Lege die Datei befund.md an.
    - type: file_contains
      path: befund.md
      pattern: "^Test:\\s*`?orders of exactly 50 euro ship for free`?\\s*$"
      message: "Die Zeile „Test:“ fehlt oder der Testname stimmt nicht. Führe die Tests aus und kopiere den Namen des roten Tests."
    - type: command
      run: |
        a=$(sed -n 's/^Commit:[[:space:]]*`\{0,1\}\([0-9a-fA-F]*\).*/\1/p' befund.md | head -n 1 | tr 'A-F' 'a-f')
        h=$(git log -S FREE_SHIPPING_FROM --reverse --format=%H | head -n 1)
        [ ${#a} -ge 7 ] && [ "${h#"$a"}" != "$h" ] && echo ok
      stdout_equals: ok
      message: "Die Zeile „Commit:“ fehlt oder der Hash zeigt nicht auf den verursachenden Commit. Der Commit mit dem Test hat den Fehler nur sichtbar gemacht – nutze git blame auf die Vergleichszeile im PriceCalculator."
    - type: file_contains
      path: befund.md
      pattern: "^Autor:\\s*Tom Muster\\s*$"
      message: "Die Zeile „Autor:“ fehlt oder der Name stimmt nicht. git show --format='%an' -s <hash> zeigt die Autorin oder den Autor."
    - type: file_contains
      path: befund.md
      pattern: "^Ticket:\\s*KIEZ-17\\s*$"
      message: "Die Zeile „Ticket:“ fehlt oder die ID stimmt nicht. Sie steht in der Commit-Message des verursachenden Commits, nicht in KIEZ-23."
    - type: command
      run: git status --porcelain | grep -v '^?? befund.md$' | wc -l
      stdout_matches: "^\\s*0\\s*$"
      message: Du hast Projektdateien geändert. Setze sie mit git restore zurück – der Befund ist reine Lesearbeit.
  hints:
    - "`make test` zeigt den roten Test. Er prüft den Wert 5000 – sieh dir an, welche Zeile im `PriceCalculator` die Versandkosten berechnet."
    - "`git blame -L 21,21 src/Service/PriceCalculator.php` oder `git log -S FREE_SHIPPING_FROM --oneline` führt zum verursachenden Commit."
    - "`git show -s 862c991` zeigt Autor und vollständige Message samt Ticket-ID."
  solution: |
    ```bash
    cd kiezladen-detektiv
    make test
    git blame -L 21,21 src/Service/PriceCalculator.php
    git show -s 862c991
    cat > befund.md <<'EOF'
    Test: orders of exactly 50 euro ship for free
    Commit: 862c991
    Autor: Tom Muster
    Ticket: KIEZ-17
    EOF
    ```
