  - id: logging-einbauen
    title: Logging mit Log-Level einbauen
    description: |
      Beim nächsten Fehler willst du nicht wieder `console.error` einbauen müssen. Baue deshalb ein kleines
      Logging in `kassenbuch.js` ein:

      1. Schreibe eine Funktion `log(level, nachricht)` mit den Leveln `debug`, `info`, `warn` und `error`.
      2. Die Umgebungsvariable `LOG_LEVEL` legt die Schwelle fest; ohne sie gilt `info`. Geschrieben wird, was
         gleich wichtig oder wichtiger als die Schwelle ist.
      3. Log-Zeilen gehen auf **stderr** und haben die Form `[debug] …`.
      4. Logge direkt nach dem Laden mit dem Level `debug`: `<anzahl> Buchungen geladen aus <datei>`.

      Erwartet: `LOG_LEVEL=debug node kassenbuch.js summe` zeigt auf stderr
      `[debug] 8 Buchungen geladen aus daten/buchungen.csv`, auf stdout weiterhin nur die Summe. Ohne
      `LOG_LEVEL` erscheint die debug-Zeile nicht.
    checklist:
      - log()-Funktion mit Schwelle aus LOG_LEVEL
      - debug-Meldung nach dem Laden
      - Log-Zeilen auf stderr, stdout unverändert
    hints:
      - "`const LEVELS = ['debug', 'info', 'warn', 'error'];` – über `LEVELS.indexOf(level)` vergleichst du die Wichtigkeit."
      - "`if (LEVELS.indexOf(level) >= LEVELS.indexOf(process.env.LOG_LEVEL ?? 'info')) console.error(`[${level}] ${nachricht}`);`"
    checks:
      - type: command
        run: LOG_LEVEL=debug node kassenbuch.js summe 2>&1 >/dev/null
        stdout_matches: "\\[debug\\] 8 Buchungen geladen aus daten/buchungen\\.csv"
        message: "Mit LOG_LEVEL=debug soll auf stderr `[debug] 8 Buchungen geladen aus daten/buchungen.csv` erscheinen."
      - type: command
        run: LOG_LEVEL=debug node kassenbuch.js summe 2>/dev/null
        stdout_equals: "Summe: 1379,10 €"
        message: Auf stdout darf weiterhin nur die Summe stehen – Log-Zeilen gehören auf stderr (console.error).
      - type: command
        run: node kassenbuch.js summe 2>&1 | grep -c '^\[debug\]' || true
        stdout_equals: "0"
        message: Ohne LOG_LEVEL gilt die Schwelle info – debug-Zeilen dürfen dann nicht erscheinen.
    solution: |
      ```js
      const LEVELS = ['debug', 'info', 'warn', 'error'];

      function log(level, nachricht) {
        const schwelle = LEVELS.indexOf(process.env.LOG_LEVEL ?? 'info');
        if (LEVELS.indexOf(level) >= schwelle) {
          console.error(`[${level}] ${nachricht}`);
        }
      }

      // in main() direkt nach dem Laden:
      log('debug', `${buchungen.length} Buchungen geladen aus ${datei}`);
      ```
    solve: |
      cat > kassenbuch.js <<'JS'
      const { ladeBuchungen, summe, findeBuchung, nachKategorie } = require('./src/buchungen');
      const { formatBetrag } = require('./src/betrag');

      const LEVELS = ['debug', 'info', 'warn', 'error'];

      function log(level, nachricht) {
        const schwelle = LEVELS.indexOf(process.env.LOG_LEVEL ?? 'info');
        if (LEVELS.indexOf(level) >= schwelle) {
          console.error(`[${level}] ${nachricht}`);
        }
      }

      async function main() {
        const [befehl, argument] = process.argv.slice(2);
        const datei = process.env.KASSENBUCH_DATEI ?? 'daten/buchungen.csv';
        const buchungen = await ladeBuchungen(datei);
        log('debug', `${buchungen.length} Buchungen geladen aus ${datei}`);

        if (befehl === 'summe') {
          console.log(`Summe: ${formatBetrag(summe(buchungen))} €`);
        } else if (befehl === 'kategorie') {
          const treffer = nachKategorie(buchungen, argument);
          console.log(`${argument}: ${formatBetrag(summe(treffer))} € in ${treffer.length} Buchungen`);
        } else if (befehl === 'zeige') {
          const buchung = findeBuchung(buchungen, Number(argument));
          if (buchung === undefined) {
            log('error', `Buchung ${argument} nicht gefunden`);
            process.exitCode = 1;
            return;
          }
          console.log(`#${buchung.id} ${buchung.datum} ${buchung.text}: ${formatBetrag(buchung.betrag)} €`);
        } else {
          console.error('Befehle: summe | kategorie <name> | zeige <id>');
          process.exitCode = 2;
        }
      }

      main();
      JS
  - id: abschluss
    title: Alle Tests grün und Protokoll vollständig
    description: |
      Zeit für die Abnahme:

      1. Führe die komplette Test-Suite aus: `node --test`. Alle 12 Tests müssen bestehen.
      2. Vervollständige `BUGS.md`: Für jeden der **vier** behobenen Fehler steht eine Zeile mit `Ursache:` –
         was genau war falsch und warum.
      3. Prüfe mit `grep -rn 'console.log(buchungen\|debugger' kassenbuch.js src/`, dass keine
         Debug-Reste übrig sind.

      Herzlichen Glückwunsch – du hast ein fremdes Programm systematisch repariert und dokumentiert.
    checklist:
      - "`node --test` meldet 12 bestandene Tests"
      - BUGS.md enthält für alle vier Fehler eine Ursache
      - Keine Debug-Reste im Code
    hints:
      - Schlägt ein Test aus einem früheren Schritt wieder fehl, lies seine Assertion-Meldung – vielleicht hat eine spätere Änderung etwas kaputt gemacht.
      - "Die vier Ursachen: fehlendes await, parseInt bei Kommabeträgen, Schleife ab 1, String-ID ohne Umwandlung samt fehlender undefined-Prüfung."
    checks:
      - type: command
        run: node --test
        message: "`node --test` meldet noch Fehlschläge. Lies die Ausgabe – welche Datei und welcher Test?"
      - type: command
        run: test "$(grep -c 'Ursache:' BUGS.md)" -ge 4
        message: In BUGS.md fehlen Ursachen. Ergänze für jeden der vier behobenen Fehler eine Zeile mit `Ursache:`.
      - type: command
        run: "! grep -rEq 'debugger;|console\\.(log|error)\\(buchungen\\)' kassenbuch.js src/"
        message: Im Code stecken noch Debug-Reste (debugger; oder eine Ausgabe von buchungen). Entferne sie.
    solution: |
      ```markdown
      - `summe`: bekommen 0,00 € – Ursache: `ladeBuchungen` wurde ohne `await` aufgerufen, `buchungen` war eine Promise.
      - Kommabeträge: Ursache: `parseInt` bricht am Komma ab, richtig ist `Number(text.replace(',', '.'))`.
      - Summe zu klein: Ursache: Die Schleife in `summe()` begann bei Index 1 (Off-by-one).
      - `zeige 3`: Ursache: Die ID aus `process.argv` war ein String, `===` mit der Zahl schlug fehl; zusätzlich fehlte die Prüfung auf `undefined`.
      ```

      ```bash
      node --test     # tests 12, pass 12, fail 0
      ```
    solve: |
      node --test > /dev/null
      grep -rn 'console.log(buchungen\|debugger' kassenbuch.js src/ || true
