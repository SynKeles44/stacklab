      - `zeige 3` findet nichts: Ursache: Die ID aus `process.argv` war ein String, der Vergleich `===` mit der Zahl schlug fehl.
      - `zeige 99` stürzt ab: Ursache: Es fehlte die Prüfung auf `undefined`, bevor auf `buchung.id` zugegriffen wurde.
