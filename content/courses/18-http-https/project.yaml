      curl -i http://127.0.0.1:8080/notizen >> protokoll.txt
      echo >> protokoll.txt
      curl -i -X PATCH --json '{"erledigt":true}' http://127.0.0.1:8080/notizen/1 >> protokoll.txt
      echo >> protokoll.txt
