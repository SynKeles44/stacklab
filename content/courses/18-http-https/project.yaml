  - id: protokoll
    title: Dein Testprotokoll mit curl
    description: |
      Zum Abschluss dokumentierst du, dass deine API funktioniert – so, wie du es in einem Pull Request
      tun würdest. Starte den Server auf Port 8080 und schreibe die Ausgaben von `curl -i` in die Datei
      `protokoll.txt`:

      1. eine Notiz anlegen (`POST` mit `--json`),
      2. die Liste abrufen (`GET /notizen`),
      3. die neue Notiz als erledigt markieren (`PATCH`),
      4. eine unbekannte Notiz abrufen (`404`).

      Mit `>>` hängst du jede Ausgabe an die Datei an. Beende den Server danach mit `kill %1` und lies dir
      das Protokoll in Ruhe durch: Erkennst du jede Statuszeile und jeden Header wieder?
    checklist:
      - protokoll.txt enthält die 201-Antwort mit Location
      - protokoll.txt enthält eine 200-Antwort mit ETag
      - protokoll.txt enthält eine 404-Antwort
    hints:
      - "`curl -i --json '{\"titel\":\"Projekt abschließen\"}' http://127.0.0.1:8080/notizen >> protokoll.txt`"
      - "Zwischen den Aufrufen kannst du mit `echo >> protokoll.txt` eine Leerzeile einfügen."
    checks:
      - type: file_contains
        path: protokoll.txt
        pattern: "^HTTP/1\\.1 201 Created"
        message: In protokoll.txt fehlt die Antwort auf das Anlegen (HTTP/1.1 201 Created). Nutze curl -i und >>.
      - type: file_contains
        path: protokoll.txt
        pattern: "^[Ll]ocation: /notizen/\\d+"
        message: In protokoll.txt fehlt der Location-Header der neuen Notiz.
      - type: file_contains
        path: protokoll.txt
        pattern: "^[Ee][Tt]ag: \"[0-9a-f]{32}\""
        message: In protokoll.txt fehlt die Listen-Antwort mit ETag (GET /notizen mit curl -i).
      - type: file_contains
        path: protokoll.txt
        pattern: "^HTTP/1\\.1 404 Not Found"
        message: In protokoll.txt fehlt eine 404-Antwort für eine unbekannte Notiz.
    solution: |
      ```bash
      php -S 127.0.0.1:8080 router.php > server.log 2>&1 &
      sleep 1
      curl -i --json '{"titel":"Projekt abschließen"}' http://127.0.0.1:8080/notizen >> protokoll.txt
