title: Skalieren und ausliefern
description: Builds mit Task-Runnern und Cache beschleunigen, interne Pakete mit Changesets versionieren und eine CI-Pipeline für Monorepos aufsetzen.
exercise:
  id: modul-uebung-release
  type: terminal
  title: Ein Release mit zwei Änderungen
  description: |
    Im Monorepo `release-uebung` sind seit dem letzten Release zwei Dinge passiert:

    - In `@kiosk/preise` (1.0.0) wurde ein Rundungsfehler behoben.
    - In `@kiosk/ui` (1.3.0) erwartet die Funktion `button()` jetzt ein Objekt statt eines Strings – Code, der
      `@kiosk/ui` nutzt, muss angepasst werden.

    `@kiosk/web` (0.4.0) nutzt `@kiosk/ui`, `@kiosk/kasse` (0.2.0) nutzt `@kiosk/preise`. Changesets ist eingerichtet.

    1. Lege für **jede** der beiden Änderungen ein eigenes Changeset mit der passenden Sprungart an.
    2. Erzeuge die neuen Versionen mit `bunx changeset version`.
    3. Ergänze in der Root-`package.json` das Skript `ci`, das die Abhängigkeiten eingefroren installiert und
       danach `bun run --workspaces --if-present test` ausführt, und probiere es aus.

    Klicke zuerst auf **Aufgabe vorbereiten** (das dauert ein paar Sekunden).
  workdir: release-uebung
  setup: |
    git init -q -b main
    git config user.name "Stacklab"
    git config user.email "stacklab@example.com"
    mkdir -p packages/preise packages/ui apps/web apps/kasse .changeset
    cat > package.json <<'JSON'
    {
      "name": "kiosk",
      "private": true,
      "workspaces": ["apps/*", "packages/*"],
      "devDependencies": { "@changesets/cli": "^3.0.0" }
    }
    JSON
    printf '{\n  "baseBranch": "main",\n  "access": "restricted"\n}\n' > .changeset/config.json
    printf 'node_modules\n' > .gitignore
    printf '{\n  "name": "@kiosk/preise",\n  "version": "1.0.0",\n  "scripts": { "test": "echo preise ok" }\n}\n' > packages/preise/package.json
    printf '{\n  "name": "@kiosk/ui",\n  "version": "1.3.0",\n  "scripts": { "test": "echo ui ok" }\n}\n' > packages/ui/package.json
    printf '{\n  "name": "@kiosk/web",\n  "version": "0.4.0",\n  "dependencies": { "@kiosk/ui": "workspace:*" }\n}\n' > apps/web/package.json
    printf '{\n  "name": "@kiosk/kasse",\n  "version": "0.2.0",\n  "dependencies": { "@kiosk/preise": "workspace:*" }\n}\n' > apps/kasse/package.json
    bun install > /dev/null 2>&1
    git add -A
    git commit -q -m "chore: initial monorepo"
  checks:
    - type: command
      run: jq -r '.version' packages/preise/package.json packages/ui/package.json | paste -sd ' ' -
      stdout_equals: "1.0.1 2.0.0"
      message: 'Erwartet: @kiosk/preise 1.0.1 (patch) und @kiosk/ui 2.0.0 (major). Prüfe die Sprungarten deiner Changesets und führe `bunx changeset version` aus.'
    - type: command
      run: jq -r '.version' apps/web/package.json apps/kasse/package.json | paste -sd ' ' -
      stdout_equals: "0.4.1 0.2.1"
      message: Die Apps sollten als abhängige Pakete automatisch einen patch-Sprung bekommen (web 0.4.1, kasse 0.2.1).
    - type: file_contains
      path: packages/ui/CHANGELOG.md
      pattern: "Major Changes"
      message: Im Changelog von @kiosk/ui fehlt der Abschnitt „Major Changes“.
    - type: command
      run: find .changeset -name '*.md' ! -name 'README.md' | wc -l
      stdout_matches: "^\\s*0\\s*$"
      message: Im Ordner .changeset liegen noch unverarbeitete Changesets.
    - type: command
      run: jq -r '.scripts.ci // ""' package.json
      stdout_matches: "--frozen-lockfile|bun ci"
      message: Das Root-Skript ci soll mit `bun install --frozen-lockfile` (oder `bun ci`) beginnen.
    - type: command
      run: bun run ci 2>&1
      stdout_matches: "ui ok"
      message: '`bun run ci` soll nach der Installation die Tests in allen Workspaces starten.'
  hints:
    - Ein Changeset pro Änderung – also zweimal `bunx changeset …`.
    - 'Rundungsfehler = patch, geänderte Funktionssignatur = major: `bunx changeset --patch @kiosk/preise -m "…"` und `bunx changeset --major @kiosk/ui -m "…"`.'
    - 'Nach `changeset version` haben sich package.json-Dateien geändert – führe `bun install` aus, bevor du `"ci": "bun install --frozen-lockfile && bun run --workspaces --if-present test"` testest.'
  solution: |
    ```bash
    cd release-uebung
    bunx changeset --patch @kiosk/preise -m "Rundungsfehler in formatPreis behoben"
    bunx changeset --major @kiosk/ui -m "button() erwartet jetzt ein Optionsobjekt"
    bunx changeset version
    bun install
    jq '.scripts.ci = "bun install --frozen-lockfile && bun run --workspaces --if-present test"' package.json > tmp.json && mv tmp.json package.json
    bun run ci
    ```
