  - id: messen
    title: Den Aufwand der Breitensuche messen
    description: |
      Zum Abschluss überprüfst du deine Big-O-Schätzung: Die Breitensuche soll O(V + E) sein – bei einem Graphen,
      in dem jedes Paket nur wenige Abhängigkeiten hat, also linear.

      1. Lege `messung.js` an. Erzeuge darin für `n = 20000`, `40000` und `80000` eine `Map` mit `n` Paketen
         `p0` bis `p{n-1}`. Paket `pi` hängt von `p{i+1}` und `p{i+2}` ab (sofern es sie gibt).
      2. Miss für jedes `n` die Laufzeit von `transitiv(pakete, 'p0')` mit `performance.now()` (Median aus 3 Läufen)
         und gib pro Messung eine Zeile aus, z. B. `n=40000: 12.3 ms`.
      3. Schreibe in `messung.txt` eine Zeile `transitiv: O(...)` mit der Klasse, die du am Faktor ablesen kannst.
    checklist:
      - Testgraph wird im Skript erzeugt, nicht von Hand geschrieben
      - Drei Messungen mit verdoppeltem n
      - Ergebnis in messung.txt festgehalten
    hints:
      - "`const pakete = new Map(); for (let i = 0; i < n; i++) pakete.set('p' + i, { name: 'p' + i, dependencies: ['p' + (i + 1), 'p' + (i + 2)].filter((d) => Number(d.slice(1)) < n) });`"
      - "Die Messfunktion aus der ersten Lektion: drei Läufe, Zeiten sortieren, mittleren Wert nehmen."
      - "Verdoppelt sich die Zeit ungefähr mit n, ist der Aufwand linear: `transitiv: O(n)` (oder `O(V + E)`)."
    checks:
      - type: file_contains
        path: messung.js
        pattern: "performance\\.now\\("
        message: Miss die Zeit in messung.js mit performance.now().
      - type: command
        run: "timeout 60 node messung.js | grep -cE 'n=(20000|40000|80000).*[0-9]'"
        stdout_matches: "^\\s*3\\s*$"
        message: "messung.js soll drei Zeilen ausgeben – je eine für n=20000, 40000 und 80000, z. B. `n=40000: 12.3 ms`."
      - type: file_contains
        path: messung.txt
        pattern: "transitiv:\\s*O\\((n|V\\s*\\+\\s*E|n\\s*\\+\\s*m)\\)"
        message: "In messung.txt fehlt die Zeile `transitiv: O(n)` – bei doppeltem n braucht die Breitensuche etwa doppelt so lange."
    solution: |
      ```js
      // messung.js
      const { transitiv } = require('./lib/graph.js');

      function erzeuge(n) {
        const pakete = new Map();
        for (let i = 0; i < n; i++) {
          const deps = [i + 1, i + 2].filter((j) => j < n).map((j) => 'p' + j);
          pakete.set('p' + i, { name: 'p' + i, dependencies: deps });
        }
        return pakete;
      }

      function miss(pakete) {
        const zeiten = [];
        for (let i = 0; i < 3; i++) {
          const start = performance.now();
          transitiv(pakete, 'p0');
          zeiten.push(performance.now() - start);
        }
        return zeiten.sort((a, b) => a - b)[1];
      }

      for (const n of [20000, 40000, 80000]) {
        console.log(`n=${n}: ${miss(erzeuge(n)).toFixed(2)} ms`);
      }
      ```

      ```bash
      node messung.js
      echo 'transitiv: O(n)' > messung.txt
      ```
    solve: |
      cat > messung.js <<'EOF'
      const { transitiv } = require('./lib/graph.js');

      function erzeuge(n) {
        const pakete = new Map();
        for (let i = 0; i < n; i++) {
          const deps = [i + 1, i + 2].filter((j) => j < n).map((j) => 'p' + j);
          pakete.set('p' + i, { name: 'p' + i, dependencies: deps });
        }
        return pakete;
      }

      function miss(pakete) {
        const zeiten = [];
        for (let i = 0; i < 3; i++) {
          const start = performance.now();
          transitiv(pakete, 'p0');
          zeiten.push(performance.now() - start);
        }
        return zeiten.sort((a, b) => a - b)[1];
      }

      for (const n of [20000, 40000, 80000]) {
        console.log(`n=${n}: ${miss(erzeuge(n)).toFixed(2)} ms`);
      }
      EOF
      echo 'transitiv: O(n)' > messung.txt
