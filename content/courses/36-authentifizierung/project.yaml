  - id: notizen-routen
    title: Notizen mit Fähigkeiten und Besitzprüfung
    description: |
      Jetzt kommt die eigentliche API – mit zwei Schutzschichten: Das **Token** braucht die richtige
      Fähigkeit, und der **Nutzer** sieht nur seine eigenen Notizen.

      1. Registriere in `bootstrap/app.php` die Middleware-Aliase `abilities` und `ability` von Sanctum.
      2. Lege in `routes/api.php` eine Gruppe mit `auth:sanctum` an:
         - `GET /notes` (`abilities:notizen:lesen`) – nur die Notizen des angemeldeten Nutzers.
         - `GET /notes/{id}` (`abilities:notizen:lesen`) – eine eigene Notiz, fremde Notizen ergeben **404**.
         - `POST /notes` (`abilities:notizen:schreiben`) – validiert `title` (Pflicht) und `body`
           (optional), legt die Notiz über `$request->user()->notes()->create(...)` an, Status **201**.
      3. Prüfe: `./vendor/bin/pest tests/Feature/NotizApi/NotizenTest.php`.
    checklist:
      - "Fähigkeiten-Middleware ist registriert"
      - "Jeder sieht nur die eigenen Notizen, fremde ergeben 404"
      - "Ein Lese-Token darf nichts anlegen (403)"
    hints:
      - "Starte jede Abfrage beim Nutzer: `$request->user()->notes()->findOrFail($id)` findet fremde Notizen gar nicht erst."
      - "Fähigkeiten an einer Route: `->middleware('abilities:notizen:lesen')`."
      - "Die Aliase: `$middleware->alias(['abilities' => \\Laravel\\Sanctum\\Http\\Middleware\\CheckAbilities::class, 'ability' => \\Laravel\\Sanctum\\Http\\Middleware\\CheckForAnyAbility::class]);`"
    checks:
      - type: file_contains
        path: bootstrap/app.php
        pattern: "CheckAbilities"
        message: In bootstrap/app.php fehlt noch der Alias abilities.
      - type: command
        run: ./vendor/bin/pest tests/Feature/NotizApi/NotizenTest.php --colors=never
        message: Die Tests in tests/Feature/NotizApi/NotizenTest.php sind noch nicht grün.
    solution: |
      ```php title="routes/api.php (ergänzen)"
      Route::middleware('auth:sanctum')->group(function () {
          Route::get('/notes', function (Request $request) {
              return $request->user()->notes()->latest('id')->get();
          })->middleware('abilities:notizen:lesen');

          Route::get('/notes/{id}', function (Request $request, int $id) {
              return $request->user()->notes()->findOrFail($id);
          })->middleware('abilities:notizen:lesen');

          Route::post('/notes', function (Request $request) {
              $daten = $request->validate([
                  'title' => ['required', 'string', 'max:255'],
                  'body' => ['nullable', 'string', 'max:10000'],
              ]);

              return response()->json($request->user()->notes()->create($daten), 201);
          })->middleware('abilities:notizen:schreiben');
      });
      ```
    solve: |
      grep -q 'CheckAbilities' bootstrap/app.php || perl -0pi -e 's/->withMiddleware\(function \(Middleware \$middleware\): void \{\n        \/\/\n    \}\)/->withMiddleware(function (Middleware \$middleware): void {\n        \$middleware->alias([\n            \x27abilities\x27 => \\Laravel\\Sanctum\\Http\\Middleware\\CheckAbilities::class,\n            \x27ability\x27 => \\Laravel\\Sanctum\\Http\\Middleware\\CheckForAnyAbility::class,\n        ]);\n    })/' bootstrap/app.php
      grep -q "'/notes'" routes/api.php || cat >> routes/api.php <<'PHP'
      
      Route::middleware('auth:sanctum')->group(function () {
          Route::get('/notes', function (Request $request) {
              return $request->user()->notes()->latest('id')->get();
          })->middleware('abilities:notizen:lesen');
      
          Route::get('/notes/{id}', function (Request $request, int $id) {
              return $request->user()->notes()->findOrFail($id);
          })->middleware('abilities:notizen:lesen');
      
          Route::post('/notes', function (Request $request) {
              $daten = $request->validate([
                  'title' => ['required', 'string', 'max:255'],
                  'body' => ['nullable', 'string', 'max:10000'],
              ]);
      
              return response()->json($request->user()->notes()->create($daten), 201);
          })->middleware('abilities:notizen:schreiben');
      });
      PHP
  - id: logout
    title: Logout per Token-Widerruf
    description: |
      Wer sich auf einem Gerät abmeldet, soll nur **dieses** Token verlieren – andere Geräte bleiben angemeldet.

      1. Lege `POST /logout` mit `auth:sanctum` an.
      2. Lösche dort `$request->user()->currentAccessToken()` und antworte mit `response()->noContent()` (204).
      3. Prüfe: `./vendor/bin/pest tests/Feature/NotizApi/AbmeldungTest.php`.
    checklist:
      - "`POST /api/logout` antwortet mit 204"
      - "Nur das benutzte Token wird gelöscht"
    hints:
      - "`$user->tokens()->delete()` wäre zu viel – das meldet alle Geräte ab."
    checks:
      - type: command
        run: ./vendor/bin/pest tests/Feature/NotizApi/AbmeldungTest.php --colors=never
        message: Die Tests in tests/Feature/NotizApi/AbmeldungTest.php sind noch nicht grün.
    solution: |
      ```php title="routes/api.php (ergänzen)"
      Route::post('/logout', function (Request $request) {
          $request->user()->currentAccessToken()->delete();

          return response()->noContent();
      })->middleware('auth:sanctum');
      ```
    solve: |
      grep -q "'/logout'" routes/api.php || cat >> routes/api.php <<'PHP'
      
      Route::post('/logout', function (Request $request) {
          $request->user()->currentAccessToken()->delete();
      
          return response()->noContent();
      })->middleware('auth:sanctum');
      PHP
  - id: login-drosseln
    title: Den Login drosseln
    description: |
      Zum Schluss schützt du den Login gegen Rateversuche.

      1. Definiere in `app/Providers/AppServiceProvider.php` einen Limiter `login`: 5 Versuche pro Minute,
         Schlüssel aus kleingeschriebener E-Mail und IP-Adresse.
      2. Hänge `throttle:login` an die Route `POST /login` (die mit dem Namen `api.login`).
      3. Lass zum Abschluss die ganze Suite laufen: `./vendor/bin/pest tests/Feature/NotizApi`.
    checklist:
      - "Limiter `login` mit 5 Versuchen pro Minute pro E-Mail und IP"
      - "Der sechste Versuch bekommt 429"
      - "Die ganze Suite ist grün"
    hints:
      - "`RateLimiter::for('login', fn (Request $request) => Limit::perMinute(5)->by(Str::lower((string) $request->input('email')).'|'.$request->ip()));`"
      - "`})->name('api.login')->middleware('throttle:login');`"
    checks:
      - type: file_contains
        path: app/Providers/AppServiceProvider.php
        pattern: "RateLimiter::for\\(\\s*['\"]login['\"]"
        message: In AppServiceProvider fehlt noch RateLimiter::for('login', …).
      - type: command
        run: ./vendor/bin/pest tests/Feature/NotizApi/DrosselungTest.php --colors=never
        message: Die Tests in tests/Feature/NotizApi/DrosselungTest.php sind noch nicht grün.
      - type: command
        run: ./vendor/bin/pest tests/Feature/NotizApi --colors=never
        message: Nicht alle Tests der Notiz-API sind grün. Ein früherer Schritt ist kaputtgegangen – lies die Fehlermeldung.
    solution: |
      ```php title="app/Providers/AppServiceProvider.php (boot)"
      RateLimiter::for('login', function (Request $request) {
          return Limit::perMinute(5)->by(Str::lower((string) $request->input('email')).'|'.$request->ip());
      });
      ```

      ```php title="routes/api.php (Ausschnitt)"
      })->name('api.login')->middleware('throttle:login');
      ```
    solve: |
      grep -q "RateLimiter::for('login'" app/Providers/AppServiceProvider.php || cat > app/Providers/AppServiceProvider.php <<'PHP'
      <?php
      
      namespace App\Providers;
      
      use Illuminate\Cache\RateLimiting\Limit;
      use Illuminate\Http\Request;
      use Illuminate\Support\Facades\RateLimiter;
      use Illuminate\Support\ServiceProvider;
      use Illuminate\Support\Str;
      
      class AppServiceProvider extends ServiceProvider
      {
          public function register(): void
          {
              //
          }
      
          public function boot(): void
          {
              RateLimiter::for('login', function (Request $request) {
                  return Limit::perMinute(5)->by(Str::lower((string) $request->input('email')).'|'.$request->ip());
              });
          }
      }
      PHP
      grep -q "throttle:login" routes/api.php || perl -0pi -e "s/->name\('api\.login'\);/->name('api.login')->middleware('throttle:login');/" routes/api.php
