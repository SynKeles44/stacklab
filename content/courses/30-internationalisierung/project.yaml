  - id: fehlende-schluessel-loggen
    title: Fehlende Übersetzungen ins Log schreiben
    description: |
      Was durch alle Tests rutscht, soll wenigstens im Log auffallen. Laravel ruft dafür einen eigenen
      Callback auf, sobald ein Schlüssel in keiner Sprache gefunden wird.

      1. Registriere in `app/Providers/AppServiceProvider.php` in der Methode `boot()` einen Callback mit
         `Lang::handleMissingKeysUsing(...)`.
      2. Er schreibt eine Warnung mit der Nachricht `Fehlende Übersetzung` und dem Kontext `key` und `locale`
         ins Log (`Log::warning(...)`) und gibt den Schlüssel zurück.
      3. Probiere es aus: `php artisan tinker --execute="echo __('events.gibts_nicht');"` und dann
         `tail -n 1 storage/logs/laravel.log`.
    checklist:
      - "`Lang::handleMissingKeysUsing` in `AppServiceProvider::boot()`"
      - "Warnung „Fehlende Übersetzung“ mit Schlüssel und Locale im Log"
    hints:
      - "Importiere `Illuminate\\Support\\Facades\\Lang` und `Illuminate\\Support\\Facades\\Log`."
      - "Signatur des Callbacks: `function (string $key, array $replace, ?string $locale) { … return $key; }`"
    checks:
      - type: file_contains
        path: app/Providers/AppServiceProvider.php
        pattern: "handleMissingKeysUsing"
        message: In app/Providers/AppServiceProvider.php fehlt noch Lang::handleMissingKeysUsing(...).
      - type: command
        run: |
          php artisan tinker --execute="echo __('events.pruefung_fehlt_' . getmypid());" > /dev/null
          tail -n 5 storage/logs/laravel.log
        stdout_matches: "Fehlende Übersetzung.*events\\.pruefung_fehlt_"
        message: Für einen fehlenden Schlüssel erscheint noch keine Warnung „Fehlende Übersetzung“ mit dem Schlüssel in storage/logs/laravel.log.
      - type: command
        run: |
          php artisan tinker --execute="echo __('events.title');"
        stdout_matches: "^Veranstaltungen\\s*$"
        message: Vorhandene Übersetzungen müssen weiter funktionieren – gibt dein Callback nur für fehlende Schlüssel etwas zurück?
    solution: |
      ```php title="app/Providers/AppServiceProvider.php"
      <?php

      namespace App\Providers;

      use Illuminate\Support\Facades\Lang;
      use Illuminate\Support\Facades\Log;
      use Illuminate\Support\ServiceProvider;

      class AppServiceProvider extends ServiceProvider
      {
          public function register(): void
          {
              //
          }

          public function boot(): void
          {
              Lang::handleMissingKeysUsing(function (string $key, array $replace, ?string $locale) {
                  Log::warning('Fehlende Übersetzung', ['key' => $key, 'locale' => $locale]);

                  return $key;
              });
          }
      }
      ```
    solve: |
      cat > app/Providers/AppServiceProvider.php <<'PHP'
