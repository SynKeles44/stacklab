title: Ein Bestellservice mit Queue, Events und Tests
description: |
  In diesem Projekt baust du das Backend eines kleinen **Bestellservice**. Eine Bestellung wird
  angelegt, ein Hintergrund-Job bucht die Zahlung über einen externen Zahlungsdienst, danach löst ein
  Event eine Bestätigungs-Mail aus. Eine geschützte, rate-limitierte Route liefert den Status, eine
  Statistik kommt aus dem Cache, und ein geplanter Befehl storniert liegengebliebene Bestellungen.
  Zum Schluss sicherst du alles mit Pest-Tests und Fakes ab – ohne eine einzige echte Mail oder
  HTTP-Anfrage.

  Damit verbindest du fast alles aus diesem Kurs: Service Container, Provider, Middleware, Events,
  Observer, Queues, Notifications, Caching, Scheduling, Eloquent-Casts und Scopes, HTTP-Client und
  Testing-Fakes.

  Klicke zuerst auf **Projekt vorbereiten**: Stacklab legt im Ordner `bestellservice` eine frische
  Laravel-13-Anwendung mit Pest an (beim allerersten Mal dauert das etwa eine Minute). Öffne danach das
  Übungs-Terminal und wechsle mit `cd bestellservice` hinein. Die Schritte bauen aufeinander auf –
  lösche nichts, was ein früherer Schritt angelegt hat.
goal: >
  Eine Laravel-Anwendung `bestellservice` mit Order-Model (Enum-Cast, Scope, Accessor), einem an ein
  Interface gebundenen Zahlungsdienst auf Basis des HTTP-Clients, Observer, Event und Listener, einem
  Queue-Job mit Wiederholungen, einer Notification, einer geschützten und rate-limitierten Route,
  einer gecachten Statistik, einem geplanten Artisan-Befehl und einer grünen Pest-Testsuite mit Fakes.
workdir: bestellservice
setup: |
  # Laravel-13-Basis (mit Pest) einmal bauen und zwischenspeichern, dann hierher kopieren
  B="$HOME/.cache/stacklab/laravel13"
  if [ ! -f "$B/.fertig" ]; then
    T="$B.bau.$$"; rm -rf "$T"; mkdir -p "$(dirname "$B")"
    timeout 170 composer create-project laravel/laravel "$T" "^13.0" -n -q --prefer-dist </dev/null
    cd "$T"
    timeout 170 composer require pestphp/pest pestphp/pest-plugin-laravel --dev -W -n -q </dev/null
    printf '%s\n' '<?php' '' "pest()->extend(Tests\\TestCase::class)->in('Feature');" > tests/Pest.php
    printf '%s\n' '<?php' '' "test('the application returns a successful response', function () {" "    \$this->get('/')->assertStatus(200);" '});' > tests/Feature/ExampleTest.php
    printf '%s\n' '<?php' '' "test('that true is true', function () {" '    expect(true)->toBeTrue();' '});' > tests/Unit/ExampleTest.php
    touch .fertig && cd - >/dev/null
    rm -rf "$B" && mv "$T" "$B"
  fi
  cp -a "$B/." . && rm -f .fertig
steps:
  - id: order-model
    title: Das Order-Model mit Enum, Scope und Accessor
    description: |
      Jede Bestellung hat eine E-Mail-Adresse, einen Betrag in Cent, einen Status und einen
      Bezahl-Zeitpunkt.

      1. Lege das Enum `App\Enums\OrderStatus` an (`php artisan make:enum OrderStatus --string`) mit den
         Fällen `Pending = 'pending'`, `Paid = 'paid'` und `Cancelled = 'cancelled'`.
      2. Erzeuge Model und Migration: `php artisan make:model Order -m`. Die Tabelle `orders` bekommt
         `number` (String, nullable, unique), `email` (String), `total_cents` (unsigned Integer),
         `status` (String, Standard `pending`), `paid_at` (Timestamp, nullable) und Timestamps.
      3. Im Model: `#[Fillable(['email', 'total_cents', 'status', 'paid_at'])]`, Casts `status` →
         `OrderStatus::class` und `paid_at` → `datetime`.
      4. Ein lokaler Scope `paid` (mit `#[Scope]`) filtert bezahlte Bestellungen.
      5. Ein Accessor `total` liefert den Betrag formatiert, z. B. `12,50 €` für 1250 Cent.
      6. Führe `php artisan migrate` aus.
    checklist:
      - Enum `OrderStatus` mit drei Fällen
      - Migration für `orders` ausgeführt
      - Casts für `status` und `paid_at`
      - "Scope `paid` und Accessor `total`"
    hints:
      - "Den Scope schreibst du als `#[Scope] protected function paid(Builder $query): void { $query->where('status', OrderStatus::Paid); }`."
      - "Der Accessor: `protected function total(): Attribute { return Attribute::make(get: fn () => number_format($this->total_cents / 100, 2, ',', '.').' €'); }`"
      - "Prüfe mit `php artisan tinker`: `App\\Models\\Order::make(['total_cents' => 1250])->total`."
    checks:
      - type: file_exists
        path: app/Enums/OrderStatus.php
        message: Das Enum app/Enums/OrderStatus.php fehlt noch.
      - type: command
        run: php artisan tinker --execute="echo implode(',', array_map(fn (\$c) => \$c->value, App\Enums\OrderStatus::cases()));"
        stdout_matches: "^pending,paid,cancelled\\s*$"
        message: OrderStatus braucht genau die Werte pending, paid und cancelled (in dieser Reihenfolge).
      - type: command
        run: php artisan tinker --execute="echo implode(',', Schema::getColumnListing('orders'));"
        stdout_matches: "number.*email.*total_cents.*status.*paid_at"
        message: Die Tabelle orders fehlt oder hat nicht alle Spalten (number, email, total_cents, status, paid_at). Hast du php artisan migrate ausgeführt?
      - type: command
        run: |
          php artisan tinker --execute="DB::beginTransaction(); \$o = App\Models\Order::create(['email' => 'kunde@example.com', 'total_cents' => 1250, 'status' => 'paid', 'paid_at' => '2026-01-02 10:00:00']); \$o = \$o->fresh(); echo get_class(\$o->status), '|', \$o->paid_at->format('Y'), '|', \$o->total, '|', App\Models\Order::paid()->count(); DB::rollBack();"
        stdout_matches: "^App\\\\Enums\\\\OrderStatus\\|2026\\|12,50 €\\|1\\s*$"
        message: "Eine bezahlte Bestellung über 1250 Cent sollte als Status ein OrderStatus-Enum, paid_at als Datum, total als „12,50 €“ liefern und von Order::paid() gefunden werden."
    solution: |
      ```php title="app/Enums/OrderStatus.php"
      enum OrderStatus: string
      {
          case Pending = 'pending';
          case Paid = 'paid';
          case Cancelled = 'cancelled';
      }
      ```

      ```php title="app/Models/Order.php"
      #[Fillable(['email', 'total_cents', 'status', 'paid_at'])]
      class Order extends Model
      {
          protected function casts(): array
          {
              return ['status' => OrderStatus::class, 'paid_at' => 'datetime'];
          }

          #[Scope]
          protected function paid(Builder $query): void
          {
              $query->where('status', OrderStatus::Paid);
          }

          protected function total(): Attribute
          {
              return Attribute::make(
                  get: fn () => number_format($this->total_cents / 100, 2, ',', '.').' €',
              );
          }
      }
      ```
    solve: |
      mkdir -p app/Enums
      cat > app/Enums/OrderStatus.php <<'EOF'
      <?php

      namespace App\Enums;

      enum OrderStatus: string
      {
          case Pending = 'pending';
          case Paid = 'paid';
          case Cancelled = 'cancelled';
      }
      EOF
      rm -f database/migrations/*_create_orders_table.php
      cat > database/migrations/2026_01_01_000000_create_orders_table.php <<'EOF'
      <?php

      use Illuminate\Database\Migrations\Migration;
      use Illuminate\Database\Schema\Blueprint;
      use Illuminate\Support\Facades\Schema;

      return new class extends Migration
      {
          public function up(): void
          {
              Schema::create('orders', function (Blueprint $table) {
                  $table->id();
                  $table->string('number')->nullable()->unique();
                  $table->string('email');
                  $table->unsignedInteger('total_cents');
                  $table->string('status')->default('pending');
                  $table->timestamp('paid_at')->nullable();
                  $table->timestamps();
              });
          }

          public function down(): void
          {
              Schema::dropIfExists('orders');
          }
      };
      EOF
      cat > app/Models/Order.php <<'EOF'
      <?php

      namespace App\Models;

      use App\Enums\OrderStatus;
      use Illuminate\Database\Eloquent\Attributes\Fillable;
      use Illuminate\Database\Eloquent\Attributes\Scope;
      use Illuminate\Database\Eloquent\Builder;
      use Illuminate\Database\Eloquent\Casts\Attribute;
      use Illuminate\Database\Eloquent\Model;

      #[Fillable(['email', 'total_cents', 'status', 'paid_at'])]
      class Order extends Model
      {
          protected function casts(): array
          {
              return [
                  'status' => OrderStatus::class,
                  'paid_at' => 'datetime',
              ];
          }

          #[Scope]
          protected function paid(Builder $query): void
          {
              $query->where('status', OrderStatus::Paid);
          }

          protected function total(): Attribute
          {
              return Attribute::make(
                  get: fn () => number_format($this->total_cents / 100, 2, ',', '.').' €',
              );
          }
      }
      EOF
      php artisan migrate --force -q

  - id: zahlungsdienst
    title: Den Zahlungsdienst an ein Interface binden
    description: |
      Die Zahlung läuft über einen externen Dienst unter `https://payments.example.com`. Dein Code soll
      aber nur ein **Interface** kennen, damit du den Dienst später austauschen oder im Test faken kannst.

      1. Lege `config/bestellservice.php` an mit den Schlüsseln `payment_url` (aus `PAYMENT_URL`,
         Standard `https://payments.example.com`), `payment_key` (aus `PAYMENT_KEY`) und `api_key` (aus
         `ORDERS_API_KEY`). Trage `PAYMENT_KEY=test-payment-key` und `ORDERS_API_KEY=test-api-key` in
         `.env` ein.
      2. Lege das Interface `App\Contracts\PaymentGateway` mit der Methode
         `charge(string $email, int $cents): string` an. Rückgabe ist die ID der Zahlung.
      3. Die Klasse `App\Services\HttpPaymentGateway` implementiert es mit dem HTTP-Client:
         `POST {payment_url}/charges` mit Bearer-Token, JSON `{"email": …, "amount": …}`, Timeout 5
         Sekunden, 2 Versuche mit 100 ms Pause. Sie gibt das Feld `id` aus der Antwort zurück.
      4. Binde das Interface im `AppServiceProvider` als **Singleton** an `HttpPaymentGateway`.
    checklist:
      - Konfigurationsdatei mit drei Schlüsseln
      - Interface `PaymentGateway`
      - "`HttpPaymentGateway` nutzt `Http::` mit Token, Timeout und Retry"
      - Singleton-Binding im Service Provider
    hints:
      - "Im Provider: `$this->app->singleton(PaymentGateway::class, HttpPaymentGateway::class);` in `register()`."
      - "Der Request: `Http::withToken(...)->timeout(5)->retry(2, 100)->post($url.'/charges', [...])->json('id')`."
      - "Teste in Tinker mit `Http::fake(['payments.example.com/*' => Http::response(['id' => 'ch_1'])])` und `app(App\\Contracts\\PaymentGateway::class)->charge('a@example.com', 100)`."
    checks:
      - type: command
        run: php artisan tinker --execute="echo config('bestellservice.payment_url'), '|', config('bestellservice.api_key');"
        stdout_matches: "^https://payments\\.example\\.com\\|test-api-key\\s*$"
        message: config('bestellservice.payment_url') oder config('bestellservice.api_key') stimmt noch nicht. Prüfe config/bestellservice.php und ORDERS_API_KEY in .env.
      - type: command
        run: php artisan tinker --execute="\$a = app(App\Contracts\PaymentGateway::class); echo get_class(\$a), '|', var_export(\$a === app(App\Contracts\PaymentGateway::class), true);"
        stdout_matches: "^App\\\\Services\\\\HttpPaymentGateway\\|true\\s*$"
        message: Der Container liefert für PaymentGateway noch nicht dieselbe HttpPaymentGateway-Instanz. Binde das Interface mit singleton() im AppServiceProvider.
      - type: command
        run: |
          php artisan tinker --execute="Illuminate\Support\Facades\Http::fake(['payments.example.com/*' => Illuminate\Support\Facades\Http::response(['id' => 'ch_42'], 201)]); echo app(App\Contracts\PaymentGateway::class)->charge('kunde@example.com', 1250); Illuminate\Support\Facades\Http::assertSent(fn (\$r) => \$r->url() === 'https://payments.example.com/charges' && \$r['amount'] === 1250 && \$r->hasHeader('Authorization', 'Bearer test-payment-key'));"
        stdout_matches: "^ch_42\\s*$"
        message: charge() soll POST https://payments.example.com/charges mit Bearer-Token und amount senden und die id aus der Antwort zurückgeben.
    solution: |
      ```php title="app/Services/HttpPaymentGateway.php"
      class HttpPaymentGateway implements PaymentGateway
      {
          public function charge(string $email, int $cents): string
          {
              return Http::withToken(config('bestellservice.payment_key'))
                  ->timeout(5)
                  ->retry(2, 100)
                  ->post(config('bestellservice.payment_url').'/charges', [
                      'email' => $email,
                      'amount' => $cents,
                  ])
                  ->throw()
                  ->json('id');
          }
      }
      ```

      ```php title="app/Providers/AppServiceProvider.php (register)"
      $this->app->singleton(PaymentGateway::class, HttpPaymentGateway::class);
      ```
    solve: |
      cat > config/bestellservice.php <<'EOF'
      <?php

      return [
          'payment_url' => env('PAYMENT_URL', 'https://payments.example.com'),
          'payment_key' => env('PAYMENT_KEY'),
          'api_key' => env('ORDERS_API_KEY'),
      ];
      EOF
      grep -q '^PAYMENT_KEY=' .env || printf '\nPAYMENT_KEY=test-payment-key\nORDERS_API_KEY=test-api-key\n' >> .env
      grep -q '^PAYMENT_KEY=' .env.example || printf '\nPAYMENT_URL=https://payments.example.com\nPAYMENT_KEY=\nORDERS_API_KEY=\n' >> .env.example
      mkdir -p app/Contracts app/Services
      cat > app/Contracts/PaymentGateway.php <<'EOF'
      <?php

      namespace App\Contracts;

      interface PaymentGateway
      {
          public function charge(string $email, int $cents): string;
      }
      EOF
      cat > app/Services/HttpPaymentGateway.php <<'EOF'
      <?php

      namespace App\Services;

      use App\Contracts\PaymentGateway;
      use Illuminate\Support\Facades\Http;

      class HttpPaymentGateway implements PaymentGateway
      {
          public function charge(string $email, int $cents): string
          {
              return Http::withToken(config('bestellservice.payment_key'))
                  ->timeout(5)
                  ->retry(2, 100)
                  ->post(config('bestellservice.payment_url').'/charges', [
                      'email' => $email,
                      'amount' => $cents,
                  ])
                  ->throw()
                  ->json('id');
          }
      }
      EOF
      cat > app/Providers/AppServiceProvider.php <<'EOF'
      <?php

      namespace App\Providers;

      use App\Contracts\PaymentGateway;
      use App\Services\HttpPaymentGateway;
      use Illuminate\Support\ServiceProvider;

      class AppServiceProvider extends ServiceProvider
      {
          public function register(): void
          {
              $this->app->singleton(PaymentGateway::class, HttpPaymentGateway::class);
          }

          public function boot(): void
          {
              //
          }
      }
      EOF
      php artisan config:clear -q

  - id: observer-und-event
    title: Observer, Event und Listener
    description: |
      Jede neue Bestellung bekommt automatisch eine Bestellnummer, und wenn eine Bestellung bezahlt
      wurde, soll der Rest der Anwendung davon erfahren – ohne dass der Bezahl-Code alle Beteiligten
      kennt.

      1. Erzeuge einen Observer: `php artisan make:observer OrderObserver --model=Order`. In
         `creating` setzt er `number` auf `B-` + Datum (`Ymd`) + `-` + vier zufällige Großbuchstaben
         oder Ziffern, z. B. `B-20261010-K7QZ`.
      2. Registriere den Observer mit dem Attribut `#[ObservedBy([OrderObserver::class])]` am Model.
      3. Erzeuge das Event `OrderPaid` (`php artisan make:event OrderPaid`). Es bekommt die Bestellung
         als `public Order $order` im Konstruktor. Die Broadcast-Methode brauchst du nicht.
      4. Erzeuge den Listener `SendOrderConfirmation` für dieses Event
         (`php artisan make:listener SendOrderConfirmation --event=OrderPaid`). Vorläufig schreibt er nur
         eine Zeile ins Log, z. B. `Log::info('Bestellung bezahlt', ['number' => …])`.
      5. Prüfe mit `php artisan event:list`, dass Laravel den Listener gefunden hat.
    checklist:
      - Observer setzt die Bestellnummer
      - "Observer per `#[ObservedBy]` registriert"
      - Event `OrderPaid` mit der Bestellung
      - Listener wird automatisch erkannt
    hints:
      - "Die Nummer: `$order->number = 'B-'.now()->format('Ymd').'-'.Str::upper(Str::random(4));`"
      - "Listener in `app/Listeners` werden automatisch gefunden, wenn `handle()` das Event als Typ hat."
      - "`php artisan event:list --event=OrderPaid` zeigt nur dieses Event."
    checks:
      - type: command
        run: php artisan tinker --execute="DB::beginTransaction(); echo App\Models\Order::create(['email' => 'kunde@example.com', 'total_cents' => 500])->number; DB::rollBack();"
        stdout_matches: "^B-\\d{8}-[A-Z0-9]{4}\\s*$"
        message: "Eine neue Bestellung bekommt noch keine Nummer im Format B-JJJJMMTT-XXXX. Prüfe den Observer (creating) und #[ObservedBy] am Model."
      - type: file_contains
        path: app/Models/Order.php
        pattern: "ObservedBy\\("
        message: "Registriere den Observer mit #[ObservedBy([OrderObserver::class])] am Order-Model."
      - type: command
        run: php artisan event:list --event=OrderPaid
        stdout_matches: "SendOrderConfirmation"
        message: Für das Event OrderPaid ist noch kein Listener SendOrderConfirmation registriert.
      - type: file_contains
        path: app/Events/OrderPaid.php
        pattern: "public\\s+(readonly\\s+)?Order\\s+\\$order"
        message: Das Event OrderPaid soll die Bestellung als public Order $order im Konstruktor bekommen.
    solution: |
      ```php title="app/Observers/OrderObserver.php"
      public function creating(Order $order): void
      {
          $order->number = 'B-'.now()->format('Ymd').'-'.Str::upper(Str::random(4));
      }
      ```

      ```php title="app/Events/OrderPaid.php"
      class OrderPaid
      {
          use Dispatchable, SerializesModels;

          public function __construct(public Order $order) {}
      }
      ```

      ```php title="app/Listeners/SendOrderConfirmation.php"
      public function handle(OrderPaid $event): void
      {
          Log::info('Bestellung bezahlt', ['number' => $event->order->number]);
      }
      ```
    solve: |
      mkdir -p app/Observers app/Events app/Listeners
      cat > app/Observers/OrderObserver.php <<'EOF'
      <?php

      namespace App\Observers;

      use App\Models\Order;
      use Illuminate\Support\Str;

      class OrderObserver
      {
          public function creating(Order $order): void
          {
              $order->number = 'B-'.now()->format('Ymd').'-'.Str::upper(Str::random(4));
          }
      }
      EOF
      sed -i 's/^use Illuminate\\Database\\Eloquent\\Attributes\\Fillable;/use App\\Observers\\OrderObserver;\nuse Illuminate\\Database\\Eloquent\\Attributes\\Fillable;\nuse Illuminate\\Database\\Eloquent\\Attributes\\ObservedBy;/' app/Models/Order.php
      sed -i 's/^#\[Fillable(/#[ObservedBy([OrderObserver::class])]\n#[Fillable(/' app/Models/Order.php
      cat > app/Events/OrderPaid.php <<'EOF'
      <?php

      namespace App\Events;

      use App\Models\Order;
      use Illuminate\Foundation\Events\Dispatchable;
      use Illuminate\Queue\SerializesModels;

      class OrderPaid
      {
          use Dispatchable, SerializesModels;

          public function __construct(public Order $order) {}
      }
      EOF
      cat > app/Listeners/SendOrderConfirmation.php <<'EOF'
      <?php

      namespace App\Listeners;

      use App\Events\OrderPaid;
      use Illuminate\Support\Facades\Log;

      class SendOrderConfirmation
      {
          public function handle(OrderPaid $event): void
          {
              Log::info('Bestellung bezahlt', ['number' => $event->order->number]);
          }
      }
      EOF
      php artisan event:clear -q || true

  - id: queue-job
    title: Die Zahlung als Queue-Job
    description: |
      Die Zahlung kann dauern oder kurz fehlschlagen. Deshalb läuft sie als **Job** im Hintergrund.
      Die Anwendung nutzt schon den `database`-Treiber (`QUEUE_CONNECTION=database`).

      1. Erzeuge den Job `ProcessOrder` (`php artisan make:job ProcessOrder`). Er bekommt die Bestellung
         im Konstruktor (`public Order $order`).
      2. Setze mit Attributen: höchstens 3 Versuche (`#[Tries(3)]`) und Wartezeiten von 10 und 60
         Sekunden zwischen den Versuchen (`#[Backoff([10, 60])]`).
      3. In `handle(PaymentGateway $gateway)`: Ist die Bestellung schon bezahlt, passiert nichts.
         Sonst wird über das Gateway kassiert, der Status auf `Paid` und `paid_at` auf jetzt gesetzt und
         danach das Event `OrderPaid` ausgelöst.
      4. Die Methode `failed(?Throwable $exception)` setzt den Status auf `Cancelled`.
      5. Probiere es aus: In Tinker eine Bestellung anlegen, `ProcessOrder::dispatch($order)` – dann in
         einem zweiten Schritt `php artisan queue:work --stop-when-empty` (ohne Fake schlägt die Zahlung
         fehl, weil das Netzwerk gesperrt ist; das ist für den Test von `failed()` sogar praktisch).
    checklist:
      - "Job mit `ShouldQueue`, `#[Tries(3)]` und `#[Backoff([10, 60])]`"
      - "`handle()` nutzt das Gateway per Method Injection"
      - "Event `OrderPaid` wird ausgelöst"
      - "`failed()` storniert die Bestellung"
    hints:
      - "Die Attribute liegen im Namespace `Illuminate\\Queue\\Attributes`."
      - "`OrderPaid::dispatch($this->order);` löst das Event aus – der Trait `Dispatchable` macht es möglich."
      - "Den Status setzt du mit `$this->order->update(['status' => OrderStatus::Paid, 'paid_at' => now()]);`."
    checks:
      - type: file_contains
        path: app/Jobs/ProcessOrder.php
        pattern: "implements\\s+ShouldQueue"
        message: ProcessOrder muss ShouldQueue implementieren, damit er in die Queue kommt.
      - type: file_contains
        path: app/Jobs/ProcessOrder.php
        pattern: "#\\[Tries\\(3\\)\\]"
        message: "Setze die Anzahl der Versuche mit #[Tries(3)]."
      - type: file_contains
        path: app/Jobs/ProcessOrder.php
        pattern: "#\\[Backoff\\(\\[\\s*10\\s*,\\s*60\\s*\\]\\)\\]"
        message: "Setze die Wartezeiten mit #[Backoff([10, 60])]."
      - type: command
        run: |
          php artisan tinker --execute="DB::beginTransaction(); Illuminate\Support\Facades\Http::fake(['payments.example.com/*' => Illuminate\Support\Facades\Http::response(['id' => 'ch_1'])]); Illuminate\Support\Facades\Event::fake([App\Events\OrderPaid::class]); \$o = App\Models\Order::create(['email' => 'kunde@example.com', 'total_cents' => 990]); \$vorher = DB::table('jobs')->count(); App\Jobs\ProcessOrder::dispatch(\$o); echo DB::table('jobs')->count() - \$vorher, '|'; Artisan::call('queue:work', ['--stop-when-empty' => true]); \$o->refresh(); echo \$o->status->value, '|', \$o->paid_at ? 'datum' : 'leer', '|'; Illuminate\Support\Facades\Event::assertDispatched(App\Events\OrderPaid::class); echo 'event'; DB::rollBack();"
        stdout_matches: "^1\\|paid\\|datum\\|event\\s*$"
        message: "Nach dispatch() und queue:work soll die Bestellung bezahlt sein (status paid, paid_at gesetzt) und OrderPaid ausgelöst werden."
      - type: command
        run: php artisan tinker --execute="DB::beginTransaction(); \$o = App\Models\Order::create(['email' => 'kunde@example.com', 'total_cents' => 990]); (new App\Jobs\ProcessOrder(\$o))->failed(new RuntimeException('down')); echo \$o->fresh()->status->value; DB::rollBack();"
        stdout_matches: "^cancelled\\s*$"
        message: failed() soll die Bestellung auf den Status cancelled setzen.
    solution: |
      ```php title="app/Jobs/ProcessOrder.php"
      #[Tries(3)]
      #[Backoff([10, 60])]
      class ProcessOrder implements ShouldQueue
      {
          use Queueable;

          public function __construct(public Order $order) {}

          public function handle(PaymentGateway $gateway): void
          {
              if ($this->order->status === OrderStatus::Paid) {
                  return;
              }

              $gateway->charge($this->order->email, $this->order->total_cents);

              $this->order->update(['status' => OrderStatus::Paid, 'paid_at' => now()]);

              OrderPaid::dispatch($this->order);
          }

          public function failed(?Throwable $exception): void
          {
              $this->order->update(['status' => OrderStatus::Cancelled]);
          }
      }
      ```
    solve: |
      mkdir -p app/Jobs
      cat > app/Jobs/ProcessOrder.php <<'EOF'
      <?php

      namespace App\Jobs;

      use App\Contracts\PaymentGateway;
      use App\Enums\OrderStatus;
      use App\Events\OrderPaid;
      use App\Models\Order;
      use Illuminate\Contracts\Queue\ShouldQueue;
      use Illuminate\Foundation\Queue\Queueable;
      use Illuminate\Queue\Attributes\Backoff;
      use Illuminate\Queue\Attributes\Tries;
      use Throwable;

      #[Tries(3)]
      #[Backoff([10, 60])]
      class ProcessOrder implements ShouldQueue
      {
          use Queueable;

          public function __construct(public Order $order) {}

          public function handle(PaymentGateway $gateway): void
          {
              if ($this->order->status === OrderStatus::Paid) {
                  return;
              }

              $gateway->charge($this->order->email, $this->order->total_cents);

              $this->order->update([
                  'status' => OrderStatus::Paid,
                  'paid_at' => now(),
              ]);

              OrderPaid::dispatch($this->order);
          }

          public function failed(?Throwable $exception): void
          {
              $this->order->update(['status' => OrderStatus::Cancelled]);
          }
      }
      EOF

