  - id: tests-mit-fakes
    title: Alles mit Pest und Fakes absichern
    description: |
      Zum Schluss schreibst du Feature-Tests, die **keine** echte HTTP-Anfrage und **keine** echte Mail
      auslösen. Lege `tests/Feature/OrderTest.php` an (mit `uses(RefreshDatabase::class);`) und schreibe
      mindestens vier Tests:

      1. **Job bezahlt die Bestellung:** `Http::fake()` für `payments.example.com/*`,
         `Notification::fake()`, dann `ProcessOrder::dispatchSync($order)`. Prüfe Status `paid`,
         `Http::assertSent(...)` mit `amount` und `Notification::assertSentOnDemand(OrderConfirmed::class)`.
      2. **Fehlschlag:** Der Zahlungsdienst antwortet mit 500 – `charge()` wirft eine
         `RequestException`.
      3. **Queue:** Mit `Queue::fake()` prüfst du, dass `ProcessOrder::dispatch($order)` den Job in die
         Queue legt (`Queue::assertPushed`).
      4. **API-Schlüssel:** `GET /orders/{id}` ohne Header liefert 401, mit Header 200.

      Führe die Tests mit `php artisan test` aus – alles muss grün sein. Tipp: Rufe am Anfang der Tests
      `Http::preventStrayRequests();` auf, dann fällt jede ungefakte Anfrage sofort auf.
    checklist:
      - "`tests/Feature/OrderTest.php` mit mindestens vier Tests"
      - "`Http::fake`, `Queue::fake` und `Notification::fake` werden genutzt"
      - "`php artisan test` ist grün"
    hints:
