  - id: geschuetzte-route
    title: Eine geschützte, rate-limitierte Status-Route
    description: |
      Ein Partner-System fragt den Status einer Bestellung ab. Nur wer den richtigen API-Schlüssel im
      Header `X-Api-Key` mitschickt, bekommt eine Antwort – und höchstens 5 Anfragen pro Minute.

      1. Erzeuge die Middleware `EnsureApiKey` (`php artisan make:middleware EnsureApiKey`). Stimmt der
         Header `X-Api-Key` nicht mit `config('bestellservice.api_key')` überein, bricht sie mit
         Status **401** ab.
      2. Registriere sie in `bootstrap/app.php` unter dem Alias `api.key`.
      3. Definiere im `AppServiceProvider` (in `boot()`) einen Rate Limiter `orders`: 5 Anfragen pro
         Minute, pro IP-Adresse.
      4. Lege in `routes/web.php` die Route `GET /orders/{order}` an. Sie nutzt die Middleware
         `api.key` und `throttle:orders` und gibt JSON mit `number`, `status` und `total` zurück.
    checklist:
      - Middleware prüft den Header und antwortet sonst mit 401
      - "Alias `api.key` in `bootstrap/app.php`"
      - "Rate Limiter `orders` mit 5 pro Minute"
      - "Route `GET /orders/{order}` liefert JSON"
    hints:
      - "In der Middleware: `abort_unless($request->header('X-Api-Key') === config('bestellservice.api_key'), 401);`"
      - "In `bootstrap/app.php`: `$middleware->alias(['api.key' => EnsureApiKey::class]);`"
      - "Rate Limiter: `RateLimiter::for('orders', fn (Request $request) => Limit::perMinute(5)->by($request->ip()));`"
    checks:
      - type: command
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class);
          $kernel->bootstrap();
          Illuminate\Support\Facades\DB::beginTransaction();
          $order = App\Models\Order::create(['email' => 'kunde@example.com', 'total_cents' => 1250]);
          $ohne = $kernel->handle(Illuminate\Http\Request::create('/orders/'.$order->id));
          echo $ohne->getStatusCode(), "\n";
          Illuminate\Support\Facades\DB::rollBack();
          PHP
        stdout_matches: "^401\\s*$"
        message: Ohne Header X-Api-Key soll GET /orders/{id} mit 401 antworten. Prüfe die Middleware EnsureApiKey und die Route.
      - type: command
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class);
          $kernel->bootstrap();
          Illuminate\Support\Facades\DB::beginTransaction();
          $order = App\Models\Order::create(['email' => 'kunde@example.com', 'total_cents' => 1250]);
          $mit = $kernel->handle(Illuminate\Http\Request::create('/orders/'.$order->id, 'GET', [], [], [], ['HTTP_X_API_KEY' => 'test-api-key']));
          $json = json_decode($mit->getContent(), true);
          echo $mit->getStatusCode(), '|', ($json['number'] ?? '') === $order->number ? 'nummer' : 'ohne-nummer', '|', $json['status'] ?? '', '|', $json['total'] ?? '', "\n";
          Illuminate\Support\Facades\DB::rollBack();
          PHP
        stdout_matches: "^200\\|nummer\\|pending\\|12,50 €\\s*$"
        message: "Mit dem richtigen Header soll die Route 200 und JSON mit number, status (z. B. pending) und total (z. B. 12,50 €) liefern."
      - type: command
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class);
          $kernel->bootstrap();
          Illuminate\Support\Facades\DB::beginTransaction();
          $order = App\Models\Order::create(['email' => 'kunde@example.com', 'total_cents' => 1250]);
          $codes = [];
          for ($i = 0; $i < 6; $i++) {
              $codes[] = $kernel->handle(Illuminate\Http\Request::create('/orders/'.$order->id, 'GET', [], [], [], ['HTTP_X_API_KEY' => 'test-api-key', 'REMOTE_ADDR' => '198.51.100.7']))->getStatusCode();
          }
          echo implode(',', $codes), "\n";
          Illuminate\Support\Facades\DB::rollBack();
          PHP
        stdout_matches: "^200,200,200,200,200,429\\s*$"
        message: Die sechste Anfrage innerhalb einer Minute soll mit 429 abgelehnt werden. Prüfe den Rate Limiter orders (5 pro Minute) und throttle:orders an der Route.
      - type: file_contains
        path: bootstrap/app.php
        pattern: "['\"]api\\.key['\"]\\s*=>"
        message: Registriere die Middleware in bootstrap/app.php unter dem Alias api.key.
    solution: |
      ```php title="app/Http/Middleware/EnsureApiKey.php"
      public function handle(Request $request, Closure $next): Response
      {
          abort_unless($request->header('X-Api-Key') === config('bestellservice.api_key'), 401);

          return $next($request);
      }
      ```

      ```php title="bootstrap/app.php"
      ->withMiddleware(function (Middleware $middleware): void {
          $middleware->alias(['api.key' => EnsureApiKey::class]);
      })
      ```

      ```php title="AppServiceProvider::boot()"
      RateLimiter::for('orders', fn (Request $request) => Limit::perMinute(5)->by($request->ip()));
      ```

      ```php title="routes/web.php"
      Route::get('/orders/{order}', fn (Order $order) => [
          'number' => $order->number,
          'status' => $order->status,
          'total' => $order->total,
      ])->middleware(['api.key', 'throttle:orders']);
      ```
    solve: |
      mkdir -p app/Http/Middleware
      cat > app/Http/Middleware/EnsureApiKey.php <<'EOF'
      <?php

      namespace App\Http\Middleware;

      use Closure;
      use Illuminate\Http\Request;
      use Symfony\Component\HttpFoundation\Response;

      class EnsureApiKey
      {
          public function handle(Request $request, Closure $next): Response
          {
              abort_unless($request->header('X-Api-Key') === config('bestellservice.api_key'), 401);

              return $next($request);
          }
      }
      EOF
      grep -q "'api.key'" bootstrap/app.php || sed -i "s/->withMiddleware(function (Middleware \$middleware): void {/->withMiddleware(function (Middleware \$middleware): void {\n        \$middleware->alias(['api.key' => \\\\App\\\\Http\\\\Middleware\\\\EnsureApiKey::class]);/" bootstrap/app.php
      cat > app/Providers/AppServiceProvider.php <<'EOF'
      <?php

      namespace App\Providers;

      use App\Contracts\PaymentGateway;
      use App\Services\HttpPaymentGateway;
      use Illuminate\Cache\RateLimiting\Limit;
      use Illuminate\Http\Request;
      use Illuminate\Support\Facades\RateLimiter;
      use Illuminate\Support\ServiceProvider;

      class AppServiceProvider extends ServiceProvider
      {
          public function register(): void
          {
              $this->app->singleton(PaymentGateway::class, HttpPaymentGateway::class);
          }

          public function boot(): void
          {
              RateLimiter::for('orders', fn (Request $request) => Limit::perMinute(5)->by($request->ip()));
          }
      }
      EOF
      cat >> routes/web.php <<'EOF'

      Route::get('/orders/{order}', fn (App\Models\Order $order) => [
          'number' => $order->number,
          'status' => $order->status,
          'total' => $order->total,
      ])->middleware(['api.key', 'throttle:orders']);
      EOF

  - id: statistik-cache
    title: Eine gecachte Statistik
    description: |
      Die Startseite des Partner-Portals zeigt Umsatzzahlen. Die Abfrage soll nicht bei jedem Aufruf
      laufen, sondern zehn Minuten im Cache liegen – und sofort verschwinden, wenn sich eine Bestellung
      ändert.

      1. Lege die Route `GET /stats` an (ohne Middleware). Sie liefert JSON
         `{"paid": <Anzahl bezahlter Bestellungen>, "revenue_cents": <Summe>}` und nutzt dafür
         `Cache::remember('orders.stats', 600, …)` mit dem Scope `paid`.
      2. Ergänze den `OrderObserver` um die Methode `saved`, die den Schlüssel `orders.stats` mit
         `Cache::forget()` löscht.
    checklist:
      - "Route `/stats` mit `Cache::remember`"
      - Observer leert den Cache bei jeder Änderung
    hints:
      - "Die Statistik: `['paid' => Order::paid()->count(), 'revenue_cents' => (int) Order::paid()->sum('total_cents')]`."
      - "`saved` läuft nach jedem Anlegen und jedem Update."
    checks:
      - type: command
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class);
          $kernel->bootstrap();
          Illuminate\Support\Facades\DB::beginTransaction();
          Illuminate\Support\Facades\Cache::put('orders.stats', ['paid' => 99, 'revenue_cents' => 1], 600);
          $a = json_decode($kernel->handle(Illuminate\Http\Request::create('/stats'))->getContent(), true);
          echo $a['paid'] ?? 'x', "\n";
          Illuminate\Support\Facades\DB::rollBack();
          PHP
        stdout_matches: "^99\\s*$"
        message: GET /stats soll den Wert aus dem Cache-Schlüssel orders.stats liefern (Cache::remember('orders.stats', 600, …)).
      - type: command
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class);
          $kernel->bootstrap();
          Illuminate\Support\Facades\DB::beginTransaction();
          Illuminate\Support\Facades\Cache::forget('orders.stats');
          $vorher = App\Models\Order::paid()->count();
          $summe = (int) App\Models\Order::paid()->sum('total_cents');
          $a = json_decode($kernel->handle(Illuminate\Http\Request::create('/stats'))->getContent(), true);
          App\Models\Order::create(['email' => 'kunde@example.com', 'total_cents' => 700, 'status' => 'paid', 'paid_at' => now()]);
          $b = json_decode($kernel->handle(Illuminate\Http\Request::create('/stats'))->getContent(), true);
          echo ($a['paid'] ?? -1) - $vorher, '|', ($b['paid'] ?? -1) - $vorher, '|', ($b['revenue_cents'] ?? -1) - $summe, "\n";
          Illuminate\Support\Facades\DB::rollBack();
          Illuminate\Support\Facades\Cache::forget('orders.stats');
          PHP
        stdout_matches: "^0\\|1\\|700\\s*$"
        message: Nach dem Speichern einer bezahlten Bestellung soll /stats sofort die neue Anzahl und Summe zeigen. Lösche orders.stats im Observer (saved).
    solution: |
      ```php title="routes/web.php"
      Route::get('/stats', fn () => Cache::remember('orders.stats', 600, fn () => [
          'paid' => Order::paid()->count(),
          'revenue_cents' => (int) Order::paid()->sum('total_cents'),
      ]));
      ```

      ```php title="app/Observers/OrderObserver.php"
      public function saved(Order $order): void
      {
          Cache::forget('orders.stats');
      }
      ```
    solve: |
      cat >> routes/web.php <<'EOF'

      Route::get('/stats', fn () => Illuminate\Support\Facades\Cache::remember('orders.stats', 600, fn () => [
          'paid' => App\Models\Order::paid()->count(),
          'revenue_cents' => (int) App\Models\Order::paid()->sum('total_cents'),
      ]));
      EOF
      cat > app/Observers/OrderObserver.php <<'EOF'
      <?php

      namespace App\Observers;

      use App\Models\Order;
      use Illuminate\Support\Facades\Cache;
      use Illuminate\Support\Str;

      class OrderObserver
      {
          public function creating(Order $order): void
          {
              $order->number = 'B-'.now()->format('Ymd').'-'.Str::upper(Str::random(4));
          }

          public function saved(Order $order): void
          {
              Cache::forget('orders.stats');
          }
      }
      EOF

  - id: geplanter-befehl
    title: Liegengebliebene Bestellungen automatisch stornieren
    description: |
      Bestellungen, die länger als 24 Stunden unbezahlt sind, sollen automatisch storniert werden –
      jede Stunde, ohne dass sich zwei Läufe überschneiden.

      1. Erzeuge den Befehl `php artisan make:command CancelStaleOrders`. Signatur:
         `orders:cancel-stale {--hours=24}`.
      2. Er sucht alle Bestellungen mit Status `pending`, die älter als `--hours` Stunden sind, und
         setzt sie auf `cancelled`. Arbeite in Paketen zu 100 mit `chunkById()`.
      3. Am Ende gibt er `Storniert: <Anzahl>` aus.
      4. Plane ihn in `routes/console.php`: stündlich und mit `withoutOverlapping()`.
      5. Prüfe mit `php artisan schedule:list`.
    checklist:
      - "Befehl `orders:cancel-stale` mit Option `--hours`"
      - "Verarbeitung mit `chunkById(100, …)`"
      - "Stündlich geplant mit `withoutOverlapping()`"
    hints:
      - "Die Abfrage: `Order::where('status', OrderStatus::Pending)->where('created_at', '<', now()->subHours($hours))`."
      - "In `chunkById` bekommst du eine Collection: `foreach ($orders as $order) { $order->update([...]); $count++; }` – denk an `use (&$count)`."
      - "`Schedule::command('orders:cancel-stale')->hourly()->withoutOverlapping();`"
    checks:
      - type: command
        run: php artisan schedule:list
        stdout_matches: "0 \\* \\* \\* \\*.*orders:cancel-stale"
        message: In schedule:list fehlt orders:cancel-stale mit stündlichem Rhythmus (0 * * * *). Plane den Befehl in routes/console.php mit ->hourly().
      - type: file_contains
        path: routes/console.php
        pattern: "withoutOverlapping\\("
        message: Verhindere Überschneidungen mit ->withoutOverlapping().
      - type: file_contains
        path: app/Console/Commands/CancelStaleOrders.php
        pattern: "chunkById\\(\\s*100"
        message: Verarbeite die Bestellungen in Paketen mit chunkById(100, …).
      - type: command
        run: |
          php artisan tinker --execute="DB::beginTransaction(); \$alt = App\Models\Order::create(['email' => 'a@example.com', 'total_cents' => 100]); \$alt->forceFill(['created_at' => now()->subHours(30)])->saveQuietly(); \$neu = App\Models\Order::create(['email' => 'b@example.com', 'total_cents' => 100]); \$bezahlt = App\Models\Order::create(['email' => 'c@example.com', 'total_cents' => 100, 'status' => 'paid']); \$bezahlt->forceFill(['created_at' => now()->subHours(30)])->saveQuietly(); Artisan::call('orders:cancel-stale', ['--hours' => 24]); echo trim(Artisan::output()), '|', \$alt->fresh()->status->value, '|', \$neu->fresh()->status->value, '|', \$bezahlt->fresh()->status->value; DB::rollBack();"
        stdout_matches: "Storniert: \\d+\\|cancelled\\|pending\\|paid\\s*$"
        message: "Der Befehl soll nur unbezahlte Bestellungen älter als --hours stornieren und „Storniert: <Anzahl>“ ausgeben."
    solution: |
      ```php title="app/Console/Commands/CancelStaleOrders.php"
      #[Signature('orders:cancel-stale {--hours=24}')]
      #[Description('Storniert unbezahlte Bestellungen, die älter als --hours sind')]
      class CancelStaleOrders extends Command
      {
          public function handle(): int
          {
              $count = 0;

              Order::where('status', OrderStatus::Pending)
                  ->where('created_at', '<', now()->subHours((int) $this->option('hours')))
                  ->chunkById(100, function ($orders) use (&$count) {
                      foreach ($orders as $order) {
                          $order->update(['status' => OrderStatus::Cancelled]);
                          $count++;
                      }
                  });

              $this->info("Storniert: {$count}");

              return self::SUCCESS;
          }
      }
      ```

      ```php title="routes/console.php"
      Schedule::command('orders:cancel-stale')->hourly()->withoutOverlapping();
      ```
