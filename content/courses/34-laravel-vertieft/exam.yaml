    tests:
      - name: bis zum Limit erlaubt, danach nicht
        code: |
          $l = new SimpleLimiter();
          assert_true($l->attempt('ip:1', 3, 60, 100));
          assert_true($l->attempt('ip:1', 3, 60, 101));
          assert_true($l->attempt('ip:1', 3, 60, 102));
          assert_same(false, $l->attempt('ip:1', 3, 60, 103));
      - name: Schlüssel werden getrennt gezählt
        code: |
          $l = new SimpleLimiter();
          $l->attempt('ip:1', 1, 60, 100);
          assert_same(false, $l->attempt('ip:1', 1, 60, 101));
          assert_true($l->attempt('ip:2', 1, 60, 101));
      - name: nach Ablauf beginnt ein neues Fenster
        code: |
          $l = new SimpleLimiter();
          $l->attempt('k', 1, 60, 100);
          assert_same(false, $l->attempt('k', 1, 60, 159));
          assert_true($l->attempt('k', 1, 60, 160));
      - name: availableIn zählt herunter und wird nie negativ
        code: |
          $l = new SimpleLimiter();
          $l->attempt('k', 1, 60, 100);
          assert_same(45, $l->availableIn('k', 115));
          assert_same(0, $l->availableIn('k', 500));
          assert_same(0, $l->availableIn('unbekannt', 100));
    hints:
      - "Speichere pro Schlüssel `['count' => 0, 'resetAt' => $now + $decaySeconds]`."
      - "Lege das Fenster neu an, wenn es fehlt oder `$now >= resetAt` ist. Erhöhe dann den Zähler und vergleiche mit `$max`."
      - "`availableIn`: `max(0, ($this->windows[$key]['resetAt'] ?? $now) - $now)`."
    solution: |
      <?php

      class SimpleLimiter
      {
          private array $windows = [];

          public function attempt(string $key, int $max, int $decaySeconds, int $now): bool
          {
              if (! isset($this->windows[$key]) || $now >= $this->windows[$key]['resetAt']) {
                  $this->windows[$key] = ['count' => 0, 'resetAt' => $now + $decaySeconds];
              }

              if ($this->windows[$key]['count'] >= $max) {
                  return false;
              }

              $this->windows[$key]['count']++;

              return true;
          }

          public function availableIn(string $key, int $now): int
          {
              return max(0, ($this->windows[$key]['resetAt'] ?? $now) - $now);
          }
      }
