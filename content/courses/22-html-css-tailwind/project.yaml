      EOF
      npm run --silent build > /dev/null 2>&1
  - id: kontaktformular
    title: Ein barrierearmes Kontaktformular
    description: |
      Lege eine `<section id="kontakt">` mit `<h2>` und einem Formular an:

      1. `<form>` mit `action="/kontakt"` und `method="post"`.
      2. Felder für Name (`type="text"`), E-Mail (`type="email"`) und Nachricht (`<textarea>`), Name und E-Mail mit `required`.
      3. Jedes Feld hat ein `<label for="…">`, das exakt zu seiner `id` passt.
      4. Ein `<button type="submit">` mit `bg-marke`, `hover:bg-marke-dunkel` und einem sichtbaren Fokus (`focus-visible:outline-…`).
      5. Baue neu.
    checklist:
      - Formular mit action und method post
      - Drei Felder mit passenden Labels
      - Pflichtfelder mit required
      - Button mit Theme-Farben und Fokus-Stil
    hints:
      - "`<label for=\"email\">E-Mail</label>` + `<input type=\"email\" id=\"email\" name=\"email\" required>`"
      - "hover:bg-marke-dunkel funktioniert nur, wenn --color-marke-dunkel im @theme steht."
    checks:
      - type: file_contains
        path: index.html
        pattern: "<section[^>]*id=\"kontakt\"[^>]*>\\s*<h2[\\s>]"
        message: Es fehlt `<section id="kontakt">`, die mit einer h2 beginnt.
      - type: file_contains
        path: index.html
        pattern: "<form(?=[^>]*action=\"/kontakt\")(?=[^>]*method=\"post\")[^>]*>"
        message: Das Formular braucht action="/kontakt" und method="post".
      - type: command
        run: for t in text email; do id=$(grep -oE "<input[^>]*type=\"$t\"[^>]*>" index.html | grep required | grep -oE 'id="[^"]+"' | head -n 1 | cut -d'"' -f2); [ -n "$id" ] && grep -q "<label[^>]*for=\"$id\"" index.html || echo "$t"; done
        stdout_equals: ""
        message: Name (type="text") und E-Mail (type="email") brauchen required, eine id und ein passendes label.
      - type: command
        run: id=$(grep -oE '<textarea[^>]*>' index.html | grep -oE 'id="[^"]+"' | head -n 1 | cut -d'"' -f2); [ -n "$id" ] && grep -q "<label[^>]*for=\"$id\"" index.html && echo ok
        stdout_equals: ok
        message: Die textarea braucht eine id und ein passendes label.
      - type: file_contains
        path: index.html
        pattern: "<button(?=[^>]*type=\"submit\")(?=[^>]*\\bbg-marke\\b)(?=[^>]*hover:bg-marke-dunkel)(?=[^>]*focus-visible:outline)[^>]*>"
        message: Der Button braucht type="submit", bg-marke, hover:bg-marke-dunkel und eine focus-visible:outline-Klasse.
      - type: command
        run: for c in '\.bg-marke' 'hover\\:bg-marke-dunkel' 'focus-visible\\:outline'; do grep -q "$c" output.css || echo "$c"; done
        stdout_equals: ""
        message: In output.css fehlen bg-marke, hover:bg-marke-dunkel oder focus-visible:outline – baue neu.
    solution: |
      ```html
      <section id="kontakt" class="p-6">
        <h2 class="font-display text-2xl font-bold">Kontakt</h2>
        <form action="/kontakt" method="post" class="mt-4 grid max-w-[40rem] gap-3">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required class="rounded border p-2">
          <label for="email">E-Mail</label>
          <input type="email" id="email" name="email" autocomplete="email" required class="rounded border p-2">
          <label for="nachricht">Nachricht</label>
          <textarea id="nachricht" name="nachricht" rows="4" class="rounded border p-2"></textarea>
          <button type="submit" class="rounded-lg bg-marke px-4 py-2 text-white hover:bg-marke-dunkel focus-visible:outline-2 focus-visible:outline-offset-2">Senden</button>
        </form>
      </section>
      ```
