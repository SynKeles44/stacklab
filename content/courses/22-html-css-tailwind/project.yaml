  - id: dark-mode-und-footer
    title: Dark Mode, Footer und finaler Build
    description: |
      Zum Schluss bekommt die Seite einen Dunkelmodus und einen Fußbereich.

      1. Der `<body>` bekommt helle Grundfarben und `dark:`-Varianten für Hintergrund und Text (z. B. `bg-white text-slate-900 dark:bg-slate-950 dark:text-slate-100`).
      2. Der `<footer>` enthält einen Link zum Impressum und eine E-Mail-Adresse als `mailto:`-Link (Platzhalter `du@example.com`).
      3. Baue final mit `npm run build` – die `output.css` ist dann minifiziert.
      4. Teste: Gibt es noch ein `<div>`, das eigentlich ein semantisches Element sein sollte? (Das Projekt-Raster darf ein div bleiben.)
    checklist:
      - body mit dark:-Hintergrund und dark:-Textfarbe
      - footer mit Impressum- und mailto-Link
      - Minifizierte output.css mit Dark-Mode-Media-Query
    hints:
      - Die dark:-Variante erzeugt eine Media Query mit prefers-color-scheme.
      - "`<a href=\"mailto:du@example.com\">du@example.com</a>`"
    checks:
      - type: file_contains
        path: index.html
        pattern: "<body[^>]*class=\"(?=[^\"]*dark:bg-)(?=[^\"]*dark:text-)[^\"]*\""
        message: Der body braucht eine dark:bg-…- und eine dark:text-…-Klasse.
      - type: file_contains
        path: index.html
        pattern: "<footer[\\s>](?=[\\s\\S]*?href=\"mailto:[^\"]+@example\\.(com|org|net)\")[\\s\\S]*?</footer>"
        message: Im footer fehlt ein mailto-Link mit einer Platzhalter-Adresse (z. B. du@example.com).
      - type: file_contains
        path: index.html
        pattern: "<footer[\\s>][\\s\\S]*?href=\"[^\"]*impressum[^\"]*\"[\\s\\S]*?</footer>"
        message: Im footer fehlt ein Link zum Impressum.
      - type: file_contains
        path: output.css
        pattern: "prefers-color-scheme:\\s*dark"
        message: output.css enthält noch keinen Dark Mode – nutze dark:-Klassen und baue neu.
