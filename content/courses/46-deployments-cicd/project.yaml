  - id: release-1-0-0
    title: Release 1.0.0 ausliefern
    description: |
      Zum Abschluss veröffentlichst du die erste Version – mit Changelog, Tag und Deployment genau dieses Stands.

      1. Lege `CHANGELOG.md` mit einem Abschnitt `## [1.0.0]` und einer Unterüberschrift `### Added` an
         (ein paar Stichpunkte: Warenkorb, CI, Deployment mit Rollback).
      2. Committe ihn (`chore(release): 1.0.0`) und setze darauf den **annotierten** Tag `v1.0.0`.
      3. Baue das Artefakt für diesen Commit und liefere es als Release `0002` aus.
    checklist:
      - Changelog mit Version 1.0.0
      - Annotierter Tag v1.0.0 auf dem letzten Commit
      - Release 0002 mit dem getaggten Stand ist aktiv
      - Keine offenen Änderungen im Repository
    hints:
      - "`git tag -a v1.0.0 -m \"Release 1.0.0\"` legt einen annotierten Tag an."
      - "Danach `scripts/build.sh` und `scripts/deploy.sh \"dist/app-$(git rev-parse --short HEAD).tar.gz\" 0002`."
    checks:
      - type: file_contains
        path: CHANGELOG.md
        pattern: "## \\[1\\.0\\.0\\][\\s\\S]*### Added"
        message: In CHANGELOG.md fehlt ein Abschnitt "## [1.0.0]" mit "### Added".
