      git commit -m "chore(release): 1.0.0"
      git tag -a v1.0.0 -m "Release 1.0.0"
      scripts/build.sh
      scripts/deploy.sh "dist/app-$(git rev-parse --short HEAD).tar.gz" 0002
      readlink server/current
