      # Changelog

      ## [1.0.0] - 2026-10-10

      ### Added

      - Warenkorb mit Summenberechnung.
      - CI mit GitHub Actions und lokalem CI-Skript.
      - Deployment mit Release-Ordnern, atomarem Symlink-Wechsel und Rollback.
      EOF
