  - id: rollback-skript
    title: Rollback in Sekunden
    description: |
      Ein Deployment ist nur so gut wie sein Rückweg. Schreib `scripts/rollback.sh`:

      1. Es ermittelt das aktive Release aus `server/current`.
      2. Es schaltet `server/current` atomar auf das Release, das nach Namen sortiert **direkt davor** liegt.
      3. Gibt es kein älteres Release, bricht es mit einer Meldung auf der Standardfehlerausgabe und Exit-Code 1 ab –
         ohne `current` zu verändern.
      4. Mach es ausführbar und committe es (`feat: add rollback script`).
    checklist:
      - Vorgänger wird korrekt ermittelt
      - Umschalten ist atomar
      - Kein älteres Release → Fehler, current bleibt
    hints:
      - "`current=$(basename \"$(readlink server/current)\")` liefert den Namen des aktiven Releases."
      - "`ls -1 server/releases | sort | grep -B1 -x \"$current\" | head -n 1` liefert den Vorgänger – oder das aktive Release selbst, wenn es keinen gibt."
    checks:
      - type: command
        run: test -x scripts/rollback.sh && grep -q "set -euo pipefail" scripts/rollback.sh && git ls-files --error-unmatch scripts/rollback.sh > /dev/null
        message: scripts/rollback.sh fehlt, ist nicht ausführbar, hat kein set -euo pipefail oder ist nicht committet.
      - type: command
        run: |
          d=$(mktemp -d "$PWD/.pruefung-XXXXXX"); mkdir -p "$d/scripts" "$d/server/releases/r1" "$d/server/releases/r2" "$d/server/releases/r3"
          cp scripts/rollback.sh "$d/scripts/"; ln -s releases/r3 "$d/server/current"
          (cd "$d" && scripts/rollback.sh) > /dev/null 2>&1; a=$(basename "$(readlink -f "$d/server/current")")
          (cd "$d" && scripts/rollback.sh) > /dev/null 2>&1; b=$(basename "$(readlink -f "$d/server/current")")
          (cd "$d" && scripts/rollback.sh) > /dev/null 2>&1; rc=$?; c=$(basename "$(readlink -f "$d/server/current")")
          tmp=$([ -e "$d/server/current.tmp" ] && echo ja || echo nein); rm -rf "$d"
          [ "$a" = r2 ] && [ "$b" = r1 ] && [ "$rc" -ne 0 ] && [ "$c" = r1 ] && [ "$tmp" = nein ]
        message: rollback.sh soll current von r3 auf r2, dann auf r1 setzen und beim ältesten Release mit Fehler abbrechen, ohne current zu verändern.
    solution: |
      ```bash
      cat > scripts/rollback.sh <<'EOF'
      #!/usr/bin/env bash
      set -euo pipefail

      base=server
      current=$(basename "$(readlink "$base/current")")
      previous=$(ls -1 "$base/releases" | sort | grep -B1 -x "$current" | head -n 1)

      if [ -z "$previous" ] || [ "$previous" = "$current" ]; then
        echo "Kein älteres Release vorhanden" >&2
        exit 1
      fi

      ln -sfn "releases/$previous" "$base/current.tmp"
      mv -T "$base/current.tmp" "$base/current"
      echo "Zurück auf: $previous"
      EOF
      chmod +x scripts/rollback.sh
      git add scripts/rollback.sh
      git commit -m "feat: add rollback script"
      ```
