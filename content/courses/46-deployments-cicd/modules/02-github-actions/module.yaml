title: GitHub Actions vertieft
description: Trigger, Job-Abhängigkeiten, Matrix, Cache, Artefakte, Environments mit Freigabe, OIDC und wiederverwendbare Workflows – alles, was eine echte Deploy-Pipeline in GitHub Actions braucht.
exercise:
  id: modul-uebung-actions
  type: terminal
  title: Die komplette Pipeline in GitHub Actions
  description: |
    Im Ordner `pipeline-actions` liegen drei Skripte: `ci.sh` (Prüfungen), `build.sh` (baut `dist/app.tar.gz`)
    und `deploy.sh <umgebung>`. Verbinde sie in `.github/workflows/pipeline.yml` zu einer Pipeline nach dem
    Prinzip „Build once, deploy many“:

    1. Trigger: `push` auf `main`. Oben `permissions` mit `contents: read`.
    2. Job `test`: `ubuntu-latest`, `actions/checkout@v7`, `run: ./ci.sh`.
    3. Job `build` (braucht `test`): Checkout, `run: ./build.sh`, danach `actions/upload-artifact@v7` mit
       `name: app` und `path: dist/`.
    4. Job `staging` (braucht `build`): `environment: staging`, **kein** Checkout, sondern
       `actions/download-artifact@v8` mit `name: app`, danach ein `run`-Step mit `deploy.sh staging`.
    5. Job `production` (braucht `staging`): `environment` mit `name: production` und
       `url: https://shop.example.com`, eigene `permissions` mit `id-token: write` und `contents: read`,
       eine `concurrency`-Gruppe `production` mit `cancel-in-progress: false`, dann wie bei staging
       Artefakt holen und `deploy.sh production` ausführen.

    Stacklab prüft die Struktur mit einem YAML-Parser. Klicke zuerst auf **Aufgabe vorbereiten**.
  workdir: pipeline-actions
  setup: |
    printf '#!/usr/bin/env bash\nset -euo pipefail\necho "Tests grün"\n' > ci.sh
    printf '#!/usr/bin/env bash\nset -euo pipefail\nmkdir -p dist\ntar -czf dist/app.tar.gz ci.sh deploy.sh\n' > build.sh
    printf '#!/usr/bin/env bash\nset -euo pipefail\necho "Deploye nach ${1:?Umgebung fehlt}"\n' > deploy.sh
    chmod +x ci.sh build.sh deploy.sh
  checks:
    - type: command
      run: bun -e 'Bun.YAML.parse(await Bun.file(".github/workflows/pipeline.yml").text())'
      message: .github/workflows/pipeline.yml fehlt oder ist kein gültiges YAML.
    - type: command
      run: |
        bun -e 'console.log(JSON.stringify(Bun.YAML.parse(await Bun.file(".github/workflows/pipeline.yml").text())))' | jq -e '.on.push.branches == ["main"] and .permissions.contents == "read" and (.jobs.test.steps | map(.run // "") | any(test("\\./ci\\.sh")))'
      message: "Prüfe push auf main, permissions contents: read und den Job test mit run: ./ci.sh."
    - type: command
      run: |
        bun -e 'console.log(JSON.stringify(Bun.YAML.parse(await Bun.file(".github/workflows/pipeline.yml").text())))' | jq -e '([.jobs.build.needs] | flatten) == ["test"] and (.jobs.build.steps | map(select(.uses == "actions/upload-artifact@v7")) | .[0].with.name == "app")'
      message: Job build braucht needs test und actions/upload-artifact@v7 mit name app.
    - type: command
      run: |
        bun -e 'console.log(JSON.stringify(Bun.YAML.parse(await Bun.file(".github/workflows/pipeline.yml").text())))' | jq -e '.jobs.staging | ([.needs] | flatten) == ["build"] and (.environment == "staging" or .environment.name == "staging") and (.steps | map(select(.uses == "actions/download-artifact@v8")) | .[0].with.name == "app") and (.steps | map(.run // "") | any(test("deploy\\.sh staging")))'
      message: Job staging braucht needs build, environment staging, actions/download-artifact@v8 mit name app und deploy.sh staging.
    - type: command
      run: |
        bun -e 'console.log(JSON.stringify(Bun.YAML.parse(await Bun.file(".github/workflows/pipeline.yml").text())))' | jq -e '.jobs.staging.steps | map(.uses // "") | map(startswith("actions/checkout")) | any | not'
      message: Der Job staging soll nicht neu auschecken, sondern nur das Artefakt herunterladen – Build once, deploy many.
    - type: command
      run: |
        bun -e 'console.log(JSON.stringify(Bun.YAML.parse(await Bun.file(".github/workflows/pipeline.yml").text())))' | jq -e '.jobs.production | ([.needs] | flatten) == ["staging"] and .environment.name == "production" and .environment.url == "https://shop.example.com" and .permissions["id-token"] == "write" and .permissions.contents == "read"'
      message: "Job production braucht needs staging, environment mit name production und url https://shop.example.com sowie permissions id-token: write und contents: read."
    - type: command
      run: |
        bun -e 'console.log(JSON.stringify(Bun.YAML.parse(await Bun.file(".github/workflows/pipeline.yml").text())))' | jq -e '.jobs.production | .concurrency.group == "production" and .concurrency["cancel-in-progress"] == false and (.steps | map(select(.uses == "actions/download-artifact@v8")) | length == 1) and (.steps | map(.run // "") | any(test("deploy\\.sh production")))'
      message: Job production braucht concurrency group production mit cancel-in-progress false, actions/download-artifact@v8 und deploy.sh production.
  hints:
    - "Die Kette lautet test → build → staging → production; jeder Job nennt seinen Vorgänger in `needs`."
    - "Das Artefakt enthält `app.tar.gz`. Entpacke es im Deploy-Job: `run: tar -xzf app.tar.gz && ./deploy.sh staging` – das tar-Archiv behält die Ausführrechte der Skripte."
    - "Für production ist `environment` ein Objekt mit `name` und `url`; `permissions` und `concurrency` stehen im Job."
  solution: |
    ```bash
    cd pipeline-actions
    mkdir -p .github/workflows
    cat > .github/workflows/pipeline.yml <<'EOF'
    name: Pipeline

    on:
      push:
        branches: [main]

    permissions:
      contents: read

    jobs:
      test:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v7
          - run: ./ci.sh

      build:
        needs: test
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v7
          - run: ./build.sh
          - uses: actions/upload-artifact@v7
            with:
              name: app
              path: dist/

      staging:
        needs: build
        runs-on: ubuntu-latest
        environment: staging
        steps:
          - uses: actions/download-artifact@v8
            with:
              name: app
          - run: tar -xzf app.tar.gz && ./deploy.sh staging

      production:
        needs: staging
        runs-on: ubuntu-latest
        environment:
          name: production
          url: https://shop.example.com
        permissions:
          id-token: write
          contents: read
        concurrency:
          group: production
          cancel-in-progress: false
        steps:
          - uses: actions/download-artifact@v8
            with:
              name: app
          - run: tar -xzf app.tar.gz && ./deploy.sh production
    EOF
    ```
