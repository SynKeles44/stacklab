  - id: router
    title: Detailseite mit React-Router-Loader
    description: |
      Jetzt bekommt jede Aufgabe eine eigene Seite, deren Daten schon beim Navigieren geladen werden.

      1. Lege `src/router.tsx` an. Darin:
         - `aufgabeLoader({ params }: LoaderFunctionArgs)`: wandelt `params.id` in eine Zahl um, wartet
           `await queryClient.query(aufgabeQuery(id))` ab und gibt `{ id }` zurück.
         - `function AufgabeDetail()`: liest die ID mit `useLoaderData<typeof aufgabeLoader>()`, die Daten mit
           `useSuspenseQuery(aufgabeQuery(id))` und zeigt den Titel in einem `<h1>` sowie einen
           `<Link to="/">Zurück</Link>`.
         - `export const router = createBrowserRouter([...])` mit den Routen `/` (Component `App`) und
           `/aufgaben/:id` (loader `aufgabeLoader`, Component `AufgabeDetail`).
      2. In `AufgabenListe` verlinkt jeder Titel mit `<Link to={'/aufgaben/' + aufgabe.id}>` auf die Detailseite.
      3. In `src/main.tsx` ersetzt `<RouterProvider router={router} />` (aus `react-router/dom`) das bisherige
         `<App />` – der QueryClientProvider bleibt außen herum.
    checklist:
      - Router mit zwei Routen
      - Loader lädt die Aufgabe über den QueryClient
      - Detailseite liest mit useSuspenseQuery
      - RouterProvider in main.tsx
    hints:
      - "Importe in router.tsx: `createBrowserRouter`, `Link`, `useLoaderData` und `type LoaderFunctionArgs` aus `react-router`, `useSuspenseQuery` aus `@tanstack/react-query`."
      - "Den QueryClient importierst du aus `./queryClient.ts` – es darf nur einen geben."
      - "In main.tsx: `import { RouterProvider } from 'react-router/dom'` und `import { router } from './router.tsx'`; den Import von App brauchst du dort nicht mehr."
    checks:
      - type: file_contains
        path: src/router.tsx
        pattern: "createBrowserRouter\\("
        message: Lege den Router in src/router.tsx mit createBrowserRouter an.
      - type: file_contains
        path: src/router.tsx
        pattern: "queryClient\\.query\\(\\s*aufgabeQuery\\("
        message: Der Loader soll die Aufgabe mit await queryClient.query(aufgabeQuery(id)) in den Cache laden.
      - type: file_contains
        path: src/router.tsx
        pattern: "useSuspenseQuery\\(\\s*aufgabeQuery\\("
        message: AufgabeDetail soll die Daten mit useSuspenseQuery(aufgabeQuery(id)) aus dem Cache lesen.
      - type: file_contains
        path: src/router.tsx
        pattern: "/aufgaben/:id"
        message: Es fehlt die Route /aufgaben/:id.
      - type: file_contains
        path: src/main.tsx
        pattern: "<RouterProvider\\s+router=\\{router\\}"
        message: In src/main.tsx fehlt <RouterProvider router={router} />.
      - type: file_contains
        path: src/AufgabenListe.tsx
        pattern: "<Link"
        message: In der Liste soll jeder Titel mit <Link> auf die Detailseite verweisen.
      - type: command
        run: npm run build >/dev/null 2>&1
        message: npm run build schlägt fehl. Prüfe die Importe in router.tsx und main.tsx.
    solution: |
      ```tsx title="src/router.tsx"
      import { createBrowserRouter, Link, useLoaderData, type LoaderFunctionArgs } from 'react-router'
      import { useSuspenseQuery } from '@tanstack/react-query'
      import { queryClient } from './queryClient.ts'
      import { aufgabeQuery } from './queries.ts'
      import App from './App.tsx'

      export async function aufgabeLoader({ params }: LoaderFunctionArgs) {
        const id = Number(params.id)
        await queryClient.query(aufgabeQuery(id))
        return { id }
      }

      function AufgabeDetail() {
        const { id } = useLoaderData<typeof aufgabeLoader>()
        const { data } = useSuspenseQuery(aufgabeQuery(id))
        return (
          <main>
            <h1>{data.titel}</h1>
            <p>{data.erledigt ? 'Erledigt' : 'Offen'}</p>
            <Link to="/">Zurück</Link>
          </main>
        )
      }

      export const router = createBrowserRouter([
        { path: '/', Component: App },
        { path: '/aufgaben/:id', loader: aufgabeLoader, Component: AufgabeDetail },
      ])
      ```

