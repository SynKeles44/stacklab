          </main>
        )
      }

      export default App
      EOF

  - id: optimistisch
    title: Optimistisch abhaken mit Rollback
    description: |
      1. Lege `src/mutations.ts` an und exportiere `umschaltenOptions()`. Sie gibt `mutationOptions({...})` zurück:
         - `mutationFn: (aufgabe: Aufgabe) => aufgabeAktualisieren({ ...aufgabe, erledigt: !aufgabe.erledigt })`
         - `onMutate(aufgabe, context)`: `cancelQueries` für `aufgabenKeys.listen()`, Schnappschuss mit
           `getQueryData`, dann mit `setQueryData` eine neue Liste, in der `erledigt` bei dieser Aufgabe umgedreht
           ist. Rückgabe `{ vorher }`.
         - `onError(fehler, aufgabe, onMutateResult, context)`: Schnappschuss zurückschreiben.
         - `onSettled(...)`: `aufgabenKeys.all` invalidieren (Kontext ist der fünfte Parameter).
         Nutze jeweils `context.client` – so funktioniert die Datei auch ohne React.
      2. Erweitere `AufgabenListe`: `const umschalten = useMutation(umschaltenOptions())`. Jedes `<li>` bekommt ein
         `<label>` mit einer Checkbox (`checked={aufgabe.erledigt}`, `onChange={() => umschalten.mutate(aufgabe)}`)
         und dem Titel.

      Die Prüfung startet deine Mutation mit einem echten QueryClient – einmal mit funktionierendem und einmal mit
      ausgefallenem Server (`server.kaputt = true`).
    checklist:
      - umschaltenOptions mit onMutate, onError und onSettled
      - Checkbox in jeder Zeile
      - Rollback bei Serverfehler
    hints:
      - "Importe in mutations.ts: `mutationOptions` aus `@tanstack/react-query`, `aufgabeAktualisieren` und `type Aufgabe` aus `./api.ts`, `aufgabenKeys` aus `./queries.ts`."
      - "Ungenutzte Parameter beginnst du mit `_`, z. B. `onError: (_fehler, _aufgabe, onMutateResult, context) => …` – sonst meldet der Build einen Fehler."
      - "In onMutate: `context.client.setQueryData<Aufgabe[]>(aufgabenKeys.listen(), (alt) => alt?.map((a) => (a.id === aufgabe.id ? { ...a, erledigt: !a.erledigt } : a)))`."
    checks:
      - type: file_contains
        path: src/mutations.ts
        pattern: "cancelQueries"
        message: onMutate soll zuerst laufende Queries mit cancelQueries abbrechen.
      - type: command
        run: |
          d=$(mktemp -d "$PWD/.pruefung-XXXXXX")
          cat > "$d/p.mjs" <<'EOF'
          import { QueryClient, MutationObserver } from '@tanstack/react-query'
          import { umschaltenOptions } from '../src/mutations.ts'
          import { aufgabenKeys } from '../src/queries.ts'
          import { server } from '../src/api.ts'
          const start = () => [{ id: 1, titel: 'Steuererklärung abgeben', erledigt: false }, { id: 3, titel: 'Fahrrad reparieren', erledigt: false }]
          server.verzoegerung = 40
          const qc = new QueryClient()
          qc.setQueryData(aufgabenKeys.listen(), start())
          const p = new MutationObserver(qc, umschaltenOptions()).mutate(start()[0])
          await new Promise((r) => setTimeout(r, 10))
          const optimistisch = qc.getQueryData(aufgabenKeys.listen())?.map((a) => a.erledigt).join(',')
          await p
          const invalidiert = qc.getQueryState(aufgabenKeys.listen())?.isInvalidated
          server.kaputt = true
          const qc2 = new QueryClient()
          qc2.setQueryData(aufgabenKeys.listen(), start())
          await new MutationObserver(qc2, umschaltenOptions()).mutate(start()[0]).catch(() => {})
          const nachFehler = qc2.getQueryData(aufgabenKeys.listen())?.map((a) => a.erledigt).join(',')
          console.log(optimistisch + '|' + invalidiert + '|' + nachFehler)
          EOF
          node "$d/p.mjs" 2>/dev/null; r=$?
          rm -rf "$d"
          exit $r
        stdout_equals: "true,false|true|false,false"
        message: "Die Mutation verhält sich noch nicht richtig. Erwartet: sofort abgehakt im Cache (nur die passende Aufgabe), danach invalidiert, und bei Serverfehler zurückgerollt."
