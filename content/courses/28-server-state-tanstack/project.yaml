  - id: tabelle
    title: Eine sortier- und filterbare Tabelle
    description: |
      Zum Schluss bekommt die App eine Tabellenansicht unter `/tabelle`.

      1. Lege `src/AufgabenTabelle.tsx` an. Auf Modulebene: `features` mit clientseitigem Sortieren
         (`rowSortingFeature` + `sortedRowModel: createSortedRowModel()` + `sortFns: { alphanumeric: sortFn_alphanumeric }`)
         und Filtern (`columnFilteringFeature` + `filteredRowModel: createFilteredRowModel()` +
         `filterFns: { includesString: filterFn_includesString }`), die Spalten `titel` (Überschrift `Titel`,
         `filterFn: 'includesString'`) und `erledigt` (Überschrift `Status`, Zelle `Erledigt` oder `Offen`) sowie
         `const leer: Aufgabe[] = []`.
      2. `export function AufgabenTabelle()` lädt mit `useQuery(aufgabenQuery())` und erzeugt die Tabelle mit
         `useTable({ features, columns, data: data ?? leer, getRowId: (a) => String(a.id) })`.
      3. Darüber ein Suchfeld, das den Filter der Spalte `titel` setzt. Die Spaltenköpfe sortieren per Klick
         (`getToggleSortingHandler()`) und zeigen ▲ oder ▼ (`getIsSorted()`).
      4. Ergänze im Router die Route `/tabelle` mit `Component: AufgabenTabelle` und in `App` einen
         `<Link to="/tabelle">Als Tabelle</Link>`.
    checklist:
      - Features und Spalten auf Modulebene
      - Sortieren per Klick auf den Spaltenkopf
      - Suchfeld filtert die Titel
      - Route /tabelle
    hints:
      - "Spalten: `const helper = createColumnHelper<typeof features, Aufgabe>()` und `helper.columns([...])`."
      - "Den Status rendert `cell: (info) => (info.getValue() ? 'Erledigt' : 'Offen')`."
      - "Suchfeld: `value={(table.getColumn('titel')?.getFilterValue() as string) ?? ''}` und `onChange={(e) => table.getColumn('titel')?.setFilterValue(e.target.value)}`."
    checks:
      - type: file_contains
        path: src/AufgabenTabelle.tsx
        pattern: "useTable\\("
        message: AufgabenTabelle soll die Tabelle mit useTable erzeugen.
      - type: file_contains
        path: src/AufgabenTabelle.tsx
        pattern: "sortedRowModel:\\s*createSortedRowModel\\(\\)"
        message: In features fehlt sortedRowModel – ohne Zeilenmodell sortiert die Tabelle nicht im Browser.
      - type: file_contains
        path: src/AufgabenTabelle.tsx
        pattern: "getToggleSortingHandler\\(\\)"
        message: Die Spaltenköpfe sollen per getToggleSortingHandler() sortieren.
      - type: file_contains
        path: src/AufgabenTabelle.tsx
        pattern: "setFilterValue\\("
        message: Das Suchfeld soll mit setFilterValue den Filter der Spalte titel setzen.
      - type: file_contains
        path: src/router.tsx
        pattern: "/tabelle"
        message: Im Router fehlt die Route /tabelle.
      - type: command
        run: npm run build >/dev/null 2>&1 && test -f dist/index.html
        message: npm run build schlägt fehl. Lies die Fehlermeldung – oft fehlt ein Import oder ein Typ.
    solution: |
      ```tsx title="src/AufgabenTabelle.tsx"
      import { useQuery } from '@tanstack/react-query'
      import {
        columnFilteringFeature, createColumnHelper, createFilteredRowModel, createSortedRowModel,
        filterFn_includesString, rowSortingFeature, sortFn_alphanumeric, tableFeatures, useTable,
      } from '@tanstack/react-table'
      import type { Aufgabe } from './api.ts'
      import { aufgabenQuery } from './queries.ts'

      const features = tableFeatures({
        columnFilteringFeature,
        filteredRowModel: createFilteredRowModel(),
        filterFns: { includesString: filterFn_includesString },
        rowSortingFeature,
        sortedRowModel: createSortedRowModel(),
        sortFns: { alphanumeric: sortFn_alphanumeric },
      })

      const helper = createColumnHelper<typeof features, Aufgabe>()

      const columns = helper.columns([
        helper.accessor('titel', { header: 'Titel', filterFn: 'includesString' }),
        helper.accessor('erledigt', { header: 'Status', cell: (info) => (info.getValue() ? 'Erledigt' : 'Offen') }),
      ])

      const leer: Aufgabe[] = []

      export function AufgabenTabelle() {
        const { data } = useQuery(aufgabenQuery())
        const table = useTable({ features, columns, data: data ?? leer, getRowId: (a) => String(a.id) })
        const titelSpalte = table.getColumn('titel')

        return (
          <main>
            <input
              placeholder="Titel suchen …"
              value={(titelSpalte?.getFilterValue() as string) ?? ''}
              onChange={(e) => titelSpalte?.setFilterValue(e.target.value)}
            />
            <table>
              <thead>
                {table.getHeaderGroups().map((gruppe) => (
                  <tr key={gruppe.id}>
                    {gruppe.headers.map((kopf) => (
                      <th key={kopf.id}>
                        <button onClick={kopf.column.getToggleSortingHandler()}>
                          <table.FlexRender header={kopf} />
                          {{ asc: ' ▲', desc: ' ▼' }[kopf.column.getIsSorted() as string] ?? null}
                        </button>
                      </th>
                    ))}
                  </tr>
                ))}
              </thead>
              <tbody>
                {table.getRowModel().rows.map((zeile) => (
                  <tr key={zeile.id}>
                    {zeile.getAllCells().map((zelle) => (
                      <td key={zelle.id}><table.FlexRender cell={zelle} /></td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </main>
        )
      }
      ```

      Im Router: `{ path: '/tabelle', Component: AufgabenTabelle }`. In `App`: `<Link to="/tabelle">Als Tabelle</Link>`.
