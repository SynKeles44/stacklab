      import { mutationOptions } from '@tanstack/react-query'
      import { aufgabeAktualisieren, type Aufgabe } from './api.ts'
      import { aufgabenKeys } from './queries.ts'

      export const umschaltenOptions = () =>
        mutationOptions({
          mutationFn: (aufgabe: Aufgabe) => aufgabeAktualisieren({ ...aufgabe, erledigt: !aufgabe.erledigt }),
          onMutate: async (aufgabe, context) => {
            await context.client.cancelQueries({ queryKey: aufgabenKeys.listen() })
            const vorher = context.client.getQueryData<Aufgabe[]>(aufgabenKeys.listen())
            context.client.setQueryData<Aufgabe[]>(aufgabenKeys.listen(), (alt) =>
              alt?.map((a) => (a.id === aufgabe.id ? { ...a, erledigt: !a.erledigt } : a)),
            )
            return { vorher }
          },
          onError: (_fehler, _aufgabe, onMutateResult, context) => {
            context.client.setQueryData(aufgabenKeys.listen(), onMutateResult?.vorher)
          },
          onSettled: (_daten, _fehler, _aufgabe, _onMutateResult, context) =>
