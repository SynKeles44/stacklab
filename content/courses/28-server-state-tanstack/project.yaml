      EOF
      cat > src/App.tsx <<'EOF'
      import { AufgabenListe } from './AufgabenListe.tsx'
      import { NeueAufgabe } from './NeueAufgabe.tsx'

      function App() {
        return (
          <main>
            <h1>Aufgaben</h1>
