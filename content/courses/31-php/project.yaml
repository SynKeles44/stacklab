  - id: fehlerbehandlung
    title: Fehler freundlich melden
    description: |
      Probiere `php bin/bibliothek.php add 123 Titel Autor`: Das Skript endet mit `Fatal error: Uncaught …` und
      einem Stack Trace. Für Nutzer ist das unverständlich.

      Fange in `bin/bibliothek.php` die erwartbaren Fehler **ganz oben** ab: `RuntimeException` (dazu gehören
      `BuchStatusFehler` und `BuchNichtGefunden`) und `InvalidArgumentException` (dazu gehört `UngueltigeEingabe`).
      Gib dann `Fehler: ` plus die Nachricht auf STDERR aus und beende das Skript mit Exit-Code 1.
    checklist:
      - Ein try/catch umschließt die Befehle
      - Fehlermeldungen beginnen mit "Fehler:" und stehen auf STDERR
      - Exit-Code 1 statt Fatal Error
    hints:
      - "Lege `try { switch (…) { … } }` um den ganzen Befehlsblock."
      - "Mehrere Klassen fängst du mit `catch (RuntimeException | InvalidArgumentException $e)`."
      - "`fwrite(STDERR, 'Fehler: ' . $e->getMessage() . PHP_EOL); exit(1);`"
    checks:
      - type: command
        run: |-
          d=$(mktemp -d "$PWD/.pruefung-XXXXXX"); export BIBLIOTHEK_DATEI="$d/b.json"; php bin/bibliothek.php add 9783161484100 Titel Autorin >/dev/null; for args in "add 123 Titel Autorin" "leihen 9780306406157" "zurueck 9783161484100"; do out=$(php bin/bibliothek.php $args 2>&1 >/dev/null); echo "$?|$out"; done; rm -rf "$d"
        stdout_matches: "^1\\|Fehler: .+\\n1\\|Fehler: .+\\n1\\|Fehler: .+$"
        message: 'Ungültige ISBN, unbekanntes Buch und Zurückgeben eines verfügbaren Buchs sollen "Fehler: …" auf STDERR ausgeben und mit Exit-Code 1 enden.'
      - type: command
        run: |-
          d=$(mktemp -d "$PWD/.pruefung-XXXXXX"); export BIBLIOTHEK_DATEI="$d/b.json"; php bin/bibliothek.php leihen 9780306406157 2>&1 | grep -c "Uncaught"; rm -rf "$d"
        stdout_equals: "0"
        message: Es erscheint noch ein "Uncaught" Fatal Error – fange die Exceptions in bin/bibliothek.php ab.
    solution: |
      ```bash
      cat > bin/bibliothek.php <<'PHP'
      <?php

      declare(strict_types=1);

      require __DIR__.'/../vendor/autoload.php';

      use Bibliothek\Buch;
      use Bibliothek\Katalog;

      $katalog = new Katalog(getenv('BIBLIOTHEK_DATEI') ?: __DIR__.'/../bibliothek.json');

      try {
          switch ($argv[1] ?? '') {
              case 'add':
                  $buch = new Buch($argv[2] ?? '', $argv[3] ?? '', $argv[4] ?? '');
                  $katalog->speichere($buch);
                  echo "Gespeichert: {$buch->titel}".PHP_EOL;
                  break;
              case 'list':
                  $buecher = $katalog->alle();
                  if ($buecher === []) {
                      echo 'Keine Bücher.'.PHP_EOL;
                  }
                  foreach ($buecher as $buch) {
                      echo implode(' | ', [$buch->isbn, $buch->titel, $buch->autor, $buch->status->label()]).PHP_EOL;
                  }
                  break;
              case 'leihen':
                  $buch = $katalog->finde($argv[2] ?? '')->ausleihen();
                  $katalog->speichere($buch);
                  echo "Ausgeliehen: {$buch->titel}".PHP_EOL;
                  break;
              case 'zurueck':
                  $buch = $katalog->finde($argv[2] ?? '')->zurueckgeben();
                  $katalog->speichere($buch);
                  echo "Zurückgegeben: {$buch->titel}".PHP_EOL;
                  break;
              default:
                  fwrite(STDERR, 'Befehle: add <isbn> <titel> <autor>, list, leihen <isbn>, zurueck <isbn>'.PHP_EOL);
                  exit(1);
          }
      } catch (RuntimeException|InvalidArgumentException $e) {
          fwrite(STDERR, 'Fehler: '.$e->getMessage().PHP_EOL);
          exit(1);
      }
