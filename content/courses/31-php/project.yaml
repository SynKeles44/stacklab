  - id: cli
    title: Das CLI-Skript
    description: |
      Jetzt bekommt die Bibliothek eine Bedienoberfläche für das Terminal: `bin/bibliothek.php`.

      - Es lädt `__DIR__ . '/../vendor/autoload.php'`.
      - Die Daten liegen in der Datei aus der Umgebungsvariable `BIBLIOTHEK_DATEI`, sonst in
        `__DIR__ . '/../bibliothek.json'` (Tipp: `getenv('BIBLIOTHEK_DATEI') ?: …`). So können die Prüfungen eine
        eigene Datei nutzen, ohne deine Daten anzufassen.

      | Befehl | Ausgabe |
      |---|---|
      | `add <isbn> <titel> <autor>` | `Gespeichert: <titel>` |
      | `list` | je Buch `<isbn> \| <titel> \| <autor> \| <label>`, ohne Bücher `Keine Bücher.` |
      | `leihen <isbn>` | `Ausgeliehen: <titel>` |
      | `zurueck <isbn>` | `Zurückgegeben: <titel>` |
      | alles andere | Hilfe auf STDERR, Exit-Code 1 |

      Probiere es aus: `php bin/bibliothek.php add 9783161484100 "Die Größe der Welt" "Ada Autorin"`.
    checklist:
      - bin/bibliothek.php lädt den Autoloader
      - Die vier Befehle funktionieren
      - Ein unbekannter Befehl endet mit Exit-Code 1
    hints:
      - "`$katalog = new Katalog(getenv('BIBLIOTHEK_DATEI') ?: __DIR__ . '/../bibliothek.json');` und danach `switch ($argv[1] ?? '')`."
      - "Ausleihen in einer Zeile: `$buch = $katalog->finde($argv[2] ?? '')->ausleihen(); $katalog->speichere($buch);`"
      - "Eine Listenzeile: `echo implode(' | ', [$buch->isbn, $buch->titel, $buch->autor, $buch->status->label()]) . PHP_EOL;`"
    checks:
      - type: command
        run: |-
          d=$(mktemp -d "$PWD/.pruefung-XXXXXX"); export BIBLIOTHEK_DATEI="$d/b.json"; php bin/bibliothek.php list && php bin/bibliothek.php add 9783161484100 "Die Größe der Welt" "Ada Autorin" && php bin/bibliothek.php add 9780306406157 "Zweites Buch" "Bo Beispiel" && php bin/bibliothek.php list; s=$?; rm -rf "$d"; exit $s
        stdout_equals: |-
          Keine Bücher.
          Gespeichert: Die Größe der Welt
          Gespeichert: Zweites Buch
          9783161484100 | Die Größe der Welt | Ada Autorin | verfügbar
          9780306406157 | Zweites Buch | Bo Beispiel | verfügbar
        message: Prüfe list (auch ohne Bücher) und add – die Ausgaben sollen genau wie in der Tabelle aussehen.
      - type: command
        run: |-
          d=$(mktemp -d "$PWD/.pruefung-XXXXXX"); export BIBLIOTHEK_DATEI="$d/b.json"; php bin/bibliothek.php add 9783161484100 "Die Größe der Welt" "Ada Autorin" >/dev/null && php bin/bibliothek.php leihen 9783161484100 && php bin/bibliothek.php list && php bin/bibliothek.php zurueck 9783161484100 && php bin/bibliothek.php list; s=$?; rm -rf "$d"; exit $s
        stdout_equals: |-
          Ausgeliehen: Die Größe der Welt
          9783161484100 | Die Größe der Welt | Ada Autorin | ausgeliehen
          Zurückgegeben: Die Größe der Welt
          9783161484100 | Die Größe der Welt | Ada Autorin | verfügbar
        message: leihen und zurueck sollen den Status ändern, speichern und "Ausgeliehen:" bzw. "Zurückgegeben:" ausgeben.
      - type: command
        run: |-
          d=$(mktemp -d "$PWD/.pruefung-XXXXXX"); export BIBLIOTHEK_DATEI="$d/b.json"; php bin/bibliothek.php quatsch >/dev/null 2>&1; s=$?; rm -rf "$d"; echo "exit=$s"
        stdout_equals: "exit=1"
        message: Ein unbekannter Befehl soll eine Hilfe auf STDERR schreiben und mit exit(1) enden.
    solution: |
      ```bash
      mkdir -p bin
      cat > bin/bibliothek.php <<'PHP'
      <?php

      declare(strict_types=1);

      require __DIR__.'/../vendor/autoload.php';

      use Bibliothek\Buch;
      use Bibliothek\Katalog;

      $katalog = new Katalog(getenv('BIBLIOTHEK_DATEI') ?: __DIR__.'/../bibliothek.json');

      switch ($argv[1] ?? '') {
          case 'add':
              $buch = new Buch($argv[2] ?? '', $argv[3] ?? '', $argv[4] ?? '');
              $katalog->speichere($buch);
              echo "Gespeichert: {$buch->titel}".PHP_EOL;
              break;
          case 'list':
              $buecher = $katalog->alle();
              if ($buecher === []) {
                  echo 'Keine Bücher.'.PHP_EOL;
              }
              foreach ($buecher as $buch) {
                  echo implode(' | ', [$buch->isbn, $buch->titel, $buch->autor, $buch->status->label()]).PHP_EOL;
              }
              break;
          case 'leihen':
              $buch = $katalog->finde($argv[2] ?? '')->ausleihen();
              $katalog->speichere($buch);
              echo "Ausgeliehen: {$buch->titel}".PHP_EOL;
              break;
          case 'zurueck':
              $buch = $katalog->finde($argv[2] ?? '')->zurueckgeben();
              $katalog->speichere($buch);
              echo "Zurückgegeben: {$buch->titel}".PHP_EOL;
              break;
          default:
              fwrite(STDERR, 'Befehle: add <isbn> <titel> <autor>, list, leihen <isbn>, zurueck <isbn>'.PHP_EOL);
              exit(1);
      }
      PHP
