  - id: qualitaet
    title: Qualität absichern
    description: |
      Zum Schluss sorgst du dafür, dass das Projekt sauber bleibt.

      1. Ergänze in `composer.json` ein Skript `check`, das nacheinander `pint --test src bin` und
         `phpstan analyse --level=8 src bin --no-progress` ausführt.
      2. Formatiere den Code mit `pint src bin`.
      3. Führe `composer check` aus. Meldet PHPStan Fehler, behebe sie – oft fehlt eine PHPDoc-Angabe wie
         `@return list<Buch>` oder `@param array{isbn: string, titel: string, autor: string, status: string} $daten`.
    checklist:
      - Composer-Skript check angelegt
      - pint --test meldet keine Stilfehler
      - PHPStan Level 8 meldet keine Fehler
      - composer check läuft grün durch
    hints:
      - "In composer.json: `\"scripts\": {\"check\": [\"pint --test src bin\", \"phpstan analyse --level=8 src bin --no-progress\"]}`"
      - "PHPStan will bei Arrays wissen, was drinsteht. Schreibe über `alle()` den Kommentar `/** @return list<Buch> */`."
      - "Nach `json_decode` hilft ein `/** @var list<array{isbn: string, titel: string, autor: string, status: string}> $daten */` direkt über der Zuweisung."
    checks:
      - type: command
        run: jq -r '.scripts.check | if type == "array" then join(" && ") else . end' composer.json
        stdout_matches: "pint --test.*phpstan analyse|phpstan analyse.*pint --test"
        message: In composer.json fehlt das Skript check mit pint --test und phpstan analyse.
      - type: command
        run: pint --test src bin
        message: Der Code-Stil passt noch nicht – führe pint src bin aus.
      - type: command
        run: phpstan analyse --level=8 src bin --no-progress --error-format=raw
        message: PHPStan meldet auf Level 8 noch Fehler in src oder bin.
      - type: command
        run: composer check
        message: composer check schlägt noch fehl – lies die Ausgabe und behebe den ersten Fehler.
    solution: |
      ```bash
      jq '.scripts = {"check": ["pint --test src bin", "phpstan analyse --level=8 src bin --no-progress"]}' composer.json > composer.tmp
      mv composer.tmp composer.json
      pint src bin
      ```
    solve: |
      jq '.scripts = {"check": ["pint --test src bin", "phpstan analyse --level=8 src bin --no-progress"]}' composer.json > composer.tmp
      mv composer.tmp composer.json
      pint src bin
