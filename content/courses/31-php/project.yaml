title: Bibliotheks-App für die Kommandozeile
description: |
  Du baust Schritt für Schritt eine kleine, aber echte PHP-Anwendung: eine Bibliotheksverwaltung, die Bücher in
  einer JSON-Datei speichert. Alles, was du im Kurs gelernt hast, kommt darin vor – Composer und PSR-4-Autoloading,
  ein Backed Enum, ein readonly-Value-Object, eigene Exceptions, Dateien und JSON, ein CLI-Skript mit sauberer
  Fehlerbehandlung und zum Schluss die Qualitätsprüfung mit Pint und PHPStan.

  Arbeite im Übungs-Terminal im Ordner `bibliothek`. Jeder Schritt baut auf dem vorigen auf. Wenn du nicht
  weiterkommst, zeigen dir die Tipps den Weg; „Für mich erledigen“ stellt den Stand des Schritts her.
goal: >
  Ein Composer-Projekt mit den Klassen Status, Buch, Katalog und drei eigenen Exceptions im Namespace Bibliothek,
  einem CLI-Skript bin/bibliothek.php (add, list, leihen, zurueck) und einem Composer-Skript check, das Pint und
  PHPStan auf Level 8 fehlerfrei durchlaufen.
workdir: bibliothek
steps:
  - id: projekt-anlegen
    title: Das Composer-Projekt anlegen
    description: |
      Lege im Ordner `bibliothek` das Fundament an:

      1. Eine `composer.json` mit dem Paketnamen `stacklab/bibliothek`. Der Namespace `Bibliothek\` zeigt per
         PSR-4 auf den Ordner `src/`.
      2. Die Ordner `src/` und `bin/`.
      3. Eine `.gitignore` mit der Zeile `/vendor/` – der Ordner gehört nicht ins Repository.
      4. Den Autoloader mit `composer dump-autoload`.
    checklist:
      - composer.json mit Name und PSR-4-Eintrag angelegt
      - Ordner src/ und bin/ angelegt
      - .gitignore schließt vendor/ aus
      - vendor/autoload.php erzeugt
    hints:
      - "`composer init --name=stacklab/bibliothek --type=project -n` legt eine composer.json an. Den Autoload-Abschnitt kannst du danach im Editor ergänzen."
      - "In JSON schreibst du den Backslash doppelt: `\"autoload\": {\"psr-4\": {\"Bibliothek\\\\\": \"src/\"}}`."
      - "Zum Schluss: `mkdir -p src bin`, `echo '/vendor/' > .gitignore` und `composer dump-autoload`."
    checks:
      - type: command
        run: jq -r '.name' composer.json
        stdout_equals: "stacklab/bibliothek"
        message: 'In composer.json soll "name": "stacklab/bibliothek" stehen.'
      - type: command
        run: jq -r '.autoload."psr-4" | to_entries[] | .key + "=" + .value' composer.json
        stdout_matches: "^Bibliothek\\\\=src/?$"
        message: 'Unter autoload.psr-4 soll der Eintrag "Bibliothek\\": "src/" stehen.'
      - type: dir_exists
        path: bin
        message: Lege den Ordner bin/ an – dort landet später das CLI-Skript.
      - type: file_contains
        path: .gitignore
        pattern: "^/?vendor/?$"
        message: In .gitignore fehlt die Zeile /vendor/.
      - type: file_exists
        path: vendor/autoload.php
        message: Es gibt noch keinen Autoloader – führe composer dump-autoload aus.
    solution: |
      ```bash
      cat > composer.json <<'JSON'
      {
          "name": "stacklab/bibliothek",
          "description": "Eine kleine Bibliotheks-App für die Kommandozeile",
          "type": "project",
          "autoload": {
              "psr-4": {
                  "Bibliothek\\": "src/"
              }
          },
          "require": {
              "php": ">=8.5"
          }
      }
      JSON
      printf '/vendor/\n' > .gitignore
      mkdir -p src bin
      composer dump-autoload
      ```
    solve: |
      cat > composer.json <<'JSON'
      {
          "name": "stacklab/bibliothek",
          "description": "Eine kleine Bibliotheks-App für die Kommandozeile",
          "type": "project",
          "autoload": {
              "psr-4": {
                  "Bibliothek\\": "src/"
              }
          },
          "require": {
              "php": ">=8.5"
          }
      }
      JSON
      printf '/vendor/\n' > .gitignore
      mkdir -p src bin
      composer dump-autoload
  - id: status-enum
    title: Der Status eines Buchs als Enum
    description: |
      Ein Buch ist entweder verfügbar oder ausgeliehen – eine feste Wertemenge, also ein Enum.

      Lege `src/Status.php` an: ein Backed Enum `Bibliothek\Status: string` mit den Fällen
      `Verfuegbar = 'verfuegbar'` und `Ausgeliehen = 'ausgeliehen'`. Die Methode `label(): string` liefert den
      Text für Menschen: `verfügbar` bzw. `ausgeliehen`. Nutze dafür `match`.
    checklist:
      - src/Status.php mit Namespace Bibliothek angelegt
      - Zwei Fälle mit den Werten verfuegbar und ausgeliehen
      - label() liefert die Anzeige mit Umlaut
    hints:
      - "Die Datei beginnt mit `<?php`, `declare(strict_types=1);` und `namespace Bibliothek;`."
      - "`enum Status: string { case Verfuegbar = 'verfuegbar'; case Ausgeliehen = 'ausgeliehen'; … }`"
      - "`return match ($this) { self::Verfuegbar => 'verfügbar', self::Ausgeliehen => 'ausgeliehen' };`"
    checks:
      - type: file_exists
        path: src/Status.php
        message: Die Datei src/Status.php fehlt noch.
      - type: command
        run: |-
          php -r 'require "vendor/autoload.php"; echo Bibliothek\Status::from("ausgeliehen")->label(), "|", Bibliothek\Status::Verfuegbar->value, "|", Bibliothek\Status::Verfuegbar->label(), "|", count(Bibliothek\Status::cases());'
        stdout_equals: "ausgeliehen|verfuegbar|verfügbar|2"
        message: Prüfe die beiden Fälle, ihre Werte (verfuegbar, ausgeliehen) und label() mit "verfügbar".
    solution: |
      ```bash
      mkdir -p src
      cat > src/Status.php <<'PHP'
      <?php

      declare(strict_types=1);

      namespace Bibliothek;

      enum Status: string
      {
          case Verfuegbar = 'verfuegbar';
          case Ausgeliehen = 'ausgeliehen';

          public function label(): string
          {
              return match ($this) {
                  self::Verfuegbar => 'verfügbar',
                  self::Ausgeliehen => 'ausgeliehen',
              };
          }
      }
      PHP
      ```
    solve: |
      mkdir -p src
      cat > src/Status.php <<'PHP'
      <?php

      declare(strict_types=1);

      namespace Bibliothek;

      enum Status: string
      {
          case Verfuegbar = 'verfuegbar';
          case Ausgeliehen = 'ausgeliehen';

          public function label(): string
          {
              return match ($this) {
                  self::Verfuegbar => 'verfügbar',
                  self::Ausgeliehen => 'ausgeliehen',
              };
          }
      }
      PHP
  - id: buch
    title: Das Buch als readonly-Value-Object
    description: |
      Jetzt kommt das Herzstück: ein Buch, das nach dem Erzeugen garantiert gültig ist.

      1. `src/UngueltigeEingabe.php`: Klasse `Bibliothek\UngueltigeEingabe`, die von `InvalidArgumentException` erbt.
      2. `src/Buch.php`: `final readonly class Bibliothek\Buch` mit Constructor Promotion:
         `string $isbn`, `string $titel`, `string $autor`, `Status $status = Status::Verfuegbar`.
      3. Der Konstruktor wirft `UngueltigeEingabe`, wenn die ISBN nicht aus genau 13 Ziffern besteht oder Titel bzw.
         Autor leer sind (Leerzeichen zählen als leer).
      4. `toArray(): array` liefert `['isbn' => …, 'titel' => …, 'autor' => …, 'status' => 'verfuegbar']` – der
         Status als Wert des Enums.
      5. `static fromArray(array $daten): self` baut aus so einem Array wieder ein Buch.
    checklist:
      - UngueltigeEingabe erbt von InvalidArgumentException
      - Buch ist readonly und prüft seine Daten im Konstruktor
      - toArray() und fromArray() passen zusammen
    hints:
      - "Die ISBN prüfst du mit `preg_match('/^\\d{13}$/', $isbn) !== 1`, leere Texte mit `trim($titel) === ''`."
      - "Constructor Promotion mit Prüfung: Die Properties stehen in der Parameterliste, die `if`-Abfragen im Rumpf des Konstruktors."
      - "`fromArray` nutzt `Status::from($daten['status'])`, um aus dem String wieder einen Enum-Fall zu machen."
    checks:
      - type: command
        run: |-
          php -r 'require "vendor/autoload.php"; $b = new Bibliothek\Buch("9783161484100", "Titel", "Autorin"); echo $b->status->value, "|", json_encode($b->toArray(), JSON_UNESCAPED_UNICODE), "|", Bibliothek\Buch::fromArray(["isbn" => "9780306406157", "titel" => "Zwei", "autor" => "Bo", "status" => "ausgeliehen"])->status->name;'
        stdout_equals: 'verfuegbar|{"isbn":"9783161484100","titel":"Titel","autor":"Autorin","status":"verfuegbar"}|Ausgeliehen'
        message: Prüfe den Standardstatus, die Schlüssel von toArray() (isbn, titel, autor, status) und fromArray().
      - type: command
        run: |-
          php -r 'require "vendor/autoload.php"; $n = 0; foreach ([["123", "T", "A"], ["97831614841001", "T", "A"], ["9783161484100", "", "A"], ["9783161484100", "T", "  "]] as [$i, $t, $a]) { try { new Bibliothek\Buch($i, $t, $a); } catch (Bibliothek\UngueltigeEingabe $e) { $n++; } } echo $n, "|", is_subclass_of(Bibliothek\UngueltigeEingabe::class, InvalidArgumentException::class) ? "ja" : "nein";'
        stdout_equals: "4|ja"
        message: Ungültige ISBN (nicht genau 13 Ziffern) sowie leerer Titel oder Autor sollen eine UngueltigeEingabe werfen, die von InvalidArgumentException erbt.
      - type: command
        run: |-
          php -r 'require "vendor/autoload.php"; $b = new Bibliothek\Buch("9783161484100", "Titel", "Autorin"); try { $b->titel = "Neu"; echo "änderbar"; } catch (Error $e) { echo "readonly"; }'
        stdout_equals: "readonly"
        message: Buch soll unveränderlich sein – deklariere die Klasse als final readonly class.
    solution: |
      ```bash
      cat > src/UngueltigeEingabe.php <<'PHP'
      <?php

      declare(strict_types=1);

      namespace Bibliothek;

      use InvalidArgumentException;

      final class UngueltigeEingabe extends InvalidArgumentException {}
      PHP
      cat > src/Buch.php <<'PHP'
      <?php

      declare(strict_types=1);

      namespace Bibliothek;

      final readonly class Buch
      {
          public function __construct(
              public string $isbn,
              public string $titel,
              public string $autor,
              public Status $status = Status::Verfuegbar,
          ) {
              if (preg_match('/^\d{13}$/', $isbn) !== 1) {
                  throw new UngueltigeEingabe("Die ISBN muss aus 13 Ziffern bestehen: {$isbn}");
              }
              if (trim($titel) === '' || trim($autor) === '') {
                  throw new UngueltigeEingabe('Titel und Autor dürfen nicht leer sein.');
              }
          }

          /** @return array{isbn: string, titel: string, autor: string, status: string} */
          public function toArray(): array
          {
              return [
                  'isbn' => $this->isbn,
                  'titel' => $this->titel,
                  'autor' => $this->autor,
                  'status' => $this->status->value,
              ];
          }

          /** @param array{isbn: string, titel: string, autor: string, status: string} $daten */
          public static function fromArray(array $daten): self
          {
              return new self($daten['isbn'], $daten['titel'], $daten['autor'], Status::from($daten['status']));
          }
      }
      PHP
      ```
    solve: |
      cat > src/UngueltigeEingabe.php <<'PHP'
      <?php

      declare(strict_types=1);

      namespace Bibliothek;

      use InvalidArgumentException;

      final class UngueltigeEingabe extends InvalidArgumentException {}
      PHP
      cat > src/Buch.php <<'PHP'
      <?php

      declare(strict_types=1);

      namespace Bibliothek;

      final readonly class Buch
      {
          public function __construct(
              public string $isbn,
              public string $titel,
              public string $autor,
              public Status $status = Status::Verfuegbar,
          ) {
              if (preg_match('/^\d{13}$/', $isbn) !== 1) {
                  throw new UngueltigeEingabe("Die ISBN muss aus 13 Ziffern bestehen: {$isbn}");
              }
              if (trim($titel) === '' || trim($autor) === '') {
                  throw new UngueltigeEingabe('Titel und Autor dürfen nicht leer sein.');
              }
          }

          /** @return array{isbn: string, titel: string, autor: string, status: string} */
          public function toArray(): array
          {
              return [
                  'isbn' => $this->isbn,
                  'titel' => $this->titel,
                  'autor' => $this->autor,
                  'status' => $this->status->value,
              ];
          }

          /** @param array{isbn: string, titel: string, autor: string, status: string} $daten */
          public static function fromArray(array $daten): self
          {
              return new self($daten['isbn'], $daten['titel'], $daten['autor'], Status::from($daten['status']));
          }
      }
      PHP
  - id: ausleihen
    title: Ausleihen und Zurückgeben
    description: |
      Ein unveränderliches Buch ändert seinen Status nicht selbst – es liefert ein **neues** Buch mit neuem Status.

      1. `src/BuchStatusFehler.php`: Klasse `Bibliothek\BuchStatusFehler`, die von `RuntimeException` erbt.
      2. In `Buch` die Methode `ausleihen(): self`. Ist das Buch schon ausgeliehen, wirft sie `BuchStatusFehler`
         (Nachricht z. B. `Das Buch … ist bereits ausgeliehen.`), sonst liefert sie ein neues Buch mit
         `Status::Ausgeliehen`.
      3. Genauso `zurueckgeben(): self`: Fehler, wenn das Buch gar nicht ausgeliehen ist, sonst ein neues Buch mit
         `Status::Verfuegbar`.
    checklist:
      - BuchStatusFehler erbt von RuntimeException
      - ausleihen() und zurueckgeben() liefern neue Objekte
      - Ungültige Statuswechsel werfen BuchStatusFehler
    hints:
      - "Ein neues Buch mit anderem Status: `return new self($this->isbn, $this->titel, $this->autor, Status::Ausgeliehen);`"
      - "Die Prüfung steht vorher: `if ($this->status === Status::Ausgeliehen) { throw new BuchStatusFehler(\"Das Buch {$this->titel} ist bereits ausgeliehen.\"); }`"
      - "Warum eine RuntimeException? Der Code ist korrekt – aber zur Laufzeit kann jemand ein bereits verliehenes Buch anfragen."
    checks:
      - type: command
        run: |-
          php -r 'require "vendor/autoload.php"; $b = new Bibliothek\Buch("9783161484100", "Titel", "Autorin"); $a = $b->ausleihen(); echo $b->status->value, "|", $a->status->value, "|", $a->zurueckgeben()->status->value;'
        stdout_equals: "verfuegbar|ausgeliehen|verfuegbar"
        message: ausleihen() soll ein neues Buch mit Status Ausgeliehen liefern, das alte bleibt verfügbar; zurueckgeben() macht es wieder verfügbar.
      - type: command
        run: |-
          php -r 'require "vendor/autoload.php"; $b = new Bibliothek\Buch("9783161484100", "Titel", "Autorin"); try { $b->ausleihen()->ausleihen(); } catch (Bibliothek\BuchStatusFehler $e) { echo $e instanceof RuntimeException ? "eins" : "kein RuntimeException"; } try { $b->zurueckgeben(); } catch (Bibliothek\BuchStatusFehler $e) { echo "|zwei"; }'
        stdout_equals: "eins|zwei"
        message: Doppeltes Ausleihen und Zurückgeben eines verfügbaren Buchs sollen einen BuchStatusFehler (eine RuntimeException) werfen.
    solution: |
      ```bash
      cat > src/BuchStatusFehler.php <<'PHP'
      <?php

      declare(strict_types=1);

      namespace Bibliothek;

      use RuntimeException;

      final class BuchStatusFehler extends RuntimeException {}
      PHP
      cat > src/Buch.php <<'PHP'
      <?php

      declare(strict_types=1);

      namespace Bibliothek;

      final readonly class Buch
      {
          public function __construct(
              public string $isbn,
              public string $titel,
              public string $autor,
              public Status $status = Status::Verfuegbar,
          ) {
              if (preg_match('/^\d{13}$/', $isbn) !== 1) {
                  throw new UngueltigeEingabe("Die ISBN muss aus 13 Ziffern bestehen: {$isbn}");
              }
              if (trim($titel) === '' || trim($autor) === '') {
                  throw new UngueltigeEingabe('Titel und Autor dürfen nicht leer sein.');
              }
          }

          public function ausleihen(): self
          {
              if ($this->status === Status::Ausgeliehen) {
                  throw new BuchStatusFehler("Das Buch {$this->titel} ist bereits ausgeliehen.");
              }

              return new self($this->isbn, $this->titel, $this->autor, Status::Ausgeliehen);
          }

          public function zurueckgeben(): self
          {
              if ($this->status === Status::Verfuegbar) {
                  throw new BuchStatusFehler("Das Buch {$this->titel} ist nicht ausgeliehen.");
              }

              return new self($this->isbn, $this->titel, $this->autor, Status::Verfuegbar);
          }

          /** @return array{isbn: string, titel: string, autor: string, status: string} */
          public function toArray(): array
          {
              return [
                  'isbn' => $this->isbn,
                  'titel' => $this->titel,
                  'autor' => $this->autor,
                  'status' => $this->status->value,
              ];
          }

          /** @param array{isbn: string, titel: string, autor: string, status: string} $daten */
          public static function fromArray(array $daten): self
          {
              return new self($daten['isbn'], $daten['titel'], $daten['autor'], Status::from($daten['status']));
          }
      }
      PHP
      ```
    solve: |
      cat > src/BuchStatusFehler.php <<'PHP'
      <?php

      declare(strict_types=1);

      namespace Bibliothek;

      use RuntimeException;

      final class BuchStatusFehler extends RuntimeException {}
      PHP
      cat > src/Buch.php <<'PHP'
      <?php

      declare(strict_types=1);

      namespace Bibliothek;

      final readonly class Buch
      {
          public function __construct(
              public string $isbn,
              public string $titel,
              public string $autor,
              public Status $status = Status::Verfuegbar,
          ) {
              if (preg_match('/^\d{13}$/', $isbn) !== 1) {
                  throw new UngueltigeEingabe("Die ISBN muss aus 13 Ziffern bestehen: {$isbn}");
              }
              if (trim($titel) === '' || trim($autor) === '') {
                  throw new UngueltigeEingabe('Titel und Autor dürfen nicht leer sein.');
              }
          }

          public function ausleihen(): self
          {
              if ($this->status === Status::Ausgeliehen) {
                  throw new BuchStatusFehler("Das Buch {$this->titel} ist bereits ausgeliehen.");
              }

              return new self($this->isbn, $this->titel, $this->autor, Status::Ausgeliehen);
          }

          public function zurueckgeben(): self
          {
              if ($this->status === Status::Verfuegbar) {
                  throw new BuchStatusFehler("Das Buch {$this->titel} ist nicht ausgeliehen.");
              }

              return new self($this->isbn, $this->titel, $this->autor, Status::Verfuegbar);
          }

          /** @return array{isbn: string, titel: string, autor: string, status: string} */
          public function toArray(): array
          {
              return [
                  'isbn' => $this->isbn,
                  'titel' => $this->titel,
                  'autor' => $this->autor,
                  'status' => $this->status->value,
              ];
          }

          /** @param array{isbn: string, titel: string, autor: string, status: string} $daten */
          public static function fromArray(array $daten): self
          {
              return new self($daten['isbn'], $daten['titel'], $daten['autor'], Status::from($daten['status']));
          }
      }
