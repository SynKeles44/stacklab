  - id: katalog
    title: Der Katalog speichert in JSON
    description: |
      Damit Bücher den Programmlauf überleben, speichert ein Katalog sie in einer JSON-Datei.

      1. `src/BuchNichtGefunden.php`: Klasse `Bibliothek\BuchNichtGefunden`, die von `RuntimeException` erbt.
      2. `src/Katalog.php`: `final class Bibliothek\Katalog` mit dem Konstruktor `__construct(private string $datei)`.
      3. `alle(): array` liefert alle Bücher als Liste von `Buch`-Objekten – eine leere Liste, wenn die Datei noch
         nicht existiert.
      4. `finde(string $isbn): Buch` sucht ein Buch oder wirft `BuchNichtGefunden`.
      5. `speichere(Buch $buch): void` fügt ein neues Buch hinzu oder ersetzt das Buch mit gleicher ISBN und
         schreibt die Datei: eine eingerückte JSON-Liste (`JSON_PRETTY_PRINT`), Umlaute lesbar
         (`JSON_UNESCAPED_UNICODE`), Fehler als Exception (`JSON_THROW_ON_ERROR`).
    checklist:
      - BuchNichtGefunden erbt von RuntimeException
      - alle() kommt mit einer fehlenden Datei klar
      - speichere() ersetzt Bücher mit gleicher ISBN
      - Die JSON-Datei ist eingerückt und enthält lesbare Umlaute
    hints:
      - "Lesen: `json_decode(file_get_contents($this->datei), true, flags: JSON_THROW_ON_ERROR)` und danach `array_map(Buch::fromArray(...), $daten)`."
      - "Ersetzen gelingt leicht über ein Array mit der ISBN als Schlüssel: `$buecher[$buch->isbn] = $buch;` – zum Speichern `array_values()` nicht vergessen."
      - "Schreiben: `file_put_contents($this->datei, json_encode($daten, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_THROW_ON_ERROR));`"
    checks:
      - type: command
        run: |-
          d=$(mktemp -d "$PWD/.pruefung-XXXXXX"); KATALOG="$d/k.json" php -r 'require "vendor/autoload.php"; use Bibliothek\Buch; $k = new Bibliothek\Katalog(getenv("KATALOG")); echo count($k->alle()), "|"; $k->speichere(new Buch("9783161484100", "Eins", "A")); $k->speichere(new Buch("9780306406157", "Zwei", "B")); $k->speichere((new Buch("9783161484100", "Eins", "A"))->ausleihen()); $k2 = new Bibliothek\Katalog(getenv("KATALOG")); echo count($k2->alle()), "|", $k2->finde("9783161484100")->status->value, "|", $k2->alle()[1]->titel; try { $k2->finde("0000000000000"); } catch (Bibliothek\BuchNichtGefunden $e) { echo "|nicht gefunden"; }'; s=$?; rm -rf "$d"; exit $s
        stdout_equals: "0|2|ausgeliehen|Zwei|nicht gefunden"
        message: Prüfe alle() bei fehlender Datei, das Ersetzen per ISBN in speichere() und die BuchNichtGefunden-Exception in finde().
      - type: command
        run: |-
          d=$(mktemp -d "$PWD/.pruefung-XXXXXX"); KATALOG="$d/k.json" php -r 'require "vendor/autoload.php"; (new Bibliothek\Katalog(getenv("KATALOG")))->speichere(new Bibliothek\Buch("9783161484100", "Die Größe der Welt", "Ada"));'; jq -r '.[0].titel + "|" + .[0].status' "$d/k.json"; grep -c '^    ' "$d/k.json" | sed 's/^[1-9][0-9]*$/eingerückt/'; rm -rf "$d"
        stdout_equals: |-
          Die Größe der Welt|verfuegbar
          eingerückt
        message: Die Datei soll eine eingerückte JSON-Liste mit lesbaren Umlauten sein (JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE).
    solution: |
      ```bash
      cat > src/BuchNichtGefunden.php <<'PHP'
      <?php

      declare(strict_types=1);

      namespace Bibliothek;

      use RuntimeException;

      final class BuchNichtGefunden extends RuntimeException {}
      PHP
      cat > src/Katalog.php <<'PHP'
      <?php

      declare(strict_types=1);

      namespace Bibliothek;

      final class Katalog
      {
          public function __construct(private string $datei) {}

          /** @return list<Buch> */
          public function alle(): array
          {
              if (! is_file($this->datei)) {
                  return [];
              }

              /** @var list<array{isbn: string, titel: string, autor: string, status: string}> $daten */
              $daten = json_decode((string) file_get_contents($this->datei), true, flags: JSON_THROW_ON_ERROR);

              return array_map(Buch::fromArray(...), $daten);
          }

          public function finde(string $isbn): Buch
          {
              foreach ($this->alle() as $buch) {
                  if ($buch->isbn === $isbn) {
                      return $buch;
                  }
              }

              throw new BuchNichtGefunden("Kein Buch mit der ISBN {$isbn}.");
          }

          public function speichere(Buch $buch): void
          {
              $buecher = [];
              foreach ($this->alle() as $vorhanden) {
                  $buecher[$vorhanden->isbn] = $vorhanden;
              }
              $buecher[$buch->isbn] = $buch;

              $daten = array_map(fn (Buch $b): array => $b->toArray(), array_values($buecher));

              file_put_contents(
                  $this->datei,
                  json_encode($daten, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_THROW_ON_ERROR).PHP_EOL,
