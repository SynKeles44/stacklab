  - id: bearbeiten-loeschen
    title: Bearbeiten und Löschen
    description: |
      Damit ist der CRUD-Kreis fast geschlossen. Es fehlen noch **U**pdate und **D**elete.

      1. Erzeuge `UpdateBookRequest` mit denselben Regeln wie beim Anlegen.
      2. `edit(Book $book)` zeigt die View `books.edit` mit einem Formular, das die aktuellen Werte
         vorausfüllt (`old('title', $book->title)`) und per `@method('PUT')` an `books.update` sendet.
      3. `update(UpdateBookRequest $request, Book $book)` speichert die Änderungen und leitet zur
         Detailseite des Buchs weiter.
      4. `destroy(Book $book)` löscht das Buch und leitet mit Flash-Nachricht zu `books.index` weiter.
      5. Ergänze auf der Detailseite einen Link „Bearbeiten“ und ein kleines Formular mit
         `@method('DELETE')` und einem Button „Löschen“.
    checklist:
      - Bearbeiten-Formular mit `@method('PUT')` und vorausgefüllten Werten
      - "`update()` speichert und leitet zur Detailseite"
      - "`destroy()` löscht und leitet zur Liste"
    hints:
      - HTML-Formulare kennen nur GET und POST. `@method('PUT')` erzeugt ein verstecktes Feld `_method`, das Laravel auswertet.
      - "`$book->update($request->validated());` und danach `return redirect()->route('books.show', $book);`"
      - "`$book->delete();`"
    checks:
      - type: command
        run: |
          f=tests/Feature/StacklabPruefungAendernTest.php
          cat > "$f" <<'EOF'
          <?php

          use App\Models\Book;
          use Illuminate\Foundation\Testing\RefreshDatabase;

          uses(RefreshDatabase::class);

          test('stacklab: bearbeiten und loeschen', function () {
              $book = Book::create(['title' => 'Alter Titel', 'author' => 'Ada']);
              $this->get("/books/{$book->id}/edit")->assertOk()->assertSee('Alter Titel')->assertSee('name="_method"', false);
              $this->put("/books/{$book->id}", ['title' => 'Neuer Titel', 'author' => 'Ada'])
                  ->assertRedirect("/books/{$book->id}");
              expect($book->fresh()->title)->toBe('Neuer Titel');
              $this->put("/books/{$book->id}", ['title' => '', 'author' => 'Ada'])->assertSessionHasErrors('title');
              $this->delete("/books/{$book->id}")->assertRedirect('/books');
              $this->assertModelMissing($book);
          });
