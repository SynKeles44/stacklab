      - "`tests/Feature/BookTest.php` mit mindestens drei Tests"
      - "`RefreshDatabase` aktiv"
      - "`php artisan test` ist grün"
    hints:
      - "Am Anfang der Datei: `uses(RefreshDatabase::class);` und den passenden `use`-Import."
      - "`$book = Book::factory()->create(); $this->get('/books')->assertSee($book->title);`"
      - Schlägt der Beispieltest für `/` fehl, hast du vielleicht `routes/web.php` kaputt gemacht – die Route `/` muss bleiben.
    checks:
      - type: file_exists
        path: tests/Feature/BookTest.php
        message: Die Datei tests/Feature/BookTest.php fehlt noch.
      - type: command
        run: grep -cE "^\s*(test|it)\(" tests/Feature/BookTest.php
        stdout_matches: "^([3-9]|[1-9][0-9]+)$"
        message: In tests/Feature/BookTest.php stehen noch keine drei Tests (test(...) oder it(...)).
      - type: file_contains
