  - id: api
    title: Eine JSON-API für die Leseliste
    description: |
      Eine Handy-App soll die Leseliste lesen können. Du ergänzt eine kleine, nur lesende JSON-API – mit
      einer API Resource, damit keine internen Felder nach außen gelangen.

      1. Richte API-Routen ein: `php artisan install:api` (danach `php artisan migrate`, falls du die
         Frage verneint hast).
      2. Erzeuge `php artisan make:resource BookResource`. Sie gibt `id`, `title`, `author`, `pages` und
         `finished` (als `true`/`false`) aus – keine Zeitstempel.
      3. Erzeuge `php artisan make:controller Api/BookController --api --model=Book`. `index()` liefert
         die Bücher alphabetisch nach Titel, seitenweise mit `config('leseliste.pro_seite')`; `show()`
         liefert ein Buch. Beides über die Resource.
      4. Registriere in `routes/api.php` nur `index` und `show`:
         `Route::apiResource('books', BookController::class)->only(['index', 'show'])->names('api.books');`
      5. Prüfe mit `php artisan route:list --path=books`, dass die Web-Routen weiter `books.index` usw.
         heißen und die API-Routen `api.books.index` und `api.books.show`.
    checklist:
      - "`routes/api.php` mit `apiResource` (nur index und show)"
      - "`BookResource` gibt nur die fünf Felder aus"
      - "`/api/books` liefert 5 Bücher pro Seite, alphabetisch"
    hints:
      - Ohne `->names('api.books')` hätten Web- und API-Routen dieselben Namen (`books.index`). Dann zeigt `route('books.index')` plötzlich auf die API.
      - "`return BookResource::collection(Book::orderBy('title')->paginate(config('leseliste.pro_seite')));`"
      - "Bei einer seitenweisen Liste ergänzt Laravel `links` und `meta` – dort steht z. B. `per_page`."
    checks:
      - type: file_exists
        path: app/Http/Resources/BookResource.php
        message: Die Resource app/Http/Resources/BookResource.php fehlt noch.
      - type: command
        run: php artisan route:list --json | jq -r '.[].name' | grep -E '^(api\.books\.(index|show)|books\.index)$' | sort | tr '\n' ' '
        stdout_matches: "^api\\.books\\.index api\\.books\\.show books\\.index\\s*$"
        message: Es fehlen die Routen api.books.index und api.books.show – oder die Web-Route books.index ist verschwunden. Nutze ->only(['index', 'show'])->names('api.books').
      - type: command
        run: |
          f=tests/Feature/StacklabPruefungApiTest.php
          cat > "$f" <<'EOF'
          <?php

          use App\Models\Book;
          use Illuminate\Foundation\Testing\RefreshDatabase;

          uses(RefreshDatabase::class);

          test('stacklab: api', function () {
              Book::factory(7)->create();
              $erstes = Book::orderBy('title')->first();
              $this->getJson('/api/books')->assertOk()
                  ->assertJsonCount(5, 'data')
                  ->assertJsonPath('data.0.title', $erstes->title)
                  ->assertJsonPath('meta.per_page', 5)
                  ->assertJsonMissingPath('data.0.created_at');
              $this->getJson("/api/books/{$erstes->id}")->assertOk()
                  ->assertExactJson(['data' => ['id' => $erstes->id, 'title' => $erstes->title, 'author' => $erstes->author, 'pages' => $erstes->pages, 'finished' => $erstes->finished]]);
              $this->getJson('/api/books/99999')->assertNotFound();
              expect(route('books.index', absolute: false))->toBe('/books');
          });
          EOF
          php artisan test "$f" >/dev/null 2>&1; s=$?; rm -f "$f"; exit $s
        message: "Die API liefert noch nicht das Erwartete. GET /api/books soll 5 Bücher pro Seite alphabetisch unter data liefern (mit meta.per_page), GET /api/books/{id} genau id, title, author, pages und finished – ohne Zeitstempel. route('books.index') muss weiter auf /books zeigen."
    solution: |
      ```php title="app/Http/Resources/BookResource.php (toArray)"
      return [
          'id' => $this->id,
          'title' => $this->title,
          'author' => $this->author,
          'pages' => $this->pages,
          'finished' => (bool) $this->finished,
      ];
      ```

      ```php title="app/Http/Controllers/Api/BookController.php (Ausschnitt)"
      public function index()
      {
          return BookResource::collection(
              Book::orderBy('title')->paginate(config('leseliste.pro_seite'))
          );
      }

      public function show(Book $book)
      {
          return new BookResource($book);
      }
      ```

      ```php title="routes/api.php (Ergänzung)"
      use App\Http\Controllers\Api\BookController;

      Route::apiResource('books', BookController::class)->only(['index', 'show'])->names('api.books');
      ```
    solve: |
      [ -f routes/api.php ] || php artisan install:api --without-migration-prompt -n -q
      php artisan migrate --force -q
      mkdir -p app/Http/Resources app/Http/Controllers/Api
      cat > app/Http/Resources/BookResource.php <<'EOF'
      <?php

      namespace App\Http\Resources;

      use Illuminate\Http\Request;
      use Illuminate\Http\Resources\Json\JsonResource;

      class BookResource extends JsonResource
      {
          public function toArray(Request $request): array
          {
              return [
                  'id' => $this->id,
                  'title' => $this->title,
                  'author' => $this->author,
                  'pages' => $this->pages,
                  'finished' => (bool) $this->finished,
              ];
          }
      }
      EOF
      cat > app/Http/Controllers/Api/BookController.php <<'EOF'
      <?php

      namespace App\Http\Controllers\Api;

      use App\Http\Controllers\Controller;
      use App\Http\Resources\BookResource;
      use App\Models\Book;

      class BookController extends Controller
      {
          public function index()
          {
              return BookResource::collection(
                  Book::orderBy('title')->paginate(config('leseliste.pro_seite'))
              );
          }

          public function show(Book $book)
          {
              return new BookResource($book);
          }
      }
      EOF
      grep -q "names('api.books')" routes/api.php || cat >> routes/api.php <<'EOF'

      Route::apiResource('books', App\Http\Controllers\Api\BookController::class)->only(['index', 'show'])->names('api.books');
      EOF

  - id: eigene-tests
    title: Eigene Tests mit Pest
    description: |
      Bisher hat Stacklab deine App mit eigenen Tests geprüft. Jetzt schreibst du die Tests selbst – so
      merkst du in Zukunft sofort, wenn eine Änderung etwas kaputt macht.

      1. Lege `tests/Feature/BookTest.php` an (`php artisan make:test BookTest`).
      2. Nutze `RefreshDatabase`, damit jeder Test mit einer leeren Datenbank startet.
      3. Schreibe **mindestens drei** Tests, zum Beispiel:
         - Die Liste zeigt ein Buch, das du vorher mit der Factory angelegt hast.
         - Ein gültiges Formular legt ein Buch an.
         - Ein Buch ohne Titel wird abgelehnt (`assertSessionHasErrors('title')`).
      4. Führe die Suite aus: `php artisan test` – alles muss grün sein.
