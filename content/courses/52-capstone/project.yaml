      EOF
      cat > src/api.ts <<'EOF'
      import { tokenSchema, workshopListSchema, workshopResponseSchema } from './schema.ts'
      import type { NewWorkshop, Workshop } from './schema.ts'

      const baseUrl: string = import.meta.env?.VITE_API_URL ?? 'http://localhost:8000'
      let token: string | null = null

      export function setToken(value: string | null): void {
        token = value
      }

      export function hasToken(): boolean {
        return token !== null
      }

      export class ApiError extends Error {
        status: number
        errors: Record<string, string[]>

        constructor(status: number, message: string, errors: Record<string, string[]> = {}) {
          super(message)
          this.status = status
          this.errors = errors
        }
      }

      async function request(path: string, init: RequestInit = {}): Promise<unknown> {
        const headers = new Headers(init.headers)
        headers.set('Accept', 'application/json')
        if (init.body) headers.set('Content-Type', 'application/json')
        if (token) headers.set('Authorization', `Bearer ${token}`)

        const response = await fetch(`${baseUrl}/api${path}`, { ...init, headers })
        if (response.status === 204) return null

        const body = await response.json().catch(() => ({}))
        if (!response.ok) {
          throw new ApiError(response.status, body.message ?? 'Unbekannter Fehler', body.errors ?? {})
        }
        return body
      }

      export async function fetchWorkshops(): Promise<Workshop[]> {
        return workshopListSchema.parse(await request('/workshops')).data
      }

      export async function fetchWorkshop(id: number): Promise<Workshop> {
        return workshopResponseSchema.parse(await request(`/workshops/${id}`)).data
      }

      export async function createWorkshop(input: NewWorkshop): Promise<Workshop> {
        const body = await request('/workshops', { method: 'POST', body: JSON.stringify(input) })
        return workshopResponseSchema.parse(body).data
      }

      export async function bookWorkshop(id: number): Promise<void> {
        await request(`/workshops/${id}/booking`, { method: 'POST' })
      }

      export async function login(email: string, password: string): Promise<void> {
        const body = await request('/login', {
          method: 'POST',
          body: JSON.stringify({ email, password, device_name: 'web' }),
        })
        setToken(tokenSchema.parse(body).token)
      }
      EOF
      cat > src/queryClient.ts <<'EOF'
      import { QueryClient } from '@tanstack/react-query'

      export const queryClient = new QueryClient({
        defaultOptions: {
          queries: { staleTime: 30_000 },
        },
      })
      EOF
      cat > src/queries.ts <<'EOF'
      import { queryOptions } from '@tanstack/react-query'
      import { fetchWorkshop, fetchWorkshops } from './api.ts'

      export const workshopKeys = {
        all: ['workshops'] as const,
        detail: (id: number) => ['workshops', id] as const,
      }

      export function workshopsQuery() {
        return queryOptions({ queryKey: workshopKeys.all, queryFn: fetchWorkshops })
      }

      export function workshopQuery(id: number) {
        return queryOptions({ queryKey: workshopKeys.detail(id), queryFn: () => fetchWorkshop(id) })
      }
      EOF

