    description: |
      Das Frontend redet nur über eine kleine Datenschicht mit der API. Zod prüft dabei zur Laufzeit, ob die
      Antworten wirklich dem vereinbarten Format entsprechen. Arbeite in `web`. Importe eigener Dateien schreibst
      du **mit** Endung (`./schema.ts`), damit die Prüfungen sie direkt mit Node.js ausführen können.

