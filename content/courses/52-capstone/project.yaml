  - id: datenmodell
    title: Datenmodell mit Migrationen und Models
    description: |
      Setze dein Datenmodell um. Ein **Workshop** gehört einer Organisatorin (`users`) und hat viele
      **Buchungen**. Eine Buchung verbindet genau einen Workshop mit genau einer Person.

      Arbeite im Ordner `api`:

      1. `php artisan make:model Workshop -mf` und `php artisan make:model Booking -m`
      2. Migration `workshops`: `user_id` (Fremdschlüssel, löscht mit), `title` (string), `description`
         (text, nullable), `location` (string), `starts_at` (dateTime), `capacity` (unsignedInteger), Timestamps.
      3. Migration `bookings`: `workshop_id` und `user_id` (Fremdschlüssel, löschen mit), Timestamps und ein
         **Unique-Constraint** über `workshop_id` und `user_id`.
      4. `Workshop`: `#[Fillable([...])]` für title, description, location, starts_at, capacity; Casts für
         `starts_at` (datetime) und `capacity` (integer); Beziehungen `organizer()` (belongsTo User über
         `user_id`) und `bookings()` (hasMany); Methode `seatsLeft(): int`.
      5. `Booking`: `#[Fillable(['user_id'])]` und `workshop()` / `user()`.
      6. `WorkshopFactory` mit sinnvollen Testdaten (Termin in der Zukunft, organizer per `User::factory()`).
      7. `php artisan migrate` und `./vendor/bin/pest tests/Feature/Vereinskurse/DatenmodellTest.php`.
    checklist:
      - Tabellen workshops und bookings mit Fremdschlüsseln
      - Unique-Constraint verhindert doppelte Buchungen
      - Models mit Fillable, Casts, Beziehungen und seatsLeft()
      - WorkshopFactory liefert gültige Testdaten
    hints:
      - "`$table->foreignId('user_id')->constrained()->cascadeOnDelete();` legt Spalte und Fremdschlüssel an."
      - "`$table->unique(['workshop_id', 'user_id']);` – so prüft die Datenbank selbst, dass niemand doppelt bucht."
      - "seatsLeft: `max(0, $this->capacity - ($this->bookings_count ?? $this->bookings()->count()))` – nutzt einen vorab geladenen Zähler, wenn es ihn gibt."
    checks:
      - type: command
        run: cd api && ./vendor/bin/pest tests/Feature/Vereinskurse/DatenmodellTest.php
        message: Der Test tests/Feature/Vereinskurse/DatenmodellTest.php ist noch rot. Führe ihn aus und lies die erste Fehlermeldung.
      - type: command
        run: cd api && php artisan tinker --execute="var_export(Schema::hasTable('workshops') && Schema::hasTable('bookings'));"
        stdout_matches: "^true\\s*$"
        message: In deiner lokalen Datenbank fehlen die Tabellen workshops oder bookings. Führe php artisan migrate aus.
    solution: |
      ```php title="database/migrations/…_create_workshops_table.php (Ausschnitt)"
      Schema::create('workshops', function (Blueprint $table) {
          $table->id();
          $table->foreignId('user_id')->constrained()->cascadeOnDelete();
          $table->string('title');
          $table->text('description')->nullable();
          $table->string('location');
          $table->dateTime('starts_at')->index();
          $table->unsignedInteger('capacity');
          $table->timestamps();
      });
      ```

      ```php title="database/migrations/…_create_bookings_table.php (Ausschnitt)"
      Schema::create('bookings', function (Blueprint $table) {
          $table->id();
          $table->foreignId('workshop_id')->constrained()->cascadeOnDelete();
          $table->foreignId('user_id')->constrained()->cascadeOnDelete();
          $table->timestamps();
          $table->unique(['workshop_id', 'user_id']);
      });
      ```

      ```php title="app/Models/Workshop.php"
      #[Fillable(['title', 'description', 'location', 'starts_at', 'capacity'])]
      class Workshop extends Model
      {
          /** @use HasFactory<WorkshopFactory> */
          use HasFactory;

          protected function casts(): array
          {
              return ['starts_at' => 'datetime', 'capacity' => 'integer'];
          }

          public function organizer(): BelongsTo
          {
              return $this->belongsTo(User::class, 'user_id');
          }

          public function bookings(): HasMany
          {
              return $this->hasMany(Booking::class);
          }

          public function seatsLeft(): int
          {
              $booked = $this->bookings_count ?? $this->bookings()->count();

              return max(0, $this->capacity - $booked);
          }
      }
      ```

      Den vollständigen Stand inklusive `Booking` und `WorkshopFactory` siehst du, wenn du **Für mich
      erledigen** nutzt.
    solve: |
      cd api
      [ -f app/Models/Workshop.php ] || php artisan make:model Workshop -mf -q
      [ -f app/Models/Booking.php ] || php artisan make:model Booking -m -q
      W=$(ls database/migrations/*_create_workshops_table.php | head -n 1)
      cat > "$W" <<'EOF'
      <?php

      use Illuminate\Database\Migrations\Migration;
      use Illuminate\Database\Schema\Blueprint;
      use Illuminate\Support\Facades\Schema;

      return new class extends Migration
      {
          public function up(): void
          {
              Schema::create('workshops', function (Blueprint $table) {
                  $table->id();
                  $table->foreignId('user_id')->constrained()->cascadeOnDelete();
                  $table->string('title');
                  $table->text('description')->nullable();
                  $table->string('location');
                  $table->dateTime('starts_at')->index();
                  $table->unsignedInteger('capacity');
                  $table->timestamps();
              });
          }

          public function down(): void
          {
              Schema::dropIfExists('workshops');
          }
      };
      EOF
      K=$(ls database/migrations/*_create_bookings_table.php | head -n 1)
      cat > "$K" <<'EOF'
      <?php

      use Illuminate\Database\Migrations\Migration;
      use Illuminate\Database\Schema\Blueprint;
