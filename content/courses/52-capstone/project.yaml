steps:
  - id: anforderungen
    title: Anforderungen und Entscheidungen festhalten
    description: |
      Bevor du Code schreibst, legst du fest, **was** Version 1 können muss – und was ausdrücklich nicht.
      Das schützt dich vor Scope Creep. Lies dazu die Lektionen aus Modul 1.

      1. Lege `docs/anforderungen.md` an mit diesen Überschriften (genau so geschrieben):
         `## Muss`, `## Soll`, `## Kann`, `## Nicht jetzt` und `## Nicht-funktionale Anforderungen`.
      2. Schreibe unter `## Muss` mindestens **drei User Stories** im Format
         `- Als <Rolle> möchte ich <Ziel>, damit <Nutzen>.`
      3. Notiere unter `## Nicht jetzt` mindestens einen Punkt, den du bewusst weglässt (z. B. Bezahlung).
      4. Lege `docs/entscheidungen.md` an mit mindestens **zwei** Entscheidungen. Jede bekommt eine
         `##`-Überschrift und eine Zeile, die mit `Begründung:` beginnt.
    checklist:
      - "`docs/anforderungen.md` mit Muss/Soll/Kann/Nicht jetzt und nicht-funktionalen Anforderungen"
      - Mindestens drei User Stories unter Muss
      - "`docs/entscheidungen.md` mit mindestens zwei begründeten Entscheidungen"
    hints:
      - "Mit `mkdir -p docs` und `nano docs/anforderungen.md` legst du die Datei an."
      - "Eine User Story: `- Als Mitglied möchte ich kommende Workshops sehen, damit ich einen passenden finde.`"
      - "Eine Entscheidung: `## Laravel-API plus React-SPA` und darunter `Begründung: …`."
    checks:
      - type: file_exists
        path: docs/anforderungen.md
        message: Die Datei docs/anforderungen.md fehlt noch.
      - type: command
        run: for h in 'Muss' 'Soll' 'Kann' 'Nicht jetzt' 'Nicht-funktionale Anforderungen'; do grep -qE "^## $h\s*$" docs/anforderungen.md || echo "$h"; done
        stdout_equals: ""
        message: "In docs/anforderungen.md fehlt mindestens eine Überschrift: ## Muss, ## Soll, ## Kann, ## Nicht jetzt, ## Nicht-funktionale Anforderungen."
      - type: command
        run: grep -cE '^- Als .+ möchte .+, damit .+' docs/anforderungen.md
        expect_exit: 0
        stdout_matches: "^([3-9]|[1-9][0-9]+)\\s*$"
        message: "Schreibe mindestens drei User Stories im Format „- Als <Rolle> möchte ich <Ziel>, damit <Nutzen>.“"
      - type: command
        run: awk '/^## Nicht jetzt/{f=1;next} /^## /{f=0} f && /^- /{n++} END{print n+0}' docs/anforderungen.md
        stdout_matches: "^[1-9][0-9]*$"
        message: Notiere unter ## Nicht jetzt mindestens einen Listenpunkt, den Version 1 bewusst nicht kann.
      - type: command
        run: "grep -c '^## ' docs/entscheidungen.md && grep -c '^Begründung:' docs/entscheidungen.md"
        stdout_matches: "^([2-9]|[1-9][0-9]+)\\s+([2-9]|[1-9][0-9]+)\\s*$"
        message: docs/entscheidungen.md braucht mindestens zwei Entscheidungen mit ##-Überschrift und je einer Zeile „Begründung:“.
    solution: |
      ```markdown title="docs/anforderungen.md"
      # Anforderungen Vereinskurse – Version 1

      ## Muss
      - Als Mitglied möchte ich die kommenden Workshops sehen, damit ich einen passenden finde.
      - Als Mitglied möchte ich einen Platz buchen, damit er für mich reserviert ist.
      - Als Organisatorin möchte ich einen Workshop anlegen, damit Mitglieder ihn buchen können.
      - Als Mitglied möchte ich eine Buchung stornieren, damit der Platz wieder frei wird.

      ## Soll
      - Freie Plätze werden in der Liste angezeigt.

      ## Kann
      - Erinnerung per E-Mail am Vortag.

      ## Nicht jetzt
      - Bezahlung
      - Warteliste

      ## Nicht-funktionale Anforderungen
      - Die Liste lädt in unter einer Sekunde.
      - Es gibt nie mehr Buchungen als Plätze.
      ```

      ```markdown title="docs/entscheidungen.md"
      # Entscheidungen

      ## Laravel-API plus React-SPA
      Begründung: Beides kennen wir aus den Kursen, die API lässt sich gut testen.

      ## Sanctum-Tokens für den Login
      Begründung: Einfach zu testen und auch für spätere Apps nutzbar.
      ```
    solve: |
