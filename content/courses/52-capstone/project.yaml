    solve: |
      cd web
      cat > src/actions.ts <<'EOF'
      import { redirect } from 'react-router'
      import type { ActionFunctionArgs } from 'react-router'
      import { z } from 'zod'
      import { ApiError, bookWorkshop, createWorkshop, login } from './api.ts'
      import { workshopKeys } from './queries.ts'
      import { queryClient } from './queryClient.ts'
      import { loginSchema, newWorkshopSchema } from './schema.ts'

      export type FieldErrors = Record<string, string[] | undefined>

      export async function createWorkshopAction({ request }: ActionFunctionArgs) {
        const parsed = newWorkshopSchema.safeParse(Object.fromEntries(await request.formData()))
        if (!parsed.success) {
          return { errors: z.flattenError(parsed.error).fieldErrors as FieldErrors }
        }
        try {
          const workshop = await createWorkshop(parsed.data)
          await queryClient.invalidateQueries({ queryKey: workshopKeys.all })
          return redirect(`/workshops/${workshop.id}`)
        } catch (error) {
          if (error instanceof ApiError && error.status === 422) return { errors: error.errors as FieldErrors }
          if (error instanceof ApiError && error.status === 401) return redirect('/login')
          throw error
        }
      }

      export async function loginAction({ request }: ActionFunctionArgs) {
        const parsed = loginSchema.safeParse(Object.fromEntries(await request.formData()))
        if (!parsed.success) {
          return { errors: z.flattenError(parsed.error).fieldErrors as FieldErrors }
        }
        try {
          await login(parsed.data.email, parsed.data.password)
          return redirect('/')
        } catch (error) {
          if (error instanceof ApiError && error.status === 422) return { errors: error.errors as FieldErrors }
          throw error
        }
      }

      export async function bookAction({ params }: ActionFunctionArgs) {
        try {
          await bookWorkshop(Number(params.id))
          await queryClient.invalidateQueries({ queryKey: workshopKeys.all })
          return { ok: true, error: null }
        } catch (error) {
          if (error instanceof ApiError && error.status === 401) return redirect('/login')
          if (error instanceof ApiError && error.status === 409) return { ok: false, error: error.message }
          throw error
        }
      }
      EOF
      cat > src/pages.tsx <<'EOF'
      import { useSuspenseQuery } from '@tanstack/react-query'
      import {
        Form,
        Link,
        Outlet,
        isRouteErrorResponse,
        useActionData,
        useFetcher,
        useNavigation,
        useParams,
        useRouteError,
      } from 'react-router'
      import type { bookAction, createWorkshopAction, loginAction } from './actions.ts'
      import { hasToken } from './api.ts'
      import { workshopQuery, workshopsQuery } from './queries.ts'

      const datum = new Intl.DateTimeFormat('de-DE', { dateStyle: 'medium', timeStyle: 'short' })

      export function Layout() {
        const navigation = useNavigation()
        return (
          <div className="app">
            <header>
              <Link to="/">Vereinskurse</Link>
              <nav>
                <Link to="/workshops/new">Workshop anlegen</Link>
                {!hasToken() && <Link to="/login">Anmelden</Link>}
              </nav>
            </header>
            <main aria-busy={navigation.state !== 'idle'}>
              <Outlet />
            </main>
          </div>
        )
      }

      export function WorkshopList() {
        const { data: workshops } = useSuspenseQuery(workshopsQuery())
        if (workshops.length === 0) {
          return <p>Gerade sind keine Workshops geplant.</p>
        }
        return (
          <ul className="workshops">
            {workshops.map((workshop) => (
              <li key={workshop.id}>
                <Link to={`/workshops/${workshop.id}`}>{workshop.title}</Link>
                <span>
                  {datum.format(new Date(workshop.starts_at))} · {workshop.location} · noch {workshop.seats_left} Plätze
                </span>
              </li>
            ))}
          </ul>
        )
      }

      export function WorkshopDetail() {
        const { id } = useParams()
        const { data: workshop } = useSuspenseQuery(workshopQuery(Number(id)))
        const fetcher = useFetcher<typeof bookAction>()
        const ausgebucht = workshop.seats_left === 0
        return (
          <article>
            <h1>{workshop.title}</h1>
            <p>
              {datum.format(new Date(workshop.starts_at))} · {workshop.location}
            </p>
            {workshop.description && <p>{workshop.description}</p>}
            <p>
              Noch {workshop.seats_left} von {workshop.capacity} Plätzen frei.
            </p>
            <fetcher.Form method="post">
              <button type="submit" disabled={ausgebucht || fetcher.state !== 'idle'}>
                {ausgebucht ? 'Ausgebucht' : 'Platz buchen'}
              </button>
            </fetcher.Form>
            {fetcher.data?.error && <p role="alert">{fetcher.data.error}</p>}
            {fetcher.data?.ok && <p role="status">Gebucht – bis bald!</p>}
          </article>
        )
      }

      export function NewWorkshop() {
        const actionData = useActionData<typeof createWorkshopAction>()
        const errors = actionData?.errors
        return (
          <Form method="post" className="formular">
            <h1>Workshop anlegen</h1>
            <label>
              Titel
              <input name="title" required minLength={3} />
            </label>
            {errors?.title && <p role="alert">{errors.title[0]}</p>}
            <label>
              Ort
              <input name="location" required />
            </label>
            {errors?.location && <p role="alert">{errors.location[0]}</p>}
            <label>
              Beginn
              <input name="starts_at" type="datetime-local" required />
            </label>
            {errors?.starts_at && <p role="alert">{errors.starts_at[0]}</p>}
            <label>
              Plätze
              <input name="capacity" type="number" min={1} max={500} required />
            </label>
            {errors?.capacity && <p role="alert">{errors.capacity[0]}</p>}
            <label>
              Beschreibung
              <textarea name="description" />
            </label>
            <button type="submit">Speichern</button>
          </Form>
        )
      }

      export function Login() {
        const actionData = useActionData<typeof loginAction>()
        const errors = actionData?.errors
        return (
          <Form method="post" className="formular">
            <h1>Anmelden</h1>
            <label>
              E-Mail
              <input name="email" type="email" autoComplete="username" required />
            </label>
            {errors?.email && <p role="alert">{errors.email[0]}</p>}
            <label>
              Passwort
              <input name="password" type="password" autoComplete="current-password" required />
            </label>
            {errors?.password && <p role="alert">{errors.password[0]}</p>}
            <button type="submit">Anmelden</button>
          </Form>
        )
      }

      export function ErrorPage() {
        const error = useRouteError()
        const text = isRouteErrorResponse(error) ? `${error.status} ${error.statusText}` : 'Etwas ist schiefgelaufen.'
        return (
          <div role="alert">
            <h1>Fehler</h1>
            <p>{text}</p>
            <Link to="/">Zur Startseite</Link>
          </div>
        )
      }
      EOF
      cat > src/router.tsx <<'EOF'
      import { createBrowserRouter } from 'react-router'
      import { bookAction, createWorkshopAction, loginAction } from './actions.ts'
      import { ErrorPage, Layout, Login, NewWorkshop, WorkshopDetail, WorkshopList } from './pages.tsx'
      import { workshopQuery, workshopsQuery } from './queries.ts'
      import { queryClient } from './queryClient.ts'

      export const router = createBrowserRouter([
        {
          path: '/',
          Component: Layout,
          ErrorBoundary: ErrorPage,
          children: [
            { index: true, Component: WorkshopList, loader: () => queryClient.ensureQueryData(workshopsQuery()) },
            { path: 'workshops/new', Component: NewWorkshop, action: createWorkshopAction },
            {
              path: 'workshops/:id',
              Component: WorkshopDetail,
              loader: ({ params }) => queryClient.ensureQueryData(workshopQuery(Number(params.id))),
              action: bookAction,
            },
            { path: 'login', Component: Login, action: loginAction },
          ],
        },
      ])
      EOF
      cat > src/main.tsx <<'EOF'
      import { QueryClientProvider } from '@tanstack/react-query'
      import { StrictMode } from 'react'
      import { createRoot } from 'react-dom/client'
      import { RouterProvider } from 'react-router/dom'
      import './index.css'
      import { queryClient } from './queryClient.ts'
      import { router } from './router.tsx'

      createRoot(document.getElementById('root')!).render(
        <StrictMode>
          <QueryClientProvider client={queryClient}>
            <RouterProvider router={router} />
          </QueryClientProvider>
        </StrictMode>,
      )
      EOF
      rm -f src/App.tsx src/App.css

  - id: container-und-ci
    title: Dockerfiles, Compose und CI-Pipeline
    description: |
      Damit die App überall gleich läuft, verpackst du sie in Container und lässt jede Änderung automatisch
      prüfen. Docker und GitHub gibt es im Übungs-Terminal nicht – die Prüfungen lesen deine Dateien deshalb
      statisch. Arbeite im Projektordner `vereinskurse`:

      1. `api/Dockerfile` mit drei Stages: `FROM php:8.5-fpm-alpine AS base` (mit `pdo_pgsql`),
         `FROM base AS vendor` (Composer ohne Dev-Pakete) und `FROM base AS final` (kopiert aus `vendor`, läuft
         als `USER www-data`, `CMD ["php-fpm"]`). Dazu `api/.dockerignore` mit mindestens `vendor` und `.env`.
      2. `web/Dockerfile` mit zwei Stages: `FROM node:24-alpine AS build` (`npm ci`, `npm run build`) und
         `FROM nginx:1.30-alpine`, das `dist` und `web/nginx.conf` übernimmt.
      3. `web/nginx.conf`: SPA-Fallback (`try_files $uri /index.html;`) und `location /api/` per
         `fastcgi_pass api:9000;` an PHP-FPM – Frontend und API liegen so auf **einem** Origin.
      4. `compose.yaml` mit den Services `db` (`postgres:18-alpine`, Volume), `api` (baut `./api`, Ziel `final`,
         wartet per `depends_on` auf `db`) und `web` (baut `./web`, Port `8080:80`).
      5. `.github/workflows/ci.yml` mit zwei Jobs: `api` (setup-php 8.5, `composer install`, `composer check`) und
         `web` (setup-node 24, `npm ci`, `npm run lint`, `npm run build`). Auslöser: `pull_request` und
         `push` auf `main`.
    checklist:
      - Multi-Stage-Dockerfiles für API und Web, API läuft nicht als root
      - Nginx liefert die SPA aus und reicht /api an PHP-FPM weiter
      - compose.yaml mit db, api und web
      - CI-Workflow prüft beide Teile bei jedem Pull Request
    hints:
      - "Die Stage-Reihenfolge prüfst du mit `grep -n '^FROM' api/Dockerfile`."
      - "In der nginx.conf für PHP: `fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;` und `include fastcgi_params;`."
      - "Im Workflow setzt `defaults: run: working-directory: api` den Ordner für alle Schritte eines Jobs."
    checks:
      - type: command
        run: grep -E '^FROM\s' api/Dockerfile | tr -s ' ' | paste -sd '|' -
        stdout_equals: "FROM php:8.5-fpm-alpine AS base|FROM base AS vendor|FROM base AS final"
        message: "api/Dockerfile braucht genau drei Stages: FROM php:8.5-fpm-alpine AS base, FROM base AS vendor, FROM base AS final."
      - type: command
        run: >-
          awk '/^FROM/{s++} s==3 && /^USER +www-data/{u=NR} s==3 && /^CMD +\[ *"php-fpm" *\]/{c=NR} s==2 && /composer +install/ && /--no-dev/{i=1} END{print (u && c && u<c && i) ? "ok" : "falsch"}' api/Dockerfile
        stdout_equals: ok
        message: "In api/Dockerfile fehlt etwas: vendor installiert mit composer install --no-dev, final setzt USER www-data vor CMD [\"php-fpm\"]."
      - type: command
        run: grep -qxE 'vendor/?' api/.dockerignore && grep -qxE '\.env' api/.dockerignore && echo ok
        stdout_equals: ok
        message: api/.dockerignore soll mindestens die Zeilen vendor und .env enthalten – Geheimnisse und lokale Pakete gehören nicht ins Image.
      - type: command
        run: grep -E '^FROM\s' web/Dockerfile | tr -s ' ' | paste -sd '|' - | grep -qE '^FROM node:24-alpine AS build\|FROM nginx:[0-9.]+-alpine( AS [a-z]+)?$' && grep -q 'npm ci' web/Dockerfile && grep -q 'npm run build' web/Dockerfile && grep -qE 'COPY +--from=build +/app/dist' web/Dockerfile && echo ok
        stdout_equals: ok
        message: "web/Dockerfile: Stage FROM node:24-alpine AS build mit npm ci und npm run build, danach FROM nginx:1.30-alpine mit COPY --from=build /app/dist …"
      - type: command
        run: grep -qE 'try_files +\$uri +(\$uri/ +)?/index\.html' web/nginx.conf && grep -qE 'location +(\^~ +)?/api/' web/nginx.conf && grep -qE 'fastcgi_pass +api:9000' web/nginx.conf && echo ok
        stdout_equals: ok
        message: "web/nginx.conf braucht try_files $uri /index.html; für die SPA und location /api/ mit fastcgi_pass api:9000;."
      - type: command
        run: >-
          for s in '^  db:' '^  api:' '^  web:' 'postgres:18' 'target: *final' '8080:80' 'depends_on'; do grep -qE "$s" compose.yaml || echo "$s"; done
        stdout_equals: ""
        message: "compose.yaml unvollständig: Es braucht die Services db (postgres:18-alpine), api (target: final, depends_on) und web (Port 8080:80)."
      - type: command
        run: f=.github/workflows/ci.yml; grep -q 'pull_request' $f && grep -qE '^  api:' $f && grep -qE '^  web:' $f && grep -q 'composer check' $f && grep -q 'npm ci' $f && grep -q 'npm run lint' $f && grep -q 'npm run build' $f && grep -q 'setup-php' $f && grep -q 'setup-node' $f && echo ok
        stdout_equals: ok
        message: ".github/workflows/ci.yml braucht den Auslöser pull_request und die Jobs api (setup-php, composer check) und web (setup-node, npm ci, npm run lint, npm run build)."
    solution: |
      ```dockerfile title="api/Dockerfile"
      FROM php:8.5-fpm-alpine AS base
      RUN apk add --no-cache libpq-dev \
       && docker-php-ext-install pdo_pgsql
      WORKDIR /var/www/html

      FROM base AS vendor
      RUN apk add --no-cache unzip
      COPY --from=composer:2 /usr/bin/composer /usr/bin/composer
      COPY composer.json composer.lock ./
      RUN composer install --no-dev --no-scripts --no-autoloader --prefer-dist
      COPY . .
      RUN composer dump-autoload --optimize --no-dev

      FROM base AS final
      COPY --from=vendor --chown=www-data:www-data /var/www/html ./
      USER www-data
      EXPOSE 9000
      CMD ["php-fpm"]
      ```

      ```yaml title=".github/workflows/ci.yml"
      name: CI
      on:
        pull_request:
        push:
          branches: [main]

      jobs:
        api:
          runs-on: ubuntu-latest
          defaults:
            run:
              working-directory: api
          steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                php-version: '8.5'
                coverage: none
            - run: composer install --no-interaction --prefer-dist
            - run: cp .env.example .env && php artisan key:generate
            - run: composer check

        web:
          runs-on: ubuntu-latest
          defaults:
            run:
              working-directory: web
          steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                node-version: 24
                cache: npm
                cache-dependency-path: web/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run build
      ```

      `web/Dockerfile`, `web/nginx.conf` und `compose.yaml` siehst du vollständig, wenn du **Für mich
      erledigen** nutzt.
    solve: |
      cat > api/Dockerfile <<'EOF'
      FROM php:8.5-fpm-alpine AS base
      RUN apk add --no-cache libpq-dev \
       && docker-php-ext-install pdo_pgsql
      WORKDIR /var/www/html

      FROM base AS vendor
      RUN apk add --no-cache unzip
      COPY --from=composer:2 /usr/bin/composer /usr/bin/composer
      COPY composer.json composer.lock ./
      RUN composer install --no-dev --no-scripts --no-autoloader --prefer-dist
      COPY . .
      RUN composer dump-autoload --optimize --no-dev

      FROM base AS final
      COPY --from=vendor --chown=www-data:www-data /var/www/html ./
      USER www-data
      EXPOSE 9000
      CMD ["php-fpm"]
      EOF
      printf '%s\n' 'vendor' '.env' 'node_modules' 'storage/logs/*' 'database/*.sqlite' 'tests' > api/.dockerignore
      cat > web/Dockerfile <<'EOF'
      FROM node:24-alpine AS build
      WORKDIR /app
      COPY package.json package-lock.json ./
      RUN npm ci
      COPY . .
      ENV VITE_API_URL=""
      RUN npm run build

      FROM nginx:1.30-alpine
      COPY nginx.conf /etc/nginx/conf.d/default.conf
      COPY --from=build /app/dist /usr/share/nginx/html
      EOF
      printf '%s\n' 'node_modules' 'dist' > web/.dockerignore
      cat > web/nginx.conf <<'EOF'
      server {
          listen 80;
          root /usr/share/nginx/html;
          index index.html;

          location / {
              try_files $uri /index.html;
          }

          location /api/ {
              include fastcgi_params;
              fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
              fastcgi_pass api:9000;
          }

          location = /up {
              include fastcgi_params;
              fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
              fastcgi_pass api:9000;
          }
      }
      EOF
      cat > compose.yaml <<'EOF'
      services:
        db:
          image: postgres:18-alpine
          environment:
            POSTGRES_DB: vereinskurse
            POSTGRES_USER: vereinskurse
            POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}
          volumes:
            - db-daten:/var/lib/postgresql
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U vereinskurse"]
            interval: 5s
            retries: 10

        api:
          build:
            context: ./api
            target: final
          env_file: ./api/.env
          depends_on:
            db:
              condition: service_healthy

        web:
          build: ./web
          ports:
            - "8080:80"
          depends_on:
            - api

      volumes:
        db-daten:
      EOF
      mkdir -p .github/workflows
      cat > .github/workflows/ci.yml <<'EOF'
      name: CI
      on:
        pull_request:
        push:
          branches: [main]

      jobs:
        api:
          runs-on: ubuntu-latest
          defaults:
            run:
              working-directory: api
          steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                php-version: '8.5'
                coverage: none
            - run: composer install --no-interaction --prefer-dist
            - run: cp .env.example .env && php artisan key:generate
            - run: composer check

        web:
          runs-on: ubuntu-latest
          defaults:
            run:
              working-directory: web
          steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                node-version: 24
                cache: npm
                cache-dependency-path: web/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run build
      EOF

  - id: go-live-und-retro
    title: Deploy-Kit, Go-Live-Checkliste und Retrospektive
    description: |
      Zum Schluss machst du das Projekt **auslieferbar** und schaust zurück. Einen echten Server gibt es im
      Übungs-Terminal nicht – du baust das Deploy-Kit so, dass du es auf einem Server mit Docker sofort nutzen
      könntest. Arbeite im Projektordner `vereinskurse`:

      1. `deploy/deploy.sh` (ausführbar): `#!/usr/bin/env bash`, `set -euo pipefail`, dann
         `docker compose build`, `docker compose run --rm api php artisan migrate --force`,
         `docker compose run --rm api php artisan optimize`, `docker compose up -d` und zum Schluss ein
         Health-Check mit `curl -fsS` auf `/up` (Adresse aus `APP_URL`, Standard `http://localhost:8080`).
      2. `deploy/.env.production.example` mit den nötigen Variablen als Platzhalter (mindestens `APP_ENV=production`,
         `APP_DEBUG=false`, `APP_KEY=`, `DB_CONNECTION=pgsql`, `DB_PASSWORD=`).
      3. `docs/go-live.md` mit mindestens **acht** Checklistenpunkten im Format `- [ ] …`.
      4. `docs/retro.md` mit den Überschriften `## Was lief gut`, `## Was war schwierig` und
         `## Was ich beim nächsten Mal anders mache` – je mit mindestens einem Punkt.
      5. `README.md` im Projektordner mit einer Überschrift `## Lokal starten`.
      6. Committe alles (`git add -A`, `git commit -m "feat: ..."`) – danach ist `git status` sauber.
    checklist:
      - Deploy-Skript mit Migration, Cache und Health-Check
      - Produktions-Variablen als Beispieldatei, ohne echte Werte
      - Go-Live-Checkliste mit mindestens acht Punkten
      - Retrospektive und README
      - Alles committet
    hints:
      - "`bash -n deploy/deploy.sh` prüft die Syntax, ohne das Skript auszuführen. `chmod +x` macht es ausführbar."
      - "Die Route `/up` bringt Laravel 13 schon mit (`health: '/up'` in `bootstrap/app.php`)."
      - "Prüfe vor dem Commit mit `git status`, dass weder `vendor/` noch `node_modules/` oder `.env` auftauchen."
    checks:
      - type: command
        run: test -x deploy/deploy.sh && bash -n deploy/deploy.sh && echo ok
        stdout_equals: ok
        message: deploy/deploy.sh fehlt, ist nicht ausführbar (chmod +x) oder hat einen Syntaxfehler (bash -n deploy/deploy.sh).
      - type: command
        run: f=deploy/deploy.sh; grep -q 'set -euo pipefail' $f && grep -q 'migrate --force' $f && grep -qE 'curl +-fsS' $f && grep -q '/up' $f && grep -q 'up -d' $f && echo ok
        stdout_equals: ok
        message: "deploy/deploy.sh braucht set -euo pipefail, php artisan migrate --force, docker compose up -d und einen Health-Check mit curl -fsS auf /up."
      - type: command
        run: f=deploy/.env.production.example; grep -qx 'APP_ENV=production' $f && grep -qx 'APP_DEBUG=false' $f && grep -q '^DB_CONNECTION=pgsql' $f && grep -q '^APP_KEY=' $f && echo ok
        stdout_equals: ok
        message: deploy/.env.production.example braucht mindestens APP_ENV=production, APP_DEBUG=false, APP_KEY= und DB_CONNECTION=pgsql.
      - type: command
        run: grep -cE '^- \[[ xX]\] ' docs/go-live.md
        stdout_matches: "^([8-9]|[1-9][0-9]+)\\s*$"
        message: docs/go-live.md braucht mindestens acht Checklistenpunkte im Format „- [ ] …“.
      - type: command
        run: for h in 'Was lief gut' 'Was war schwierig' 'Was ich beim nächsten Mal anders mache'; do awk -v h="## $h" '$0==h{f=1;next} /^## /{f=0} f && /^- /{n++} END{if(!n) print h}' docs/retro.md; done
        stdout_equals: ""
        message: "docs/retro.md braucht die Überschriften ## Was lief gut, ## Was war schwierig und ## Was ich beim nächsten Mal anders mache – jeweils mit mindestens einem Listenpunkt."
      - type: command
        run: grep -qE '^## Lokal starten' README.md && echo ok
        stdout_equals: ok
        message: Im Projektordner fehlt README.md mit der Überschrift ## Lokal starten.
      - type: command
        run: test "$(git rev-list --count HEAD 2>/dev/null || echo 0)" -ge 1 && test -z "$(git status --porcelain)" && echo ok
        stdout_equals: ok
        message: Committe alle Dateien. git status muss danach sauber sein (keine geänderten oder neuen Dateien).
      - type: command
        run: git ls-files | grep -E '(^|/)(vendor|node_modules)/|(^|/)\.env$' | head -n 1
        stdout_equals: ""
        message: Im Repository liegen vendor/, node_modules/ oder eine .env-Datei. Entferne sie mit git rm -r --cached und prüfe die .gitignore.
    solution: |
      ```bash title="deploy/deploy.sh"
      #!/usr/bin/env bash
      set -euo pipefail

      cd "$(dirname "$0")/.."
      APP_URL="${APP_URL:-http://localhost:8080}"

      docker compose build
      docker compose run --rm api php artisan migrate --force
      docker compose run --rm api php artisan optimize
      docker compose up -d

      curl -fsS --retry 5 --retry-delay 2 "$APP_URL/up" >/dev/null
      echo "Deployment erfolgreich: $APP_URL"
      ```

      ```bash
      chmod +x deploy/deploy.sh
      git add -A
      git commit -m "feat: ship vereinskurse v1"
      git status
      ```

      Beispiele für Go-Live-Checkliste und Retrospektive findest du in den Lektionen von Modul 4.
    solve: |
      mkdir -p deploy
      cat > deploy/deploy.sh <<'EOF'
      #!/usr/bin/env bash
      set -euo pipefail

      cd "$(dirname "$0")/.."
      APP_URL="${APP_URL:-http://localhost:8080}"

      docker compose build
      docker compose run --rm api php artisan migrate --force
      docker compose run --rm api php artisan optimize
      docker compose up -d

      curl -fsS --retry 5 --retry-delay 2 "$APP_URL/up" >/dev/null
      echo "Deployment erfolgreich: $APP_URL"
      EOF
      chmod +x deploy/deploy.sh
      cat > deploy/.env.production.example <<'EOF'
      APP_NAME=Vereinskurse
      APP_ENV=production
      APP_DEBUG=false
      APP_KEY=
      APP_URL=https://kurse.example.com
      LOG_LEVEL=warning
      DB_CONNECTION=pgsql
      DB_HOST=db
      DB_PORT=5432
      DB_DATABASE=vereinskurse
      DB_USERNAME=vereinskurse
      DB_PASSWORD=
      EOF
      cat > docs/go-live.md <<'EOF'
      # Go-Live-Checkliste

      - [ ] CI ist auf main grün
      - [ ] APP_ENV=production und APP_DEBUG=false gesetzt
