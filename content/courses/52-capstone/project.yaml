           `starts_at` (`z.iso.datetime({ offset: true })`), `capacity` und `seats_left` (ganze Zahlen ≥ 0).
         - `workshopListSchema` (`{ data: Workshop[] }`), `workshopResponseSchema` (`{ data: Workshop }`),
           `tokenSchema` (`{ token: string }`).
         - `newWorkshopSchema` für das Formular (title min. 3, location min. 2, starts_at nicht leer,
           capacity per `z.coerce.number()` als ganze Zahl von 1 bis 500) und `loginSchema` (E-Mail, Passwort).
         - Typen per `z.infer`: `Workshop`, `NewWorkshop`.
      2. `src/api.ts`: Basis-URL aus `import.meta.env?.VITE_API_URL ?? 'http://localhost:8000'`, ein Token im
         Speicher (`setToken`, `hasToken`), eine Klasse `ApiError` (mit `status` und `errors`) und die Funktionen
         `fetchWorkshops`, `fetchWorkshop(id)`, `createWorkshop(input)`, `bookWorkshop(id)` und
         `login(email, password)`. Jede Antwort wird mit dem passenden Schema geprüft.
      3. `src/queryClient.ts` exportiert `queryClient` (Standard-`staleTime` 30 Sekunden).
      4. `src/queries.ts` exportiert `workshopKeys` (`all: ['workshops']`, `detail(id)`) und die Fabriken
         `workshopsQuery()` und `workshopQuery(id)` mit `queryOptions`.
