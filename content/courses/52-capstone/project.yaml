  - id: buchungen
    title: Buchungen mit Geschäftsregeln
    description: |
      Das Herzstück der Fachlogik: Ein Workshop darf **nie** mehr Buchungen haben als Plätze, und niemand bucht
      doppelt. Arbeite in `api`:

      1. Lege einen `BookingController` mit zwei Methoden an:
         - `store(Request $request, Workshop $workshop)`: in einer **Transaktion** den Workshop mit
           `lockForUpdate()` neu laden. Schon gebucht → `abort(409, …)`. Keine Plätze frei → `abort(409, …)`.
           Sonst Buchung anlegen und mit Status 201 antworten (z. B. `{"data": {"workshop_id": 1, "seats_left": 4}}`).
         - `destroy(Request $request, Workshop $workshop)`: löscht nur die **eigene** Buchung, Status 204.
      2. Routen in der `auth:sanctum`-Gruppe: `POST /workshops/{workshop}/booking` und
         `DELETE /workshops/{workshop}/booking`.
      3. Prüfe mit `./vendor/bin/pest tests/Feature/Vereinskurse/BuchungTest.php`.
    checklist:
      - Buchen legt eine Buchung an (201)
      - Doppelte Buchung und ausgebuchter Workshop → 409 mit message
      - Stornieren löscht nur die eigene Buchung (204)
      - Prüfung und Anlegen laufen in einer Transaktion mit Sperre
    hints:
      - "`return DB::transaction(function () use ($request, $workshop) { … });`"
      - "`$workshop = Workshop::query()->lockForUpdate()->findOrFail($workshop->id);` – zwei gleichzeitige Anfragen warten so aufeinander."
      - "Der Unique-Constraint aus Schritt 2 ist dein Sicherheitsnetz, falls die Prüfung im Code doch einmal versagt."
    checks:
      - type: command
        run: cd api && ./vendor/bin/pest tests/Feature/Vereinskurse/BuchungTest.php
        message: Der Test tests/Feature/Vereinskurse/BuchungTest.php ist noch rot. Führe ihn aus und lies die erste Fehlermeldung.
      - type: file_contains
        path: api/app/Http/Controllers/BookingController.php
        pattern: "lockForUpdate"
        message: Lade den Workshop im BookingController mit lockForUpdate() innerhalb einer Transaktion, damit zwei gleichzeitige Buchungen nicht beide durchrutschen.
    solution: |
      ```php title="app/Http/Controllers/BookingController.php"
      class BookingController extends Controller
      {
          public function store(Request $request, Workshop $workshop): JsonResponse
          {
              return DB::transaction(function () use ($request, $workshop) {
                  $workshop = Workshop::query()->lockForUpdate()->findOrFail($workshop->id);
                  $userId = $request->user()->id;

                  if ($workshop->bookings()->where('user_id', $userId)->exists()) {
                      abort(409, 'Du hast diesen Workshop schon gebucht.');
                  }

                  if ($workshop->seatsLeft() === 0) {
                      abort(409, 'Der Workshop ist leider ausgebucht.');
                  }

                  $workshop->bookings()->create(['user_id' => $userId]);

                  return response()->json([
                      'data' => ['workshop_id' => $workshop->id, 'seats_left' => $workshop->seatsLeft()],
                  ], 201);
              });
          }

          public function destroy(Request $request, Workshop $workshop): Response
          {
              $workshop->bookings()->where('user_id', $request->user()->id)->delete();

              return response()->noContent();
          }
      }
      ```
