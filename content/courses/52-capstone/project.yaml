title: "Vereinskurse: eine App von null bis live"
description: |
  Das ist das große Abschlussprojekt der Plattform. Du baust **Vereinskurse**, eine kleine, aber vollständige
  Web-App für einen Sportverein: Mitglieder sehen die kommenden Workshops (Yoga, Erste Hilfe, Kochabend),
  melden sich an und buchen einen Platz. Organisatorinnen legen neue Workshops an. Ist ein Workshop voll,
  lehnt die API weitere Buchungen ab.

  Du gehst denselben Weg wie in einem echten Projekt – und nutzt dabei, was du in den früheren Kursen gelernt
  hast:

  1. Anforderungen und Entscheidungen festhalten
  2. Datenmodell mit Migrationen und Models
  3. Login mit Laravel Sanctum
  4. REST-API mit Validierung und API Resources
  5. Buchungen mit Geschäftsregeln
  6. Tests und Code-Qualität
  7. Datenschicht im Frontend (Zod, TanStack Query)
  8. Routen und Formulare mit React Router (Data Mode)
  9. Dockerfiles, Compose und eine CI-Pipeline
  10. Deploy-Kit, Go-Live-Checkliste und Retrospektive

  Klicke zuerst auf **Projekt vorbereiten**. Stacklab legt den Ordner `vereinskurse` an mit:

  - `api/` – eine frische Laravel-13-Anwendung mit Sanctum und Pest. Unter `api/tests/Feature/Vereinskurse/`
    liegt für mehrere Schritte ein fertiger Pest-Test, der das Ziel beschreibt. Lies ihn vor dem Schritt.
  - `web/` – ein frisches Vite-Projekt (React 19, TypeScript) mit React Router, Zod und TanStack Query.
  - `docs/` – ein leerer Ordner für deine Planungsdokumente.
  - ein Git-Repository für das ganze Projekt.

  Öffne dann das Übungs-Terminal und wechsle mit `cd vereinskurse` hinein. Die Schritte bauen aufeinander auf.
  Wenn du festhängst, hilft **Für mich erledigen** – schau dir danach genau an, was geschrieben wurde, und
  vergleiche es mit deiner Lösung. Plane für das Projekt etwa vier Stunden ein.
goal: >
  Ein Repository `vereinskurse` mit Planungsdokumenten, einer getesteten Laravel-API (Sanctum-Login,
  Workshops, Buchungen mit Platzlimit), einem React-Frontend mit Data-Mode-Routen, Zod-Validierung und
  TanStack Query, Dockerfiles, Compose-Datei, CI-Workflow, Deploy-Skript, Go-Live-Checkliste und
  Retrospektive – alles committet.
workdir: vereinskurse
setup: |
  # Laravel 13 mit Sanctum und Pest einmal bauen und zwischenspeichern, dann nach api/ kopieren
  B="$HOME/.cache/stacklab/laravel13"
  A="$HOME/.cache/stacklab/laravel13-sanctum"
  if [ ! -f "$A/.fertig" ]; then
    if [ ! -f "$B/.fertig" ]; then
      T="$B.bau.$$"; rm -rf "$T"; mkdir -p "$(dirname "$B")"
      timeout 170 composer create-project laravel/laravel "$T" "^13.0" -n -q --prefer-dist </dev/null
      (cd "$T" && timeout 170 composer require pestphp/pest pestphp/pest-plugin-laravel --dev -W -n -q </dev/null)
      printf '%s\n' '<?php' '' "pest()->extend(Tests\\TestCase::class)->in('Feature');" > "$T/tests/Pest.php"
      touch "$T/.fertig"; rm -rf "$B"; mv "$T" "$B"
    fi
    T="$A.bau.$$"; rm -rf "$T"; cp -a "$B" "$T"
    (cd "$T" && timeout 120 php artisan install:api --without-migration-prompt -n -q </dev/null && php artisan migrate --force -q)
    rm -rf "$A"; mv "$T" "$A"
  fi
  mkdir -p api docs
  cp -a "$A/." api/ && rm -f api/.fertig
  sed -i 's/^APP_NAME=.*/APP_NAME=Vereinskurse/' api/.env
  touch docs/.gitkeep
  mkdir -p api/tests/Feature/Vereinskurse
  cat > api/tests/Feature/Vereinskurse/DatenmodellTest.php <<'STACKLAB_EOF'
  <?php

  use App\Models\User;
  use App\Models\Workshop;
  use Illuminate\Database\QueryException;
  use Illuminate\Foundation\Testing\RefreshDatabase;
  use Illuminate\Support\Facades\Schema;

  uses(RefreshDatabase::class);

  test('die Tabellen haben die geplanten Spalten', function () {
      expect(Schema::hasColumns('workshops', ['user_id', 'title', 'description', 'location', 'starts_at', 'capacity']))->toBeTrue();
      expect(Schema::hasColumns('bookings', ['workshop_id', 'user_id']))->toBeTrue();
  });

  test('ein Workshop gehört einer Organisatorin und kennt seine Buchungen', function () {
      $workshop = Workshop::factory()->create(['capacity' => 3]);
      $workshop->bookings()->create(['user_id' => User::factory()->create()->id]);

      expect($workshop->organizer)->toBeInstanceOf(User::class);
      expect($workshop->starts_at)->toBeInstanceOf(DateTimeInterface::class);
      expect($workshop->bookings()->count())->toBe(1);
      expect($workshop->seatsLeft())->toBe(2);
  });

  test('dieselbe Person kann einen Workshop nur einmal buchen', function () {
      $workshop = Workshop::factory()->create();
      $user = User::factory()->create();
      $workshop->bookings()->create(['user_id' => $user->id]);

      expect(fn () => $workshop->bookings()->create(['user_id' => $user->id]))->toThrow(QueryException::class);
  });
  STACKLAB_EOF
  cat > api/tests/Feature/Vereinskurse/LoginTest.php <<'STACKLAB_EOF'
  <?php

  use App\Models\User;
  use Illuminate\Foundation\Testing\RefreshDatabase;

  uses(RefreshDatabase::class);

  test('POST /api/login gibt bei richtigen Zugangsdaten ein Token zurück', function () {
      User::factory()->create(['email' => 'ada@example.com', 'password' => 'ein-langes-passwort']);

      $this->postJson('/api/login', [
          'email' => 'ada@example.com',
          'password' => 'ein-langes-passwort',
          'device_name' => 'web',
      ])->assertOk()->assertJsonStructure(['token']);

      expect(User::first()->tokens()->count())->toBe(1);
  });

  test('ein falsches Passwort führt zu 422', function () {
      User::factory()->create(['email' => 'ada@example.com', 'password' => 'ein-langes-passwort']);

      $this->postJson('/api/login', [
          'email' => 'ada@example.com',
          'password' => 'falsch',
          'device_name' => 'web',
      ])->assertStatus(422)->assertJsonValidationErrors('email');
  });

  test('fehlende Felder führen zu 422', function () {
      $this->postJson('/api/login', [])
          ->assertStatus(422)
          ->assertJsonValidationErrors(['email', 'password', 'device_name']);
  });

  test('GET /api/me liefert mit Token das eigene Konto ohne Passwort', function () {
      $user = User::factory()->create();
      $token = $user->createToken('test')->plainTextToken;

      $this->withToken($token)->getJson('/api/me')
          ->assertOk()
          ->assertJsonPath('email', $user->email)
          ->assertJsonMissingPath('password');
  });

  test('ohne Token antwortet /api/me mit 401', function () {
      $this->getJson('/api/me')->assertUnauthorized();
  });

  test('POST /api/logout widerruft das aktuelle Token', function () {
      $user = User::factory()->create();
      $token = $user->createToken('test')->plainTextToken;

      $this->withToken($token)->postJson('/api/logout')->assertNoContent();

      expect($user->tokens()->count())->toBe(0);
  });
  STACKLAB_EOF
  cat > api/tests/Feature/Vereinskurse/WorkshopApiTest.php <<'STACKLAB_EOF'
  <?php

  use App\Models\User;
  use App\Models\Workshop;
  use Illuminate\Foundation\Testing\RefreshDatabase;
  use Laravel\Sanctum\Sanctum;

  uses(RefreshDatabase::class);

  test('GET /api/workshops listet kommende Workshops nach Datum mit freien Plätzen', function () {
      Workshop::factory()->create(['title' => 'Erste Hilfe', 'starts_at' => now()->addDays(10), 'capacity' => 10]);
      $yoga = Workshop::factory()->create(['title' => 'Yoga', 'starts_at' => now()->addDays(2), 'capacity' => 2]);
      Workshop::factory()->create(['title' => 'Schon vorbei', 'starts_at' => now()->subDay()]);
      $yoga->bookings()->create(['user_id' => User::factory()->create()->id]);

      $this->getJson('/api/workshops')
          ->assertOk()
          ->assertJsonCount(2, 'data')
          ->assertJsonPath('data.0.title', 'Yoga')
          ->assertJsonPath('data.0.seats_left', 1)
          ->assertJsonPath('data.1.title', 'Erste Hilfe');
  });

  test('GET /api/workshops/{id} zeigt einen Workshop im vereinbarten Format', function () {
      $workshop = Workshop::factory()->create(['capacity' => 8]);

      $this->getJson("/api/workshops/{$workshop->id}")
          ->assertOk()
          ->assertJsonPath('data.id', $workshop->id)
          ->assertJsonPath('data.capacity', 8)
          ->assertJsonPath('data.seats_left', 8)
          ->assertJsonPath('data.starts_at', $workshop->starts_at->toIso8601String())
          ->assertJsonStructure(['data' => ['id', 'title', 'description', 'location', 'starts_at', 'capacity', 'seats_left']]);
  });

  test('ein unbekannter Workshop antwortet mit 404', function () {
      $this->getJson('/api/workshops/999')->assertNotFound();
  });

  test('POST /api/workshops verlangt eine Anmeldung', function () {
      $this->postJson('/api/workshops', [])->assertUnauthorized();
  });

  test('POST /api/workshops validiert die Eingaben', function () {
      Sanctum::actingAs(User::factory()->create());

      $this->postJson('/api/workshops', ['title' => '', 'capacity' => 0, 'starts_at' => 'irgendwann'])
          ->assertStatus(422)
          ->assertJsonValidationErrors(['title', 'location', 'starts_at', 'capacity']);

      $this->postJson('/api/workshops', [
          'title' => 'Kochabend',
          'location' => 'Vereinsheim',
          'starts_at' => now()->subDay()->toIso8601String(),
          'capacity' => 501,
      ])->assertStatus(422)->assertJsonValidationErrors(['starts_at', 'capacity']);
  });

  test('POST /api/workshops legt einen Workshop für die angemeldete Person an', function () {
      $user = User::factory()->create();
      Sanctum::actingAs($user);

      $this->postJson('/api/workshops', [
          'title' => 'Kochabend',
          'location' => 'Vereinsheim',
          'starts_at' => now()->addWeek()->toIso8601String(),
          'capacity' => 12,
      ])->assertCreated()
          ->assertJsonPath('data.title', 'Kochabend')
          ->assertJsonPath('data.seats_left', 12);

      expect(Workshop::first()->user_id)->toBe($user->id);
  });
  STACKLAB_EOF
  cat > api/tests/Feature/Vereinskurse/BuchungTest.php <<'STACKLAB_EOF'
  <?php

  use App\Models\User;
  use App\Models\Workshop;
  use Illuminate\Foundation\Testing\RefreshDatabase;
  use Laravel\Sanctum\Sanctum;

  uses(RefreshDatabase::class);

  test('POST /api/workshops/{id}/booking bucht einen Platz', function () {
      $user = User::factory()->create();
      $workshop = Workshop::factory()->create(['capacity' => 5]);
      Sanctum::actingAs($user);

      $this->postJson("/api/workshops/{$workshop->id}/booking")->assertCreated();

      expect($workshop->bookings()->where('user_id', $user->id)->exists())->toBeTrue();
      $this->getJson("/api/workshops/{$workshop->id}")->assertJsonPath('data.seats_left', 4);
  });

  test('eine doppelte Buchung antwortet mit 409', function () {
      $workshop = Workshop::factory()->create(['capacity' => 5]);
      Sanctum::actingAs(User::factory()->create());

      $this->postJson("/api/workshops/{$workshop->id}/booking")->assertCreated();
      $this->postJson("/api/workshops/{$workshop->id}/booking")->assertStatus(409);

      expect($workshop->bookings()->count())->toBe(1);
  });

  test('ein ausgebuchter Workshop antwortet mit 409', function () {
      $workshop = Workshop::factory()->create(['capacity' => 1]);
      $workshop->bookings()->create(['user_id' => User::factory()->create()->id]);
      Sanctum::actingAs(User::factory()->create());

      $this->postJson("/api/workshops/{$workshop->id}/booking")
          ->assertStatus(409)
          ->assertJsonStructure(['message']);

      expect($workshop->bookings()->count())->toBe(1);
  });

  test('DELETE /api/workshops/{id}/booking storniert nur die eigene Buchung', function () {
      $workshop = Workshop::factory()->create(['capacity' => 5]);
      $andere = User::factory()->create();
      $workshop->bookings()->create(['user_id' => $andere->id]);
      $user = User::factory()->create();
      $workshop->bookings()->create(['user_id' => $user->id]);
      Sanctum::actingAs($user);

      $this->deleteJson("/api/workshops/{$workshop->id}/booking")->assertNoContent();

      expect($workshop->bookings()->pluck('user_id')->all())->toBe([$andere->id]);
  });

  test('Buchen ohne Anmeldung antwortet mit 401', function () {
      $workshop = Workshop::factory()->create();

      $this->postJson("/api/workshops/{$workshop->id}/booking")->assertUnauthorized();
  });
  STACKLAB_EOF
