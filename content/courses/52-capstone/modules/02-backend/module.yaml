title: Die API bauen
description: Den API-Vertrag festlegen, den Login mit Sanctum absichern, Geschäftsregeln gegen Race Conditions schützen und alles mit aussagekräftigen Tests belegen.
exercise:
  id: modul-uebung-verleih-api
  type: terminal
  title: Eine API für den Geräteverleih
  description: |
    Der Geräteverleih aus Modul 1 bekommt eine API. Im Ordner `verleih-api` liegt eine Laravel-13-Anwendung mit
    Sanctum. Datenmodell, Models und Factories sind schon da:

    - `items` (`id`, `name`) – Model `Item` mit `loans()`
    - `loans` (`item_id`, `user_id`, `returned_at`) – Model `Loan`; eine Ausleihe ist **offen**, solange
      `returned_at` leer ist

    Unter `tests/Feature/VerleihTest.php` beschreibt ein Pest-Test, was die API können soll. Klicke zuerst auf
    **Aufgabe vorbereiten** und lies den Test.

    1. `GET /api/items` (öffentlich) liefert `{"data": [{"id": …, "name": …, "available": true|false}]}`.
       `available` ist `false`, wenn es eine offene Ausleihe gibt. Vermeide N+1, z. B. mit
       `withExists(['loans as lent' => fn ($q) => $q->whereNull('returned_at')])`.
    2. `POST /api/items/{item}/loan` (nur angemeldet): legt eine offene Ausleihe für die angemeldete Person an
       und antwortet mit **201**. Ist das Gerät schon verliehen, antwortet die API mit **409**. Prüfen und
       Anlegen laufen in einer Transaktion mit `lockForUpdate()`.
    3. `POST /api/items/{item}/return` (nur angemeldet): setzt `returned_at` auf jetzt – aber nur für die
       **eigene** offene Ausleihe – und antwortet mit **204**. Gibt es keine eigene offene Ausleihe, antwortet
       sie mit **404**.
    4. Alles grün? `./vendor/bin/pest tests/Feature/VerleihTest.php`
  workdir: verleih-api
  setup: |
    B="$HOME/.cache/stacklab/laravel13"
    A="$HOME/.cache/stacklab/laravel13-sanctum"
    if [ ! -f "$A/.fertig" ]; then
      if [ ! -f "$B/.fertig" ]; then
        T="$B.bau.$$"; rm -rf "$T"; mkdir -p "$(dirname "$B")"
        timeout 170 composer create-project laravel/laravel "$T" "^13.0" -n -q --prefer-dist </dev/null
        (cd "$T" && timeout 170 composer require pestphp/pest pestphp/pest-plugin-laravel --dev -W -n -q </dev/null)
        printf '%s\n' '<?php' '' "pest()->extend(Tests\\TestCase::class)->in('Feature');" > "$T/tests/Pest.php"
        touch "$T/.fertig"; rm -rf "$B"; mv "$T" "$B"
      fi
      T="$A.bau.$$"; rm -rf "$T"; cp -a "$B" "$T"
      (cd "$T" && timeout 120 php artisan install:api --without-migration-prompt -n -q </dev/null && php artisan migrate --force -q)
      rm -rf "$A"; mv "$T" "$A"
    fi
    cp -a "$A/." . && rm -f .fertig
    perl -0pi -e 's/use Illuminate\\Notifications\\Notifiable;/use Illuminate\\Notifications\\Notifiable;\nuse Laravel\\Sanctum\\HasApiTokens;/; s/use HasFactory, Notifiable;/use HasApiTokens, HasFactory, Notifiable;/' app/Models/User.php
    cat > database/migrations/2026_10_01_000000_create_items_and_loans_tables.php <<'EOF'
    <?php

    use Illuminate\Database\Migrations\Migration;
    use Illuminate\Database\Schema\Blueprint;
    use Illuminate\Support\Facades\Schema;

    return new class extends Migration
    {
        public function up(): void
        {
            Schema::create('items', function (Blueprint $table) {
                $table->id();
                $table->string('name');
                $table->timestamps();
            });

            Schema::create('loans', function (Blueprint $table) {
                $table->id();
                $table->foreignId('item_id')->constrained()->cascadeOnDelete();
                $table->foreignId('user_id')->constrained()->cascadeOnDelete();
                $table->timestamp('returned_at')->nullable();
                $table->timestamps();
            });
        }

        public function down(): void
        {
            Schema::dropIfExists('loans');
            Schema::dropIfExists('items');
        }
    };
    EOF
    cat > app/Models/Item.php <<'EOF'
    <?php

    namespace App\Models;

    use Database\Factories\ItemFactory;
    use Illuminate\Database\Eloquent\Attributes\Fillable;
    use Illuminate\Database\Eloquent\Factories\HasFactory;
    use Illuminate\Database\Eloquent\Model;
    use Illuminate\Database\Eloquent\Relations\HasMany;

    #[Fillable(['name'])]
    class Item extends Model
    {
        /** @use HasFactory<ItemFactory> */
        use HasFactory;

        /** @return HasMany<Loan, $this> */
        public function loans(): HasMany
        {
            return $this->hasMany(Loan::class);
        }
    }
    EOF
    cat > app/Models/Loan.php <<'EOF'
    <?php

    namespace App\Models;

    use Illuminate\Database\Eloquent\Attributes\Fillable;
    use Illuminate\Database\Eloquent\Model;
    use Illuminate\Database\Eloquent\Relations\BelongsTo;

    #[Fillable(['user_id', 'returned_at'])]
    class Loan extends Model
    {
        protected function casts(): array
        {
            return ['returned_at' => 'datetime'];
        }

        /** @return BelongsTo<Item, $this> */
        public function item(): BelongsTo
        {
            return $this->belongsTo(Item::class);
        }
    }
    EOF
    cat > database/factories/ItemFactory.php <<'EOF'
    <?php

    namespace Database\Factories;

    use App\Models\Item;
    use Illuminate\Database\Eloquent\Factories\Factory;

    /**
     * @extends Factory<Item>
     */
    class ItemFactory extends Factory
    {
        public function definition(): array
        {
            return ['name' => fake()->randomElement(['Zelt', 'Beamer', 'Bierbank', 'Musikbox'])];
        }
    }
    EOF
    cat > tests/Feature/VerleihTest.php <<'EOF'
    <?php

    use App\Models\Item;
    use App\Models\User;
    use Illuminate\Foundation\Testing\RefreshDatabase;
    use Laravel\Sanctum\Sanctum;

    uses(RefreshDatabase::class);

    test('GET /api/items zeigt, welche Geräte verfügbar sind', function () {
        $zelt = Item::factory()->create(['name' => 'Zelt']);
        $beamer = Item::factory()->create(['name' => 'Beamer']);
        $beamer->loans()->create(['user_id' => User::factory()->create()->id]);
        $zelt->loans()->create(['user_id' => User::factory()->create()->id, 'returned_at' => now()]);

        $this->getJson('/api/items')
            ->assertOk()
            ->assertJsonCount(2, 'data')
            ->assertJsonPath('data.0.name', 'Zelt')
            ->assertJsonPath('data.0.available', true)
            ->assertJsonPath('data.1.available', false);
    });

    test('Ausleihen verlangt eine Anmeldung', function () {
        $item = Item::factory()->create();

        $this->postJson("/api/items/{$item->id}/loan")->assertUnauthorized();
    });

    test('ein freies Gerät wird ausgeliehen', function () {
        $user = User::factory()->create();
        $item = Item::factory()->create();
        Sanctum::actingAs($user);

        $this->postJson("/api/items/{$item->id}/loan")->assertCreated();

        expect($item->loans()->whereNull('returned_at')->where('user_id', $user->id)->count())->toBe(1);
    });

    test('ein verliehenes Gerät antwortet mit 409', function () {
        $item = Item::factory()->create();
        $item->loans()->create(['user_id' => User::factory()->create()->id]);
        Sanctum::actingAs(User::factory()->create());

        $this->postJson("/api/items/{$item->id}/loan")->assertStatus(409);

        expect($item->loans()->count())->toBe(1);
    });

    test('die eigene Rückgabe macht das Gerät wieder frei', function () {
        $user = User::factory()->create();
        $item = Item::factory()->create();
        $item->loans()->create(['user_id' => $user->id]);
        Sanctum::actingAs($user);

        $this->postJson("/api/items/{$item->id}/return")->assertNoContent();

        expect($item->loans()->whereNull('returned_at')->count())->toBe(0);
        $this->getJson('/api/items')->assertJsonPath('data.0.available', true);
    });

    test('fremde Ausleihen kann niemand zurückgeben', function () {
        $item = Item::factory()->create();
        $item->loans()->create(['user_id' => User::factory()->create()->id]);
        Sanctum::actingAs(User::factory()->create());

        $this->postJson("/api/items/{$item->id}/return")->assertNotFound();

        expect($item->loans()->whereNull('returned_at')->count())->toBe(1);
    });
    EOF
    php artisan migrate --force -q
  checks:
    - type: command
      run: ./vendor/bin/pest tests/Feature/VerleihTest.php >/dev/null 2>&1 && echo gruen
      stdout_equals: gruen
      message: tests/Feature/VerleihTest.php ist noch rot. Führe ./vendor/bin/pest tests/Feature/VerleihTest.php aus und arbeite die Fehler von oben nach unten ab.
    - type: command
      run: grep -rl 'lockForUpdate' app/Http/Controllers | head -n 1
      stdout_matches: "\\.php$"
      message: Das Ausleihen soll in einer Transaktion mit lockForUpdate() laufen, damit zwei gleichzeitige Anfragen das Gerät nicht doppelt verleihen.
    - type: command
      run: >-
        php artisan route:list --path=api/items --json | jq -r '[.[] | select(.method | test("POST")) | (.middleware | join(","))] | map(select(test("Authenticate:sanctum"))) | length'
      stdout_equals: "2"
      message: Die beiden POST-Routen (loan und return) müssen mit auth:sanctum geschützt sein.
  hints:
    - "Lege einen `ItemController` an (`php artisan make:controller ItemController`) und registriere die Routen in `routes/api.php`."
    - "`available` berechnest du in der Antwort als `! $item->lent`, wenn du vorher `withExists(['loans as lent' => …])` geladen hast."
    - "Rückgabe: `$loan = $item->loans()->where('user_id', $request->user()->id)->whereNull('returned_at')->firstOrFail();` – `firstOrFail` erzeugt die 404 von selbst."
  solution: |
    ```php title="app/Http/Controllers/ItemController.php"
    <?php

    namespace App\Http\Controllers;

    use App\Models\Item;
    use Illuminate\Http\JsonResponse;
    use Illuminate\Http\Request;
    use Illuminate\Http\Response;
    use Illuminate\Support\Facades\DB;

    class ItemController extends Controller
    {
        public function index(): JsonResponse
        {
            $items = Item::query()
                ->withExists(['loans as lent' => fn ($query) => $query->whereNull('returned_at')])
                ->orderBy('id')
                ->get()
                ->map(fn (Item $item) => ['id' => $item->id, 'name' => $item->name, 'available' => ! $item->lent]);

            return response()->json(['data' => $items]);
        }

        public function loan(Request $request, Item $item): JsonResponse
        {
            return DB::transaction(function () use ($request, $item) {
                $item = Item::query()->lockForUpdate()->findOrFail($item->id);

                if ($item->loans()->whereNull('returned_at')->exists()) {
                    abort(409, 'Das Gerät ist gerade verliehen.');
                }

                $item->loans()->create(['user_id' => $request->user()->id]);

                return response()->json(['data' => ['item_id' => $item->id]], 201);
            });
        }

        public function giveBack(Request $request, Item $item): Response
        {
            $loan = $item->loans()
                ->where('user_id', $request->user()->id)
                ->whereNull('returned_at')
                ->firstOrFail();
            $loan->update(['returned_at' => now()]);

            return response()->noContent();
        }
    }
    ```

    ```php title="routes/api.php"
    <?php

    use App\Http\Controllers\ItemController;
    use Illuminate\Support\Facades\Route;

    Route::get('/items', [ItemController::class, 'index']);

    Route::middleware('auth:sanctum')->group(function () {
        Route::post('/items/{item}/loan', [ItemController::class, 'loan']);
        Route::post('/items/{item}/return', [ItemController::class, 'giveBack']);
    });
    ```
