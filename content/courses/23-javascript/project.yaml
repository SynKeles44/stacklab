    title: Abschluss – alles grün
    description: |
      Zum Schluss sicherst du auch das Laden mit Tests ab und prüfst das ganze Projekt.

      1. Lege `test/lade-fragen.test.js` mit mindestens **einem** Test an, der `ladeFragen` mit einer
         nachgebauten `fetchFn` prüft (z. B. dass bei Status 500 die Ersatzfragen zurückkommen).
      2. Starte `npm test` – insgesamt müssen mindestens **sechs** Tests grün sein.
      3. Prüfe alle Dateien mit `node --check`.
    checklist:
      - Test für ladeFragen mit nachgebauter fetchFn
      - Mindestens sechs grüne Tests
      - Alle Module ohne Syntaxfehler
    hints:
      - "`const fetchFn = async () => new Response(\"\", { status: 500 });` – Response gibt es in Node.js global."
      - "`for f in src/*.js; do node --check \"$f\"; done`"
    checks:
      - type: file_exists
        path: test/lade-fragen.test.js
        message: Lege die Datei test/lade-fragen.test.js an.
      - type: command
        run: grep -c "ladeFragen" test/lade-fragen.test.js
        stdout_matches: "^[1-9]"
        message: test/lade-fragen.test.js soll ladeFragen testen.
      - type: command
        run: node --test --test-reporter=tap 2>&1 | grep -E '^# (pass|fail)' | tr '\n' ' '
        stdout_matches: "^# pass ([6-9]|[1-9][0-9]+) # fail 0\\s*$"
        message: Es sollen mindestens sechs Tests grün und keiner rot sein.
      - type: command
        run: for f in src/*.js; do node --check "$f" || exit 1; done; echo alles-ok
        stdout_equals: alles-ok
        message: Eine Datei in src/ hat einen Syntaxfehler.
    solution: |
      ```js
      // test/lade-fragen.test.js
      import { test } from "node:test";
      import assert from "node:assert/strict";
      import { ladeFragen } from "../src/lade-fragen.js";

      test("bei HTTP 500 kommen die Ersatzfragen", async () => {
        const fetchFn = async () => new Response("", { status: 500 });
        assert.deepEqual(await ladeFragen("/fragen.json", { fetchFn, ersatz: ["E"] }), ["E"]);
      });

      test("geladene Fragen werden zurückgegeben", async () => {
        const fetchFn = async () => new Response(JSON.stringify([{ frage: "A" }]));
        assert.deepEqual(await ladeFragen("/fragen.json", { fetchFn }), [{ frage: "A" }]);
      });
      ```

      ```bash
      npm test
      for f in src/*.js; do node --check "$f"; done
      ```
