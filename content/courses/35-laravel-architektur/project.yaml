  - id: mandanten-test
    title: Die Mandanten-Trennung beweisen
    description: |
      Zum Schluss schreibst du die Tests, die in einem echten SaaS-Projekt am meisten wert sind: Sie
      beweisen, dass kein Mandant fremde Daten sieht.

      Lege `tests/Feature/TenantIsolationTest.php` an (mit `uses(RefreshDatabase::class);`) und schreibe
      drei Tests:

      1. Mandant 1 legt eine Rechnung an, Mandant 2 zwei. Mit Mandant 2 im Kontext liefert
         `Invoice::count()` 2, mit Mandant 1 liefert es 1.
      2. Ohne gesetzten Mandanten liefert `Invoice::count()` 0, obwohl Rechnungen existieren.
      3. `POST /invoices` **ohne** Header `X-Tenant-Id` antwortet mit Status 400.

      Am Ende ist die ganze Suite grün: `./vendor/bin/pest`.
    checklist:
      - Test für zwei Mandanten
      - Test ohne Mandant
      - Test für die Middleware
      - Ganze Suite grün
    hints:
      - "Für Test 2 brauchst du einen frischen Kontext: `app()->forgetScopedInstances();` setzt alle `scoped`-Objekte zurück."
      - "Rechnungen ohne Kontext legst du mit expliziter `tenant_id` an: `Invoice::create(['tenant_id' => 1, ...])`."
      - "`$this->postJson('/invoices', [...])->assertStatus(400);`"
    checks:
      - type: file_contains
        path: tests/Feature/TenantIsolationTest.php
        pattern: "TenantContext"
        message: tests/Feature/TenantIsolationTest.php fehlt oder setzt den TenantContext nicht.
      - type: command
        run: grep -cE "^\s*(test|it)\(" tests/Feature/TenantIsolationTest.php
        stdout_matches: "^\\s*([3-9]|[1-9][0-9])\\s*$"
        message: In TenantIsolationTest.php sollen mindestens drei Tests stehen.
      - type: file_contains
        path: tests/Feature/TenantIsolationTest.php
        pattern: "400"
        message: Es fehlt der Test, dass POST /invoices ohne X-Tenant-Id mit Status 400 antwortet.
      - type: command
        run: ./vendor/bin/pest
        message: Die Testsuite ist noch nicht grün. Führe ./vendor/bin/pest aus und lies die Fehlermeldung.
    solution: |
      ```php title="tests/Feature/TenantIsolationTest.php"
      <?php

      use App\Modules\Invoicing\Models\Invoice;
      use App\Support\Tenancy\TenantContext;
      use Illuminate\Foundation\Testing\RefreshDatabase;

      uses(RefreshDatabase::class);

      function invoiceFor(int $tenant): Invoice
      {
          return Invoice::create([
              'tenant_id' => $tenant, 'customer' => 'Beispiel AG',
              'net_cents' => 100, 'tax_rate' => 0, 'gross_cents' => 100,
          ]);
      }

      test('a tenant only sees its own invoices', function () {
          invoiceFor(1);
          invoiceFor(2);
          invoiceFor(2);

          app(TenantContext::class)->set(2);
          expect(Invoice::count())->toBe(2);

          app(TenantContext::class)->set(1);
          expect(Invoice::count())->toBe(1);
      });

      test('without a tenant nothing is visible', function () {
          invoiceFor(1);
          app()->forgetScopedInstances();

          expect(Invoice::count())->toBe(0);
      });

      test('the api rejects requests without a tenant', function () {
          $this->postJson('/invoices', ['customer' => 'Beispiel AG', 'net_cents' => 100, 'tax_rate' => 0])
              ->assertStatus(400);
      });
      ```
    solve: |
      cat > tests/Feature/TenantIsolationTest.php <<'EOF'
