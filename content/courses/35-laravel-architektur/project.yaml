      Route::post('/invoices', [InvoiceController::class, 'store'])->middleware(IdentifyTenant::class);
      EOF

  - id: domain-event
    title: Ein Domain Event für andere Module
    description: |
      Das Modul **Reporting** soll erfahren, dass eine Rechnung angelegt wurde – ohne dass Invoicing das
      Reporting kennt.

      1. Lege `app/Modules/Invoicing/Events/InvoiceCreated.php` an. Das Event nutzt den Trait
         `Illuminate\Foundation\Events\Dispatchable`, implementiert
         `Illuminate\Contracts\Events\ShouldDispatchAfterCommit` und trägt nur **einfache Werte**:
         `public int $invoiceId`, `public int $tenantId`, `public int $grossCents`.
      2. Die Action `CreateInvoice` löst das Event **innerhalb** der Transaktion mit
         `InvoiceCreated::dispatch(...)` aus. Dank `ShouldDispatchAfterCommit` kommt es erst nach dem Commit an.
      3. Lege den Listener `app/Modules/Reporting/Listeners/RecordRevenue.php` an. Seine Methode
         `handle(InvoiceCreated $event): void` schreibt eine Log-Zeile mit `Log::info(...)`.
      4. Laravel sucht Listener standardmäßig nur in `app/Listeners`. Ergänze in `bootstrap/app.php` vor
         `->withExceptions(` die Zeile `->withEvents(discover: [__DIR__.'/../app/Modules/*/Listeners'])`.
      5. Prüfe mit `php artisan event:list`, dass `RecordRevenue` erscheint.
    checklist:
      - Event mit einfachen Werten und `ShouldDispatchAfterCommit`
      - Action löst das Event aus
      - Listener im Modul Reporting wird gefunden
    hints:
      - "Ein Event mit `use Dispatchable;` kannst du mit `InvoiceCreated::dispatch($invoice->id, $invoice->tenant_id, $invoice->gross_cents)` auslösen."
      - "Pack das Anlegen und das Dispatchen in **eine** Closure: `return DB::transaction(function () use (...) { $invoice = Invoice::create([...]); InvoiceCreated::dispatch(...); return $invoice; });`"
      - "Siehst du den Listener nicht, hilft `php artisan event:clear`."
    checks:
      - type: file_contains
        path: app/Modules/Invoicing/Events/InvoiceCreated.php
        pattern: "implements\\s+ShouldDispatchAfterCommit"
        message: InvoiceCreated implementiert ShouldDispatchAfterCommit noch nicht.
      - type: command
        run: php artisan tinker --execute='Event::fake([App\Modules\Invoicing\Events\InvoiceCreated::class]); app(App\Support\Tenancy\TenantContext::class)->set(3); $i = app(App\Modules\Invoicing\Actions\CreateInvoice::class)->handle(App\Modules\Invoicing\Data\CreateInvoiceData::fromArray(["customer" => "X", "net_cents" => 100, "tax_rate" => 0])); $e = Event::dispatched(App\Modules\Invoicing\Events\InvoiceCreated::class)->first()[0] ?? null; echo $e?->tenantId ?? "kein Event"; $i->delete();'
        stdout_matches: "^\\s*3\\s*$"
        message: Die Action löst InvoiceCreated noch nicht aus – oder das Event trägt keine tenantId. Dispatche InvoiceCreated in der Action.
      - type: command
        run: php artisan event:list
        stdout_matches: "RecordRevenue"
        message: Laravel findet den Listener RecordRevenue noch nicht. Lege ihn in app/Modules/Reporting/Listeners an und ergänze withEvents(discover ...) in bootstrap/app.php.
      - type: command
        run: ./vendor/bin/pest
        message: Die Testsuite ist rot. Führe ./vendor/bin/pest aus und lies die Fehlermeldung.
    solution: |
      ```php title="app/Modules/Invoicing/Events/InvoiceCreated.php"
      <?php

      namespace App\Modules\Invoicing\Events;

      use Illuminate\Contracts\Events\ShouldDispatchAfterCommit;
      use Illuminate\Foundation\Events\Dispatchable;

      final class InvoiceCreated implements ShouldDispatchAfterCommit
      {
          use Dispatchable;

          public function __construct(
              public int $invoiceId,
              public int $tenantId,
              public int $grossCents,
          ) {}
      }
      ```

      ```php title="app/Modules/Reporting/Listeners/RecordRevenue.php"
      <?php

      namespace App\Modules\Reporting\Listeners;

      use App\Modules\Invoicing\Events\InvoiceCreated;
      use Illuminate\Support\Facades\Log;

      final class RecordRevenue
      {
          public function handle(InvoiceCreated $event): void
          {
              Log::info('Revenue recorded', ['tenant' => $event->tenantId, 'cents' => $event->grossCents]);
          }
      }
      ```

      ```php title="bootstrap/app.php (Ergänzung)"
      ->withEvents(discover: [__DIR__.'/../app/Modules/*/Listeners'])
      ```
    solve: |
      mkdir -p app/Modules/Invoicing/Events app/Modules/Reporting/Listeners
      cat > app/Modules/Invoicing/Events/InvoiceCreated.php <<'EOF'
      <?php

      namespace App\Modules\Invoicing\Events;

      use Illuminate\Contracts\Events\ShouldDispatchAfterCommit;
      use Illuminate\Foundation\Events\Dispatchable;

      final class InvoiceCreated implements ShouldDispatchAfterCommit
      {
          use Dispatchable;

          public function __construct(
              public int $invoiceId,
              public int $tenantId,
              public int $grossCents,
          ) {}
      }
      EOF
      cat > app/Modules/Reporting/Listeners/RecordRevenue.php <<'EOF'
      <?php

      namespace App\Modules\Reporting\Listeners;

      use App\Modules\Invoicing\Events\InvoiceCreated;
      use Illuminate\Support\Facades\Log;

      final class RecordRevenue
      {
          public function handle(InvoiceCreated $event): void
          {
              Log::info('Revenue recorded', ['tenant' => $event->tenantId, 'cents' => $event->grossCents]);
          }
      }
      EOF
      cat > app/Modules/Invoicing/Actions/CreateInvoice.php <<'EOF'
      <?php

      declare(strict_types=1);

      namespace App\Modules\Invoicing\Actions;

      use App\Modules\Invoicing\Data\CreateInvoiceData;
      use App\Modules\Invoicing\Events\InvoiceCreated;
      use App\Modules\Invoicing\Models\Invoice;
      use Illuminate\Support\Facades\DB;

      final class CreateInvoice
      {
          public function handle(CreateInvoiceData $data): Invoice
          {
              $gross = $data->net->add($data->net->percent($data->taxRate));

              return DB::transaction(function () use ($data, $gross) {
                  $invoice = Invoice::create([
                      'customer' => $data->customer,
                      'net_cents' => $data->net->cents,
                      'tax_rate' => $data->taxRate,
                      'gross_cents' => $gross->cents,
                  ]);

                  InvoiceCreated::dispatch($invoice->id, $invoice->tenant_id, $invoice->gross_cents);

                  return $invoice;
              });
          }
      }
      EOF
      grep -q "withEvents" bootstrap/app.php || sed -i "s#    ->withExceptions(#    ->withEvents(discover: [__DIR__.'/../app/Modules/*/Listeners'])\n    ->withExceptions(#" bootstrap/app.php
      php artisan event:clear -q

  - id: architekturtests
    title: Grenzen mit Architekturtests sichern
    description: |
      Damit die neue Struktur nicht in drei Monaten wieder verwildert, schreibst du Regeln, die Pest bei
      jedem Testlauf prüft.

      Lege `tests/Unit/ArchitectureTest.php` mit vier `arch()`-Regeln an:

      1. `App\Modules\Invoicing\Domain` benutzt nichts aus `Illuminate` (`->not->toUse('Illuminate')`).
      2. Alle Klassen in `App\Modules\Invoicing\Data` sind readonly (`->classes()->toBeReadonly()`).
      3. Das Model `App\Modules\Invoicing\Models` wird nur innerhalb von `App\Modules\Invoicing` benutzt
         (`->toOnlyBeUsedIn(...)`).
      4. `App\Modules\Invoicing\Http` benutzt die Fassade `Illuminate\Support\Facades\DB` nicht.

      Führe `./vendor/bin/pest tests/Unit/ArchitectureTest.php` aus. Mach zur Probe kurz eine Regel kaputt
      (z. B. `use Illuminate\Support\Str;` in `Money.php`) und schau, wie der Test rot wird – dann wieder
      entfernen.
    checklist:
      - Vier `arch()`-Regeln in `tests/Unit/ArchitectureTest.php`
      - Architekturtests grün
    hints:
      - "Eine Regel sieht so aus: `arch('domain is framework free')->expect('App\\Modules\\Invoicing\\Domain')->not->toUse('Illuminate');`"
      - Architekturtests brauchen keine Datenbank und kein `TestCase` – deshalb liegen sie gut in `tests/Unit`.
    checks:
      - type: file_contains
        path: tests/Unit/ArchitectureTest.php
        pattern: "toOnlyBeUsedIn"
        message: In tests/Unit/ArchitectureTest.php fehlt die Regel mit toOnlyBeUsedIn für das Invoice-Model.
      - type: file_contains
        path: tests/Unit/ArchitectureTest.php
        pattern: "toBeReadonly"
        message: In tests/Unit/ArchitectureTest.php fehlt die Regel, dass die DTOs readonly sind.
      - type: command
        run: grep -c "arch(" tests/Unit/ArchitectureTest.php
        stdout_matches: "^\\s*([4-9]|[1-9][0-9])\\s*$"
        message: Es sollen mindestens vier arch()-Regeln in der Datei stehen.
      - type: command
        run: ./vendor/bin/pest tests/Unit/ArchitectureTest.php
        message: Die Architekturtests sind rot. Lies die Meldung – sie nennt die Klasse, die eine Regel bricht.
    solution: |
      ```php title="tests/Unit/ArchitectureTest.php"
      <?php

      arch('domain is framework free')
          ->expect('App\Modules\Invoicing\Domain')
          ->not->toUse('Illuminate');

      arch('data objects are readonly')
          ->expect('App\Modules\Invoicing\Data')
          ->classes()->toBeReadonly();

      arch('invoice model stays inside its module')
          ->expect('App\Modules\Invoicing\Models')
          ->toOnlyBeUsedIn('App\Modules\Invoicing');

      arch('http layer does not query the database')
          ->expect('App\Modules\Invoicing\Http')
          ->not->toUse('Illuminate\Support\Facades\DB');
      ```
