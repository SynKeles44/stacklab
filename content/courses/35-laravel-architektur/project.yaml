      sed -i "s#^Route::post('/invoices', \[InvoiceController::class, 'store'\]);#Route::post('/invoices', [InvoiceController::class, 'store'])->middleware(App\\\\Support\\\\Tenancy\\\\IdentifyTenant::class);#" routes/web.php
      grep -q IdentifyTenant routes/web.php

  - id: action-anlegen
    title: Eine Action für den Anwendungsfall
    description: |
      Jetzt bekommt der Anwendungsfall „Rechnung anlegen“ eine eigene Klasse, die von überall nutzbar ist –
      aus dem Controller, einem Artisan-Befehl oder einem Job.

      1. Lege `app/Modules/Invoicing/Actions/CreateInvoice.php` an (Namespace
         `App\Modules\Invoicing\Actions`), eine `final class` mit genau einer öffentlichen Methode
         `handle(CreateInvoiceData $data): Invoice`.
      2. Berechne den Bruttobetrag **mit `Money`**: Netto plus `percent($data->taxRate)`.
      3. Lege die Rechnung innerhalb von `DB::transaction(...)` an. Die `tenant_id` setzt der Trait aus
         dem vorigen Schritt automatisch.
    checklist:
      - "`CreateInvoice::handle` nimmt das DTO und gibt ein `Invoice` zurück"
      - Der Bruttobetrag wird mit `Money` berechnet
      - Das Anlegen läuft in einer Transaktion
    hints:
      - "`$gross = $data->net->add($data->net->percent($data->taxRate));`"
      - "`return DB::transaction(fn () => Invoice::create([...]));` – `DB::transaction` gibt den Rückgabewert der Closure zurück."
    checks:
      - type: file_exists
        path: app/Modules/Invoicing/Actions/CreateInvoice.php
        message: Die Datei app/Modules/Invoicing/Actions/CreateInvoice.php fehlt noch.
      - type: file_contains
        path: app/Modules/Invoicing/Actions/CreateInvoice.php
        pattern: "DB::transaction"
        message: Die Action legt die Rechnung noch nicht in DB::transaction(...) an.
      - type: command
        run: php artisan tinker --execute='DB::beginTransaction(); app(App\Support\Tenancy\TenantContext::class)->set(7); $i = app(App\Modules\Invoicing\Actions\CreateInvoice::class)->handle(App\Modules\Invoicing\Data\CreateInvoiceData::fromArray(["customer" => "Beispiel AG", "net_cents" => 1000, "tax_rate" => 19])); echo $i->gross_cents, "|", $i->tenant_id, "|", $i->customer; DB::rollBack();'
        stdout_matches: "1190\\|7\\|Beispiel AG"
        message: Die Action liefert noch nicht die erwartete Rechnung. Für 1000 Cent netto und 19 Prozent sollen 1190 Cent brutto herauskommen, tenant_id kommt aus dem Kontext.
    solution: |
      ```php title="app/Modules/Invoicing/Actions/CreateInvoice.php"
      <?php

      declare(strict_types=1);

      namespace App\Modules\Invoicing\Actions;

      use App\Modules\Invoicing\Data\CreateInvoiceData;
      use App\Modules\Invoicing\Models\Invoice;
      use Illuminate\Support\Facades\DB;

      final class CreateInvoice
      {
          public function handle(CreateInvoiceData $data): Invoice
          {
              $gross = $data->net->add($data->net->percent($data->taxRate));

              return DB::transaction(fn () => Invoice::create([
                  'customer' => $data->customer,
                  'net_cents' => $data->net->cents,
                  'tax_rate' => $data->taxRate,
                  'gross_cents' => $gross->cents,
              ]));
          }
      }
      ```
    solve: |
      mkdir -p app/Modules/Invoicing/Actions
      cat > app/Modules/Invoicing/Actions/CreateInvoice.php <<'EOF'
      <?php

      declare(strict_types=1);

      namespace App\Modules\Invoicing\Actions;

      use App\Modules\Invoicing\Data\CreateInvoiceData;
      use App\Modules\Invoicing\Models\Invoice;
      use Illuminate\Support\Facades\DB;

      final class CreateInvoice
      {
          public function handle(CreateInvoiceData $data): Invoice
          {
              $gross = $data->net->add($data->net->percent($data->taxRate));

              return DB::transaction(fn () => Invoice::create([
                  'customer' => $data->customer,
                  'net_cents' => $data->net->cents,
                  'tax_rate' => $data->taxRate,
                  'gross_cents' => $gross->cents,
              ]));
          }
      }
      EOF

  - id: schlanker-controller
    title: Der Controller wird schlank und zieht ins Modul
    description: |
      Der dicke Controller hat jetzt nichts mehr zu tun, was nicht schon an anderer Stelle steht.
      Ersetze ihn durch einen schlanken Controller **im Modul**.

      1. Lege `app/Modules/Invoicing/Http/StoreInvoiceRequest.php` an – ein Form Request mit den drei
         Regeln aus dem alten Controller.
      2. Lege `app/Modules/Invoicing/Http/InvoiceController.php` an. `store` nimmt den Form Request und die
         Action `CreateInvoice` entgegen, baut das DTO mit `CreateInvoiceData::fromArray($request->validated())`
         und gibt `id` und `gross_cents` mit Status 201 zurück. Kein `DB::`, keine Berechnung.
      3. Lass die Route `POST /invoices` auf den neuen Controller zeigen und lösche
         `app/Http/Controllers/InvoiceController.php`.
      4. `./vendor/bin/pest` muss grün bleiben – das ist der Beweis, dass dein Umbau nichts kaputt gemacht hat.
    checklist:
      - Validierung im Form Request
      - Controller im Modul ohne `DB::` und ohne Berechnung
      - Alter Controller gelöscht, Feature-Test weiter grün
    hints:
      - "Die Action bekommst du per Methoden-Injection: `public function store(StoreInvoiceRequest $request, CreateInvoice $createInvoice): JsonResponse`."
      - "Denk an `authorize(): bool { return true; }` im Form Request."
      - "In `routes/web.php` musst du das `use` auf `App\\Modules\\Invoicing\\Http\\InvoiceController` ändern."
    checks:
      - type: file_absent
        path: app/Http/Controllers/InvoiceController.php
        message: Der alte Controller app/Http/Controllers/InvoiceController.php existiert noch. Lösche ihn.
      - type: file_exists
        path: app/Modules/Invoicing/Http/InvoiceController.php
        message: Der neue Controller app/Modules/Invoicing/Http/InvoiceController.php fehlt noch.
      - type: file_exists
        path: app/Modules/Invoicing/Http/StoreInvoiceRequest.php
        message: Der Form Request app/Modules/Invoicing/Http/StoreInvoiceRequest.php fehlt noch.
      - type: command
        run: grep -cE "DB::|round\(|->validate\(" app/Modules/Invoicing/Http/InvoiceController.php
        expect_exit: 1
        message: Der neue Controller rechnet, validiert oder spricht selbst mit der Datenbank. Das gehört in Form Request und Action.
      - type: file_contains
        path: app/Modules/Invoicing/Http/InvoiceController.php
        pattern: "CreateInvoice\\b"
        message: Der Controller nutzt die Action CreateInvoice noch nicht.
      - type: command
        run: ./vendor/bin/pest
        message: Die Testsuite ist rot. Prüfe Route, Form Request und Controller mit ./vendor/bin/pest.
    solution: |
      ```php title="app/Modules/Invoicing/Http/InvoiceController.php"
      <?php

      declare(strict_types=1);

      namespace App\Modules\Invoicing\Http;

      use App\Modules\Invoicing\Actions\CreateInvoice;
      use App\Modules\Invoicing\Data\CreateInvoiceData;
      use Illuminate\Http\JsonResponse;

      final class InvoiceController
      {
          public function store(StoreInvoiceRequest $request, CreateInvoice $createInvoice): JsonResponse
          {
              $invoice = $createInvoice->handle(CreateInvoiceData::fromArray($request->validated()));

              return response()->json(['id' => $invoice->id, 'gross_cents' => $invoice->gross_cents], 201);
          }
      }
      ```

      ```bash
      rm app/Http/Controllers/InvoiceController.php
      ```

      In `routes/web.php`: `use App\Modules\Invoicing\Http\InvoiceController;`
    solve: |
      mkdir -p app/Modules/Invoicing/Http
      cat > app/Modules/Invoicing/Http/StoreInvoiceRequest.php <<'EOF'
      <?php

      namespace App\Modules\Invoicing\Http;

      use Illuminate\Foundation\Http\FormRequest;

      final class StoreInvoiceRequest extends FormRequest
      {
          public function authorize(): bool
          {
              return true;
          }

          public function rules(): array
          {
              return [
                  'customer' => ['required', 'string', 'max:120'],
                  'net_cents' => ['required', 'integer', 'min:0'],
                  'tax_rate' => ['required', 'integer', 'in:0,7,19'],
              ];
          }
      }
      EOF
      cat > app/Modules/Invoicing/Http/InvoiceController.php <<'EOF'
      <?php

      declare(strict_types=1);

      namespace App\Modules\Invoicing\Http;

      use App\Modules\Invoicing\Actions\CreateInvoice;
      use App\Modules\Invoicing\Data\CreateInvoiceData;
      use Illuminate\Http\JsonResponse;

      final class InvoiceController
      {
          public function store(StoreInvoiceRequest $request, CreateInvoice $createInvoice): JsonResponse
          {
              $invoice = $createInvoice->handle(CreateInvoiceData::fromArray($request->validated()));

              return response()->json(['id' => $invoice->id, 'gross_cents' => $invoice->gross_cents], 201);
          }
      }
      EOF
