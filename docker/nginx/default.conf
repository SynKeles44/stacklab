map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location = /up {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        include fastcgi_params;
    }

    location /terminal/ws {
        proxy_pass http://sandbox:7681/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        alias /srv/content/assets/;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:" always;
    }

    location /screenshots/ {
        alias /srv/content/screenshots/;
        add_header Cache-Control "public, max-age=3600";
    }

    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # The React runner iframe is sandboxed (opaque origin) and loads its module bundle cross-origin.
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

# Internal-only bridge from the backend to the sandbox API (port 8081 is never published).
# PHP-FPM is deliberately NOT on the sandbox network, so the practice shell cannot talk FastCGI to it.
server {
    listen 8081;
    server_name _;

    location /api/ {
        proxy_pass http://sandbox:7681;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        client_max_body_size 1m;
    }

    location / {
        return 404;
    }
}
