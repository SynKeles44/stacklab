# Egress proxy for the practice sandbox: only package registries are reachable.
Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Notice
MaxClients 50
Allow 0.0.0.0/0
ViaProxyName "stacklab-proxy"
DisableViaHeader Yes
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
FilterCaseSensitive Off
ConnectPort 443
ConnectPort 80
